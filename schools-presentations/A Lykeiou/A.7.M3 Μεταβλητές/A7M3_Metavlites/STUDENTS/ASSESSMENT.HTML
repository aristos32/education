 if(ASSESS&&stage==='end'){const R=results,sum=R.reduce((a,r)=>a+r.ok,0),tot=R.reduce((a,r)=>a+r.total,0),hu=hintUsed.filter(Boolean).length;show('<div class="paper"><h1>'+(expired?t('t0A'):t('resT'))+'</h1><p><b>'+esc(student)+'</b> · '+esc(classroom)+'</p><div class="stats three"><div><b>'+sum+'/'+tot+'</b><span>'+t('score')+'</span></div><div><b>'+Math.round(100*sum/Math.max(1,tot))+'%</b><span>&nbsp;</span></div><div><b>'+hu+'</b><span>💡 '+t('hintsU')+'</span></div></div>'+'<div class="task">'+EX.map((e,k)=>'<p><b>'+(k+1)+'. '+esc(tx(e.title))+'</b> — '+R[k].ok+'/'+R[k].total+(hintUsed[k]?' 💡':'')+'</p>').join('')+'</div>'+'<div class="notice"><p>⚠️ '+t('saveFirst')+'</p></div><div class="foot"><span id="saveStatus"></span><button id="saveR" class="primary">'+t('save')+'</button></div></div>');return}
 if(stage==='start'){show('<div class="paper"><div class="hero"><div><div class="label">'+tx(HERO.label)+'</div><h1>'+tx(HERO.h)+'</h1><p>'+tx(HERO.p)+'</p></div><div class="heroart">'+HERO.icons.map(x=>IC(x[0],x[1])).join('')+'</div></div>'
  +'<div class="rules '+(N>6?'eight':'six')+'">'+EX.map((e,k)=>{const ti=tx(e.title);return '<div><b>'+esc(ti.split(' ')[0])+' '+t('mission')+' '+(k+1)+'</b>'+esc(ti.replace(/^\S+\s/,''))+'</div>'}).join('')+'</div>'
  +'<div class="notice"><p>'+t('notice')+'</p></div><button id="begin" class="primary">'+t('begin')+'</button></div>');return}
 if(stage==='end'){const f=first.filter(v=>v===true).length,d=done.filter(Boolean).length,hp=helped.filter(Boolean).length;
  show('<div class="paper"><h1>'+(expired?t('endX'):t('endT'))+'</h1><div class="stats three"><div><b>'+f+'/'+N+'</b><span>✓ '+t('st1')+'</span></div><div><b>'+d+'/'+N+'</b><span>🏁 '+t('st2')+'</span></div><div><b>'+hp+'</b><span>💡 '+t('st3')+'</span></div></div>'
  +'<div class="lesson">'+tx(HERO.recap)+'</div><div class="task"><p>'+tx(HERO.home)+'</p></div><div class="foot"><span></span><button id="again">'+t('again')+'</button></div></div>');return}
 const e=EX[m];let h=missionsBar()+'<div class="paper"><div class="mhead">'+IC(e.icon,'mi '+e.cls)+'<div><div class="label">'+t(ASSESS?'task':'mission')+' '+(m+1)+' · '+e.code+'</div><h1>'+esc(tx(e.title))+'</h1><p>'+esc(tx(e.instr))+'</p></div></div>'+body(m);
 if(ASSESS){if(hintUsed[m])h+='<div class="feedback">💡 '+esc(tx(e.hint))+'</div>';h+='<div class="foot"><span><button id="prv" '+(m===0?'disabled':'')+'>'+t('prev')+'</button> '+(e.hint?'<button id="hnt" '+(hintUsed[m]?'disabled':'')+'>'+t('hint')+'</button>':'')+'</span>'+(m<N-1?'<button id="nxt" class="primary">'+t('nextA')+'</button>':'<button id="sub" class="primary">'+t('submit')+'</button>')+'</div></div>';show(h);return}
 if(fb[m])h+='<div class="feedback'+(fb[m][0]==='ok'?' ok':'')+'">'+fb[m][1]()+'</div>';
 if(done[m])h+='<div class="lesson">💡 '+esc(tx(e.lesson))+'</div>';
 h+='<div class="foot"><span><button id="rs">'+t('reset')+'</button> '+(checked[m]&&!done[m]?'<button id="sol">'+t('sol')+'</button>':'')+'</span>'+(done[m]?(m<N-1?'<button id="toM" class="primary">'+t('next')+'</button>':'<button id="fin" class="primary">'+t('finish')+'</button>'):'<button id="chk" class="primary">'+t('check')+'</button>')+'</div></div>';
 show(h)}
function clearFb(){marks[m]=null;fb[m]=null}
function place(chipId,slot){const e=EX[m],s=st[m];
 if(e.type==='sort'){if(slot)s[chipId]=slot;else delete s[chipId]}
 else{for(const k in s)if(s[k]===chipId)delete s[k];if(slot)s[slot]=chipId}
 sel=null;clearFb();render()}
function bind(){const on=(id,f)=>{if($(id))$(id).onclick=f};
 on('begin',()=>{if(ASSESS){student=$('nm').value.trim();classroom=$('cl').value.trim();if(!student||!classroom){$('err').textContent=t('needName');return}}stage='play';deadline=Date.now()+TOTAL*1000;render();tick()});
 on('prv',()=>{if(timeout())return;m--;sel=null;render()});on('nxt',()=>{if(timeout())return;m++;sel=null;render()});
 on('hnt',()=>{hintUsed[m]=true;render()});on('sub',()=>{if(timeout())return;if(!EX.every((_,k)=>answered(k))&&!confirm(t('confirm')))return;submit(false)});on('saveR',saveReport);
 on('again',()=>location.reload());
 EX.forEach((_,k)=>on('mb'+k,()=>{if(timeout())return;m=k;sel=null;render()}));
 on('toM',()=>{m++;sel=null;render()});
 on('fin',()=>{stage='end';finish=Date.now();confetti();render();tick()});
 on('rs',()=>{st[m]={};clearFb();Object.keys(tv).filter(k=>k.startsWith(m+':')).forEach(k=>delete tv[k]);render()});
 on('chk',check);on('sol',solve);
 if(stage!=='play'||done[m])return;
 document.querySelectorAll('input[data-t]').forEach(inp=>{inp.oninput=()=>{tv[inp.dataset.t]=inp.value;inp.classList.remove('ok','bad')};if(ASSESS)inp.onchange=()=>{const y=scrollY;render();scrollTo(0,y)}});
 document.querySelectorAll('.wc[data-id]').forEach(c=>{c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.id);sel=c.dataset.id}});
 document.querySelectorAll('.dz,[data-pool],.sbin').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
  z.ondrop=e=>{e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain')||sel;if(id&&!timeout())place(id,z.dataset.slot||z.dataset.bin||null)}})}
function activate(target){if(stage!=='play'||done[m]||timeout())return;const e=EX[m];
 const bl=target.closest('.bl');if(bl){const k=+bl.dataset.line,v=st[m][k]||'';const nx=v===''?'syn':v==='syn'?'log':'';if(nx)st[m][k]=nx;else delete st[m][k];clearFb();render();return}
 const c=target.closest('.wc[data-id]'),z=target.closest('.dz'),bin=target.closest('.sbin'),pool=target.closest('[data-pool]');
 if(c&&!z&&!(bin&&sel&&sel!==c.dataset.id)){
  if(bin&&!sel){place(c.dataset.id,null);return}
  const same=sel===c.dataset.id;document.querySelectorAll('.wc.sel').forEach(x=>x.classList.remove('sel'));sel=same?null:c.dataset.id;if(!same)c.classList.add('sel');return}
 if(z){if(sel){place(sel,z.dataset.slot);return}if(st[m][z.dataset.slot]){delete st[m][z.dataset.slot];clearFb();render()}return}
 if(bin&&sel){place(sel,bin.dataset.bin);return}
 if(pool&&sel)place(sel,null)}
app.addEventListener('click',e=>activate(e.target));
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.wc,.dz')){e.preventDefault();activate(e.target)}});
const norm=v=>String(v??'').trim().replace(/\s+/g,' ').replace(/,(?=\d)/g,'.');
const same=(a,b)=>{const x=norm(a),y=norm(b);if(x===y)return true;const p=parseFloat(x),q=parseFloat(y);return x!==''&&!isNaN(p)&&!isNaN(q)&&/^-?[\d.]+$/.test(x)&&/^-?[\d.]+$/.test(String(y))&&Math.abs(p-q)<1e-9};
function grade(i){const e=EX[i],s=st[i],mk={};let ok=0,total=0;const TV=k=>tv[i+':'+k];
 if(e.type==='sort')Object.keys(e.chips).forEach(c=>{total++;const g=s[c]===e.answer[c];if(g)ok++;mk[c]=g?'ok':'bad'});
 else if(e.type==='bugs')e.lines.forEach((_,k)=>{total++;const g=(s[k]||'')===(e.answer[k]||'');if(g)ok++;mk['l'+k]=g?'ok':'bad'});
 else if(e.type==='trace')e.rows.forEach((r,ri)=>{r.vals.forEach((v,vi)=>{if(v===null)return;total++;const g=same(TV('r'+ri+'v'+vi),v);if(g)ok++;mk['tr'+ri+'v'+vi]=g?'ok':'bad'});if(r.out!==null){total++;const g=same(TV('r'+ri+'o'),r.out);if(g)ok++;mk['tr'+ri+'o']=g?'ok':'bad'}});
 else slotIds(e).forEach(k=>{total++;const g=e.unordered?(e.unordered.includes(s[k])&&slotIds(e).filter(j=>s[j]===s[k]).length===1):s[k]===e.answer[k];if(g)ok++;mk[k]=g?'ok':'bad'});
 if(e.test)e.test.rows.forEach((r,ri)=>r[1].forEach((v,oi)=>{total++;const g=same(TV(ri+'-'+oi),v);if(g)ok++;mk['t'+ri+'-'+oi]=g?'ok':'bad'}));
 return {ok,total,mk}}
function submit(byTime){results=EX.map((_,k)=>grade(k));stage='end';finish=byTime?deadline:Date.now();if(byTime)expired=true;if(!byTime)confetti();render();tick()}
const chipText=(i,id)=>{const o=chipObj(EX[i],id);return o?(o.code||tx(o)):''};
function slotLabel(e,k,idx){if(e.type==='list')return e.labels[L()][idx];if(e.type==='match'){const r=e.rows.find(r=>r.slot===k);return r.code||tx(r.label)||tx(r.shape)}if(e.type==='pick')return e.diagrams.find(d=>d.slot===k).name;if(e.type==='flow')return t('step')+' '+(idx+1);return t('blank')+' '+(idx+1)}
function reportItems(i){const e=EX[i],s=st[i],R=results[i],mk=R.mk,li=[],mark=g=>g==='ok'?' ✓':' ✗';
 if(e.type==='sort')Object.keys(e.chips).forEach(c=>{const b=e.bins.find(b=>b.id===s[c]);li.push(chipText(i,c)+' → '+(b?tx(b.name):t('empty2'))+mark(mk[c]))});
 else if(e.type==='bugs')e.lines.forEach((ln,k)=>{const v=s[k]||'';li.push(t('line')+' '+(k+1)+': '+ln+' → '+(v==='syn'?t('syn'):v==='log'?t('log'):t('none'))+mark(mk['l'+k]))});
 else if(e.type==='trace')e.rows.forEach((r,ri)=>{const parts=[];r.vals.forEach((v,vi)=>{if(v!==null)parts.push(e.vars[vi]+' = '+(tv[i+':r'+ri+'v'+vi]||t('empty2'))+mark(mk['tr'+ri+'v'+vi]))});if(r.out!==null)parts.push(t('shows')+': '+(tv[i+':r'+ri+'o']||t('empty2'))+mark(mk['tr'+ri+'o']));li.push(r.code+' → '+parts.join(', '))});
 else slotIds(e).forEach((k,idx)=>li.push(slotLabel(e,k,idx)+' → '+(s[k]?chipText(i,s[k]):t('empty2'))+mark(mk[k])));
 if(e.test)e.test.rows.forEach((r,ri)=>li.push(t('in')+' '+e.test.cols.map((c,ci)=>c+'='+r[0][ci]).join(', ')+' → '+r[1].map((_,oi)=>e.test.out[oi]+' = '+(tv[i+':'+ri+'-'+oi]||t('empty2'))+mark(mk['t'+ri+'-'+oi])).join(', ')));
 return li}
function safeName(v){return v.trim().replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,90)||'x'}
async function saveReport(){const status=$('saveStatus'),title=CODE+' · '+t('repTitle')+' · '+tx(HERO.title);const R=results,sum=R.reduce((a,r)=>a+r.ok,0),tot=R.reduce((a,r)=>a+r.total,0);
 const body=EX.map((e,k)=>'<article><h2>'+(k+1)+'. '+esc(tx(e.title))+' — '+R[k].ok+'/'+R[k].total+(hintUsed[k]?' 💡':'')+'</h2><ul>'+reportItems(k).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></article>').join('');
 const html='<!doctype html><html lang="'+L()+'"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:18px/1.5 Arial;max-width:960px;margin:30px auto;padding:20px;color:#213450}h1{color:#146f86}h2{font-size:20px;margin:0 0 6px}article{border-bottom:1px solid #ccc;padding:12px 0}li{font-family:Consolas,monospace;font-size:16px;overflow-wrap:anywhere}.sc{font-size:26px;font-weight:bold;color:#146f86}</style><h1>'+esc(title)+'</h1><p>'+t('name')+': <b>'+esc(student)+'</b><br>'+t('class')+': <b>'+esc(classroom)+'</b><br>'+t('date')+': '+new Date().toLocaleString(L()==='el'?'el-CY':'en-GB')+'</p><p class="sc">'+t('score')+': '+sum+'/'+tot+' ('+Math.round(100*sum/Math.max(1,tot))+'%) · 💡 '+hintUsed.filter(Boolean).length+' '+t('hintsU')+(expired?' · ⏰':'')+'</p>'+body+'</html>';
 const filename=CODE+'_ASSESSMENT_'+safeName(student)+'_'+safeName(classroom)+'.html';
 if(window.showSaveFilePicker&&window.isSecureContext&&window.top===window.self){try{const h=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'HTML',accept:{'text/html':['.html']}}]});const w=await h.createWritable();await w.write(html);await w.close();status.textContent=t('saved');return}catch(err){if(err.name==='AbortError'){status.textContent=t('cancel');return}}}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download=filename;a.textContent=t('dlLink');a.className='button primary';status.replaceChildren(t('dl'),a);a.click()}
function check(){if(timeout())return;const e=EX[m],s=st[m],mk={};let ok=0,total=0,extra=()=>'';
 if(e.type==='sort'){const items=Object.keys(e.chips);if(items.some(c=>!s[c])){fb[m]=['bad',()=>t('missing')];render();return}
  const wrong=[];items.forEach(c=>{total++;const g=s[c]===e.answer[c];if(g)ok++;else wrong.push(c);mk[c]=g?'ok':'bad'});
  if(e.explain)extra=()=>wrong.filter(c=>e.explain[c]).map(c=>'<br>💡 <b>'+esc(e.chips[c].code||tx(e.chips[c]))+':</b> '+esc(tx(e.explain[c]))).join('')}
 else if(e.type==='bugs'){e.lines.forEach((_,k)=>{total++;const g=(s[k]||'')===(e.answer[k]||'');if(g)ok++;mk['l'+k]=g?'ok':'bad'})}
 else if(e.type==='trace'){e.rows.forEach((r,ri)=>{r.vals.forEach((v,vi)=>{if(v===null)return;total++;const g=same(tv[m+':r'+ri+'v'+vi],v);if(g)ok++;mk['tr'+ri+'v'+vi]=g?'ok':'bad'});if(r.out!==null){total++;const g=same(tv[m+':r'+ri+'o'],r.out);if(g)ok++;mk['tr'+ri+'o']=g?'ok':'bad'}})}
 else{const ids=slotIds(e);if(ids.some(k=>!s[k])){fb[m]=['bad',()=>t('missing')];render();return}
  ids.forEach(k=>{total++;const g=e.unordered?e.unordered.includes(s[k]):s[k]===e.answer[k];if(g)ok++;mk[k]=g?'ok':'bad'})}
 if(e.test)e.test.rows.forEach((r,ri)=>r[1].forEach((v,oi)=>{total++;const g=same(tv[m+':'+ri+'-'+oi],v);if(g)ok++;mk['t'+ri+'-'+oi]=g?'ok':'bad'}));
 marks[m]=mk;checked[m]=true;const all=ok===total;if(first[m]===null)first[m]=all;
 if(all){done[m]=true;fb[m]=['ok',()=>t('allok')];confetti()}else{const o=ok,tt=total;fb[m]=['bad',()=>o+'/'+tt+' '+t('some')+extra()]}
 render()}
function solve(){const e=EX[m];st[m]={};const mk={};
 if(e.type==='sort'){Object.assign(st[m],e.answer);Object.keys(e.chips).forEach(c=>mk[c]='ok')}
 else if(e.type==='bugs'){Object.assign(st[m],e.answer);e.lines.forEach((_,k)=>mk['l'+k]='ok')}
 else if(e.type==='trace'){e.rows.forEach((r,ri)=>{r.vals.forEach((v,vi)=>{if(v!==null){tv[m+':r'+ri+'v'+vi]=String(v);mk['tr'+ri+'v'+vi]='ok'}});if(r.out!==null){tv[m+':r'+ri+'o']=String(r.out);mk['tr'+ri+'o']='ok'}})}
 else{if(e.unordered)e.unordered.forEach((c,k)=>st[m]['s'+(k+1)]=c);else Object.assign(st[m],e.answer);slotIds(e).forEach(k=>mk[k]='ok')}
 if(e.test)e.test.rows.forEach((r,ri)=>r[1].forEach((v,oi)=>{tv[m+':'+ri+'-'+oi]=String(v);mk['t'+ri+'-'+oi]='ok'}));
 marks[m]=mk;helped[m]=true;done[m]=true;fb[m]=['ok',()=>t('helped')];render()}
function setTimer(left,cls,text){$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('fill').style.width=(left/TOTAL*100)+'%';$('timer').className='timer'+cls;$('timeStatus').textContent=text}
function timeout(){if(stage==='play'&&Date.now()>=deadline){if(ASSESS){submit(true);return true}expired=true;finish=deadline;stage='end';render()}return stage==='end'}
function tick(){timeout();const left=stage==='start'?TOTAL:Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000));
 setTimer(left,expired?' expired':stage==='play'&&left<=120?' warn':'',expired?t(ASSESS?'t0A':'t0'):stage==='end'?t('tend'):stage==='start'?t('tstart'):left<=60?t('t1'):left<=120?t('t2'):t(ASSESS?'trunA':'trun'))}
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
window.onLang=()=>{render();tick()};
setInterval(tick,250);render();tick();
</script></body></html>
