.pymenu .pyrun{background:#146f86;color:white;border-radius:5px;padding:0 8px;cursor:pointer}
.pywrap{display:flex;min-height:230px;flex:1}
.pygut{margin:0;padding:10px 6px;background:#f1f5f9;color:#8fa1b3;font:600 17px/1.5 Consolas,'Courier New',monospace;text-align:right;user-select:none;overflow:hidden;min-width:34px}
.pycode{flex:1;border:0;outline:0;resize:vertical;padding:10px 12px;font:600 17px/1.5 Consolas,'Courier New',monospace;color:#213450;white-space:pre;overflow:auto;min-height:230px;tab-size:4}
.pyout{flex:1;min-height:230px;max-height:340px;overflow:auto;padding:10px 12px;font:600 16px/1.5 Consolas,'Courier New',monospace;white-space:pre-wrap;color:#213450;background:#fbfdff}
.pyout .pyrs{color:#8fa1b3}.pyout .pyerr{color:#c4302b}.pyout .pyuser{color:#1368ce}.pyout .pyps{color:#8fa1b3}
.pyin{font:600 16px Consolas,monospace;border:0;border-bottom:2px solid #1368ce;outline:0;background:#eef5ff;color:#1368ce;width:12em;padding:0 4px}
.pybtns{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.ctest{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:16px}
.ctest th{font-size:14px;color:#376878;text-align:left;padding:2px 8px}.ctest td{background:#f6f9fc;padding:6px 8px;font-family:Consolas,monospace;vertical-align:top;white-space:pre-wrap}
.ctest td.ok{background:#e6f6ec;color:#16703a;font-weight:800}.ctest td.bad{background:#fdeceb;color:#ae2d28;font-weight:800}
@media(max-width:820px){.pyide{grid-template-columns:1fr}}
@media(max-width:820px){.rules.eight,.rules.six,.cols3{grid-template-columns:1fr}.fs{min-width:170px;font-size:15px}.flowv .dz{min-width:230px}.blanks p{font-size:18px}.sbins{grid-template-columns:1fr!important}}

.progress{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.progress span{height:10px;flex:1;min-width:18px;border-radius:6px;background:#cfdbe6}
.progress span.done{background:#2f9a5c}.progress span.now{background:#5363b8}
.progress b{font-size:14px;color:var(--muted);margin-left:8px;white-space:nowrap}
label{display:block;margin-top:10px;font-size:17px;font-weight:600}
#nm,#cl{font:inherit;width:100%;max-width:520px;border:1px solid #b9c8d9;border-radius:10px;padding:10px 12px;background:white;color:var(--ink);display:block}
.task p{margin:4px 0}

html.en .le{display:none!important}html:not(.en) .ln{display:none!important}
.langs{display:inline-flex;gap:4px;margin-left:6px}
header.top .langs button{padding:5px 11px;font-size:15px;font-weight:700}
header.top .langs button[aria-pressed=true]{background:#a6dfeb;color:#213450;border-color:#a6dfeb}
header.top .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}

</script><script>/* PY: a small Python-subset interpreter for the classroom (lesson A7.3 level).
   Supports: assignment, expression statements, int/float/str/bool/None, tuples in % formatting,

    if (!isFinite(v)) return isNaN(v) ? 'nan' : (v > 0 ? 'inf' : '-inf');

async function runCode(i){const e=EX[i],src=codeS[i],tests=[];for(const [inp,exp] of e.tests){const r=await PY.test(src,inp);tests.push({inputs:inp,expect:exp,printed:r.printed,err:r.err,pass:r.ok&&subseq(numsOf(r.printed),exp)})}
 const reqs=(e.req||[]).map(q=>{let pass=true;if(q==='prompt')pass=!/input\(\s*\)/.test(src);if(q==='label')pass=tests.some(r=>/\p{L}/u.test(r.printed));return {label:q==='prompt'?{el:'Κάθε input() έχει μήνυμα για τον χρήστη',en:'Every input() has a message for the user'}:{el:'Το print εμφανίζει και μήνυμα, όχι μόνο τον αριθμό',en:'print also shows a message, not just the number'},pass}});
 const ok=tests.filter(r=>r.pass).length+reqs.filter(r=>r.pass).length;return {tests,reqs,ok,total:tests.length+reqs.length}}
async function checkCode(){const i=m,R=await runCode(i);codeRes[i]=R;checked[i]=true;const all=R.ok===R.total;if(first[i]===null)first[i]=all;
 if(all){done[i]=true;fb[i]=['ok',()=>t('allok')];confetti()}else{const o=R.ok,tt=R.total,e1=R.tests.find(r=>r.err);fb[i]=['bad',()=>o+'/'+tt+' '+t('codeSome')+(e1?'<br><code>'+esc(e1.err.split('\n').pop())+'</code>':'')]}render()}
function check(){if(timeout())return;if(EX[m].type==='code'){checkCode();return}const e=EX[m],s=st[m],mk={};let ok=0,total=0,extra=()=>'';
 if(e.type==='sort'){const items=Object.keys(e.chips);if(items.some(c=>!s[c])){fb[m]=['bad',()=>t('missing')];render();return}
  const wrong=[];items.forEach(c=>{total++;const g=s[c]===e.answer[c];if(g)ok++;else wrong.push(c);mk[c]=g?'ok':'bad'});
  if(e.explain)extra=()=>wrong.filter(c=>e.explain[c]).map(c=>'<br>💡 <b>'+esc(e.chips[c].code||tx(e.chips[c]))+':</b> '+esc(tx(e.explain[c]))).join('')}
 else if(e.type==='bugs'){e.lines.forEach((_,k)=>{total++;const g=(s[k]||'')===(e.answer[k]||'');if(g)ok++;mk['l'+k]=g?'ok':'bad'})}
 else if(e.type==='trace'){e.rows.forEach((r,ri)=>{r.vals.forEach((v,vi)=>{if(v===null)return;total++;const g=same(tv[m+':r'+ri+'v'+vi],v);if(g)ok++;mk['tr'+ri+'v'+vi]=g?'ok':'bad'});if(r.out!==null){total++;const g=same(tv[m+':r'+ri+'o'],r.out);if(g)ok++;mk['tr'+ri+'o']=g?'ok':'bad'}})}
 else{const ids=slotIds(e);if(ids.some(k=>!s[k])){fb[m]=['bad',()=>t('missing')];render();return}
  ids.forEach(k=>{total++;const g=e.unordered?e.unordered.includes(s[k]):s[k]===e.answer[k];if(g)ok++;mk[k]=g?'ok':'bad'})}
 if(e.test)e.test.rows.forEach((r,ri)=>r[1].forEach((v,oi)=>{total++;const g=same(tv[m+':'+ri+'-'+oi],v);if(g)ok++;mk['t'+ri+'-'+oi]=g?'ok':'bad'}));
 marks[m]=mk;checked[m]=true;const all=ok===total;if(first[m]===null)first[m]=all;
 if(all){done[m]=true;fb[m]=['ok',()=>t('allok')];confetti()}else{const o=ok,tt=total;fb[m]=['bad',()=>o+'/'+tt+' '+t('some')+extra()]}
 render()}
function solve(){const e=EX[m];if(e.type==='code'){const i=m;codeS[i]=tx(e.solution);runCode(i).then(R=>{codeRes[i]=R;helped[i]=true;done[i]=true;fb[i]=['ok',()=>t('helped')];render()});return}st[m]={};const mk={};
 if(e.type==='sort'){Object.assign(st[m],e.answer);Object.keys(e.chips).forEach(c=>mk[c]='ok')}
 else if(e.type==='bugs'){Object.assign(st[m],e.answer);e.lines.forEach((_,k)=>mk['l'+k]='ok')}
 else if(e.type==='trace'){e.rows.forEach((r,ri)=>{r.vals.forEach((v,vi)=>{if(v!==null){tv[m+':r'+ri+'v'+vi]=String(v);mk['tr'+ri+'v'+vi]='ok'}});if(r.out!==null){tv[m+':r'+ri+'o']=String(r.out);mk['tr'+ri+'o']='ok'}})}
 else{if(e.unordered)e.unordered.forEach((c,k)=>st[m]['s'+(k+1)]=c);else Object.assign(st[m],e.answer);slotIds(e).forEach(k=>mk[k]='ok')}
 if(e.test)e.test.rows.forEach((r,ri)=>r[1].forEach((v,oi)=>{tv[m+':'+ri+'-'+oi]=String(v);mk['t'+ri+'-'+oi]='ok'}));
 marks[m]=mk;helped[m]=true;done[m]=true;fb[m]=['ok',()=>t('helped')];render()}
function setTimer(left,cls,text){$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('fill').style.width=(left/TOTAL*100)+'%';$('timer').className='timer'+cls;$('timeStatus').textContent=text}
function timeout(){if(stage==='grading')return true;if(stage==='play'&&Date.now()>=deadline){if(ASSESS){submit(true);return true}expired=true;finish=deadline;stage='end';render()}return stage==='end'}
function tick(){timeout();const left=stage==='start'?TOTAL:Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000));
 setTimer(left,expired?' expired':stage==='play'&&left<=120?' warn':'',expired?t(ASSESS?'t0A':'t0'):stage==='end'?t('tend'):stage==='start'?t('tstart'):left<=60?t('t1'):left<=120?t('t2'):t(ASSESS?'trunA':'trun'))}
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
window.onLang=()=>{render();tick()};
setInterval(tick,250);render();tick();
</script></body></html>
