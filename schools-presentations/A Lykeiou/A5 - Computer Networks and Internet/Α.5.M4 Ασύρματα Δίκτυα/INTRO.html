ο laptop δεν συνδέεται", "Το PC0 βλέπει το δίκτυο SCHOOL, αλλά μετά την αλλαγή των ρυθμίσεων δεν συνδέεται.", "Ποιες ρυθμίσεις θα ελέγχατε πρώτα;", "Την ασύρματη κάρτα, το SSID, τον τύπο ασφάλειας και το Pre-shared Key."], ["Το ασύρματο δίκτυο", "Ο Wireless Router συνδέει ασύρματα τα PC0 και PC1. Κάθε PC χρειάζεται ασύρματη κάρτα δικτύου.", "Αρκεί να τοποθετήσουμε δύο PC δίπλα στον Router;", "Χρειάζονται συμβατές κάρτες και σωστές ρυθμίσεις σύνδεσης. Στο Packet Tracer σβήνουμε το PC πριν αλλάξουμε κάρτα."], ["SSID · Το όνομα του δικτύου", "Το SSID αναγνωρίζει το ασύρματο δίκτυο. Στην άσκηση αλλάζουμε το Default σε SCHOOL και πατάμε Save Settings.", "Το όνομα SCHOOL είναι ο κωδικός;", "Το SCHOOL είναι το SSID. Ο κωδικός συμπληρώνεται σε διαφορετικό πεδίο."], ["Πρόσβαση και κρυπτογράφηση", "Η πιστοποίηση ελέγχει ποιος συνδέεται. Η κρυπτογράφηση προστατεύει τα δεδομένα κατά τη μετάδοση. Στην άσκηση επιλέγουμε WPA2 Personal και Passphrase guesswhat.", "Ποιες ρυθμίσεις πρέπει να συμφωνούν στο PC και στον Router;", "Το SSID, ο τύπος ασφάλειας και το κλειδί. Το guesswhat είναι η τιμή της άσκησης."], ["Επανασύνδεση των PC", "PC0 → Desktop → PC Wireless → Connect → Refresh → SCHOOL → Connect. Πληκτρολογούμε guesswhat στο Pre-shared Key. Επαναλαμβάνουμε για PC1.", "Γιατί χάθηκε η σύνδεση μετά την αλλαγή του Router;", "Τα PC χρειάζονται τις νέες ρυθμίσεις SSID και ασφάλειας."], ["IP Address και έλεγχος", "Ο Router μπορεί μέσω DHCP να δώσει τις ρυθμίσεις δικτύου. Καταγράφουμε τις πραγματικές IP των PC και χρησιμοποιούμε ping προς την IP του άλλου PC.", "Αν το ping αποτύχει, τι ελέγχουμε;", "Κάρτα και τροφοδοσία, σύνδεση στο SCHOOL, κλειδί και ρυθμίσεις IP. Διορθώνουμε και δοκιμάζουμε ξανά."], ["Η διαδρομή της άσκησης", "Δημιουργία δικτύου → κάρτες → IP → ping → SSID και ασφάλεια → επανασύνδεση → File → Save ως Network2.", "Ποια στοιχεία θα καταγράφατε για να αποδείξετε ότι ολοκληρώσατε την εργασία;", "Τις IP του PC0 και του PC1, το αποτέλεσμα του ping και την επιτυχημένη επανασύνδεση. Αποθηκεύουμε το Network2."]], "en": [["The laptop cannot connect", "PC0 can see SCHOOL, but cannot connect after the settings changed.", "Which settings would you check first?", "The wireless card, SSID, security mode and Pre-shared Key."], ["The wireless network", "The Wireless Router connects PC0 and PC1 wirelessly. Each PC needs a wireless network card.", "Is placing two PCs beside the Router enough?", "They need compatible cards and correct connection settings. In Packet Tracer, turn the PC off before replacing its card."], ["SSID · The network name", "The SSID identifies the wireless network. In the exercise, change Default to SCHOOL and click Save Settings.", "Is SCHOOL the password?", "SCHOOL is the SSID. The password goes in a separate field."], ["Access and encryption", "Authentication controls who connects. Encryption protects data during transmission. In the exercise select WPA2 Personal and use Passphrase guesswhat.", "Which settings must match on the PC and Router?", "The SSID, security mode and key. guesswhat is the value specified in the exercise."], ["Reconnect the PCs", "PC0 → Desktop → PC Wireless → Connect → Refresh → SCHOOL → Connect. Enter guesswhat in Pre-shared Key. Repeat for PC1.", "Why was the connection lost after changing the Router?", "The PCs need the new SSID and security settings."], ["IP Address and testing", "The Router can supply network settings through DHCP. Record the actual IP addresses and use ping with the other PC’s IP.", "What do you check if ping fails?", "The card and power, SCHOOL connection, key and IP settings. Correct the problem and test again."], ["The exercise workflow", "Build network → cards → IP → ping → SSID and security → reconnect → File → Save as Network2.", "What would you record as evidence of completing the task?", "The IP addresses of PC0 and PC1, the ping result and successful reconnection. Save Network2."]], "ru": [["Ноутбук не подключается", "PC0 видит SCHOOL, но после изменения настроек не подключается.", "Какие настройки вы проверите сначала?", "Беспроводную карту, SSID, режим безопасности и Pre-shared Key."], ["Беспроводная сеть", "Wireless Router соединяет PC0 и PC1 по беспроводной связи. Каждому PC нужна беспроводная сетевая карта.", "Достаточно поставить два PC рядом с Router?", "Нужны совместимые карты и правильные настройки. В Packet Tracer выключайте PC перед заменой карты."], ["SSID · Имя сети", "SSID обозначает беспроводную сеть. В задании изменяем Default на SCHOOL и нажимаем Save Settings.", "SCHOOL — это пароль?", "SCHOOL — это SSID. Пароль вводится в отдельное поле."], ["Доступ и шифрование", "Аутентификация контролирует доступ. Шифрование защищает передаваемые данные. В задании выбираем WPA2 Personal и Passphrase guesswhat.", "Какие настройки должны совпадать на PC и Router?", "SSID, режим безопасности и ключ. guesswhat — значение из задания."], ["Повторное подключение PC", "PC0 → Desktop → PC Wireless → Connect → Refresh → SCHOOL → Connect. Введите guesswhat в Pre-shared Key. Повторите для PC1.", "Почему связь пропала после изменения настроек Router?", "Для PC нужно задать новые SSID и параметры безопасности."], ["IP Address и проверка", "Router может выдавать настройки через DHCP. Запишите фактические IP и выполните ping к IP другого PC.", "Что проверить при неудачном ping?", "Карту и питание, подключение к SCHOOL, ключ и настройки IP. Устраните проблему и повторите проверку."], ["Порядок работы", "Создать сеть → карты → IP → ping → SSID и безопасность → подключение → File → Save как Network2.", "Как подтвердить выполнение задания?", "Запишите IP PC0 и PC1, результат ping и успешного подключения. Сохраните Network2."]], "fa": [["لپ‌تاپ وصل نمی‌شود", "PC0 شبکهٔ SCHOOL را می‌بیند، اما پس از تغییر تنظیمات وصل نمی‌شود.", "ابتدا چه تنظیماتی را بررسی می‌کنید؟", "کارت بی‌سیم، SSID، حالت امنیت و Pre-shared Key."], ["شبکهٔ بی‌سیم", "Wireless Router رایانه‌های PC0 و PC1 را بی‌سیم متصل می‌کند. هر PC به کارت شبکهٔ بی‌سیم نیاز دارد.", "آیا قرار دادن دو PC کنار Router کافی است؟", "کارت سازگار و تنظیمات درست لازم است. در Packet Tracer پیش از تعویض کارت، PC را خاموش کنید."], ["SSID · نام شبکه", "SSID شبکهٔ بی‌سیم را مشخص می‌کند. در تمرین، Default را به SCHOOL تغییر می‌دهیم و Save Settings را می‌زنیم.", "آیا SCHOOL رمز است؟", "SCHOOL نام شبکه یا SSID است. رمز در بخش دیگری وارد می‌شود."], ["دسترسی و رمزنگاری", "احراز هویت دسترسی را کنترل می‌کند. رمزنگاری از داده‌های در حال انتقال محافظت می‌کند. در تمرین WPA2 Personal و Passphrase برابر guesswhat را انتخاب می‌کنیم.", "کدام تنظیمات PC و Router باید یکسان باشند؟", "SSID، حالت امنیت و کلید. guesswhat مقدار تعیین‌شده در تمرین است."], ["اتصال دوبارهٔ PCها", "PC0 → Desktop → PC Wireless → Connect → Refresh → SCHOOL → Connect. در Pre-shared Key مقدار guesswhat را وارد کنید. برای PC1 تکرار کنید.", "چرا پس از تغییر تنظیمات Router ارتباط قطع شد؟", "PCها به SSID و تنظیمات امنیتی جدید نیاز دارند."], ["IP Address و بررسی", "Router می‌تواند تنظیمات را با DHCP اختصاص دهد. IP واقعی رایانه‌ها را ثبت و با IP رایانهٔ دیگر دستور ping را اجرا کنید.", "اگر ping موفق نبود چه چیزی را بررسی می‌کنید؟", "کارت و روشن بودن رایانه، اتصال به SCHOOL، کلید و تنظیمات IP. مشکل را برطرف و دوباره آزمایش کنید."], ["مراحل تمرین", "ساخت شبکه ← کارت‌ها ← IP ← ping ← SSID و امنیت ← اتصال دوباره ← File → Save با نام Network2.", "برای نشان دادن انجام کار چه چیزهایی ثبت می‌کنید؟", "IP رایانه‌های PC0 و PC1، نتیجهٔ ping و اتصال دوبارهٔ موفق. Network2 را ذخیره کنید."]]};

 if(page===3){renderFinish();return}
 const sourcePage=(MODE==='practice'?99:102)+page;
 let content='<div class="card"><div class="tag">'+t(MODE==='practice'?21:22)+' · '+sourcePage+'</div><h1>'+t(0)+'</h1><p class="muted">'+t(12)+' '+sourcePage+'</p>';
 if(lang==='el')content+='<img class="page-image" src="'+IMAGES[sourcePage]+'" alt="'+t(12)+' '+sourcePage+'" onclick="zoom()">';
 else content+='<div class="columns"><div><img class="page-image" src="'+IMAGES[sourcePage]+'" alt="'+t(12)+' '+sourcePage+'" onclick="zoom()"></div><div><h2>'+t(13)+'</h2><div class="translation">'+escapeText(TRANSLATIONS[lang][sourcePage-99])+'</div></div></div>';
 content+='<button onclick="zoom()">'+t(20)+'</button><div class="checkpoint"><label><input type="checkbox" '+(state.done[sourcePage]?'checked':'')+' onchange="state.done['+sourcePage+']=this.checked;persist()"> '+t(11)+'</label>';
 if(sourcePage===101)content+='<div class="row"><label>PC0 · IP Address <input dir="ltr" value="'+escapeText(state.ip0)+'" oninput="state.ip0=this.value;persist()"></label><label>PC1 · IP Address <input dir="ltr" value="'+escapeText(state.ip1)+'" oninput="state.ip1=this.value;persist()"></label></div>';
 content+='<label for="notes">'+t(10)+'</label><textarea id="notes" oninput="state.notes['+sourcePage+']=this.value;persist()">'+escapeText(state.notes[sourcePage]||'')+'</textarea></div></div><div class="footer"><button onclick="move(-1)" '+(page===0?'disabled':'')+'>'+t(1)+'</button><span>'+(page+1)+' / 3</span><button class="primary" onclick="move(1)">'+t(2)+'</button></div>';
 $('content').innerHTML=content;
}
function renderFinish(){
 $('content').innerHTML='<div class="card"><h1>'+t(MODE==='practice'?21:22)+'</h1><p>'+escapeText(state.name)+' · '+escapeText(state.className)+'</p><p>'+t(30)+'</p><p class="muted">'+t(31)+'</p><button class="primary" onclick="saveReport()">'+t(9)+'</button><p id="saved" role="status"></p><div class="row"><button onclick="move(-1)">'+t(1)+'</button><a class="button" href="student_index.html">'+t(3)+'</a>'+(MODE==='practice'?'<a class="button primary" href="ASSESSMENT.html">'+t(22)+' →</a>':'')+'</div></div>';
}
function begin(){if(!state.name.trim()||!state.className.trim()){$('formError').textContent=t(14);return}started=true;persist();render()}
function move(delta){page=Math.max(0,Math.min(STUDENT?3:6,page+delta));render();window.scrollTo(0,0)}
function zoom(){$('bigImage').src=IMAGES[(MODE==='practice'?99:102)+page];$('imageDialog').showModal()}
function saveReport(){
 const start=MODE==='practice'?99:102;
 const lines=['Α.5.Μ4 — '+t(0),state.name,state.className,new Date().toLocaleString(),lang,MODE];
 for(let p=start;p<start+3;p++)lines.push('\nPage '+p+' — Completed: '+!!state.done[p],state.notes[p]||'');
 lines.push('\nPC0 IP: '+state.ip0,'PC1 IP: '+state.ip1);
 const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='A5M4_'+MODE+'_'+state.name.replace(/[^\p{L}\p{N}_-]/gu,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('saved').textContent=t(15);
}
function toggleTimer(){if(remaining<=0)return;if(running){remaining=Math.max(0,(deadline-Date.now())/1000);running=false}else{running=true;deadline=Date.now()+remaining*1000}paintTimer()}
function resetTimer(){running=false;remaining=600;paintTimer()}
function paintTimer(){if(MODE!=='theory')return;const s=Math.ceil(remaining);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('toggle').textContent=t(running?7:6);$('reset').textContent=t(8);$('warning').textContent=s===0?t(16):s<=60?t(18):s<=120?t(17):''}
setInterval(()=>{if(running){remaining=Math.max(0,(deadline-Date.now())/1000);if(!remaining)running=false;paintTimer()}},250);
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
document.addEventListener('keydown',event=>{if(STUDENT||MODE==='professor'||MODE==='student'||MODE==='intro'||/INPUT|SELECT|TEXTAREA|BUTTON/.test(event.target.tagName))return;if(event.key==='ArrowRight')move(1);if(event.key==='ArrowLeft')move(-1)});
render();
</script></body></html>
