 network card by dragging and dropping it at the bottom right of the window.\n(d) Make sure an empty black slot appears where the network card was.\n(e) Drag the wireless network card from the bottom right into the empty slot you created.", "5. (continued)\n(f) Turn PC0 on by pressing ON/OFF once.\n(g) Close the PC0 window.\n(h) Open PC1 and repeat the same process to add a wireless network card to PC1.\nYour final wireless network should look like the figure.\n6. Record the IP Address assigned by the Router to each PC.\nPC0: ________ . ________ . ________ . ________\nPC1: ________ . ________ . ________ . ________\n7. Use the ping command to check whether PC0 can communicate with PC1. Check for possible problems and solve them.", "WIRELESS NETWORK SECURITY\n8. The network you created has a security gap. Any computer you add can connect without a password. To create a secure, controlled network, set passwords on the Wireless Router as follows.\n(a) Select Router WRT300N and click the GUI tab.\n(b) Select Wireless and change Network Name (SSID) from Default to SCHOOL. Click Save Settings.\n(c) Select Wireless Security and change Security mode from Disabled to WPA2 Personal.\nDisabled = open network without a password.\nWEP, WPA Personal, WPA2 Personal = password-protected network.\n(d) In Passphrase, you can add the password you want. It must have at least 8 characters.\n(e) Enter guesswhat and click Save Settings.", "After changing the network name (SSID) and password, your network is relatively secure.\n9. The two computers have now lost their connection to the Wireless Router and wireless network. Configure them with the security settings you defined.\n(a) Select PC0, the Desktop tab, then click PC Wireless.\n(b) On the next screen, select Connect and press Refresh until the wireless network named SCHOOL appears.\n(c) Select SCHOOL, then click Connect to connect.", "9. (continued)\n(d) Enter guesswhat in Pre-shared Key and click Connect.\n(e) Close the two open windows and check whether PC0 has reconnected to the Router.\n(f) Repeat for PC1. The final network should look like the figure.\n10. Save the file using File → Save (or the disk icon), with the name Network2 in the folder your teacher specifies.\nADDITIONAL ACTIVITIES\n11. Create the network shown in the figure.\n12. Open Troubleshooting 2.pka and find the errors in the wireless network.\n13. Open Troubleshooting 3.pka and follow the instructions shown.\n14. With your teacher, carry out this task using a small Wireless Router and classroom computers fitted with USB Wireless adapters."], "ru": ["1. Откройте Cisco Packet Tracer.\n2. Спроектируйте беспроводную сеть, используя (а) один wireless router и (б) конечные устройства (PC или laptop), оснащённые беспроводной сетевой картой для подключения к беспроводному устройству.\n3. Мышью перетащите (drag and drop) беспроводное сетевое устройство в центр основного рабочего поля, как показано на рисунке. Выберите Wireless Devices, затем модель WRT300N.", "4. С помощью мыши добавьте два компьютера, PC0 и PC1.\n5. Установите в компьютеры беспроводные сетевые карты для подключения к беспроводному сетевому устройству.\n(а) Выберите PC0 и выключите его одним нажатием ON/OFF.\n(б) Положение выключателя показано на рисунке. Убедитесь, что LED над ним меняет цвет с зелёного на чёрный.\n(в) Пока компьютер выключен, извлеките сетевую карту, перетащив её в правую нижнюю часть окна.\n(г) На месте карты должен появиться пустой чёрный слот.\n(д) Перетащите беспроводную сетевую карту из правого нижнего угла в освободившийся слот.", "5. (продолжение)\n(е) Включите PC0 одним нажатием ON/OFF.\n(ж) Закройте окно PC0.\n(з) Откройте PC1 и повторите те же действия, установив беспроводную сетевую карту.\nГотовая беспроводная сеть должна выглядеть как на рисунке.\n6. Запишите IP Address, назначенный Router каждому PC.\nPC0: ________ . ________ . ________ . ________\nPC1: ________ . ________ . ________ . ________\n7. Командой ping проверьте связь PC0 с PC1. Найдите возможные проблемы и устраните их.", "БЕЗОПАСНОСТЬ БЕСПРОВОДНОЙ СЕТИ\n8. В созданной сети есть пробел в безопасности. Любой добавленный компьютер может подключиться без пароля. Для создания безопасной, контролируемой сети задайте пароли на Wireless Router.\n(а) Выберите Router WRT300N и вкладку GUI.\n(б) Выберите Wireless и измените Network Name (SSID) с Default на SCHOOL. Нажмите Save Settings.\n(в) Выберите Wireless Security и измените Security mode с Disabled на WPA2 Personal.\nDisabled = открытая сеть без пароля.\nWEP, WPA Personal, WPA2 Personal = сеть с защитой паролем.\n(г) В Passphrase можно указать желаемый пароль длиной не менее 8 символов.\n(д) Введите guesswhat и нажмите Save Settings.", "После изменения имени сети (SSID) и пароля ваша сеть относительно безопасна.\n9. Теперь оба компьютера потеряли соединение с Wireless Router и беспроводной сетью. Настройте их с заданными параметрами безопасности.\n(а) Выберите PC0, вкладку Desktop, затем PC Wireless.\n(б) На следующем экране выберите Connect и нажимайте Refresh, пока не появится сеть SCHOOL.\n(в) Выберите SCHOOL и нажмите Connect для подключения.", "9. (продолжение)\n(г) Введите guesswhat в Pre-shared Key и нажмите Connect.\n(д) Закройте два открытых окна и проверьте, подключился ли PC0 к Router.\n(е) Повторите для PC1. Готовая сеть должна выглядеть как на рисунке.\n10. Сохраните файл через File → Save (или значок дискеты) под именем Network2 в папке, указанной учителем.\nДОПОЛНИТЕЛЬНЫЕ ЗАДАНИЯ\n11. Создайте сеть, показанную на рисунке.\n12. Откройте Troubleshooting 2.pka и найдите ошибки беспроводной сети.\n13. Откройте Troubleshooting 3.pka и выполните показанные инструкции.\n14. Вместе с учителем выполните эту работу на реальном оборудовании, используя небольшой Wireless Router и компьютеры кабинета с USB Wireless adapters."], "fa": ["۱. نرم‌افزار Cisco Packet Tracer را باز کنید.\n۲. یک شبکهٔ بی‌سیم با این تجهیزات طراحی کنید. (الف) یک wireless router و (ب) دستگاه‌های پایانی (PC یا laptop) مجهز به کارت شبکهٔ بی‌سیم برای اتصال به دستگاه بی‌سیم.\n۳. با ماوس یک دستگاه شبکهٔ بی‌سیم را به مرکز محیط کار اصلی بکشید و رها کنید (drag and drop)، مانند شکل. نوع Wireless Devices و سپس مدل WRT300N را انتخاب کنید.", "۴. با ماوس دو رایانه به نام‌های PC0 و PC1 اضافه کنید.\n۵. رایانه‌ها را به کارت شبکهٔ بی‌سیم مجهز کنید تا به دستگاه شبکهٔ بی‌سیم متصل شوند.\n(الف) PC0 را انتخاب و با یک بار فشار دادن ON/OFF خاموش کنید.\n(ب) محل کلید در شکل نشان داده شده است. مطمئن شوید رنگ LED بالای کلید از سبز به سیاه تغییر می‌کند.\n(پ) هنگامی که رایانه خاموش است، کارت شبکه را به پایین سمت راست پنجره بکشید و رها کنید تا خارج شود.\n(ت) در محل کارت شبکه باید یک جای خالی سیاه دیده شود.\n(ث) کارت شبکهٔ بی‌سیم را از پایین سمت راست به جای خالی ایجادشده بکشید و رها کنید.", "۵. (ادامه)\n(ج) PC0 را با یک بار فشار دادن ON/OFF روشن کنید.\n(چ) پنجرهٔ PC0 را ببندید.\n(ح) PC1 را باز کنید و همین مراحل را برای نصب کارت شبکهٔ بی‌سیم تکرار کنید.\nشبکهٔ بی‌سیم نهایی باید مانند شکل باشد.\n۶. IP Address اختصاص‌یافته توسط Router به هر PC را یادداشت کنید.\nPC0: ________ . ________ . ________ . ________\nPC1: ________ . ________ . ________ . ________\n۷. با دستور ping بررسی کنید که PC0 با PC1 ارتباط دارد. مشکلات احتمالی را بررسی و برطرف کنید.", "امنیت شبکهٔ بی‌سیم\n۸. شبکه‌ای که ساخته‌اید یک نقص امنیتی دارد. هر رایانه‌ای که اضافه کنید می‌تواند بدون رمز متصل شود. برای ایجاد شبکه‌ای امن و کنترل‌شده، مطابق مراحل زیر روی Wireless Router رمز تنظیم کنید.\n(الف) Router WRT300N را انتخاب و روی زبانهٔ GUI کلیک کنید.\n(ب) Wireless را انتخاب و Network Name (SSID) را از Default به SCHOOL تغییر دهید. روی Save Settings کلیک کنید.\n(پ) Wireless Security را انتخاب و Security mode را از Disabled به WPA2 Personal تغییر دهید.\nDisabled = شبکهٔ باز بدون رمز.\nWEP، WPA Personal، WPA2 Personal = شبکهٔ دارای حفاظت با رمز.\n(ت) در Passphrase رمز دلخواه را وارد کنید. رمز باید حداقل ۸ نویسه داشته باشد.\n(ث) guesswhat را وارد و روی Save Settings کلیک کنید.", "پس از تغییر نام شبکه (SSID) و رمز، شبکهٔ شما نسبتاً امن است.\n۹. اکنون ارتباط دو رایانه با Wireless Router و شبکهٔ بی‌سیم قطع شده است. آن‌ها را با تنظیمات امنیتی تعیین‌شده پیکربندی کنید.\n(الف) PC0 و زبانهٔ Desktop را انتخاب و روی PC Wireless کلیک کنید.\n(ب) در صفحهٔ بعد، زبانهٔ Connect را انتخاب و Refresh را فشار دهید تا شبکهٔ SCHOOL ظاهر شود.\n(پ) شبکهٔ SCHOOL را انتخاب و برای اتصال روی Connect کلیک کنید.", "۹. (ادامه)\n(ت) رمز guesswhat را در Pre-shared Key وارد و روی Connect کلیک کنید.\n(ث) دو پنجرهٔ باز را ببندید و بررسی کنید که PC0 دوباره به Router متصل شده است.\n(ج) همین مراحل را برای PC1 تکرار کنید. شبکهٔ نهایی باید مانند شکل باشد.\n۱۰. با File → Save یا نماد دیسکت، فایل را با نام Network2 در پوشه‌ای که معلم تعیین می‌کند ذخیره کنید.\nفعالیت‌های تکمیلی\n۱۱. شبکهٔ نشان‌داده‌شده در شکل را ایجاد کنید.\n۱۲. فعالیت Troubleshooting 2.pka را باز کنید و خطاهای شبکهٔ بی‌سیم را بیابید.\n۱۳. فعالیت Troubleshooting 3.pka را باز کنید و دستورهای نمایش‌داده‌شده را دنبال کنید.\n۱۴. با همکاری معلم، این کار را در محیط واقعی با یک Wireless Router کوچک و رایانه‌های آزمایشگاه مجهز به USB Wireless adapters انجام دهید."]};const SLIDES={};

const $=id=>document.getElementById(id);
const safeGet=(k,fallback='')=>{try{return localStorage.getItem(k)??fallback}catch{return fallback}};
const safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let lang=safeGet('A5M4-language','el');if(!UI[lang])lang='el';
let page=0,started=false,remaining=600,running=false,deadline=0;
let state={name:'',className:'',notes:{},done:{},ip0:'',ip1:''};
try{Object.assign(state,JSON.parse(safeGet('A5M4-'+MODE,'{}')))}catch{}
function t(i){return UI[lang][i]}
function persist(){safeSet('A5M4-'+MODE,JSON.stringify(state))}
function escapeText(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function changeLanguage(value){lang=value;safeSet('A5M4-language',lang);render()}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 $('language').value=lang;$('heading').textContent='Α.5.Μ4 · '+t(0);$('home').textContent=t(3);$('full').textContent=t(19);
 $('home').href=STUDENT?'student_index.html':'professor_index.html';
 $('sources').textContent=t(27);$('sourceText').textContent=t(28);$('warning').textContent='';
 if(MODE==='professor'||MODE==='student')return renderIndex();
 if(STUDENT)return renderStudent();
 const index=MODE==='intro'?0:page;const s=SLIDES[lang][index];
 $('content').innerHTML='<div class="card"><div class="tag">'+t(MODE==='intro'?24:23)+' · '+(page+1)+' / '+(MODE==='intro'?1:7)+'</div><h1>'+s[0]+'</h1><div class="network"><span>PC0</span> ··· <span>◉ WRT300N</span> ··· <span>PC1</span></div><p>'+s[1]+'</p><div class="checkpoint"><p>💬 '+s[2]+'</p><button onclick="$(\'answer\').hidden=!$(\'answer\').hidden">'+t(32)+'</button><div class="answer" id="answer" hidden>'+s[3]+'</div></div></div>';
 if(MODE==='theory')$('content').innerHTML+='<div class="footer"><button onclick="move(-1)" '+(page===0?'disabled':'')+'>'+t(1)+'</button><span>'+(page+1)+' / 7</span><button onclick="move(1)" '+(page===6?'disabled':'')+'>'+t(2)+'</button></div>';
 $('timerBox').hidden=MODE!=='theory';paintTimer();
}
function renderIndex(){
 $('timerBox').hidden=true;
 const links=MODE==='professor'?[['INTRO.html',24],['THEORY.html',23],['students/student_index.html',21]]:[['PRACTICE.html',21],['ASSESSMENT.html',22]];
 $('content').innerHTML='<div class="card"><div class="tag">Α.5.Μ4</div><h1>'+t(0)+'</h1><p>'+t(25)+'</p><p class="muted">'+t(26)+'</p></div><div class="navcards">'+links.map(([href,label])=>'<a href="'+href+'">'+t(label)+' →</a>').join('')+'</div>';
 $('home').hidden=true;
}
function renderStudent(){
 $('timerBox').hidden=true;
 if(!started){
 $('content').innerHTML='<div class="card"><div class="tag">'+t(MODE==='practice'?21:22)+'</div><h1>'+t(0)+'</h1><p>'+t(25)+'</p><label for="studentName">'+t(4)+'</label><input id="studentName" autocomplete="name" value="'+escapeText(state.name)+'" oninput="state.name=this.value;persist()"><label for="studentClass">'+t(5)+'</label><input id="studentClass" value="'+escapeText(state.className)+'" oninput="state.className=this.value;persist()"><p><button class="primary" onclick="begin()">'+t(6)+'</button></p><div id="formError" role="alert"></div></div>';return;
 }
 if(page===3){renderFinish();return}
 const sourcePage=(MODE==='practice'?99:102)+page;
 let content='<div class="card"><div class="tag">'+t(MODE==='practice'?21:22)+' · '+sourcePage+'</div><h1>'+t(0)+'</h1><p class="muted">'+t(12)+' '+sourcePage+'</p>';
 if(lang==='el')content+='<img class="page-image" src="'+IMAGES[sourcePage]+'" alt="'+t(12)+' '+sourcePage+'" onclick="zoom()">';
 else content+='<div class="columns"><div><img class="page-image" src="'+IMAGES[sourcePage]+'" alt="'+t(12)+' '+sourcePage+'" onclick="zoom()"></div><div><h2>'+t(13)+'</h2><div class="translation">'+escapeText(TRANSLATIONS[lang][sourcePage-99])+'</div></div></div>';
 content+='<button onclick="zoom()">'+t(20)+'</button><div class="checkpoint"><label><input type="checkbox" '+(state.done[sourcePage]?'checked':'')+' onchange="state.done['+sourcePage+']=this.checked;persist()"> '+t(11)+'</label>';
 if(sourcePage===101)content+='<div class="row"><label>PC0 · IP Address <input dir="ltr" value="'+escapeText(state.ip0)+'" oninput="state.ip0=this.value;persist()"></label><label>PC1 · IP Address <input dir="ltr" value="'+escapeText(state.ip1)+'" oninput="state.ip1=this.value;persist()"></label></div>';
 content+='<label for="notes">'+t(10)+'</label><textarea id="notes" oninput="state.notes['+sourcePage+']=this.value;persist()">'+escapeText(state.notes[sourcePage]||'')+'</textarea></div></div><div class="footer"><button onclick="move(-1)" '+(page===0?'disabled':'')+'>'+t(1)+'</button><span>'+(page+1)+' / 3</span><button class="primary" onclick="move(1)">'+t(2)+'</button></div>';
 $('content').innerHTML=content;
}
function renderFinish(){
 $('content').innerHTML='<div class="card"><h1>'+t(MODE==='practice'?21:22)+'</h1><p>'+escapeText(state.name)+' · '+escapeText(state.className)+'</p><p>'+t(30)+'</p><p class="muted">'+t(31)+'</p><button class="primary" onclick="saveReport()">'+t(9)+'</button><p id="saved" role="status"></p><div class="row"><button onclick="move(-1)">'+t(1)+'</button><a class="button" href="student_index.html">'+t(3)+'</a>'+(MODE==='practice'?'<a class="button primary" href="ASSESSMENT.html">'+t(22)+' →</a>':'')+'</div></div>';
}
function begin(){if(!state.name.trim()||!state.className.trim()){$('formError').textContent=t(14);return}started=true;persist();render()}
function move(delta){page=Math.max(0,Math.min(STUDENT?3:6,page+delta));render();window.scrollTo(0,0)}
function zoom(){$('bigImage').src=IMAGES[(MODE==='practice'?99:102)+page];$('imageDialog').showModal()}
function saveReport(){
 const start=MODE==='practice'?99:102;
 const lines=['Α.5.Μ4 — '+t(0),state.name,state.className,new Date().toLocaleString(),lang,MODE];
 for(let p=start;p<start+3;p++)lines.push('\nPage '+p+' — Completed: '+!!state.done[p],state.notes[p]||'');
 lines.push('\nPC0 IP: '+state.ip0,'PC1 IP: '+state.ip1);
 const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='A5M4_'+MODE+'_'+state.name.replace(/[^\p{L}\p{N}_-]/gu,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('saved').textContent=t(15);
}
function toggleTimer(){if(remaining<=0)return;if(running){remaining=Math.max(0,(deadline-Date.now())/1000);running=false}else{running=true;deadline=Date.now()+remaining*1000}paintTimer()}
function resetTimer(){running=false;remaining=600;paintTimer()}
function paintTimer(){if(MODE!=='theory')return;const s=Math.ceil(remaining);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('toggle').textContent=t(running?7:6);$('reset').textContent=t(8);$('warning').textContent=s===0?t(16):s<=60?t(18):s<=120?t(17):''}
setInterval(()=>{if(running){remaining=Math.max(0,(deadline-Date.now())/1000);if(!remaining)running=false;paintTimer()}},250);
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
document.addEventListener('keydown',event=>{if(STUDENT||MODE==='professor'||MODE==='student'||MODE==='intro'||/INPUT|SELECT|TEXTAREA|BUTTON/.test(event.target.tagName))return;if(event.key==='ArrowRight')move(1);if(event.key==='ArrowLeft')move(-1)});
render();
</script></body></html>
