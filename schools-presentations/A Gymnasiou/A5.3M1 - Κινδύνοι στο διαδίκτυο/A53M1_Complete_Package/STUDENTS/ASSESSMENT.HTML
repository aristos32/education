 solid #333;padding-bottom:15px}} .timerbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid #cadce3;padding:10px 4vw;display:flex;gap:15px;align-items:center;flex-wrap:wrap}.timerbar strong{font-size:27px;font-variant-numeric:tabular-nums}.timerbar.warn{background:#fff2d2;border-color:#d79c24}.timerbar.expired{background:#ffe5df;border-color:#c83b27}.timerbar p{margin:0}.alert{color:#9c241a;font-weight:bold;background:#fff0e8;padding:12px;border-radius:8px}.correct{background:#b8edc8!important;color:#064720!important;border:3px solid #16813c!important;opacity:1!important}.savearea{margin:22px 0;padding:20px;background:#e9f3f1;border-radius:14px}@media print{.timerbar{display:none!important}}.options button.correct{background:transparent!important;color:#087b32!important;border:1px solid #beced6!important;box-shadow:none!important;font-weight:400!important;opacity:1!important}.options button.wrong{background:transparent!important;color:#b3261e!important;border:1px solid #beced6!important;box-shadow:none!important;font-weight:400!important}.feedback.answer-correct{background:transparent!important;color:#087b32!important;border:0!important;font-size:20px;font-weight:400}.feedback.answer-wrong{background:transparent!important;color:#b3261e!important;border:0!important;font-size:20px;font-weight:400} .answer-ok{color:#087b32!important;font-weight:400!important;background:transparent!important;border:1px solid #beced6!important;box-shadow:none!important;opacity:1!important}.answer-no{color:#b3261e!important;font-weight:400!important;background:transparent!important;border:1px solid #beced6!important;box-shadow:none!important}.response-ok,.response-no{padding:14px 0;background:transparent;border:0;font-weight:400}.response-ok{color:#087b32}.response-no{color:#b3261e}.response-ok strong,.response-no strong{font-weight:500}.status-line{min-height:32px}.mini-progress{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.mini-progress span{padding:4px 12px async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά και έλεγξε τις ρυθμίσεις λήψεων του browser.';}}
function resultHTML(title,body){return '<!doctype html><html lang="el"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:18px/1.6 Arial;max-width:900px;margin:35px auto;padding:20px}article{border-bottom:1px solid #ccc;padding:15px 0;break-inside:avoid}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{button{display:none}}</style><h1>'+esc(title)+'</h1>'+body+'</html>'}
function safeName(t){return t.replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,70)||'student'}
const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[{"title": "Το απρόσμενο συνημμένο", "case": "Ένα μήνυμα από άγνωστο, με θέμα «I hate school!!!!!!!!!!!!!», περιέχει το αρχείο photo.jpg.vbs και γράφει «Δες αυτή τη φωτογραφία!».", "q": "Ποια ενέργεια μειώνει τον κίνδυνο;", "options": ["Το μετονομάζω σε photo.jpg και το ανοίγω.", "Δεν το εκτελώ και ζητώ βοήθεια για ασφαλή έλεγχο.", "Το προωθώ σε φίλο με Antivirus.", "Το ανοίγω επειδή μοιάζει με φωτογραφία."], "correct": 1, "hint": "Η αλλαγή ονόματος δεν αλλάζει το περιεχόμενο ενός αρχείου. Εξέτασε την τελευταία επέκταση και την προέλευση.", "guide": "Το .vbs δείχνει script και όχι απλή φωτογραφία. Δεν το εκτελώ, δεν το προωθώ και ζητώ βοήθεια για ασφαλή αντιμετώπιση.", "visual": "<div class=\"scenario-top\">EMAIL ΑΠΟ ΑΓΝΩΣΤΟ</div><div class=\"scenario-icon\">✉ 📎</div><h2>I hate school!!!!!!!!!!!!!</h2><div class=\"chatline\">«Δες αυτή τη φωτογραφία!»</div><div class=\"scenario-tags\"><span>photo.jpg.vbs</span><span>Μη αναμενόμενο συνημμένο</span></div>"}, {"title": "Το Inbox γεμίζει προσφορές", "case": "Κάθε μέρα λαμβάνεις δεκάδες διαφημιστικά email από άγνωστους αποστολείς, χωρίς να τα έχεις ζητήσει. Ένας φίλος προτείνει «Απάντησε σε όλους να σταματήσουν» ή «Κάνε back up και θα λυθεί».", "q": "Ποια αντιμετώπιση ταιριάζει στο Spam;", "hint": "Ξεχώρισε το φίλτρο email από το back up και σκέψου τι αποκαλύπτει μια απάντηση σε άγνωστο αποστολέα.", "guide": "Spam: ανεπιθύμητη μαζική αλληλογραφία. Η απάντηση μπορεί να επιβεβαιώσει ότι το email χρησιμοποιείται. Το back up αφορά επαναφορά αρχείων, όχι φίλτρο μηνυμάτων. Χρησιμοποιώ Report spam/Junk και φίλτρο, αποφεύγω ύποπτους συνδέσμους και προσέχω πού δίνω τη διεύθυνσή μου.", "options": ["Report spam και φίλτρο, χωρίς απάντηση.", "Απάντηση σε κάθε αποστολέα για να σταματήσει.", "Back up για να σταματήσουν τα email.", "Άνοιγμα κάθε συνδέσμου διαγραφής."], "correct": 0, "visual": "<div class=\"scenario-top\">ΤΟ INBOX ΓΕΜΙΖΕΙ</div><div class=\"scenario-icon\">✉ ✉ ✉</div><h2>Δεκάδες προσφορές κάθε μέρα</h2><div class=\"scenario-tags\"><span>Άγνωστοι αποστολείς</span><span>Δεν τις ζήτησες</span></div><div class=\"chatline\">Φίλος: «Απάντησε σε όλους να σταματήσουν ή κάνε back up».</div>"}, {"title": "«Θα μπεις στους λογαριασμούς των φίλων σου»", "case": "Ένα μήνυμα υποστηρίζει ότι θα αποκτήσεις πρόσβαση σε λογαριασμούς Facebook φίλων, αρκεί να στείλεις το δικό σου username και password. Δεν υπάρχει συνημμένο.", "q": "Ποιο συμπέρασμα και ποια αντίδραση είναι κατάλληλα;", "options": ["Χωρίς συνημμένο, δεν υπάρχει κίνδυνος.", "Είναι μόνο Spam, αφού δεν ζητά PIN.", "Δίνω password και το αλλάζω αμέσως μετά.", "Είναι Phishing· δεν δίνω κωδικούς και ζητώ βοήθεια."], "correct": 3, "hint": "Το Phishing μπορεί να στοχεύει κωδικούς λογαριασμών και δεν χρειάζεται να περιέχει αρχείο.", "guide": "Το αίτημα username/password με παραπλανητική υπόσχεση δείχνει Phishing. Δεν χρειάζεται να ανοίξω κάτι για να αναγνωρίσω τον κίνδυνο. Δεν επιχειρώ πρόσβαση σε λογαριασμούς άλλων.", "visual": "<div class=\"scenario-top\">ΥΠΟΣΧΕΣΗ ΣΕ ΜΗΝΥΜΑ</div><div class=\"scenario-icon\">💬 🔑</div><div class=\"chatline\">«Θα μπεις στους λογαριασμούς Facebook των φίλων σου!»</div><p>Ζητά το δικό σου <b>username και password</b>.</p><div class=\"scenario-tags\"><span>Χωρίς συνημμένο</span><span>Υπόσχεση πρόσβασης σε άλλους λογαριασμούς</span></div>"}, {"title": "«ΚΑΡΤΑ ΝΕΩΝ» – ένα επείγον δώρο", "case": "Email με λογότυπο τράπεζας γράφει: «Αναβαθμίσαμε την κάρτα νέων. Για να λάβεις δώρα, στείλε άμεσα τον αριθμό και τον κωδικό της κάρτας σου». Δεν γνωρίζεις τον αποστολέα.", "q": "Αναγνώρισε τον κίνδυνο και πρότεινε δύο ασφαλείς ενέργειες.", "hint": "Σκέψου τι ζητά, ποιο δέλεαρ χρησιμοποιεί και πώς θα επιβεβαιώσεις το αίτημα χωρίς να βασιστείς στο email.", "guide": "Πιθανό Phishing: αίτημα για μυστικό κωδικό, δώρα και πίεση χρόνου. Δεν δίνω στοιχεία/δεν πατώ τον σύνδεσμο. Ζητώ βοήθεια και επικοινωνώ από γνωστό επίσημο κανάλι που βρήκα ανεξάρτητα.", "visual": "<div class=\"scenario-top\">EMAIL ΜΕ ΛΟΓΟΤΥΠΟ ΤΡΑΠΕΖΑΣ</div><div class=\"scenario-icon\">💳 🎁</div><h2>«ΚΑΡΤΑ ΝΕΩΝ»</h2><div class=\"chatline\">«Για να λάβεις δώρα, στείλε άμεσα τον αριθμό και τον κωδικό της κάρτας σου».</div><div class=\"scenario-tags\"><span>Άγνωστος αποστολέας</span><span>Επείγον αίτημα</span></div>"}];const extras=[{"title": "Μια προειδοποίηση για τους μικρότερους μαθητές", "case": "Λαμβάνεις αυτό το φανταστικό μήνυμα: «Κέρδισες δωρεάν πόντους για το παιχνίδι σου! Στείλε το username και το password σου μέσα σε 10 λεπτά, αλλιώς το δώρο χάνεται. Μην το πεις σε κανέναν». Θέλεις να βοηθήσεις έναν μικρότερο μαθητή να αποφασίσει τι θα κάνει.", "task": "Δημιούργησε στο Word μια σύντομη ενημερωτική σελίδα με τίτλο «Πριν απαντήσεις, σκέψου». 1. Παράθεσε τρεις συγκεκριμένες φράσεις του μηνύματος που σε υποψιάζουν και εξήγησε γιατί. 2. Γράψε τρεις ασφαλείς ενέργειες που θα προτείνεις στον μικρότερο μαθητή. 3. Εξήγησε με δύο προτάσεις γιατί το ότι έχει Antivirus δεν κάνει ασφαλή την αποστολή του password. Χρησιμοποίησε απλές λέξεις. Αποθήκευσε το Word στον φάκελό σου και γράψε παρακάτω τη βασική συμβουλή της σελίδας σου.", "hint": "Εξέτασε τι ζητά το μήνυμα, πώς σε πιέζει και γιατί ζητά μυστικότητα. Κάθε συμβουλή σου πρέπει να εξηγεί τι ακριβώς θα κάνει ο μαθητής.", "guide": "Έλεγξε αν συνέδεσες κάθε ύποπτη φράση με έναν λόγο και αν έδωσες εφαρμόσιμες συμβουλές. Το Antivirus ελέγχει κακόβουλο λογισμικό· δεν εμποδίζει κάποιον να δώσει μόνος του τον κωδικό του. Δεν χρησιμοποιούμε πραγματικά στοιχεία ή ύποπτους συνδέσμους.", "online": false}, {"title": "Antivirus, update και back up: ποιος κάνει τι;", "case": "Ένας μαθητής πιστεύει ότι το back up αντικαθιστά το Antivirus.", "task": "Ερεύνησε σε επίσημη σελίδα υποστήριξης λειτουργικού συστήματος τι κάνει το Antivirus και σε δεύτερη επίσημη σελίδα τι κάνει το back up. Σε Word φτιάξε πίνακα με ρόλο, ένα πρόβλημα που αντιμετωπίζει και ένα που δεν αποτρέπει για κάθε μέτρο. Πρόσθεσε πηγές και μια τεκμηριωμένη απάντηση στον μαθητή. Δεν χρειάζεται εγκατάσταση ή αλλαγή ρυθμίσεων.", "hint": "Η πρόληψη, ο εντοπισμός και η επαναφορά είναι διαφορετικές λειτουργίες.", "guide": "Μην παρουσιάσεις το back up ως έλεγχο ιών ή το Antivirus ως εγγύηση διατήρησης όλων των αρχείων.", "online": true}, {"title": "Το φίλτρο έκανε λάθος", "case": "Μια αναμενόμενη εργασία του καθηγητή μπήκε στο Junk, ενώ ένα ύποπτο μήνυμα έφτασε στο Inbox.", "task": "Αναζήτησε στον επίσημο οδηγό μιας υπηρεσίας email πώς σημειώνεται Report spam και Not spam. Σε Word γράψε σχέδιο έξι βημάτων για τις δύο περιπτώσεις. Εξήγησε πώς θα επιβεβαιώσεις ότι το μήνυμα του καθηγητή είναι αναμενόμενο πριν το επαναφέρεις. Κατάγραψε πηγή και ημερομηνία. Μη συνδεθείς σε λογαριασμό άλλου και μην αλλάξεις ρυθμίσεις στο εργαστήριο.", "hint": "Η θέση ενός μηνύματος σε φάκελο δεν αποδεικνύει ότι είναι ασφαλές ή επικίνδυνο.", "guide": "Ο έλεγχος από γνωστό κανάλι προηγείται της ενέργειας. Τα φίλτρα μπορεί να κάνουν λάθη προς τις δύο κατευθύνσεις.", "online": true}, {"title": "Μήνυμα από φίλο, αλλιώτικο από τα άλλα", "case": "Λαμβάνεις από το γνωστό email φίλου μήνυμα «Τρέξε αυτό το αρχείο για να δεις φωτογραφίες μας». Το συνημμένο είναι memories.jpg.vbs. Ο φίλος δεν το είχε αναφέρει.", "task": "Σε Word γράψε τουλάχιστον τρεις πιθανές εξηγήσεις και ποια στοιχεία λείπουν για να επιλέξεις ανάμεσά τους. Σχεδίασε ασφαλή τρόπο επιβεβαίωσης, με σύντομο διάλογο από άλλο γνωστό κανάλι. Εξήγησε γιατί ούτε το γνωστό όνομα ούτε η αλλαγή ονόματος του αρχείου αρκούν. Μη δημιουργήσεις ή εκτε η δραστηριότητα χρειάζεται Internet για την έρευνα. Η εφαρμογή λειτουργεί offline. Αν δεν υπάρχει σύνδεση, ξεκίνα σχεδιάζοντας τι θα ελέγξεις και ολοκλήρωσε την έρευνα αργότερα.</p>':''}${x.online?'<p><a href="https://support.microsoft.com/" target="_blank" rel="noopener">Microsoft Support</a> · <a href="https://support.google.com/" target="_blank" rel="noopener">Google Help</a></p>':''}<label for="response">Σύντομη αιτιολόγηση / ευρήματα και πηγές</label><textarea id="response" placeholder="Κατάγραψε ευρήματα, πηγές ή το σχέδιο εργασίας σου…">${esc(responses[ex])}</textarea><button id="extraHint">💡 Καθοδήγηση</button>${extraHints[ex]?`<div class="feedback">${x.hint}</div>`:''}<p id="extraWarning" role="alert"></p></div><div class="foot"><button id="extraPrev" ${ex===0?'disabled':''}>← Προηγούμενο</button><button id="extraNext" class="primary">${ex===extras.length-1?'Ολοκλήρωση επιπλέον δραστηριοτήτων':'Επόμενη αποστολή →'}</button></div>`);return}if(stage==='extraResults'){shell(`<div class="label">ΕΠΙΠΛΕΟΝ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ · ΟΛΟΚΛΗΡΩΣΗ</div><h1>Αποθήκευση της εργασίας σου</h1><div class="paper"><label for="extraName">Ονοματεπώνυμο (υποχρεωτικό)</label><input id="extraName" required value="${esc(extraName||student)}"><button id="saveExtra" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="extraStatus" role="alert"></p><p class="muted">Η αναφορά αποθηκεύει όσα έγραψες εδώ. Το Word αρχείο το αποθηκεύεις χωριστά από την εφαρμογή Word.</p><h2>Παράδοση των εγγράφων Word</h2><p>Όταν ολοκληρώσεις τις εργασίες, επισύναψε τα έγγραφα σε email προς <b>aristos.aresti@gmail.com</b>, με θέμα «Α.5.3 Μ1 – Επιπλέον Δραστηριότητες – Ονοματεπώνυμο».</p><a class="button" href="mailto:aristos.aresti@gmail.com?subject=%CE%91.5.3%20%CE%9C1%20-%20%CE%95%CF%80%CE%B9%CF%80%CE%BB%CE%AD%CE%BF%CE%BD%20%CE%94%CF%81%CE%B1%CF%83%CF%84%CE%B7%CF%81%CE%B9%CF%8C%CF%84%CE%B7%CF%84%CE%B5%CF%82">Άνοιγμα εφαρμογής email</a><p class="smallnote">Απαιτεί σύνδεση και ρυθμισμένη εφαρμογή email. Το μήνυμα δεν αποστέλλεται αυτόματα. Πρόσθεσε εσύ τα αρχεία και το όνομά σου.</p><details><summary>Σημεία αυτοελέγχου των αποστολών</summary>${extras.map((x,j)=>`<div class="source"><h3>${j+1}. ${x.title}</h3><p>${x.guide}</p></div>`).join('')}</details><button id="extraReview">Επιστροφή στις αποστολές</button> </div>`);return}}function capture(){if($('answerA'))openParts.a=$('answerA').value;if($('answerB'))openParts.b=$('answerB').value;if($('response'))responses[ex]=$('response').value}function bind(){listen('begin',()=>{student=$('name').value.trim();classroom=$('class').value.trim();if(!student){$('nameWarning').className='alert';$('nameWarning').textContent='Υποχρεωτικό πεδίο: συμπλήρωσε το ονοματεπώνυμό σου για να συνεχίσεις.';$('name').focus();return}assessmentDeadline=Date.now()+600000;stage='question';render();updateAssessmentClock()});if(stage==='question'&&qs[i].options)qs[i].options.forEach((_,k)=>listen('choice'+k,()=>{if(checkDeadline())return;answers[i]=String(k);render()}));for(const id of ['answerA','answerB'])if($(id))$(id).oninput=()=>{capture();checkDeadline()};listen('hint',()=>{if(checkDeadline())return;capture();hints[i]=true;render()});listen('prev',()=>{if(checkDeadline())return;capture();i--;render()});listen('next',()=>{if(checkDeadline())return;capture();if(!answerComplete(i)){$('answerWarning').className='alert';$('answerWarning').textContent=qs[i].options?'Επίλεξε μία απάντηση πριν συνεχίσεις.':'Συμπλήρωσε και τα δύο μέρη, 4α και 4β, πριν συνεχίσεις.';if($('answerA')){if(!openParts.a.trim())$('answerA').focus();else $('answerB').focus()}else $('choice0')?.focus();return}if(i===qs.length-1)stage='review';else i++;render()});listen('review',()=>{if(checkDeadline())return;i=0;stage='question';render()});listen('submit',()=>{if(checkDeadline()||!completed())return;finishAssessment(false)});listen('finishNow',()=>{if(checkDeadline())return;capture();endedEarly=!completed();finishAssessment(false)});listen('saveAssessment',saveAssessment);listen('extraStart',()=>{if(!submitted)return;student=$('resultName').value.trim()||student;stage='extra';render()});if($('response'))$('response').oninput=()=>responses[ex]=$('response').value;listen('extraHint',()=>{capture();extraHints[ex]=true;render()});listen('extraPrev',()=>{capture();ex--;render()});listen('extraNext',()=>{capture();if(!String(responses[ex]||'').trim()){$('extraWarning').className='alert';$('extraWarning').textContent='Κατάγραψε την απάντηση ή τα ευρήματά σου πριν συνεχίσεις.';$('response').focus();return}if(ex===extras.length-1){extraComplete=true;stage='extraResults'}else ex++;render()});listen('saveExtra',saveExtra);listen('extraReview',()=>{stage='extra';ex=0;render()})}render();</script></body></html>
