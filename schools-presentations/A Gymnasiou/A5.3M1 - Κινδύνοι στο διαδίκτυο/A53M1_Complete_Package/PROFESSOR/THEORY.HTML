const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const slides=[["Κακόβουλα προγράμματα: τι μπορούν να κάνουν;", "90″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"7\" y=\"7\" width=\"10\" height=\"13\" rx=\"5\"/><path d=\"M9 7V4h6v3M3 10h4m10 0h4M3 16h4m10 0h4M12 8v12\"/></svg><span>Viruses · Trojan horses · worms</span></div><div class=\"grid\"><div class=\"paper\"><p>Είναι διαφορετικοί τύποι κακόβουλων προγραμμάτων. Μπορούν να αλλάξουν ή να διαγράψουν αρχεία, να εγκαταστήσουν άλλο επιβλαβές λογισμικό και να δυσκολέψουν τη λειτουργία του υπολογιστή.</p><div class=\"files\"><span>Αρχεία</span><span>Προγράμματα</span><span>Λειτουργία Η/Υ</span></div><p>Ένα ύποπτο συνημμένο ή πρόγραμμα μπορεί να αποτελέσει τρόπο μόλυνσης. Η αργή λειτουργία <b>δεν αποδεικνύει μόνη της</b> ότι υπάρχει ιός.</p></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Ο υπολογιστής αργεί. Μπορούμε να πούμε με βεβαιότητα ότι έχει Virus;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Όχι. Υπάρχουν και άλλες αιτίες. Χρειάζεται έλεγχος με ενημερωμένο Antivirus και βοήθεια από τον καθηγητή.</div></details></div></div>"], ["Προλαμβάνω: τέσσερις διαφορετικές ασπίδες", "105″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z\"/><path d=\"m8 12 3 3 5-6\"/></svg><span>Antivirus · update · back up · τύπος αρχείου</span></div><div class=\"grid\"><div class=\"paper\"><p><b>Antivirus:</b> ελέγχει για κακόβουλο λογισμικό.</p><p><b>Update:</b> κρατά την προστασία ενημερωμένη για νέες απειλές.</p><p><b>Back up:</b> ξεχωριστό αντίγραφο των αρχείων, ώστε να μπορώ να τα επαναφέρω αν χαθούν.</p><p><b>Πλήρης εμφάνιση επεκτάσεων:</b> ελέγχω όλο το όνομα, όχι μόνο το πρώτο μέρος του.</p></div><div class=\"scene\"><h2>Φωτογραφία ή πρόγραμμα;</h2><div class=\"files\"><span style=\"color:#193345\">photo.jpg<span style=\"padding:0;background:transparent;color:#a52a20\">.vbs</span></span></div><p>Η τελευταία επέκταση είναι <b>.vbs</b>. Το όνομα «photo» και το «.jpg» στη μέση δεν εγγυώνται φωτογραφία.</p><p>Δεν το ανοίγω για να «δω τι είναι». Επιβεβαιώνω τον αποστολέα από γνωστό κανάλι.</p></div></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Το back up εμποδίζει έναν ιό να μπει στον υπολογιστή;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Όχι. Βοηθά στην επαναφορά αρχείων. Συμπληρώνει το Antivirus, τις ενημερώσεις και την προσεκτική συμπεριφορά.</div></details></div>"], ["Αν υποψιάζομαι μόλυνση", "90″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h5\"/></svg><span>Έλεγχος με full system scan</span></div><div class=\"grid\"><div class=\"paper\"><p>Ενημερώνω τον καθηγητή ή άλλον υπεύθυνο. Δεν ανοίγω ξανά το ύποπτο αρχείο.</p><p>Χρησιμοποιούμε το ενημερωμένο, εγκατεστημένο Antivirus για <b>full system scan</b>.</p><p>Ακολουθούμε τις ενέργειες που προτείνει το αξιόπιστο Antivirus, όπως απομόνωση του ευρήματος. Αν το πρόβλημα παραμένει, ζητούμε τεχνική βοήθεια.</p></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Μια ιστοσελίδα γράφει «Βρήκαμε 20 ιούς! Κατέβασε αμέσως αυτό το πρόγραμμα». Είναι αποτέλεσμα του Antivirus σου;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Όχι απαραίτητα. Μπορεί να είναι παραπλανητικό μήνυμα. Κλείνουμε τη σελίδα και ανοίγουμε εμείς την εγκατεστημένη εφαρμογή προστασίας με βοήθεια υπευθύνου.</div></details></div></div>"], ["Spam: πολλά ανεπιθύμητα μηνύματα", "105″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"m3 6 9 7 9-7\"/></svg><span>Ανεπιθύμητη μαζική αλληλογραφία</span></div><div class=\"grid\"><div class=\"scene\"><h2>«Μοναδική προσφορά!»</h2><p>Ένα άγνωστο κατάστημα στέλνει επανειλημμένα διαφημίσεις που δεν ζήτησες.</p><div class=\"files\"><span style=\"color:#193345\">Inbox: 47 νέα</span></div><p>Ένα μήνυμα προς όλη την τάξη από τον καθηγητή <b>δεν γίνεται Spam μόνο επειδή έχει πολλούς παραλήπτες</b>.</p></div><div class=\"paper\"><p>Το <b>Spam</b> είναι ανεπιθύμητη μαζική αλληλογραφία, συχνά διαφημιστική.</p><p>Δεν απαντώ σε ύποπτο Spam. Δεν πατώ ύποπτους συνδέσμους.</p><p>Χρησιμοποιώ <b>Report spam / Junk</b> και το φίλτρο της υπηρεσίας email. Προσέχω πού δίνω τη διεύθυνσή μου.</p><p>Το φίλτρο δεν είναι Antivirus και δεν εγγυάται ότι θα σταματήσει κάθε απειλή.</p></div></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Γιατί το να απαντήσω «μη μου ξαναστείλεις» σε έναν ύποπτο άγνωστο δεν είναι η καλύτερη λύση;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Μπορεί να επιβεβαιώσει ότι η διεύθυνσή μου χρησιμοποιείται. Προτιμώ την αναφορά και το φίλτρο του email.</div></details></div>"], ["Phishing: παγίδα για τα στοιχεία μου", "120″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5\"/><path d=\"m12 12 9 9m-3-3 3-3m-6 0 3-3\"/></svg><span>Το όνομα αποστολέα δεν αποτελεί απόδειξη</span></div><div class=\"grid\"><div class=\"scene\"><h2>«Η κάρτα σου θα κλειδωθεί!»</h2><p>Στείλε τον αριθμό και το PIN σου τώρα για επιβεβαίωση.</p><p><b>Εμφανιζόμενο όνομα:</b> Υποστήριξη κάρτας</p><button id=\"showSender\">Δες περισσότερα στοιχεία</button><div id=\"senderDetails\" class=\"hide\"><p><b>Διεύθυνση:</b> support@card-gifts.example</p><p>Το .example χρησιμοποιείται μόνο για το φανταστικό σενάριο. Η επαγγελματική εμφάνιση δεν αρκεί για επιβεβαίωση.</p></div></div><div class=\"paper\"><p>Το <b>Phishing</b> χρησιμοποιεί παραπλάνηση για να αποσπάσει προσωπικά στοιχεία, username, password ή PIN. Μπορεί να σε οδηγήσει σε πλαστή ιστοσελίδα.</p><p>Δεν απαντώ με μυστικά στοιχεία και δεν χρησιμοποιώ τον σύνδεσμο του ύποπτου μηνύματος.</p><p>Επιβεβαιώνω από γνωστή επίσημη εφαρμογή, διεύθυνση ή τηλέφωνο που βρήκα ανεξάρτητα. Ζητώ βοήθεια ενήλικα.</p></div></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Αν το μήνυμα έχει λογότυπο και σωστά ελληνικά, αποκλείεται να είναι Phishing;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Όχι. Ο στόχος και το αίτημα για μυστικά στοιχεία μετρούν περισσότερο από το λογότυπο. Ακόμη και γνωστός λογαριασμός μπορεί να έχει παραβιαστεί.</div></details></div>"], ["Αναγνωρίζω τον κίνδυνο και επιλέγω προστασία", "90″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z\"/><path d=\"m8 12 3 3 5-6\"/></svg><span>Δεν αντιδρώ βιαστικά</span></div><div class=\"paper\"><p>🗂 <b>Ύποπτο συνημμένο:</b> δεν το εκτελώ, ελέγχω και ζητώ βοήθεια. Antivirus, update και back up έχουν διαφορετικούς ρόλους.</p><p>✉ <b>Spam:</b> ανεπιθύμητη μαζική αλληλογραφία. Δεν απαντώ, χρησιμοποιώ φίλτρο και αναφορά.</p><p>🔑 <b>Phishing:</b> παραπλάνηση για προσωπικά ή μυστικά στοιχεία. Δεν τα δίνω, επιβεβαιώνω ανεξάρτητα.</p><p><b>Ένα μήνυμα μπορεί να συνδυάζει κινδύνους.</b> Δεν χρειάζεται να επιλέξω μία μόνο ετικέτα για να προστατευθώ.</p></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Διαφημιστικό email περιέχει άγνωστο πρόγραμμα και ζητά password. Ποιους κινδύνους βλέπεις; Τι κάνεις;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Πιθανό Spam, κίνδυνος κακόβουλου λογισμικού και Phishing. Δεν ανοίγω/εκτελώ, δεν δίνω στοιχεία και ενημερώνω υπεύθυνο για ασφαλή αναφορά.</div></details></div><details class=\"teacher-note\"><summary>Σύνδεση με Δείκτες Επιτυχίας και Επάρκειας</summary><p><b>Επιτυχίας Α5.4.1:</b> Αναγνωρίζουν και περιγράφουν διάφορες κατηγορίες κινδύνων που μπορεί να προκύψουν από τη χρήση του Διαδικτύου.</p><p><b>Επιτυχίας Α5.4.2:</b> Αντιμετωπίζουν διάφορες κατηγορίες κινδύνων που μπορεί να προκύψουν από τη χρήση του Διαδικτύου.</p><p><b>Επάρκειας Α5.4.1, μέρος του Μ1:</b> Κίνδυνοι και τρόποι αντιμετώπισης ανεπιθύμητων μηνυμάτων (Spam) και υποκλοπής προσωπικών δεδομένων (Phishing).</p><p>Τα κακόβουλα προγράμματα και η προστασία τους περιλαμβάνονται επίσης ρητά στη θεωρία και στο Φύλλο Εργασίας Μ1. Υποστηρίζουν τους δύο δείκτες επιτυχίας, παρότι δεν κατονομάζονται στον συγκεκριμένο κατάλογο επάρκειας.</p><p>Σε κάθε θέμα: αναγνωρίζω τον κίνδυνο, περιγράφω το πρόβλημα και επιλέγω κατάλληλη προστασία.</p></details><p class=\"muted\">Πηγές: Σημειώσεις Α΄ Γυμνασίου σ. 129–131 · Φύλλο εργασίας Α.5.3 Μ1 σ. 145–148 · Αναλυτικό πρόγραμμα σ. 31.</p>"]];let i=0;let remaining=600,deadline=0,running=false;function tick(){if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!remaining)running=false}const m=Math.floor(remaining/60),sec=remaining%60;$('clock').textContent=m+':'+String(sec).padStart(2,'0');$('timerbar').className='timerbar'+(remaining===0?' expired':remaining<=120?' warn':'');$('timerStatus').textContent=remaining===0?'Ο χρόνος των 10΄ ολοκληρώθηκε. Η παρουσίαση παραμένει διαθέσιμη.':remaining<=60?'Προσοχή: απομένει λιγότερο από 1 λεπτό.':remaining<=120?'Προσοχή: απομένουν έως 2 λεπτά.':'Χρόνος θεωρίας και συζήτησης · 10΄';$('timerToggle').textContent=running?'Παύση':remaining?'Έναρξη / Συνέχεια':'Ο χρόνος ολοκληρώθηκε'}listen('timerToggle',()=>{if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));running=false}else if(remaining){deadline=Date.now()+remaining*1000;running=true}tick()});listen('timerReset',()=>{remaining=600;running=false;tick()});setInterval(tick,250);function render(){const s=slides[i];shell(`<div class="label">ΘΕΩΡΙΑ · ${i+1} / ${slides.length} · ${s[1]}</div><h1>${s[0]}</h1>${s[2]}<div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><span class="count">10΄ μαζί με συζήτηση</span><button id="next" class="primary" ${i===slides.length-1?'disabled':''}>Επόμενο →</button></div>`)}function bind(){listen('showSender',()=>document.getElementById('senderDetails').classList.remove('hide'));document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{document.getElementById('age-explain').textContent='PEGI '+b.dataset.age+': καταλληλότητα περιεχομένου για ηλικίες '+b.dataset.age+' και άνω.'});listen('investigate',()=>document.getElementById('evidence').classList.remove('hide'));listen('balance',()=>{document.getElementById('plan').classList.remove('hide');document.getElementById('timebar').style.width='90%'});listen('prev',()=>{i--;render()});listen('next',()=>{i++;render()})}document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&i<slides.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});render();</script></body></html>
