async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά και έλεγξε τις ρυθμίσεις λήψεων του browser.';}}
function resultHTML(title,body){return '<!doctype html><html lang="el"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:18px/1.6 Arial;max-width:900px;margin:35px auto;padding:20px}article{border-bottom:1px solid #ccc;padding:15px 0;break-inside:avoid}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{button{display:none}}</style><h1>'+esc(title)+'</h1>'+body+'</html>'}
function safeName(t){return t.replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,70)||'student'}
const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[["💬 Σε μια ομαδική συνομιλία εμφανίζεται περιεχόμενο που σε αναστατώνει. Ποια αντίδραση είναι ασφαλής;", ["Το προωθώ σε φίλο για να το κρίνει.", "Σταματώ την προβολή, δεν το προωθώ και μιλώ σε έμπιστο ενήλικα.", "Συνεχίζω να το βλέπω για να βεβαιωθώ."], 1, "Σκέψου πώς θα προστατεύσεις τον εαυτό σου χωρίς να το διαδώσεις.", "Ακατάλληλο περιεχόμενο: σταματούμε την προβολή και ζητούμε βοήθεια. Δεν το προωθούμε."], ["🎮 Το PEGI 16 σε ένα εύκολο παιχνίδι δείχνει…", ["καταλληλότητα περιεχομένου για ηλικίες 16 και άνω.", "ότι το παιχνίδι χρειάζεται 16 παίκτες.", "ότι μπορούν να παίξουν μικρότεροι αν είναι καλοί παίκτες."], 0, "Το PEGI αφορά το περιεχόμενο και την ηλικία, όχι την ικανότητα του παίκτη.", "Η ευκολία δεν αλλάζει την ηλικιακή καταλληλότητα. Εξετάζουμε και τις περιγραφικές ενδείξεις με ενήλικα."], ["👻 Ένα παιχνίδι έχει την ένδειξη Fear / Horror. Τι σημαίνει αυτό;", ["Περιέχει τρομακτικές εικόνες ή ήχους.", "Απαιτεί γρήγορα αντανακλαστικά.", "Πωλείται αποκλειστικά σε ενήλικες."], 0, "Σκέψου τι μπορεί να σε ξαφνιάσει ή να σε τρομάξει.", "Η ένδειξη προειδοποιεί για τρομακτικό περιεχόμενο."], ["🛒 Σε παιχνίδι βλέπεις την ένδειξη In-game Purchases. Τι σημαίνει;", ["Η εγκατάσταση απαιτεί συνδρομή.", "Υπάρχουν προαιρετικές αγορές μέσα στο παιχνίδι.", "Οι αγορές γίνονται μόνο με πόντους του παιχνιδιού."], 1, "Η ένδειξη αφορά κάτι που μπορείς να αγοράσεις ενώ παίζεις.", "Το παιχνίδι προσφέρει αγορές ψηφιακών αγαθών ή υπηρεσιών με πραγματικό κόστος."], ["📱 Ένας φίλος συνεχίζει να σου στέλνει βίαια βίντεο. Τι κάνεις;", ["Τα βλέπω για να ξέρω τι στέλνει.", "Τα προωθώ στην ομάδα για να πάρει θέση.", "Σταματώ την προβολή και ζητώ βοήθεια για Report ή Block."], 2, "Πώς μπορείς να σταματήσεις τη διάδοση και να ζητήσεις βοήθεια;", "Σταματώ την προβολή, δεν προωθώ και ζητώ βοήθεια από έμπιστο ενήλικα."], ["📸 Ποιος συνδέεται με τα πνευματικά δικαιώματα μιας φωτογραφίας;", ["Όποιος τη βρει πρώτος σε αναζήτηση.", "Κάθε χρήστης που την κατεβάζει.", "Ο δημιουργός της και οι δικαιούχοι, σύμφωνα με τους όρους χρήσης."], 2, "Η λήψη ενός έργου δεν σε κάνει δημιουργό του.", "Σεβόμαστε τον δημιουργό και ελέγχουμε τους όρους με τους οποίους διαθέτει το έργο."], ["🖼️ Θέλεις μια εικόνα για δημόσια σχολική αφίσα. Ποια επιλογή είναι κατάλληλη;", ["Χρησιμοποιώ οποιαδήποτε εικόνα, αρκεί η αφίσα να μην έχει εμπορικό σκοπό.", "Επιλέγω δική μου εικόνα ή υλικό με άδεια που επιτρέπει αυτή τη χρήση.", "Γράφω «πηγή: Internet» και αρκεί."], 1, "Η δημόσια εμφάνιση μιας εικόνας δεν σημαίνει ελεύθερη επαναχρησιμοποίηση.", "Ελέγχουμε την άδεια και τους όρους, συμπεριλαμβανομένης της αναφοράς δημιουργού όπου απαιτείται."], ["🎵 Μοιράζομαι μουσική online χωρίς την απαραίτητη άδεια. Με ποιον κίνδυνο συνδέεται;", ["Παραβίαση πνευματικών δικαιωμάτων.", "Ακατάλληλο περιεχόμενο λόγω ηλικιακής σήμανσης.", "Εθισμός λόγω του είδους αρχείου."], 0, "Σκέψου τα δικαιώματα χρήσης και διανομής του έργου.", "Το ζήτημα είναι η χρήση ή διανομή χωρίς την άδεια που απαιτείται."], ["📱 Ποια περίπτωση χρήσης του TikTok χρειάζεται προσοχή και υποστήριξη;", ["Βλέπω βίντεο στο TikTok και σταματώ στην ώρα που έχω συμφωνήσει.", "Κλείνω το TikTok για να ολοκληρώσω τα μαθήματά μου και επιστρέφω αργότερα.", "Συνεχίζω συχνά να βλέπω βίντεο στο TikTok, παρότι θέλω να σταματήσω, και παραμελώ ύπνο, μαθήματα ή φίλους."], 2, "Σκέψου αν μπορώ να σταματήσω τη χρήση και πώς επηρεάζονται ο ύπνος, τα μαθήματα και οι σχέσεις μου.", "Η συχνή δυσκολία να κλείσω το TikTok και η παραμέληση της καθημερινότητάς μου είναι λόγοι να μιλήσω σε έμπιστο ενήλικα και να ζητήσω υποστήριξη."], ["⚖️ Πώς μπορώ να οργανώσω τον χρόνο που περνώ στο Internet;", ["Σταματώ να χρησιμοποιώ το Internet μόνο όταν τελειώσω όλα τα βίντεο ή τα παιχνίδια που θέλω.", "Συμφωνώ με τους γονείς μου πότε και για πόση ώρα χρησιμοποιώ το Internet, κάνω διαλείμματα και αφήνω χρόνο για ύπνο και άλλες δραστηριότητες.", "Αποφασίζω κάθε φορά πόση ώρα θα μείνω στο Internet, ανάλογα με το πόσο ενδιαφέρον βρίσκω το περιεχόμενο."], 1, "Σκέψου ποια επιλογή βάζει συγκεκριμένα χρονικά όρια στη χρήση του Internet και αφήνει χρόνο για τις υπόλοιπες ανάγκες σου.", "Ένα συμφωνημένο πρόγραμμα ορίζει πότε ξεκινώ και πότε σταματώ τη χρήση του Internet. Το τηρώ, κάνω διαλείμματα και δίνω χρόνο στα μαθήματα, στον ύπνο, στους φίλους και σε δραστηριότητες εκτός οθόνης."]];let i=0,started=false,expired=false,finishedAt=0,deadline=0;const answers={},first={},hints={},solved={},attempts={};function tick(){if(started&&!finishedAt&&!expired&&Date.now()>=deadline){expired=true;render()}const rem=!started?600:Math.max(0,Math.ceil((deadline-(finishedAt||Date.now()))/1000));$('clock').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');$('timerbar').className='timerbar'+(expired?' expired':started&&!finishedAt&&rem<=120?' warn':'');$('timerStatus').textContent=expired?'Ο χρόνος έληξε. Η εμπέδωση κλειδώθηκε.':finishedAt?'Η εμπέδωση ολοκληρώθηκε. Το χρονόμετρο σταμάτησε.':!started?'Ο χρόνος αρχίζει με την Έναρξη.':rem<=60?'Προσοχή: απομένει έως 1 λεπτό.':rem<=120?'Προσοχή: απομένουν έως 2 λεπτά.':'Εμπέδωση · 10 λεπτά';}function render(){if(!started){shell(`<div class="paper"><h1>🧩 Εμπέδωση · 10 ερωτήσεις</h1><p>Θα αναγνωρίσεις κινδύνους και θα επιλέξεις τρόπους προστασίας. Έχεις υποδείξεις και μπορείς να ξαναδοκιμάσεις.</p><div class="record-notice"><b>📝 Τι καταγράφεται;</b><p>Η πρώτη επιλογή σου καταγράφεται, ακόμη κι αν είναι λανθασμένη. Κάθε επιλογή απάντησης μετρά ως μία προσπάθεια. Μπορείς να ξανα
