<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Α7.3 Μ1 · Εμπέδωση</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#213450;font:19px/1.45 'Segoe UI',Arial,sans-serif;min-height:100dvh}button,a.button{font:inherit;cursor:pointer;border:1px solid #b9c8d9;border-radius:10px;padding:10px 16px;background:white;color:#213450;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:default}.primary{background:#146f86!important;color:white!important;border-color:#146f86!important}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d9991a;outline-offset:3px}header{padding:9px 3vw;background:#213450;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}header a{color:white}header small{font-size:14px}.timer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 3vw;background:#dcecf2}.timer b{font-size:26px;font-variant-numeric:tabular-nums}.warn{background:#fff0bb}.expired{background:#f7ddd7}main{max-width:1220px;margin:0 auto;padding:18px 24px}.paper,.scenario,.question{padding:18px 22px;border-radius:16px;background:white;margin-bottom:12px}.scenario{background:#253d60;color:white}.question{background:#e3eafa;border-left:5px solid #6374c9}h1{font-size:clamp(26px,3.4vw,43px);line-height:1.2;margin:6px 0 18px}h2{font-size:clamp(21px,2.1vw,28px);line-height:1.25;margin:0 0 10px}h3{font-size:21px;margin:8px 0}p{margin:7px 0 12px}.label{font-size:14px;color:#376878;letter-spacing:.06em;margin-bottom:10px}.scenario svg{stroke:#a6dfeb}.scenario .label{color:#bfd9ed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:white;border:1px solid #c9d7e6;border-radius:14px;padding:16px}.tile p{font-size:17px}.art{height:100px;display:flex;align-items:center;justify-content:center}.art svg{max-height:100%;width:130px}.options{display:grid;gap:10px}.option{display:flex;text-align:left;gap:14px;align-items:center;width:100%;padding:13px 16px}.letter{border:1px solid currentColor;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}.selected{border:2px solid #146f86;background:#edf7fa}.correct{color:#16703a!important;background:transparent!important;font-weight:400}.wrong{color:#ae2d28!important;background:transparent!important;font-weight:400}.feedback{padding:12px 16px;background:#e9effb;border-radius:10px;margin:10px 0}.notice{background:#fff1c5;border-left:5px solid #d2a23c;border-radius:10px;padding:13px 16px;margin:12px 0}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.muted{font-size:15px;color:#586a7d}.error{color:#ae2d28;font-weight:600}label{display:block;margin-top:10px;font-size:17px}input,textarea{font:inherit;width:100%;border:1px solid #b9c8d9;border-radius:9px;padding:9px;background:white;color:#213450}textarea{min-height:62px;resize:vertical}.answer-group{border:1px solid #c9d7e6;border-radius:12px;padding:12px;margin-bottom:12px}.answer-group h2{font-size:21px}.answer-group textarea{height:58px;min-height:58px}.record{padding:12px 0;border-bottom:1px solid #c9d7e6}.record p{font-size:17px}.next-stage{border-top:4px solid #146f86;margin-top:24px;padding-top:20px}.next-stage .button{font-size:23px;padding:15px 22px}.teacher main{min-height:calc(100dvh - 135px);display:flex;flex-direction:column}.teacher #content{flex:1}.key{background:#fff1c5;color:#594516;padding:12px;border-radius:10px}.teacher details{margin-top:12px}.mini-list{display:grid;gap:8px}.mini-list p{margin:0;padding:10px;border-radius:9px;background:#f0f5fb}.scenario .mini-list p{background:#345075}.intro main{min-height:calc(100dvh - 55px);display:flex;align-items:stretch}.intro .paper{flex:1;display:flex;flex-direction:column;justify-content:center}.intro .grid{align-items:center}.intro .art{height:200px}.intro .art svg{width:230px}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#app{animation:arrive .3s ease}@media(prefers-reduced-motion:reduce){#app{animation:none}}.report-table{overflow-wrap:anywhere}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}main{padding:14px}header{flex-wrap:wrap}.foot{flex-wrap:wrap}.teacher main{min-height:0}.timer{flex-wrap:wrap}.art{height:76px}}main{max-width:1400px}.scenario{font-size:clamp(18px,1.55vw,23px)}.question h1{font-size:clamp(26px,2.6vw,38px)}header{font-size:16px}.option:disabled{opacity:1}.correct,.wrong{font-weight:400!important}.answer-group{display:block}.answer-group textarea{min-height:60px}.foot{flex-wrap:wrap}.next-stage button{font-size:22px;padding:16px 24px}</style></head><body class=""><header><span>Α7.3 Μ1 · Γνωρίζω την Τεχνητή Νοημοσύνη</span><button id="full">⛶ Πλήρης οθόνη</button></header><aside class="timer" id="timer"><b id="clock">10:00</b><span id="timeStatus">Ο χρόνος αρχίζει με την Έναρξη.</span></aside><main id="app"></main><script>const app=document.getElementById('app');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function on(id,fn){if($(id))$(id).onclick=fn}function show(html){app.innerHTML=html;bind();window.scrollTo(0,0)}on('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[["🤖 Ποια περιγραφή αποδίδει καλύτερα την AI;", ["Συστήματα που εκτελούν εργασίες όπως αναγνώριση και επίλυση προβλημάτων.", "Κάθε συσκευή που συνδέεται στο Internet.", "Κάθε πρόγραμμα που αποθηκεύει αρχεία."], 0, "Σκέψου την εργασία που εκτελεί το σύστημα.", "Η AI συνδέεται με ικανότητες όπως αναγνώριση, γλώσσα και επίλυση προβλημάτων."], ["🐱 Δείχνουμε πολλές επισημασμένες εικόνες για να αναγνωρίζει γάτες. Τι χρησιμοποιούμε;", ["Απλή αντιγραφή αρχείων.", "Machine Learning.", "Μόνο αποθήκευση εικόνων."], 1, "Το σύστημα εντοπίζει μοτίβα από παραδείγματα.", "Το Machine Learning είναι τρόπος ανάπτυξης AI με δεδομένα."], ["🧪 Ποιες εικόνες βοηθούν να ελέγξουμε τη μάθηση;", ["Μόνο τις πιο εύκολες εικόνες εκπαίδευσης.", "Ακριβώς τις ίδιες εικόνες που έχει ήδη δει.", "Νέες εικόνες που δεν χρησιμοποιήθηκαν στην εκπαίδευση."], 2, "Ελέγχουμε αν εφαρμόζει όσα έμαθε σε νέα δεδομένα.", "Η δοκιμή με νέα παραδείγματα αποκαλύπτει δυσκολίες που δεν φαίνονται στην εκπαίδευση."], ["📷 Έχουμε μόνο φωτογραφίες λευκών γάτων. Τι βελτιώνουμε;", ["Την ποικιλία και τη σωστή επισήμανση των εικόνων.", "Αντιγράφουμε πολλές φορές την ίδια φωτογραφία.", "Αφαιρούμε όλες τις εικόνες που είναι δύσκολες."], 0, "Σκέψου γάτες άλλων χρωμάτων και συνθήκες φωτισμού.", "Χρειαζόμαστε παραδείγματα που καλύπτουν την πραγματική χρήση."], ["🎙️ Ένας βοηθός μετατρέπει την ομιλία σου σε λέξεις. Ποια είναι η εργασία AI;", ["Αποθήκευση της έντασης των ηχείων.", "Αναγνώριση φωνής.", "Αλλαγή της φωτεινότητας της οθόνης."], 1, "Τι δεδομένα λαμβάνει και τι αποτέλεσμα παράγει;", "Επεξεργάζεται ήχο για να αναγνωρίσει λέξεις."], ["🏥 Ένα εργαλείο επισημαίνει ύποπτο σημείο σε ακτινογραφία. Τι κάνει ο γιατρός;", ["Αποδέχεται υποχρεωτικά την επισήμανση.", "Αγνοεί το εργαλείο χωρίς έλεγχο.", "Εξετάζει την επισήμανση μαζί με τα υπόλοιπα στοιχεία."], 2, "Η AI προσφέρει υποστήριξη στον ειδικό.", "Το αποτέλεσμα χρειάζεται επαγγελματική αξιολόγηση."], ["🕰️ Με ποια ιδέα συνδέεται ο Alan Turing το 1950;", ["Με το imitation game.", "Με την καθιέρωση του ονόματος AI το 1956.", "Με την εμφάνιση των Smartphones."], 0, "Σκέψου γραπτή συζήτηση ανθρώπου και μηχανής.", "Ο Turing εξέτασε το ερώτημα της διάκρισης μηχανικών και ανθρώπινων απαντήσεων."], ["📅 Τι ξεχωρίζει το 1956 στην ιστορία της AI;", ["Η πρώτη χρήση κινητού τηλεφώνου.", "Η καθιέρωση του όρου Artificial Intelligence στο πεδίο.", "Η δημιουργία του Internet για όλους."], 1, "Το ορόσημο αφορά το όνομα του πεδίου.", "Η συνάντηση στο Dartmouth συνδέεται με την ονομασία AI."], ["🗣️ Ποια επιστήμη βοηθά ειδικά στην επεξεργασία της φυσικής γλώσσας;", ["Μόνο η Ηλεκτρολογία.", "Μόνο η Ρομποτική.", "Η Γλωσσολογία, μαζί με την Πληροφορική."], 2, "Η γλώσσα έχει δομή και νόημα που μελετά συγκεκριμένη επιστήμη.", "Η AI αξιοποιεί γνώσεις από πολλές επιστήμες."], ["💬 Μια μηχανή γράφει πολύ πειστικά. Τι μπορούμε να συμπεράνουμε;", ["Ότι παράγει πειστικό κείμενο, αλλά χρειάζεται έλεγχος ακρίβειας.", "Ότι έχει οπωσδήποτε ανθρώπινα συναισθήματα.", "Ότι όλες οι απαντήσεις της είναι σωστές."], 0, "Η μορφή της απάντησης δεν εγγυάται την αλήθεια της.", "Η πειστικότητα και η ορθότητα είναι διαφορετικά πράγματα."]];let i=0,started=false,ended=false,expired=false,deadline=0,finish=0;const first={},attempts={},answers={},hints={};function report(){return qs.map((q,j)=>'<article class="record"><h3>'+(j+1)+'. '+q[0]+'</h3><p>Πρώτη απάντηση: '+(first[j]===undefined?'Δεν απαντήθηκε':esc(q[1][first[j]]))+'</p><p>Σωστή με την πρώτη: '+(first[j]===undefined?'—':first[j]===q[2]?'Ναι':'Όχι')+' · Προσπάθειες: '+(attempts[j]||0)+' · Υπόδειξη: '+(hints[j]?'Ναι':'Όχι')+'</p></article>').join('')}function render(){if(!started){show('<div class="paper"><h1>🧩 Εμπέδωση · 10 ερωτήσεις</h1><p>Εφάρμοσε τις ιδέες του μαθήματος σε καθημερινά παραδείγματα. Επιλέγεις μία σωστή απάντηση.</p><div class="notice"><b>📝 Τι καταγράφεται;</b><p>Καταγράφονται η πρώτη επιλογή σου, κάθε προσπάθεια και η χρήση υπόδειξης. Θα τα δεις στην τελική αναφορά. Μπορείς να ξαναδοκιμάσεις μέχρι να βρεις τη σωστή απάντηση.</p></div><p>⏱️ Έχεις 10΄. Προχωράς μόνο με σωστή απάντηση. Στη λήξη οι ερωτήσεις κλειδώνουν.</p><button id="begin" class="primary">Έναρξη →</button></div>');return}if(ended){show('<div class="paper"><h1>'+(expired?'⏰ Ο χρόνος ολοκληρώθηκε':'🎉 Ολοκλήρωσες την Εμπέδωση!')+'</h1><p>🎯 Σωστές με την πρώτη: '+qs.filter((q,j)=>first[j]===q[2]).length+' / 10</p><p>✅ Τελικά σωστές: '+qs.filter((q,j)=>answers[j]===q[2]).length+' / 10</p><p>🔁 Συνολικές προσπάθειες: '+Object.values(attempts).reduce((a,b)=>a+b,0)+'</p><details><summary>📊 Πρώτες απαντήσεις και προσπάθειες</summary>'+report()+'</details><div class="next-stage"><a class="button primary" href="ASSESSMENT.HTML">Συνέχεια στην Αξιολόγηση →</a></div></div>');return}const q=qs[i],ok=answers[i]===q[2];show('<div class="label">ΕΜΠΕΔΩΣΗ · '+(i+1)+' / 10</div><div class="question"><h1>'+q[0]+'</h1></div><div class="paper"><p>Επίλεξε <b>μία σωστή απάντηση</b> από τις τρεις επιλογές.</p><div class="options" role="group" aria-label="Επιλογές απάντησης">'+q[1].map((o,k)=>'<button id="c'+k+'" class="option '+(answers[i]===k?(ok?'correct':'wrong'):'')+'" '+(ok?'disabled':'')+'><span class="letter">'+String.fromCharCode(913+k)+'</span><span>'+(answers[i]===k?(ok?'✓ ':'✗ '):'')+o+'</span></button>').join('')+'</div><p><button id="hint">💡 Υπόδειξη</button></p>'+(hints[i]?'<div class="feedback">'+q[3]+'</div>':'')+(answers[i]!==undefined?'<p class="'+(ok?'correct':'wrong')+'">'+(ok?'✓ Σωστή απάντηση. '+q[4]:'✗ Δοκίμασε ξανά ή άνοιξε την υπόδειξη.')+'</p>':'')+'</div><div class="foot"><button id="prev" '+(i===0?'disabled':'')+'>← Πίσω</button><button id="next" class="primary" '+(!ok?'disabled':'')+'>'+(i===9?'Ολοκλήρωση':'Επόμενο →')+'</button></div>')}function timeout(){if(started&&!ended&&Date.now()>=deadline){ended=true;expired=true;finish=deadline;render()}return ended}function tick(){timeout();const left=started?Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000)):600;$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timer').className='timer'+(expired?' expired':started&&!ended&&left<=120?' warn':'');$('timeStatus').textContent=expired?'Η Εμπέδωση κλειδώθηκε.':ended?'Η Εμπέδωση ολοκληρώθηκε.':!started?'Ο χρόνος αρχίζει με την Έναρξη.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Εμπέδωση · 10΄'}function bind(){on('begin',()=>{started=true;deadline=Date.now()+600000;render();tick()});if(started&&!ended)qs[i][1].forEach((_,k)=>on('c'+k,()=>{if(timeout()||answers[i]===qs[i][2])return;if(first[i]===undefined)first[i]=k;attempts[i]=(attempts[i]||0)+1;answers[i]=k;render()}));on('hint',()=>{if(timeout())return;hints[i]=true;render()});on('prev',()=>{if(timeout()||i===0)return;i--;render()});on('next',()=>{if(timeout()||answers[i]!==qs[i][2])return;i++;if(i===qs.length){ended=true;finish=Date.now()}render();tick()})}setInterval(tick,250);render();</script></body></html>
