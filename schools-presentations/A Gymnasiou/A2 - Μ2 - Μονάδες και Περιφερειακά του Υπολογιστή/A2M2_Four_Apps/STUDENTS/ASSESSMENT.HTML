<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Α2 Μ2 · Αξιολόγηση</title><style>
*{box-sizing:border-box}
:root{--navy:#213450;--teal:#146f86;--ink:#213450;--muted:#586a7d;--line:#c9d7e6;--bg:#edf3f8;--amber:#d9991a}
.in{--c:#146f86;--t:#d9eff4}.out{--c:#5363b8;--t:#e3e7fa}.st{--c:#b47a0c;--t:#fbefd2}.main{--c:#c4533c;--t:#fbe3dc}.nv{--c:#213450;--t:#dde6f0}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 'Segoe UI',Inter,'Noto Sans',Arial,sans-serif;min-height:100dvh}
svg.ic{display:block;width:100%;height:100%;color:var(--c,#213450);overflow:visible}
button,a.button{font:inherit;cursor:pointer;border:1px solid #b9c8d9;border-radius:12px;padding:10px 18px;background:white;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled),a.button:hover{border-color:var(--teal);background:#f3f9fb}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--teal)!important;color:white!important;border-color:var(--teal)!important;font-weight:600}
.primary:hover:not(:disabled){background:#0f5d71!important}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
header.top{padding:10px 3vw;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top a{color:white}
header.top .brand{display:flex;align-items:center;gap:12px;font-weight:600}
header.top .badge{background:#a6dfeb;color:var(--navy);border-radius:8px;padding:2px 9px;font-size:15px;font-weight:800;letter-spacing:.04em}
header.top button{background:transparent;color:white;border-color:#5d7593;padding:7px 14px;font-size:16px}
header.top button:hover:not(:disabled){background:#2d4466}
.timer{display:flex;align-items:center;gap:16px;padding:8px 3vw;background:#dcecf2;transition:background .3s}
.timer b{font-size:28px;font-variant-numeric:tabular-nums;color:var(--teal);min-width:80px}
.timer .bar{flex:1;height:8px;border-radius:6px;background:#c3dbe4;overflow:hidden;max-width:420px}
.timer .bar i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .3s}
.timer.warn{background:#fff0bb}.timer.warn b{color:#8a5b00}.timer.warn .bar i{background:var(--amber)}
.timer.expired{background:#f7ddd7}.timer.expired b{color:#ae2d28}.timer.expired .bar i{background:#ae2d28}
main{max-width:1180px;margin:0 auto;padding:20px 24px 40px}
.paper{padding:24px 28px;border-radius:20px;background:white;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
h1{font-size:clamp(26px,3.2vw,40px);line-height:1.18;margin:4px 0 14px}
h2{font-size:clamp(21px,2vw,27px);line-height:1.25;margin:0 0 10px}
h3{font-size:20px;margin:6px 0}
p{margin:7px 0 12px}
.label{font-size:14px;color:#376878;letter-spacing:.1em;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.muted{font-size:16px;color:var(--muted)}
.error{color:#ae2d28;font-weight:600;min-height:1em}
.notice{background:#fff4d2;border-left:6px solid var(--amber);border-radius:12px;padding:12px 18px;margin:14px 0}
.notice p{margin:4px 0}
.feedback{padding:12px 16px;background:#eef2fc;border-left:5px solid #5363b8;border-radius:10px;margin:10px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.enter>*{animation:arrive .3s ease both}
@media(prefers-reduced-motion:reduce){#app.enter>*{animation:none}}

.qhead{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:white;border-radius:20px;padding:20px 26px;margin-bottom:14px;box-shadow:0 2px 0 var(--line);border-left:8px solid #5363b8}
.qhead h1{margin:0;font-size:clamp(23px,2.6vw,33px)}
.qicons{display:flex;gap:10px}
.qicons i{width:clamp(70px,9vw,110px);height:clamp(54px,7vw,84px);display:block;background:var(--t);border-radius:14px;padding:8px}
.progress{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.progress span{height:10px;flex:1;min-width:18px;border-radius:6px;background:#cfdbe6}
.progress span.done{background:#2f9a5c}.progress span.now{background:#5363b8}
.progress b{font-size:14px;color:var(--muted);margin-left:8px;white-space:nowrap}
.options{display:grid;gap:10px}
.option{display:flex;text-align:left;gap:14px;align-items:center;width:100%;padding:14px 18px;font-size:clamp(17px,1.6vw,21px)}
.letter{border:2px solid currentColor;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;font-weight:700}
.option.selected{border:2px solid var(--teal);background:#e8f5f9}
.option.selected .letter{background:var(--teal);color:white;border-color:var(--teal)}
.option.correct{border:2px solid #2f9a5c!important;background:#e6f6ec!important;color:#16703a!important;opacity:1}
.option.correct .letter{background:#2f9a5c;color:white;border-color:#2f9a5c}
.option.wrong{border:2px solid #d0675f!important;background:#fdeceb!important;color:#ae2d28!important}
.verdict{font-weight:700;padding:10px 14px;border-radius:10px}
.verdict.ok{background:#e6f6ec;color:#16703a}.verdict.no{background:#fdeceb;color:#ae2d28}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:center}
.heroart{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.heroart i{display:block;height:84px;background:var(--t);border-radius:16px;padding:10px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.rules div{background:#f1f6fa;border-radius:14px;padding:12px 14px;font-size:17px}
.rules b{display:block;font-size:24px;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stats div{background:#f1f6fa;border-radius:14px;padding:14px;text-align:center}
.stats b{display:block;font-size:36px;color:var(--teal)}
.stats span{font-size:16px;color:var(--muted)}
details{margin-top:12px;background:#f6f9fc;border-radius:12px;padding:10px 16px}
summary{cursor:pointer;font-weight:700}
.record{padding:12px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}
.record h3{font-size:18px}.record p{font-size:16px;margin:3px 0}
.next-stage{border-top:4px solid var(--teal);margin-top:24px;padding-top:18px}
.next-stage .button,.next-stage button{font-size:22px;padding:14px 22px}
label{display:block;margin-top:10px;font-size:17px;font-weight:600}
input,textarea{font:inherit;width:100%;border:1px solid #b9c8d9;border-radius:10px;padding:10px 12px;background:white;color:var(--ink)}
textarea{min-height:64px;resize:vertical;font-size:18px}
.scenario{background:var(--navy);color:white;border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.scenario .qicons i{background:#345075}.scenario .qicons .in{--c:#a6dfeb;--t:#2a5470}.scenario .qicons .out{--c:#c3cbf5;--t:#3d4c86}.scenario .qicons .st{--c:#ffd27a;--t:#6b5320}.scenario .qicons .main{--c:#f5a896;--t:#7a3a2d}.scenario .qicons .nv{--c:#e6eef6;--t:#2d4466}
.scenario .ask{background:#345075;border-radius:12px;padding:12px 16px;font-weight:700;font-size:20px}
.scenario p{font-size:clamp(18px,1.6vw,21px);margin:0}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}
.answer-group{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.answer-group h2{font-size:21px;display:flex;align-items:center;gap:10px}
.answer-group h2 i{width:48px;height:36px;display:block}
.task{background:#eef2fc;border-left:6px solid #5363b8;border-radius:12px;padding:12px 16px;margin:10px 0}
@media(max-width:820px){.grid,.hero,.rules,.stats{grid-template-columns:1fr}.qhead{grid-template-columns:1fr}.heroart{display:none}}

let student='',classroom='',stage='start',i=0,ex=0,deadline=0,finish=0,timedOut=false,submitted=false;
const answers={},hints={},parts=['','','',''],extraAnswers=extras.map(x=>x.labels.map(()=>'')),extraHints={};
function capture(){parts.forEach((_,j)=>{if($('part'+j))parts[j]=$('part'+j).value});if(stage==='extra')extras[ex].labels.forEach((_,j)=>{if($('extra'+j))extraAnswers[ex][j]=$('extra'+j).value})}
function complete(j){return qs[j].options?answers[j]!==undefined:parts.every(v=>v.trim())}
function answerText(j){return qs[j].options?(answers[j]===undefined?'Δεν απαντήθηκε':LET(answers[j])+'. '+qs[j].options[answers[j]]):['Άννα · συσκευές','Άννα · ρόλοι','Νίκος · πού αποθηκεύει','Νίκος · γιατί όχι μόνο RAM'].map((label,k)=>label+': '+(parts[k].trim()||'Δεν απαντήθηκε')).join('\n')}
function score(){return qs.filter((q,j)=>q.options&&answers[j]===q.correct).length}
function report(){return '<p>Κατάσταση: '+(timedOut?'Λήξη χρόνου':'Ολοκλήρωση')+' · Πλήρως απαντημένες: '+qs.filter((_,j)=>complete(j)).length+'/4 · Πολλαπλής επιλογής: '+score()+'/3 σωστές.</p>'+qs.map((q,j)=>'<article><h2>Ερώτηση '+(j+1)+'</h2><p>'+esc(q.case)+'</p><p><b>'+esc(q.ask)+'</b></p><p>'+esc(answerText(j))+'</p><p>Υπόδειξη: '+(hints[j]?'Ναι':'Όχι')+'</p><p>Σχόλιο καθηγητή: ________________________</p></article>').join('')}
function end(expired){if(submitted)return;capture();timedOut=expired;finish=expired?deadline:Date.now();submitted=true;stage='results';render();tick()}
function check(){if(deadline&&!submitted&&Date.now()>=deadline)end(true);return submitted}
function tick(){check();$('timer').hidden=stage==='extra'||stage==='extraResults';const left=deadline?Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000)):600;

 if(stage==='start'){show('<div class="paper"><div class="hero"><div><div class="label">Αξιολόγηση</div><h1>Δείξε τι έμαθες</h1><p>Τρεις ερωτήσεις πολλαπλής επιλογής και ένα σενάριο με τέσσερα σύντομα πεδία. Απαντάς σε κάθε ερώτηση πριν προχωρήσεις.</p></div><div class="heroart">'+ICON([['cpu','main'],['keyboard','in'],['speakers','out'],['ram','st'],['harddisk','st'],['tablet','nv']]).replace('qicons','heroart-in')+'</div></div>'

  +'<label for="name">Ονοματεπώνυμο (υποχρεωτικό)</label><input id="name" autocomplete="name" required value="'+esc(student)+'"><label for="class">Τμήμα (υποχρεωτικό)</label><input id="class" required value="'+esc(classroom)+'"><p id="warning" class="error" role="alert"></p><button id="begin" class="primary">Έναρξη →</button></div>');return}
 if(stage==='question'){const q=qs[i];
  show(progress()+'<div class="grid"><article class="scenario">'+ICON(q.icons)+'<p>'+q.case+'</p><div class="ask">'+q.ask+'</div></article><div class="paper">'

   :'<section class="answer-group"><h2><i class="in">'+ICON([['microphone','in']]).replace(/<\/?div[^>]*>/g,'')+'</i>Για την Άννα</h2>'+field('part0','Ποιες συσκευές χρειάζεται για να ηχογραφήσει και να ακούσει;',parts[0])+field('part1','Εξήγησε τον ρόλο κάθε συσκευής.',parts[1])+'</section><section class="answer-group"><h2><i class="st">'+ICON([['usb','st']]).replace(/<\/?div[^>]*>/g,'')+'</i>Για τον Νίκο</h2>'+field('part2','Πού πρέπει να αποθηκεύσει το τελικό αρχείο;',parts[2])+field('part3','Γιατί δεν αρκεί να μείνει το αρχείο στη RAM;',parts[3])+'</section>')
  +'<p><button id="hint">💡 Υπόδειξη</button></p>'+(hints[i]?'<div class="feedback">💡 '+q.hint+'</div>':'')+'<p id="warning" class="error" role="alert"></p></div></div>'

 if(stage==='review'){show('<div class="paper"><h1>✔️ Έλεγξε τις απαντήσεις σου</h1><p>Απάντησες και στις τέσσερις ερωτήσεις. Θέλεις να ξαναδείς κάτι πριν παραδώσεις;</p>'+qs.map((q,j)=>'<article class="record"><h3>Ερώτηση '+(j+1)+'</h3><p>'+esc(answerText(j)).replace(/\n/g,'<br>')+'</p></article>').join('')+'<div class="foot"><button id="review">← Επιστροφή στις ερωτήσεις</button><button id="submit" class="primary">Παράδοση ✓</button></div></div>');return}

  +'<div class="notice"><p><b>Αποθήκευσε τώρα τα αποτελέσματα.</b> Κράτα τη σελίδα ανοικτή μέχρι να ολοκληρωθεί η αποθήκευση.</p></div><button id="save" class="primary">💾 Αποθήκευση αποτελεσμάτων ως…</button><p id="saveStatus" role="status"></p><details><summary>Οι απαντήσεις μου</summary>'+qs.map((q,j)=>'<article class="record"><p>'+esc(q.case)+'</p><p>'+esc(answerText(j)).replace(/\n/g,'<br>')+'</p></article>').join('')+'</details>'
  +'<section class="next-stage"><h2>🚀 Επιπλέον Δραστηριότητες</h2><p>Τελείωσες νωρίς; Αφού αποθηκεύσεις, δοκίμασε τέσσερις πιο απαιτητικές αποστολές.</p><button id="extraStart" class="primary">Συνέχεια στις αποστολές →</button></section></div>');return}
 if(stage==='extra'){if(!submitted)return;const x=extras[ex];
  show('<div class="progress" aria-hidden="true">'+extras.map((_,j)=>'<span class="'+(j===ex?'now':extraAnswers[j].every(v=>v.trim())?'done':'')+'"></span>').join('')+'<b>Αποστολή '+(ex+1)+' / 4</b></div><div class="qhead">'+ICON([x.icon])+'<h1>'+x.title+'</h1></div><div class="paper"><p>'+x.case+'</p><div class="task">'+x.task+'</div>'+x.labels.map((label,j)=>field('extra'+j,label,extraAnswers[ex][j])).join('')
  +'<p><button id="extraHint">💡 Καθοδήγηση</button></p>'+(extraHints[ex]?'<div class="feedback">💡 '+x.hint+'</div>':'')+'<p id="warning" class="error" role="alert"></p></div><div class="foot"><button id="extraPrev" '+(ex===0?'disabled':'')+'>← Πίσω</button><button id="extraNext" class="primary">'+(ex===3?'Ολοκλήρωση ✓':'Επόμενη αποστολή →')+'</button></div>');return}
 if(stage==='extraResults'){show('<div class="paper"><h1>🎉 Ολοκλήρωσες τις αποστολές!</h1><p><b>'+esc(student)+'</b> · '+esc(classroom)+'</p><button id="saveExtra" class="primary">💾 Αποθήκευση αποτελεσμάτων ως…</button><p id="extraStatus" role="status"></p><div class="notice"><p>Το αρχείο Word της 4ης αποστολής το αποθηκεύεις χωριστά, μέσα από το Word.</p></div><button id="extraReview">← Επιστροφή στις αποστολές</button></div>')}}
function bind(){
 on('begin',()=>{student=$('name').value.trim();classroom=$('class').value.trim();if(!student||!classroom){$('warning').textContent='Συμπλήρωσε ονοματεπώνυμο και τμήμα.';(!student?$('name'):$('class')).focus();return}deadline=Date.now()+600000;stage='question';render();tick()});
 if(stage==='question'&&qs[i].options)qs[i].options.forEach((_,k)=>on('c'+k,()=>{if(check())return;answers[i]=k;render()}));
 parts.forEach((_,j)=>{if($('part'+j))$('part'+j).oninput=()=>{capture();check()}});
 on('hint',()=>{if(check())return;capture();hints[i]=true;render()});
 on('prev',()=>{if(check()||i===0)return;capture();i--;render()});
 on('next',()=>{if(check())return;capture();if(!complete(i)){$('warning').textContent=qs[i].options?'Επίλεξε μία απάντηση για να συνεχίσεις.':'Συμπλήρωσε και τα τέσσερα πεδία για να συνεχίσεις.';return}if(i===3)stage='review';else i++;render()});
 on('done',()=>end(false));
 on('review',()=>{if(check())return;i=0;stage='question';render()});
 on('submit',()=>{if(check()||!qs.every((_,j)=>complete(j)))return;end(false)});
 on('save',()=>saveReport('Α2 Μ2 · Αξιολόγηση',report(),'Assessment','saveStatus'));
 on('extraStart',()=>{if(!submitted)return;stage='extra';render();tick()});
 on('extraHint',()=>{capture();extraHints[ex]=true;render()});
 on('extraPrev',()=>{capture();if(ex>0)ex--;render()});
 on('extraNext',()=>{capture();if(!extraAnswers[ex].every(v=>v.trim())){$('warning').textContent='Συμπλήρωσε όλα τα πεδία για να συνεχίσεις.';return}if(ex===3)stage='extraResults';else ex++;render()});
 on('saveExtra',()=>saveReport('Α2 Μ2 · Επιπλέον Δραστηριότητες',extras.map((x,j)=>'<article><h2>'+esc(x.title)+'</h2><p>'+esc(x.task)+'</p>'+x.labels.map((label,k)=>'<p><b>'+esc(label)+':</b> '+esc(extraAnswers[j][k])+'</p>').join('')+'</article>').join(''),'Extra','extraStatus'));
 on('extraReview',()=>{ex=0;stage='extra';render()})}
setInterval(tick,250);render();
