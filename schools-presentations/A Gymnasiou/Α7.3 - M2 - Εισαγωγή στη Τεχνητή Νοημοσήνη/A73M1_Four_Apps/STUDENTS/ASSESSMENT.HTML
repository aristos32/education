ustify-content:center}.intro .grid{align-items:center}.intro .art{height:200px}.intro .art svg{width:230px}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#app{animation:arrive .3s ease}@media(prefers-reduced-motion:reduce){#app{animation:none}}.report-table{overflow-wrap:anywhere}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}main{padding:14px}header{flex-wrap:wrap}.foot{flex-wrap:wrap}.teacher main{min-height:0}.timer{flex-wrap:wrap}.art{height:76px}}main{max-width:1400px}.scenario{font-size:clamp(18px,1.55vw,23px)}.question h1{font-size:clamp(26px,2.6vw,38px)}header{font-size:16px}.option:disabled{opacity:1}.correct,.wrong{font-weight:400!important}.answer-group{display:block}.answer-group textarea{min-height:60px}.foot{flex-wrap:wrap}.next-stage button{font-size:22px;padding:16px 24px}</style></head><body class=""><header><span>Α7.3 Μ1 · Γνωρίζω την Τεχνητή Νοημοσύνη</span><button id="full">⛶ Πλήρης οθόνη</button></header><aside class="timer" id="timer"><b id="clock">10:00</b><span id="timeStatus">Ο χρόνος αρχίζει με την Έναρξη.</span></aside><main id="app"></main><script>const app=document.getElementById('app');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function on(id,fn){if($(id))$(id).onclick=fn}function show(html){app.innerHTML=html;bind();window.scrollTo(0,0)}on('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});async function saveReport(title,content,suffix,statusId){const status=$(statusId);const filename='A73M1_'+suffix+'_'+safeName(student)+'_'+safeName(classroom)+'.html';const html='<!doctype html><html lang="el"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:18px/1.5 Arial;max-width:960px;margin:30px auto;padding:20px}article{border-bottom:1px solid #ccc;padding:15px 0}p{white-space:pre-wrap;ove εταφέρει ένα έτοιμο αρχείο σε φάκελο.", "ask": "Πού αναγνωρίζεις σαφέστερα εργασία AI;", "options": ["Και στις δύο, επειδή εκτελούνται γρήγορα.", "Μόνο στη μεταφορά αρχείου, επειδή είναι αυτόματη.", "Και στις δύο, επειδή χρησιμοποιούν αποθήκευση.", "Στην αναγνώριση ομιλίας και παραγωγή υποτίτλων."], "correct": 3, "hint": "Η αυτοματοποίηση από μόνη της δεν αρκεί για τον χαρακτηρισμό AI."}, {"case": "📜 Ένας συμμαθητής λέει: «Ο Turing έδωσε το όνομα AI το 1950 και απέδειξε ότι οι μηχανές έχουν συνείδηση».", "ask": "Ποια διόρθωση είναι ακριβέστερη;", "options": ["Imitation game το 1950· ο όρος AI συνδέεται με το 1956.", "Ο όρος AI το 1950· imitation game το 1956.", "Το imitation game εξετάζει μόνο την ταχύτητα υπολογισμών.", "Το imitation game εγγυάται σωστές απαντήσεις σε όλα."], "correct": 0, "hint": "Ξεχώρισε το ιστορικό ορόσημο από το τι εξετάζει το τεστ."}, {"case": "🐱 Η Άννα φτιάχνει αναγνώριση γάτας μόνο με εικόνες της δικής της λευκής γάτας. Ο Νίκος λέει ότι αρκεί να δοκιμάσουν τις ίδιες εικόνες και να δηλώσουν ότι το σύστημα λειτουργεί για όλες τις γάτες.", "ask": "Πρότεινε καλύτερη εκπαίδευση και δίκαιο έλεγχο.", "hint": "Ξεχώρισε τα παραδείγματα εκπαίδευσης από τα νέα παραδείγματα δοκιμής."}];const extras=[{"title": "🔎 Αναγνωρίζω την AI", "case": "Το σχολείο θέλει παραδείγματα AI που χρησιμοποιούν οι μαθητές.", "task": "Διάλεξε δύο εφαρμογές. Εξήγησε εργασία, είδος δεδομένων και πώς θα έλεγξες μια λανθασμένη έξοδο. Αν δεν γνωρίζεις αν χρησιμοποιείται AI, δήλωσε τι χρειάζεται επιβεβαίωση.", "labels": ["Εφαρμογές και εργασίες", "Δεδομένα και έλεγχος"], "hint": "Μη χαρακτηρίζεις κάθε αυτόματη λειτουργία ως AI."}, {"title": "🧪 Δοκιμή χωρίς παγίδες", "case": "Θέλεις να ελέγξεις αναγνώριση εικόνων φρούτων.", "task": "Σχεδίασε σε χαρτί ή Word μια δοκιμή με διαφορετικά φρούτα, φόντο και φωτισμό. Δώσε κριτήριο επιτυχίας και εξήγησε τι πρέπει να κρατήσεις σταθερό.", "labels": ["Παραδείγματα και συνθήκες", "Κριτήριο επιτυχίας και καταγραφή λαθών"], "hint": "Η δοκιμή πρέ ολλαπλής επιλογής: '+score()+'/3 σωστές.</p>'+qs.map((q,j)=>'<article><h2>Ερώτηση '+(j+1)+'</h2><p>'+esc(q.case)+'</p><p>'+esc(q.ask)+'</p><p>'+esc(answerText(j))+'</p><p>Υπόδειξη: '+(hints[j]?'Ναι':'Όχι')+'</p><p>Σχόλιο καθηγητή: ________________________</p></article>').join('')}function end(expired){if(submitted)return;capture();timedOut=expired;finish=expired?deadline:Date.now();submitted=true;stage='results';render();tick()}function check(){if(deadline&&!submitted&&Date.now()>=deadline)end(true);return submitted}function tick(){check();$('timer').hidden=stage==='extra'||stage==='extraResults';const left=deadline?Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000)):600;$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timer').className='timer'+(timedOut?' expired':deadline&&!submitted&&left<=120?' warn':'');$('timeStatus').textContent=timedOut?'Ο χρόνος έληξε. Αποθήκευσε όσα πρόλαβες.':submitted?'Η Αξιολόγηση ολοκληρώθηκε.':!deadline?'Ο χρόνος αρχίζει με την Έναρξη.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Αξιολόγηση · 10΄'}function render(){if(stage==='start'){show('<div class="paper"><h1>📝 Αξιολόγηση · 4 ερωτήσεις</h1><p>Τρεις ερωτήσεις πολλαπλής επιλογής και ένα σενάριο με τέσσερα σύντομα πεδία. Κάθε ερώτηση χρειάζεται απάντηση πριν συνεχίσεις.</p><div class="notice"><b>Σκέψου προσεκτικά πριν απαντήσεις.</b><p>Η σωστή απάντηση δεν εμφανίζεται κατά την Αξιολόγηση. Η επισήμανση δείχνει μόνο την επιλογή σου.</p></div><p>⏱️ Έχεις 10΄. Στη λήξη οι απαντήσεις κλειδώνουν και μεταφέρεσαι στην αποθήκευση με όσα έχεις γράψει.</p><label for="name">Ονοματεπώνυμο (υποχρεωτικό)</label><input id="name" autocomplete="name" required><label for="class">Τμήμα (υποχρεωτικό)</label><input id="class" required><p id="warning" class="error" role="alert"></p><button id="begin" class="primary">Έναρξη →</button></div>');return}if(stage==='question'){const q=qs[i];show('<div class="label">ΑΞΙΟΛΟΓΗΣΗ · '+(i+1)+' / 4</div> +qs.filter((_,j)=>complete(j)).length+'/4 · Πολλαπλής επιλογής: '+score()+'/3 σωστές.</p><p>Το ανοικτό σενάριο θα αξιολογηθεί από τον καθηγητή.</p><button id="save" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="saveStatus" role="status"></p><details><summary>Οι απαντήσεις μου</summary>'+qs.map((q,j)=>'<article class="record"><p>'+esc(q.case)+'</p><p>'+esc(answerText(j))+'</p></article>').join('')+'</details><section class="next-stage"><h2>🚀 Επιπλέον Δραστηριότητες</h2><p>Αποθήκευσε την Αξιολόγηση. Αν τελείωσες νωρίς, συνέχισε σε τέσσερις πιο απαιτητικές αποστολές.</p><button id="extraStart" class="primary">Συνέχεια στις Επιπλέον Δραστηριότητες →</button></section></div>');return}if(stage==='extra'){if(!submitted)return;const x=extras[ex];show('<div class="label">ΕΠΙΠΛΕΟΝ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ · '+(ex+1)+' / 4</div><div class="paper"><h1>'+x.title+'</h1><p>'+x.case+'</p><div class="question">'+x.task+'</div>'+x.labels.map((label,j)=>'<label for="extra'+j+'">'+label+'</label><textarea id="extra'+j+'">'+esc(extraAnswers[ex][j])+'</textarea>').join('')+'<p><button id="extraHint">💡 Καθοδήγηση</button></p>'+(extraHints[ex]?'<div class="feedback">'+x.hint+'</div>':'')+'<p id="warning" class="error" role="alert"></p></div><div class="foot"><button id="extraPrev" '+(ex===0?'disabled':'')+'>← Πίσω</button><button id="extraNext" class="primary">'+(ex===3?'Ολοκλήρωση':'Επόμενη αποστολή →')+'</button></div>');return}if(stage==='extraResults'){show('<div class="paper"><h1>🎉 Ολοκλήρωσες τις αποστολές</h1><p><b>'+esc(student)+'</b> · '+esc(classroom)+'</p><button id="saveExtra" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="extraStatus" role="status"></p><p>Το Word αποθηκεύεται χωριστά από την εφαρμογή Word.</p><button id="extraReview">Επιστροφή στις αποστολές</button></div>')}}function bind(){on('begin',()=>{student=$('name').value.trim();classroom=$('class').value.trim();if(!student||!classroom){$('warning').textContent='Συμπλήρωσε ονοματεπώνυμο και τμήμα.';(!student?$('name'):$('class')).focus();return}deadline=Date.now()+600000;stage='question';render();tick()});if(stage==='question'&&qs[i].options)qs[i].options.forEach((_,k)=>on('c'+k,()=>{if(check())return;answers[i]=k;render()}));parts.forEach((_,j)=>{if($('part'+j))$('part'+j).oninput=()=>{capture();check()}});on('hint',()=>{if(check())return;capture();hints[i]=true;render()});on('prev',()=>{if(check()||i===0)return;capture();i--;render()});on('next',()=>{if(check())return;capture();if(!complete(i)){$('warning').textContent=qs[i].options?'Επίλεξε μία απάντηση για να συνεχίσεις.':'Συμπλήρωσε και τα τέσσερα πεδία για να συνεχίσεις.';return}if(i===3)stage='review';else i++;render()});on('done',()=>end(false));on('review',()=>{if(check())return;i=0;stage='question';render()});on('submit',()=>{if(check()||!qs.every((_,j)=>complete(j)))return;end(false)});on('save',()=>saveReport('Α7.3 Μ1 · Αξιολόγηση',report(),'Assessment','saveStatus'));on('extraStart',()=>{if(!submitted)return;stage='extra';render();tick()});on('extraHint',()=>{capture();extraHints[ex]=true;render()});on('extraPrev',()=>{capture();if(ex>0)ex--;render()});on('extraNext',()=>{capture();if(!extraAnswers[ex].every(v=>v.trim())){$('warning').textContent='Συμπλήρωσε όλα τα πεδία για να συνεχίσεις.';return}if(ex===3)stage='extraResults';else ex++;render()});on('saveExtra',()=>saveReport('Α7.3 Μ1 · Επιπλέον Δραστηριότητες',extras.map((x,j)=>'<article><h2>'+esc(x.title)+'</h2><p>'+esc(x.task)+'</p>'+x.labels.map((label,k)=>'<p>'+esc(label)+': '+esc(extraAnswers[j][k])+'</p>').join('')+'</article>').join(''),'Extra','extraStatus'));on('extraReview',()=>{ex=0;stage='extra';render()})}setInterval(tick,250);render();</script></body></html>
