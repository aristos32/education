<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Α.5.3 Μ1 · Δραστηριότητες Εμπέδωσης</title><style>*{box-sizing:border-box}body{margin:0;font:20px/1.55 'Segoe UI',Arial,sans-serif;background:#eef3f6;color:#193345}header{background:#173647;color:white;display:flex;justify-content:space-between;gap:15px;align-items:center;padding:18px 4vw}small{font-size:14px;letter-spacing:1px}main{max-width:1160px;min-height:65vh;margin:28px auto;padding:0 24px}h1{font-size:clamp(30px,4vw,48px);line-height:1.18;margin:12px 0 25px}h2{font-size:27px;margin:0 0 15px}h3{font-size:22px}p{margin:12px 0}button,.button{font:inherit;display:inline-block;cursor:pointer;background:white;color:#193345;border:1px solid #beced6;border-radius:12px;padding:11px 18px;text-decoration:none}button:hover,.button:hover{background:#e8f5f0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #eab746}button:disabled{opacity:.5;cursor:default}.primary{background:#087b76;color:white;border:0}.primary:hover{background:#09605c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.paper{background:white;border-radius:20px;padding:27px;box-shadow:0 10px 35px #18334509}.scene{background:#193a50;color:white;border-radius:20px;padding:28px}.scene .muted{color:#c5d4e0}.label{font-size:15px;font-weight:bold;letter-spacing:1px;color:#087b76}.muted{font-size:16px;color:#5d7280}.options{display:grid;gap:12px;margin:18px 0}.options button{text-align:left}.selected{border:2px solid #087b76;background:#e3f2ed}.correct{background:#dff3e9!important;border-color:#318665!important}.wrong{background:#ffede6!important}.feedback{margin:18px 0;padding:15px;border-left:4px solid #d6a13b;background:#fff7e5;color:#433b29}.tools{display:flex;gap:10px;flex-wrap:wrap}.foot{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:25px 0}.progress{height:6px;background:#d2e2e7}.progress i{display:block;height:100%;background:#e3b24f;transition:width .3s}.art{display:flex;gap:18px;align-items:center;margin-bottom:20px}.art svg{width:75px;height:75px;background:#e0f1ee;color:#087b76;border-radius:20px;padding:15px;flex:none}.scene .art svg{background:#2d5368;color:#f2c66f}.art span{font-weight:bold}.mail{border-top:5px solid #e2ac42}.mail .line{padding:9px 0;border-bottom:1px solid #d6e1e5;overflow-wrap:anywhere}.mail code{font-size:18px;color:#914c35}.files{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.files span{padding:12px 18px;background:#e3f1ef;border-radius:10px}.hide{display:none!important}.reveal{animation:enter .4s ease-out}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}textarea,input{font:inherit;padding:13px;border:1px solid #a7bdc8;border-radius:10px;width:100%;margin:8px 0}textarea{min-height:130px}details{margin:18px 0}summary{cursor:pointer;color:#086c68;font-weight:bold}.stepnav{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.stepnav button{padding:8px 14px}.bigscore{font-size:45px;font-weight:bold;color:#087b76}.board{font-size:25px}.board main{max-width:1350px}.count{font-size:16px}blockquote{border-left:5px solid #e2b350;margin:20px 0;padding:15px 22px;font-size:25px;background:#f9f2e3}.report{display:none}.report h1{font-size:26px}.report article{break-inside:avoid;border-bottom:1px solid #ccc;padding:12px 0}.report p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}main{padding:0 16px}.paper,.scene{padding:21px}.foot{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{@page{size:A4;margin:15mm}body{font-size:12px;background:white;color:black}body>*:not(.report){display:none!important}.report{display:block!important}.report h2{font-size:18px}.report h3{font-size:14px}.report .meta{font-size:14px;border-bottom:2px solid #333;padding-bottom:15px}} .timerbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid #cadce3;padding:10px 4vw;display:flex;gap:15px;align-items:center;flex-wrap:wrap}.timerbar strong{font-size:27px;font-variant-numeric:tabular-nums}.timerbar.warn{background:#fff2d2;border-color:#d79c24}.timerbar.expired{background:#ffe5df;border-color:#c83b27}.timerbar p{margin:0}.alert{color:#9c241a;font-weight:bold;background:#fff0e8;padding:12px;border-radius:8px}.correct{background:#b8edc8!important;color:#064720!important;border:3px solid #16813c!important;opacity:1!important}.savearea{margin:22px 0;padding:20px;background:#e9f3f1;border-radius:14px}@media print{.timerbar{display:none!important}}.options button.correct{background:transparent!important;color:#087b32!important;border:1px solid #beced6!important;box-shadow:none!important;font-weight:400!important;opacity:1!important}.options button.wrong{background:transparent!important;color:#b3261e!important;border:1px solid #beced6!important;box-shadow:none!important;font-weight:400!important}.feedback.answer-correct{background:transparent!important;color:#087b32!important;border:0!important;font-size:20px;font-weight:400}.feedback.answer-wrong{background:transparent!important;color:#b3261e!important;border:0!important;font-size:20px;font-weight:400} .answer-ok{color:#087b32!important;font-weight:400!important;background:transparent!important;border:1px solid #beced6!important;box-shadow:none!important;opacity:1!important}.answer-no{color:#b3261e!important;font-weight:400!important;background:transparent!important;border:1px solid #beced6!important;box-shadow:none!important}.response-ok,.response-no{padding:14px 0;background:transparent;border:0;font-weight:400}.response-ok{color:#087b32}.response-no{color:#b3261e}.response-ok strong,.response-no strong{font-weight:500}.status-line{min-height:32px}.mini-progress{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.mini-progress span{padding:4px 12px;border-bottom:3px solid #bdcfd5}.mini-progress .done{border-color:#087b32}.mini-progress .current{background:#e3f1ef;border-radius:8px}.criteria{font-size:17px;line-height:1.5}.teacher-note{margin-top:22px;font-size:16px;color:#5d7280}.savearea input{max-width:650px;display:block}.source{border-bottom:1px solid #cedde1;padding:14px 0}.report .source{break-inside:avoid}.menu-links{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:25px}.task{border-left:4px solid #d8b04e;padding:12px 20px;margin:18px 0}.timerbar{box-shadow:0 5px 12px #17364708} .smallnote{font-size:15px;color:#647985}</style></head><body><header><div><small>Α΄ ΓΥΜΝΑΣΙΟΥ · Α.5.3 Μ1</small><div>Δραστηριότητες Εμπέδωσης</div></div><div class="tools"><button id="board">Μεγάλα γράμματα</button><button id="full" aria-label="Πλήρης οθόνη">⛶</button></div></header><aside id="timerbar" class="timerbar"><strong id="clock">10:00</strong><p id="timerStatus" role="status">Ο χρόνος αρχίζει με την Έναρξη.</p></aside><main id="app"></main><section id="report" class="report"></section><script>
const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[["Ένας άγνωστος στέλνει συνημμένο «photo.jpg.vbs». Ποιος κίνδυνος χρειάζεται έλεγχο;", ["Μόνο Spam, αφού η μόλυνση δεν μπορεί να έρθει σε συνημμένο.", "Κακόβουλο πρόγραμμα που μπορεί να εκτελεστεί αν ανοίξω το αρχείο.", "Phishing μόνο και μόνο επειδή το αρχείο ονομάζεται photo."], 1, "Διάβασε την τελευταία επέκταση και σκέψου τι μπορεί να εκτελεστεί.", "Ένα συνημμένο μπορεί να μεταφέρει κακόβουλο λογισμικό. Δεν το ανοίγουμε για δοκιμή. Η παρουσία συνημμένου μόνη της δεν αποδεικνύει μόλυνση."], ["Ποια είναι η κύρια λειτουργία ενός Antivirus;", ["Να εντοπίζει και να αντιμετωπίζει κακόβουλα προγράμματα.", "Να αποθηκεύει ξεχωριστό αντίγραφο όλων των εγγράφων.", "Να μεταφέρει όλα τα διαφημιστικά email σε άλλο φάκελο."], 0, "Ξεχώρισε τον έλεγχο κακόβουλου λογισμικού από το back up και το φίλτρο email.", "Το Antivirus αφορά κακόβουλα προγράμματα. Δεν αντικαθιστά το back up ή την προσοχή στα μηνύματα."], ["Μήνυμα σε παραπλανά για να δώσεις username και password. Πώς ονομάζεται αυτή η πρακτική;", ["Back up, επειδή δημιουργεί δεύτερο λογαριασμό.", "Spam, άρα δεν μπορεί να περιέχει και απάτη.", "Phishing, επειδή προσπαθεί να αποσπάσει στοιχεία."], 2, "Σκέψου τον σκοπό του μηνύματος, όχι μόνο πόσοι το έλαβαν.", "Phishing είναι η παραπλάνηση για υποκλοπή στοιχείων. Ένα μήνυμα μπορεί συγχρόνως να είναι Spam."], ["Ένα email «τράπεζας» ζητά τον κωδικό της κάρτας σου. Ποια αντίδραση είναι κατάλληλη;", ["Απαντώ μόνο με τα μισά στοιχεία για μεγαλύτερη ασφάλεια.", "Δεν δίνω στοιχεία και επιβεβαιώνω από γνωστό επίσημο κανάλι.", "Ανοίγω τον σύνδεσμο του μηνύματος για να ελέγξω αν μοιάζει επίσημος."], 1, "Η επιβεβαίωση πρέπει να γίνει ανεξάρτητα από το ύποπτο μήνυμα.", "Δεν στέλνουμε μυστικά στοιχεία σε τέτοιο αίτημα. Ζητούμε βοήθεια και χρησιμοποιούμε επίσημο κανάλι που ήδη γνωρίζουμε."], ["Ποια περιγραφή ταιριάζει στο Spam;", ["Κάθε email που περιέχει συνημμένο αρχείο.", "Κάθε ενημέρωση του καθηγητή προς όλη την τάξη.", "Μαζική ανεπιθύμητη αλληλογραφία, συχνά για διαφημίσεις."], 2, "Το πλήθος παραληπτών δεν αρκεί. Μετρά και αν το μήνυμα είναι ανεπιθύμητο.", "Spam είναι η ανεπιθύμητη μαζική αλληλογραφία. Μια αναμενόμενη σχολική ενημέρωση δεν είναι αυτόματα Spam."], ["Λαμβάνεις συνεχώς ύποπτες διαφημίσεις που δεν ζήτησες. Ποιο εργαλείο βοηθά;", ["Report spam / Junk και φίλτρο στην υπηρεσία email.", "Back up του υπολογιστή για να σταματήσουν τα email.", "Απάντηση σε κάθε άγνωστο αποστολέα με αίτημα διαγραφής."], 0, "Επίλεξε το εργαλείο που ταξινομεί την ανεπιθύμητη αλληλογραφία.", "Χρησιμοποιούμε το φίλτρο email και την αναφορά Spam. Δεν απαντούμε σε ύποπτους αγνώστους."], ["Γιατί εμφανίζουμε ολόκληρο το όνομα «photo.jpg.vbs»;", ["Για να μετατραπεί αυτόματα σε φωτογραφία.", "Για να κρίνουμε από το πόσο μεγάλο είναι το όνομα.", "Για να δούμε την τελευταία επέκταση και να μην ξεγελαστούμε από το .jpg."], 2, "Ο τύπος δεν καθορίζεται από την πρώτη λέξη του ονόματος.", "Το .vbs δείχνει script. Το όνομα ή ένα εικονίδιο δεν αποδεικνύουν ότι ένα αρχείο είναι ασφαλές."], ["Το Antivirus ενημερώνεται συχνά με update. Για ποιον λόγο;", ["Για να εντοπίζει καλύτερα νέες απειλές που εμφανίζονται.", "Για να αποτελεί ξεχωριστό αντίγραφο των αρχείων μου.", "Για να μην χρειάζεται πια έλεγχος στα συνημμένα."], 0, "Οι απειλές αλλάζουν. Καμία προστασία δεν καταργεί την προσοχή μας.", "Το update βελτιώνει την προστασία απέναντι σε νέες απειλές. Συνεχίζουμε να προσέχουμε τι ανοίγουμε."], ["Υποψιάζεσαι μόλυνση στον σχολικό Η/Υ. Τι είναι κατάλληλο να γίνει με τον υπεύθυνο;", ["Να κατεβάσουμε το πρώτο «δωρεάν καθαριστικό» που εμφανίζει μια διαφήμιση.", "Να κάνουμε full system scan με το ενημερωμένο εγκατεστημένο Antivirus.", "Να αλλάξουμε μόνο το όνομα του ύποπτου αρχείου."], 1, "Χρειάζεται αξιόπιστο εργαλείο ελέγχου, όχι τυχαία διαφήμιση.", "Ενημερώνουμε τον καθηγητή και κάνουμε έλεγχο με το αξιόπιστο Antivirus. Αν το πρόβλημα επιμένει, ζητούμε τεχνική βοήθεια."], ["Ποια δήλωση για την προστασία των αρχείων είναι σωστή;", ["Το back up και το Antivirus κάνουν ακριβώς την ίδια εργασία.", "Το Antivirus εγγυάται ότι κάθε email που λαμβάνω είναι αληθινό.", "Το back up βοηθά στην επαναφορά, το Antivirus στον έλεγχο κακόβουλου λογισμικού."], 2, "Δύο εργαλεία μπορεί να μας προστατεύουν με διαφορετικούς τρόπους.", "Χρειαζόμαστε συνδυασμό: ενημερωμένο Antivirus, back up και προσεκτικές επιλογές."]];let i=0,started=false,expired=false,finishedAt=0,deadline=0;const answers={},first={},hints={},solved={};function tick(){if(started&&!finishedAt&&!expired&&Date.now()>=deadline){expired=true;render()}const rem=!started?600:Math.max(0,Math.ceil((deadline-(finishedAt||Date.now()))/1000));$('clock').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');$('timerbar').className='timerbar'+(expired?' expired':started&&!finishedAt&&rem<=120?' warn':'');$('timerStatus').textContent=expired?'Ο χρόνος έληξε. Η εμπέδωση κλειδώθηκε.':finishedAt?'Η εμπέδωση ολοκληρώθηκε. Το χρονόμετρο σταμάτησε.':!started?'Ο χρόνος αρχίζει με την Έναρξη.':rem<=60?'Προσοχή: απομένει έως 1 λεπτό.':rem<=120?'Προσοχή: απομένουν έως 2 λεπτά.':'Εμπέδωση · 10 λεπτά';}function render(){if(!started){shell(`<div class="paper"><h1>Εμπέδωση · 10 ερωτήσεις</h1><p>Θα αναγνωρίσεις κινδύνους και θα επιλέξεις τρόπους προστασίας. Έχεις υποδείξεις και μπορείς να ξαναδοκιμάσεις.</p><p>Χρόνος: <b>10΄</b>. Στη λήξη οι ερωτήσεις κλειδώνουν. Κάθε ερώτηση πρέπει να απαντηθεί πριν συνεχίσεις.</p><button id="begin" class="primary">Έναρξη 10 λεπτών →</button></div>`);return}if(expired||i===qs.length){shell(`<div class="paper"><h1>${expired?'Ο χρόνος ολοκληρώθηκε':'Ολοκλήρωσες την εμπέδωση!'}</h1>${expired?'<p class="alert">Οι ερωτήσεις έχουν κλειδωθεί.</p>':''}<p>Απαντημένες: <b>${Object.keys(answers).length} / 10</b></p><p>Σωστές με την πρώτη προσπάθεια: <b>${qs.filter((q,j)=>first[j]===q[2]).length} / 10</b></p><p>Σωστές συνολικά, με ή χωρίς βοήθεια: <b>${Object.keys(solved).length} / 10</b></p><p>Όταν σου το ζητήσει ο καθηγητής, άνοιξε χωριστά το αρχείο ASSESSMENT.HTML για την αξιολόγηση.</p></div>`);return}const q=qs[i],a=answers[i],ok=a===q[2];shell(`<div class="label">ΕΜΠΕΔΩΣΗ · ${i+1} / 10</div><div class="art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span>Ελέγχω πριν ενεργήσω</span></div><h1>Αναγνωρίζω και αντιμετωπίζω</h1><div class="paper"><h2>${q[0]}</h2><div class="options">${q[1].map((o,j)=>`<button data-answer="${j}" ${solved[i]?'disabled':''} class="${a===j?(ok?'answer-ok':'answer-no'):''}">${a===j?(ok?'✓ ':'✗ '):''}${o}</button>`).join('')}</div><button id="hint">💡 Υπόδειξη</button>${hints[i]?`<div class="feedback">${q[3]}</div>`:''}${a!==undefined?`<div class="${ok?'response-ok':'response-no'}" role="status"><strong>${ok?'✓ Σωστή απάντηση':'✗ Λάθος απάντηση'}</strong><p>${ok?q[4]:'Δοκίμασε ξανά ή άνοιξε την υπόδειξη. Μπορείς επίσης να συνεχίσεις και να συζητήσεις την εξήγηση με τον καθηγητή.'}</p></div>`:''}</div><div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><button id="next" class="primary" ${a===undefined?'disabled':''}>${i===9?'Ολοκλήρωση':'Επόμενο →'}</button></div><p class="smallnote">Προσαρμογή των Δραστηριοτήτων Εμπέδωσης 1–6 (σ. 145–146), με επιπλέον εφαρμογές της θεωρίας Μ1 (σ. 129–131).</p>`)}function bind(){listen('begin',()=>{started=true;deadline=Date.now()+600000;render();tick()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(expired||Date.now()>=deadline){tick();return}const a=+b.dataset.answer;if(first[i]===undefined)first[i]=a;answers[i]=a;if(a===qs[i][2])solved[i]=true;render()});listen('hint',()=>{if(Date.now()>=deadline){tick();return}hints[i]=true;render()});listen('prev',()=>{if(Date.now()>=deadline){tick();return}i--;render()});listen('next',()=>{if(Date.now()>=deadline){tick();return}if(answers[i]===undefined)return;i++;if(i===qs.length)finishedAt=Date.now();render();tick()})}setInterval(tick,250);render();</script></body></html>
