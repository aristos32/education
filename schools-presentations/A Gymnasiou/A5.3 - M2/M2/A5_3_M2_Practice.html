async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά ή χρησιμοποίησε Εκτύπωση / PDF.';}}
function resultHTML(title,body){return '<!doctype html><html lang="el"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:18px/1.6 Arial;max-width:900px;margin:35px auto;padding:20px}article{border-bottom:1px solid #ccc;padding:15px 0;break-inside:avoid}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{button{display:none}}</style><h1>'+esc(title)+'</h1>'+body+'<button onclick="window.print()">Εκτύπωση / Αποθήκευση ως PDF</button></html>'}
function safeName(t){return t.replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,70)||'student'}
const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[["Σε μια ομαδική συνομιλία εμφανίζεται περιεχόμενο που σε αναστατώνει. Ποια αντίδραση είναι ασφαλής;", ["Το προωθώ σε φίλο για να το κρίνει.", "Σταματώ την προβολή, δεν το προωθώ και μιλώ σε έμπιστο ενήλικα.", "Συνεχίζω να το βλέπω για να βεβαιωθώ."], 1, "Σκέψου πώς θα προστατεύσεις τον εαυτό σου χωρίς να το διαδώσεις.", "Ακατάλληλο περιεχόμενο: σταματούμε την προβολή και ζητούμε βοήθεια. Δεν το προωθούμε."], ["Το PEGI 16 σε ένα εύκολο παιχνίδι δείχνει…", ["καταλληλότητα περιεχομένου για ηλικίες 16 και άνω.", "ότι το παιχνίδι χρειάζεται 16 παίκτες.", "ότι μπορούν να παίξουν μικρότεροι αν είναι καλοί παίκτες."], 0, "Το PEGI αφορά το περιεχόμενο και την ηλικία, όχι την ικανότητα του παίκτη.", "Η ευκολία δεν αλλάζει την ηλικιακή καταλληλότητα. Εξετάζουμε και τις περιγραφικές ενδείξεις με ενήλικα."], ["Τρεις λογαριασμοί κοινοποιούν το ίδιο screenshot μιας ανακοίνωσης. Πριν την πιστέψεις…", ["αρκεί να μετρήσεις τις κοινοποιήσεις.", "θεωρείς ότι έχεις τρεις ανεξάρτητες πηγές.", "αναζητάς την αρχική ανακοίνωση και ανεξάρτητη επιβεβαίωση."], 2, "Μπορεί όλοι να αντέγραψαν το ίδιο λάθος.", "Η επανάληψη δεν αποδεικνύει την αλήθεια. Διασταυρώνουμε τις πληροφορίες."], ["Μια αληθινή ανακοίνωση από πέρσι παρουσιάζεται ως σημερινή. Ποιο είναι το πρόβλημα;", ["Μπορεί να παραπλανήσει επειδή λείπει το σωστό πλαίσιο και η ημερομηνία.", "Δεν υπάρχει πρόβλημα, αφού κάποτε ήταν αληθινή.", "Αρκεί το λογότυπο για να ισχύει και σήμερα."], 0, "Μια πληροφορία μπορεί να είναι σωστή για άλλη στιγμή ή περιοχή.", "Η παραπληροφόρηση μπορεί να προκύψει και από ελλιπείς ή εκτός πλαισίου πληροφορίες."], ["Ποιος έλεγχος βοηθά να αποφύγεις την παραπληροφόρηση;", ["Έχει έντονο τίτλο και ωραία φωτογραφία;", "Ποιος γράφει, πότε δημοσιεύτηκε και ποιες πηγές το στηρίζουν;", "Πόσοι φίλοι μου συμφωνούν;"], 1, "Χρειαζόμαστε στοιχεία που ελέγχονται, όχι μόνο εντυπώσεις.", "Ελέγχουμε συγγραφέα, ημερομηνία, τεκμηρίωση και άλλες αξιόπιστες πηγές."], ["Ποιος συνδέεται με τα πνευματικά δικαιώματα μιας φωτογραφίας;", ["Όποιος τη βρει πρώτος σε αναζήτηση.", "Κάθε χρήστης που την κατεβάζει.", "Ο δημιουργός της και οι δικαιούχοι, σύμφωνα με τους όρους χρήσης."], 2, "Η λήψη ενός έργου δεν σε κάνει δημιουργό του.", "Σεβόμαστε τον δημιουργό και ελέγχουμε τους όρους με τους οποίους διαθέτει το έργο."], ["Θέλεις μια εικόνα για δημόσια σχολική αφίσα. Ποια επιλογή είναι κατάλληλη;", ["Παίρνω οποιαδήποτε εικόνα, αρκεί να μη βγάζω χρήματα.", "Επιλέγω δική μου εικόνα ή υλικό με άδεια που επιτρέπει αυτή τη χρήση.", "Γράφω «πηγή: Internet» και αρκεί."], 1, "Η δημόσια εμφάνιση μιας εικόνας δεν σημαίνει ελεύθερη επαναχρησιμοποίηση.", "Ελέγχουμε την άδεια και τους όρους, συμπεριλαμβανομένης της αναφοράς δημιουργού όπου απαιτείται."], ["Μοιράζομαι μουσική online χωρίς την απαραίτητη άδεια. Με ποιον κίνδυνο συνδέεται;", ["Παραβίαση πνευματικών δικαιωμάτων.", "Παραπληροφόρηση για την ημερομηνία.", "Εθισμός λόγω του είδους αρχείου."], 0, "Σκέψου τα δικαιώματα χρήσης και διανομής του έργου.", "Το ζήτημα είναι η χρήση ή διανομή χωρίς την άδεια που απαιτείται."], ["Ποια περίπτωση χρειάζεται προσοχή και υποστήριξη;", ["Χρησιμοποιώ το Internet για μια εργασία και σταματώ όταν τελειώσω.", "Παίζω και μετά ακολουθώ το συμφωνημένο πρόγραμμά μου.", "Δυσκολεύομαι συχνά να σταματήσω και παραμελώ ύπνο, μαθήματα ή φίλους."], 2, "Εξέτασε την επίδραση στην καθημερινότητα και τη δυνατότητα διακοπής.", "Αυτά είναι σημάδια για συζήτηση με έμπιστο ενήλικα. Δεν βάζουμε διάγνωση από έναν αριθμό ωρών."], ["Ποιο σχέδιο βοηθά να κρατήσουμε ισορροπία στη χρήση του Διαδικτύου;", ["Σταματώ μόνο όταν τελειώσουν όλα τα παιχνίδια.", "Συμφωνώ πρόγραμμα, κάνω διαλείμματα και κρατώ χρόνο για ύπνο και δραστηριότητες εκτός οθόνης.", "Αφήνω το πρόγραμμα κάθε μέρας στην τύχη."], 1, "Σκέψου ένα σχέδιο που περιλαμβάνει και ανάγκες εκτός οθόνης.", "Η χρήση με μέτρο, οι εναλλακτικές δραστηριότητες και η υποστήριξη βοηθούν στην πρόληψη και αντιμετώπιση δυσκολιών."]];let i=0,started=false,expired=false,finishedAt=0,deadline=0;const answers={},first={},hints={},solved={};function tick(){if(started&&!finishedAt&&!expired&&Date.now()>=deadline){expired=true;render()}const rem=!started?600:Math.max(0,Math.ceil((deadline-(finishedAt||Date.now()))/1000));$('clock').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');$('timerbar').className='timerbar'+(expired?' expired':started&&!finishedAt&&rem<=120?' warn':'');$('timerStatus').textContent=expired?'Ο χρόνος έληξε. Η εμπέδωση κλειδώθηκε.':finishedAt?'Η εμπέδωση ολοκληρώθηκε. Το χρονόμετρο σταμάτησε.':!started?'Ο χρόνος αρχίζει με την Έναρξη.':rem<=60?'Προσοχή: απομένει έως 1 λεπτό.':rem<=120?'Προσοχή: απομένουν έως 2 λεπτά.':'Εμπέδωση · 10 λεπτά';}function render(){if(!started){shell(`<div class="paper"><h1>Εμπέδωση · 10 ερωτήσεις</h1><p>Θα αναγνωρίσεις κινδύνους και θα επιλέξεις τρόπους προστασίας. Έχεις υποδείξεις και μπορείς να ξαναδοκιμάσεις.</p><p>Χρόνος: <b>10΄</b>. Στη λήξη οι ερωτήσεις κλειδώνουν. Κάθε ερώτηση πρέπει να απαντηθεί πριν συνεχίσεις.</p><button id="begin" class="primary">Έναρξη 10 λεπτών →</button></div>`);return}if(expired||i===qs.length){shell(`<div class="paper"><h1>${expired?'Ο χρόνος ολοκληρώθηκε':'Ολοκλήρωσες την εμπέδωση!'}</h1>${expired?'<p class="alert">Οι ερωτήσεις έχουν κλειδωθεί.</p>':''}<p>Απαντημένες: <b>${Object.keys(answers).length} / 10</b></p><p>Σωστές με την πρώτη προσπάθεια: <b>${qs.filter((q,j)=>first[j]===q[2]).length} / 10</b></p><p>Ερωτήσεις που ολοκλήρωσες σωστά με βοήθεια ή επανάληψη: <b>${Object.keys(solved).length} / 10</b></p><p>Συνέχισε στην ξεχωριστή εφαρμογή αξιολόγησης όταν σου το ζητήσει ο καθηγητής.</p><a class="button" href="Student_index.html">Αρχικό Μενού</a></div>`);return}const q=qs[i],a=answers[i],ok=a===q[2];shell(`<div class="label">ΕΜΠΕΔΩΣΗ · ${i+1} / 10</div><h1>Αναγνωρίζω και αντιμετωπίζω</h1><div class="paper"><h2>${q[0]}</h2><div class="options">${q[1].map((o,j)=>`<button data-answer="${j}" ${solved[i]?'disabled':''} class="${a===j?(ok?'answer-ok':'answer-no'):''}">${a===j?(ok?'✓ ':'✗ '):''}${o}</button>`).join('')}</div><button id="hint">💡 Υπόδειξη</button>${hints[i]?`<div class="feedback">${q[3]}</div>`:''}${a!==undefined?`<div class="${ok?'response-ok':'response-no'}" role="status"><strong>${ok?'✓ Σωστή απάντηση':'✗ Λάθος απάντηση'}</strong><p>${ok?q[4]:'Δοκίμασε ξανά ή άνοιξε την υπόδειξη. Μπορείς επίσης να συνεχίσεις και να συζητήσεις την εξήγηση με τον καθηγητή.'}</p></div>`:''}</div><div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><button id="next" class="primary" ${a===undefined?'disabled':''}>${i===9?'Ολοκλήρωση':'Επόμενο →'}</button></div><p class="smallnote">Βασισμένο στις Δραστηριότητες Εμπέδωσης 1–11 του βιβλίου (σ. 149–151), με εφαρμογές αναγνώρισης και αντιμετώπισης κινδύνων.</p>`)}function bind(){listen('begin',()=>{started=true;deadline=Date.now()+600000;render();tick()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(expired||Date.now()>=deadline){tick();return}const a=+b.dataset.answer;if(first[i]===undefined)first[i]=a;answers[i]=a;if(a===qs[i][2])solved[i]=true;render()});listen('hint',()=>{if(Date.now()>=deadline){tick();return}hints[i]=true;render()});listen('prev',()=>{if(Date.now()>=deadline){tick();return}i--;render()});listen('next',()=>{if(Date.now()>=deadline){tick();return}if(answers[i]===undefined)return;i++;if(i===qs.length)finishedAt=Date.now();render();tick()})}setInterval(tick,250);render();</script></html>
