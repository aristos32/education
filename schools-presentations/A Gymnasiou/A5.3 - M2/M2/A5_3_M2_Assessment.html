async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά και έλεγξε τις ρυθμίσεις λήψεων του browser.';}}

const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[{"title": "Ακατάλληλο περιεχόμενο στην ομάδα", "case": "Ένας συμμαθητής ανεβάζει στην ομάδα της τάξης ένα βίντεο που προωθεί βία και ρατσιστικά σχόλια. Κάποιοι ζητούν να το προωθήσετε «για να το δουν όλοι».", "q": "Ποια αντίδραση συνδυάζει καλύτερα την προστασία σου με την υπεύθυνη αντιμετώπιση του περιεχομένου;", "hint": "Σκέψου την προστασία σου, την αποφυγή διάδοσης και τη βοήθεια από έμπιστο ενήλικα.", "guide": "Αναγνώριση ακατάλληλου περιεχομένου. Σταματώ την προβολή, δεν το προωθώ και ενημερώνω έμπιστο ενήλικα για ασφαλή αναφορά ή αποκλεισμό.", "options": ["Αποθηκεύω το βίντεο και το στέλνω σε άλλη ομάδα, ζητώντας να καταδικάσουν το περιεχόμενο.", "Ζητώ από την ομάδα να σταματήσει τα σχόλια και κρατώ το βίντεο για να το δείξω αργότερα σε φίλους.", "Σταματώ την προβολή, δεν το προωθώ και ζητώ βοήθεια από έμπιστο ενήλικα για αναφορά ή αποκλεισμό.", "Διαγράφω την εφαρμογή και δεν ενημερώνω κανέναν, ώστε να μη δοθεί περισσότερη προσοχή στο βίντεο."], "correct": 2}, {"title": "Μια ανακοίνωση χωρίς ημερομηνία", "case": "Ένα screenshot γράφει «Αύριο κλείνουν τα σχολεία». Έχει λογότυπο, αλλά δεν δείχνει πηγή ή ημερομηνία. Τρεις σελίδες το αναδημοσιεύουν.", "q": "Ποιον κίνδυνο αναγνωρίζεις; Ποια δύο στοιχεία θα ελέγξεις πριν ενημερώσεις την τάξη σου;", "hint": "Το λογότυπο και οι αναδημοσιεύσεις δεν αρκούν. Πού θα βρεις την αρχική και σημερινή ενημέρωση;", "guide": "Κίνδυνος παραπληροφόρησης. Ελέγχω αρχική πηγή, ημερομηνία και περιοχή. Διασταυρώνω σε ανεξάρτητο αξιόπιστο κανάλι. Οι αναδημοσιεύσεις μπορεί να αντιγράφουν την ίδια πληροφορία."}, {"title": "Η αφίσα και η μουσική της τάξης", "case": "Η ομάδα σου θέλει να δημοσιεύσει μια αφίσα με εικόνα και μουσική που βρήκε online. Δεν έχει ελέγξει άδεια χρήσης.", "q": "Ποια επιλογή σέβεται τα πνευματικά δικαιώματα όταν η αφίσα και η μουσική δημοσιευθούν δημόσια;", "hint": "Σκέψου τι σημαίνουν «αντιγράφω», «αναδημοσιεύω» και «διανέμω». Η αναφορά ονόματος αρκεί από μόνη της;", "guide": "Παραδείγματα: αναδημοσίευση εικόνας ή διανομή μουσικής χωρίς την απαραίτητη άδεια. Ασφαλής εναλλακτική: δικό μας υλικό ή υλικό με κατάλληλη άδεια, τηρώντας τους όρους.", "options": ["Χρησιμοποιούμε εικόνα με άδεια που επιτρέπει τη συγκεκριμένη χρήση, τηρούμε τους όρους της και επιλέγουμε δική μας μουσική.", "Χρησιμοποιούμε εικόνα και μουσική από τα πρώτα αποτελέσματα αναζήτησης και αναφέρουμε μόνο τις ιστοσελίδες.", "Αναφέρουμε τους δημιουργούς και χρησιμοποιούμε το υλικό χωρίς έλεγχο άδειας, επειδή η εργασία είναι σχολική.", "Κόβουμε ένα μικρό τμήμα της εικόνας και της μουσικής, ώστε η αλλαγή να μας δίνει δικαίωμα δημόσιας χρήσης."], "correct": 0}, {"title": "«Άλλο ένα παιχνίδι»", "case": "Ο Νίκος παίζει μέχρι αργά, δυσκολεύεται να σταματήσει και αναβάλλει συστηματικά τον ύπνο και τις σχολικές εργασίες.", "q": "Περιέγραψε δύο στοιχεία που σε προβληματίζουν. Πρότεινε δύο συγκεκριμένα βήματα βοήθειας χωρίς να βάλεις διάγνωση.", "hint": "Εξέτασε τις συνέπειες και τη δυνατότητα διακοπής. Σκέψου πρόγραμμα, εναλλακτικές δραστηριότητες και υποστήριξη.", "guide": "Σημεία προβληματισμού: δυσκολία διακοπής και παραμέληση ύπνου/μαθημάτων. Συζήτηση με έμπιστο ενήλικα, συμφωνημένο πρόγραμμα, διαλείμματα και δραστηριότητες εκτός οθόνης. Αν οι δυσκολίες επιμένουν, ζητά πρόσθετη υποστήριξη."}, {"title": "Μια απόφαση για το παιχνίδι", "case": "Η 12χρονη Μαρία θέλει να παίξει ένα εύκολο παιχνίδι PEGI 16, επειδή ένας δημοφιλής λογαριασμός γράφει «είναι ασφαλές για όλους».", "q": "Ποιο συμπέρασμα στηρίζεται σωστά στα στοιχεία και ποια ενέργεια είναι καταλληλότερη;", "hint": "Συνδύασε την καταλληλότητα του περιεχομένου με την αξιοπιστία της πληροφορίας.", "guide": "Καταλληλότητα περιεχομένου και πιθανή παραπληροφόρηση. Το PEGI αφορά ηλικιακή καταλληλότητα, όχι δυσκολία. Ελέγχουμε την επίσημη ηλικιακή ένδειξη και περιγραφές, και την τεκμηρίωση του ισχυρισμού με ενήλικα.", "options": ["Αφού το παιχνίδι είναι εύκολο, η ένδειξη 16 αφορά κυρίως την εμπειρία του παίκτη· αρκεί μικρότερος χρόνος παιχνιδιού.", "Η ένδειξη αφορά το περιεχόμενο, αλλά ένας δημοφιλής λογαριασμός μπορεί να επιβεβαιώσει ότι ταιριάζει και σε μικρότερες ηλικίες.", "Η ένδειξη 16 σημαίνει ότι κάθε παίκτης θα πάθει βλάβη· απορρίπτουμε το παιχνίδι χωρίς να ελέγξουμε τι περιγράφει η αξιολόγηση.", "Η ένδειξη αφορά ηλικιακή καταλληλότητα, όχι δυσκολία· ελέγχουμε την επίσημη αξιολόγηση και τους περιγραφικούς δείκτες με ενήλικα, χωρίς να βασιστούμε στη δημοφιλία του ισχυρισμού."], "correct": 3}];const extras=[{"title": "Ερευνητής παιχνιδιών", "case": "Ένα παιδί 12 ετών ζητά τη συμβουλή σου για ένα παιχνίδι που διαφημίζεται online.", "task": "Ερεύνησε ένα πραγματικό παιχνίδι στην επίσημη ιστοσελίδα PEGI. Σε Word γράψε τίτλο παιχνιδιού, ηλικιακή ένδειξη, τουλάχιστον έναν περιγραφικό δείκτη και τις διευθύνσεις των πηγών με ημερομηνία πρόσβασης. Εξήγησε αν θα το πρότεινες στο παιδί και γιατί. Αν δεν βρεις ένα στοιχείο, δήλωσέ το αντί να το υποθέσεις.", "hint": "Μην κρίνεις από τη δυσκολία ή το διαφημιστικό trailer. Αναζήτησε στοιχεία για το περιεχόμενο.", "guide": "Έλεγξε αν διαχώρισες την ηλικιακή καταλληλότητα από τη δυσκολία και αν τεκμηρίωσες την πρότασή σου.", "online": true}, {"title": "Διασταύρωση μιας είδησης", "case": "Η τάξη ετοιμάζει μια μικρή ενημέρωση για ασφαλή χρήση του Διαδικτύου.", "task": "Διάλεξε μια μη ευαίσθητη είδηση για τεχνολογία ή σχολική ζωή. Βρες την αρχική πηγή και μία δεύτερη ανεξάρτητη πηγή. Σε Word καταχώρισε συγγραφέα/φορέα, ημερομηνία, συνδέσμους και τι συμφωνεί ή διαφέρει. Κατέληξε: επιβεβαιώνεται, δεν επιβεβαιώνεται ή χρειάζονται περισσότερα στοιχεία;", "hint": "Δύο σελίδες που αντιγράφουν την ίδια ανακοίνωση δεν είναι απαραίτητα ανεξάρτητη τεκμηρίωση.", "guide": "Η απάντηση χρειάζεται αιτιολόγηση, όχι μόνο δύο συνδέσμους. Έλεγξε την ημερομηνία και το πλαίσιο.", "online": true}, {"title": "Μια αφίσα με σεβασμό στον δημιουργό", "case": "Η σχολική ομάδα χρειάζεται εικόνα για δημόσια αφίσα κατά της παραπληροφόρησης.", "task": "Φτιάξε σε Word μια μικρή αφίσα με δική σου εικόνα ή με εικόνα κατάλληλης άδειας. Κάτω από αυτήν γράψε δημιουργό, πηγή, άδεια και τους όρους που τήρησες. Εξήγησε γιατί το «πηγή: Internet» δεν αρκεί. Αν χρησιμοποιήσεις δική σου εικόνα, δήλωσέ το.", "hint": "Έλεγξε αν επιτρέπονται δημοσίευση και τυχόν αλλαγές και αν απαιτείται αναφορά δημιουργού.", "guide": "Έλεγξε ότι η άδεια αφορά πραγματικά την εικόνα και τη συγκεκριμένη χρήση. Η αναφορά ονόματος δεν αντικαθιστά την άδεια.", "online": true}, {"title": "Σχέδιο ισορροπίας με αιτιολόγηση", "case": "Ένας συνομήλικός σου θέλει να μειώσει τη χρήση που επηρεάζει τον ύπνο του, αλλά επικοινωνεί με τους φίλους του κυρίως online.", "task": "Σχεδίασε σε Word ένα ρεαλιστικό πρόγραμμα μιας απογευματινής ημέρας. Κράτησε χρόνο για υποχρεώσεις, ύπνο, επικοινωνία και δραστηριότητα εκτός οθόνης. Γράψε πώς θα ελέγξει μετά από μία εβδομάδα αν το πρόγραμμα βοηθά και πότε θα ζητήσει υποστήριξη.", "hint": "Αιτιολόγησε τις επιλογές χωρίς να παρουσιάσεις έναν αριθμό ωρών ως διάγνωση για όλους.", "guide": "Το σχέδιο χρειάζεται συγκεκριμένα βήματα, εφικτές αλλαγές και κριτήρια για την καθημερινότητα.", "online": false}, {"title": "Βοήθεια χωρίς διάδοση", "case": "Μια φίλη βλέπει ένα βίντεο που την αναστατώνει. Ένας άλλος μαθητής προτείνει να το αναρτήσετε δημόσια μαζί με το όνομα του αποστολέα.", "task": "Γράψε ένα σύντομο σχέδιο αντίδρασης σε Word. Εξήγησε δύο πιθανά προβλήματα της δημόσιας κοινοποίησης, πώς θα στηρίξεις τη φίλη σου και πώς θα ζητήσετε βοήθεια. Μην αναζητήσεις, αποθηκεύσεις ή επισυνάψεις ακατάλληλο υλικό.", "hint": "Σκέψου την αποφυγή περαιτέρω διάδοσης, την προστασία προσώπων και την υποστήριξη από έμπιστο ενήλικα.", "guide": "Το σχέδιο προστατεύει τα παιδιά χωρίς να επαναδιαδίδει το υλικό και περιλαμβάνει ασφαλή αναφορά με βοήθεια ενήλικα.", "online": false}];let stage='start',i=0,ex=0,student='',classroom='',extraName='',submitted=false,extraComplete=false;const answers={},hints={},responses={},extraHints={},extraGuides={};function answerText(j){return qs[j].options?qs[j].options[Number(answers[j])]||'':answers[j]||''}function mcScore(){return qs.filter((q,j)=>q.options&&Number(answers[j])===q.correct).length}function completed(){return qs.every((_,j)=>String(answers[j]||'').trim())}function reportBody(){return `<p>Ονοματεπώνυμο: <b>${esc(student)}</b><br>Τμήμα: ${esc(classroom)||'—'}<br>Ημερομηνία: ${new Date().toLocaleDateString('el-GR')}</p><p>3 ερωτήσεις πολλαπλής επιλογής και 2 ανοικτά σενάρια. Σωστές επιλογές: ${mcScore()} / 3. Τα ανοικτά σενάρια αξιολογούνται από τον καθηγητή.</p>${qs.map((q,j)=>`<article><h2>${j+1}. ${esc(q.title)}</h2><p>${esc(q.case)}</p><p><b>${esc(q.q)}</b></p><p>Απάντηση: ${esc(answerText(j))}</p><p>Χρήση υπόδειξης: ${hints[j]?'Ναι':'Όχι'}</p><p>Σχόλιο / βαθμός καθηγητή: _________________________________</p></article>`).join('')}`}function saveAssessment(){const n=$('resultName').value.trim();if(!n){$('saveStatus').className='alert';$('saveStatus').textContent='Υποχρεωτικό πεδίο: συμπλήρωσε το ονοματεπώνυμό σου πριν αποθηκεύσεις.';$('resultName').focus();return}student=n;$('report').innerHTML='<h1>Α.5.3 Μ2 · Δραστηριότητες Αξιολόγησης</h1>'+reportBody();saveLocal(resultHTML('Α.5.3 Μ2 · Δραστηριότητες Αξιολόγησης',reportBody()),'A5_3_M2_Assessment_'+safeName(student)+'.html','saveStatus')}function saveExtra(){extraName=$('extraName').value.trim();if(!extraName){$('extraStatus').className='alert';$('extraStatus').textContent='Υποχρεωτικό πεδίο: συμπλήρωσε ονοματεπώνυμο για να αποθηκεύσεις τις Επιπλέον Δραστηριότητες.';$('extraName').focus();return}const body='<p>Ονοματεπώνυμο: '+esc(extraName)+'</p><p>Ημερομηνία: '+new Date().toLocaleDateString('el-GR')+'</p>'+extras.map((x,j)=>'<article><h2>'+esc(x.title)+'</h2><p>'+esc(x.case)+'</p><p>'+esc(x.task)+'</p><p>Απάντηση / τεκμηρίωση: '+esc(responses[j])+'</p></article>').join('');saveLocal(resultHTML('Α.5.3 Μ2 · Επιπλέον Δραστηριότητες',body),'A5_3_M2_Extra_'+safeName(extraName)+'.html','extraStatus')}function render(){if(stage==='start'){shell(`<div class="label">ΑΞΙΟΛΟΓΗΣΗ · 5 ΕΡΩΤΗΣΕΙΣ</div><h1>Εξηγώ και επιλέγω προστασία</h1><div class="paper"><p>Τρεις απαιτητικές ερωτήσεις πολλαπλής επιλογής και δύο ανοικτά σενάρια. Επίλεξε μία απάντηση στις ερωτήσεις επιλογής και αιτιολόγησε τις ενέργειές σου στα ανοικτά σενάρια. Μπορείς να ζητήσεις υπόδειξη.</p><label for="name">Ονοματεπώνυμο (υποχρεωτικό)</label><input id="name" value="${esc(student)}" required autocomplete="name"><label for="class">Τμήμα (προαιρετικό)</label><input id="class" value="${esc(classroom)}"><p id="nameWarning" role="alert"></p><button id="begin" class="primary">Έναρξη αξιολόγησης →</button><p class="muted">Οι απαντήσεις δεν αποστέλλονται. Η αποθήκευση εμφανίζεται στο τέλος. Μην κλείσεις ή ανανεώσεις τη σελίδα πριν αποθηκεύσεις.</p></div>`);return}if(stage==='question'){const q=qs[i];shell(`<div class="label">ΑΞΙΟΛΟΓΗΣΗ · ${i+1} / 5</div><h1>${q.title}</h1><div class="grid"><div class="scene"><h2>Το σενάριο</h2><p>${q.case}</p></div><div class="paper"><h2>${q.q}</h2>${q.options?`<div class="options" role="group" aria-label="Επίλεξε μία απάντηση">${q.options.map((o,k)=>`<button type="button" id="choice${k}" aria-pressed="${answers[i]===String(k)}" class="${answers[i]===String(k)?'selected':''}">${String.fromCharCode(913+k)}. ${esc(o)}</button>`).join('')}</div>`:`<label for="answer">Η απάντησή σου</label><textarea id="answer" placeholder="Αναγνώρισε τον κίνδυνο και αιτιολόγησε τι θα κάνεις…">${esc(answers[i])}</textarea>`}<button id="hint">💡 Χρειάζομαι μια υπόδειξη</button>${hints[i]?`<div class="feedback">${q.hint}</div>`:''}<p id="answerWarning" role="alert"></p></div></div><div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><span class="count">${esc(student)}</span><button id="next" class="primary">${i===4?'Έλεγχος απαντήσεων':'Επόμενο →'}</button></div><p class="smallnote">Προσαρμογή των Δραστηριοτήτων Αξιολόγησης 12–14 (σ. 151–152), με εφαρμογές για την κάλυψη όλων των κινδύνων του Μ2. Το σενάριο παραπληροφόρησης αντικαθιστά την παρακολούθηση βίντεο για offline χρήση.</p>`);return}if(stage==='review'){shell(`<div class="paper"><h1>Έλεγχος πριν την υποβολή</h1><p>Έχεις συμπληρώσει 5 απαντήσεις. Έλεγξε ότι αναγνώρισες τον κίνδυνο και αιτιολόγησες τις ενέργειές σου.</p><button id="review">Επιστροφή στις απαντήσεις</button> <button id="submit" class="primary">Ολοκλήρωση αξιολόγησης</button></div>`);return}if(stage==='results'){shell(`<div class="label">Η ΑΞΙΟΛΟΓΗΣΗ ΟΛΟΚΛΗΡΩΘΗΚΕ</div><h1>Τα αποτελέσματά σου</h1><div class="paper"><p>Πολλαπλής επιλογής: ${mcScore()} / 3 σωστές. Τα δύο ανοικτά σενάρια θα αξιολογηθούν από τον καθηγητή. Δεν δίνεται αυτόματη βαθμολογία στις αιτιολογήσεις.</p><div class="savearea"><label for="resultName">Ονοματεπώνυμο (υποχρεωτικό για αποθήκευση)</label><input id="resultName" required value="${esc(student)}"><button id="saveAssessment" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="saveStatus" role="alert"></p><p class="muted">Επιλέγεις τοπικό φάκελο όπου υποστηρίζεται. Διαφορετικά γίνεται λήψη αρχείου. Το αρχείο αναφοράς ανοίγει και offline.</p></div><button id="extraStart" class="primary">Επιπλέον Δραστηριότητες →</button><details><summary>Οι απαντήσεις μου και σημεία αυτοελέγχου</summary>${qs.map((q,j)=>`<div class="source"><h3>${j+1}. ${q.title}</h3><p>${esc(answerText(j))}</p><p class="criteria"><b>Σημεία αυτοελέγχου:</b> ${q.guide}</p></div>`).join('')}</details></div>`);$('report').innerHTML='<h1>Α.5.3 Μ2 · Αξιολόγηση</h1>'+reportBody();return}if(stage==='extra'){if(!submitted){stage='start';render();return}const x=extras[ex];shell(`<div class="label">ΕΠΙΠΛΕΟΝ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ · ${ex+1} / ${extras.length}</div><h1>${x.title}</h1><div class="paper"><p>${x.case}</p><div class="task"><b>Η αποστολή σου</b><p>${x.task}</p></div>${x.online?'<p class="muted">Αυτή η δραστηριότητα χρειάζεται Internet για την έρευνα. Η εφαρμογή λειτουργεί offline. Αν δεν υπάρχει σύνδεση, ξεκίνα σχεδιάζοντας τι θα ελέγξεις και ολοκλήρωσε την έρευνα αργότερα.</p>':''}${ex===0?'<p><a href="https://pegi.info/" target="_blank" rel="noopener">Επίσημη ιστοσελίδα PEGI</a></p>':''}<label for="response">Σύντομη αιτιολόγηση / ευρήματα και πηγές</label><textarea id="response" placeholder="Κατάγραψε ευρήματα, πηγές ή το σχέδιο εργασίας σου…">${esc(responses[ex])}</textarea><button id="extraHint">💡 Καθοδήγηση</button>${extraHints[ex]?`<div class="feedback">${x.hint}</div>`:''}<p id="extraWarning" role="alert"></p></div><div class="foot"><button id="extraPrev" ${ex===0?'disabled':''}>← Προηγούμενο</button><button id="extraNext" class="primary">${ex===extras.length-1?'Ολοκλήρωση επιπλέον δραστηριοτήτων':'Επόμενη αποστολή →'}</button></div>`);return}if(stage==='extraResults'){shell(`<div class="label">ΕΠΙΠΛΕΟΝ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ · ΟΛΟΚΛΗΡΩΣΗ</div><h1>Αποθήκευση της εργασίας σου</h1><div class="paper"><label for="extraName">Ονοματεπώνυμο (υποχρεωτικό)</label><input id="extraName" required value="${esc(extraName||student)}"><button id="saveExtra" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="extraStatus" role="alert"></p><p class="muted">Η αναφορά αποθηκεύει όσα έγραψες εδώ. Το Word αρχείο το αποθηκεύεις χωριστά από την εφαρμογή Word.</p><h2>Παράδοση των εγγράφων Word</h2><p>Όταν ολοκληρώσεις τις εργασίες, επισύναψε τα έγγραφα σε email προς <b>aristos.aresti@gmail.com</b>, με θέμα «Α.5.3 Μ2 – Επιπλέον Δραστηριότητες – Ονοματεπώνυμο».</p><a class="button" href="mailto:aristos.aresti@gmail.com?subject=%CE%91.5.3%20%CE%9C2%20-%20%CE%95%CF%80%CE%B9%CF%80%CE%BB%CE%AD%CE%BF%CE%BD%20%CE%94%CF%81%CE%B1%CF%83%CF%84%CE%B7%CF%81%CE%B9%CF%8C%CF%84%CE%B7%CF%84%CE%B5%CF%82">Άνοιγμα εφαρμογής email</a><p class="smallnote">Απαιτεί σύνδεση και ρυθμισμένη εφαρμογή email. Το μήνυμα δεν αποστέλλεται αυτόματα. Πρόσθεσε εσύ τα αρχεία και το όνομά σου.</p><details><summary>Σημεία αυτοελέγχου των αποστολών</summary>${extras.map((x,j)=>`<div class="source"><h3>${j+1}. ${x.title}</h3><p>${x.guide}</p></div>`).join('')}</details><button id="extraReview">Επιστροφή στις αποστολές</button> <a class="button" href="Student_index.html">Αρχικό Μενού</a></div>`);return}}function capture(){if($('answer'))answers[i]=$('answer').value;if($('response'))responses[ex]=$('response').value}function bind(){listen('begin',()=>{student=$('name').value.trim();classroom=$('class').value.trim();if(!student){$('nameWarning').className='alert';$('nameWarning').textContent='Υποχρεωτικό πεδίο: συμπλήρωσε το ονοματεπώνυμό σου για να συνεχίσεις.';$('name').focus();return}stage='question';render()});if(stage==='question'&&qs[i].options)qs[i].options.forEach((_,k)=>listen('choice'+k,()=>{answers[i]=String(k);render()}));if($('answer'))$('answer').oninput=()=>answers[i]=$('answer').value;listen('hint',()=>{capture();hints[i]=true;render()});listen('prev',()=>{capture();i--;render()});listen('next',()=>{capture();if(!String(answers[i]||'').trim()){$('answerWarning').className='alert';$('answerWarning').textContent='Απάντησε στην ερώτηση πριν συνεχίσεις.';if($('answer'))$('answer').focus();else $('choice0')?.focus();return}if(i===qs.length-1)stage='review';else i++;render()});listen('review',()=>{i=0;stage='question';render()});listen('submit',()=>{if(!completed())return;submitted=true;stage='results';render()});listen('saveAssessment',saveAssessment);listen('extraStart',()=>{if(!submitted)return;student=$('resultName').value.trim()||student;stage='extra';render()});if($('response'))$('response').oninput=()=>responses[ex]=$('response').value;listen('extraHint',()=>{capture();extraHints[ex]=true;render()});listen('extraPrev',()=>{capture();ex--;render()});listen('extraNext',()=>{capture();if(!String(responses[ex]||'').trim()){$('extraWarning').className='alert';$('extraWarning').textContent='Κατάγραψε την απάντηση ή τα ευρήματά σου πριν συνεχίσεις.';$('response').focus();return}if(ex===extras.length-1){extraComplete=true;stage='extraResults'}else ex++;render()});listen('saveExtra',saveExtra);listen('extraReview',()=>{stage='extra';ex=0;render()})}render();</script></html>
