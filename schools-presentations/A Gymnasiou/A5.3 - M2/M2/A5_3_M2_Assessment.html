<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Αξιολόγηση με αναφορά PDF</title><style>*{box-sizing:border-box}body{margin:0;font:20px/1.55 'Segoe UI',Arial,sans-serif;background:#eef3f6;color:#193345}header{background:#173647;color:white;display:flex;justify-content:space-between;gap:15px;align-items:center;padding:18px 4vw}small{font-size:14px;letter-spacing:1px}main{max-width:1160px;min-height:65vh;margin:28px auto;padding:0 24px}h1{font-size:clamp(30px,4vw,48px);line-height:1.18;margin:12px 0 25px}h2{font-size:27px;margin:0 0 15px}h3{font-size:22px}p{margin:12px 0}button,.button{font:inherit;display:inline-block;cursor:pointer;background:white;color:#193345;border:1px solid #beced6;border-radius:12px;padding:11px 18px;text-decoration:none}button:hover,.button:hover{background:#e8f5f0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #eab746}button:disabled{opacity:.5;cursor:default}.primary{background:#087b76;color:white;border:0}.primary:hover{background:#09605c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.paper{background:white;border-radius:20px;padding:27px;box-shadow:0 10px 35px #18334509}.scene{background:#193a50;color:white;border-radius:20px;padding:28px}.scene .muted{color:#c5d4e0}.label{font-size:15px;font-weight:bold;letter-spacing:1px;color:#087b76}.muted{font-size:16px;color:#5d7280}.options{display:grid;gap:12px;margin:18px 0}.options button{text-align:left}.selected{border:2px solid #087b76;background:#e3f2ed}.correct{background:#dff3e9!important;border-color:#318665!important}.wrong{background:#ffede6!important}.feedback{margin:18px 0;padding:15px;border-left:4px solid #d6a13b;background:#fff7e5;color:#433b29}.tools{display:flex;gap:10px;flex-wrap:wrap}.foot{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:25px 0}.progress{height:6px;background:#d2e2e7}.progress i{display:block;height:100%;background:#e3b24f;transition:width .3s}.art{display:flex;gap:18px;align-items:center;margin-bottom:20px}.art svg{width:75px;height:75px;background:#e0f1ee;color:#087b76;border-radius:20px;padding:15px;flex:none}.scene .art svg{background:#2d5368;color:#f2c66f}.art span{font-weight:bold}.mail{border-top:5px solid #e2ac42}.mail .line{padding:9px 0;border-bottom:1px solid #d6e1e5;overflow-wrap:anywhere}.mail code{font-size:18px;color:#914c35}.files{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.files span{padding:12px 18px;background:#e3f1ef;border-radius:10px}.hide{display:none!important}.reveal{animation:enter .4s ease-out}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}textarea,input{font:inherit;padding:13px;border:1px solid #a7bdc8;border-radius:10px;width:100%;margin:8px 0}textarea{min-height:130px}details{margin:18px 0}summary{cursor:pointer;color:#086c68;font-weight:bold}.stepnav{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.stepnav button{padding:8px 14px}.bigscore{font-size:45px;font-weight:bold;color:#087b76}.board{font-size:25px}.board main{max-width:1350px}.count{font-size:16px}blockquote{border-left:5px solid #e2b350;margin:20px 0;padding:15px 22px;font-size:25px;background:#f9f2e3}.report{display:none}.report h1{font-size:26px}.report article{break-inside:avoid;border-bottom:1px solid #ccc;padding:12px 0}.report p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}main{padding:0 16px}.paper,.scene{padding:21px}.foot{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{@page{size:A4;margin:15mm}body{font-size:12px;background:white;color:black}body>*:not(.report){display:none!important}.report{display:block!important}.report h2{font-size:18px}.report h3{font-size:14px}.report .meta{font-size:14px;border-bottom:2px solid #333;padding-bottom:15px}} .timerbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid #cadce3;padding:10px 4vw;display:flex;gap:15px;align-items:center;flex-wrap:wrap}.timerbar strong{font-size:27px;font-variant-numeric:tabular-nums}.timerbar.warn{background:#fff2d2;border-color:#d79c24}.timerbar.expired{background:#ffe5df;border-color:#c83b27}.timerbar p{margin:0}.alert{color:#9c241a;font-weight:bold;background:#fff0e8;padding:12px;border-radius:8px}.correct{background:#b8edc8!important;color:#064720!important;border:3px solid #16813c!important;opacity:1!important}.savearea{margin:22px 0;padding:20px;background:#e9f3f1;border-radius:14px}@media print{.timerbar{display:none!important}}</style><header><a class="button" href="student_index.html" style="white-space:nowrap">⌂ Μενού μαθητή</a><div><small>Α΄ ΓΥΜΝΑΣΙΟΥ · Α.5.3 Μ2</small><div>Αξιολόγηση με αναφορά PDF</div></div><div class="tools"><button id="board">Μεγάλα γράμματα</button><button id="full" aria-label="Πλήρης οθόνη">⛶</button><a class="button" href="A5_3_M2_Assessment.html" download>↓ HTML</a></div></header><main id="app"></main><section id="report" class="report"></section><script>
async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά ή χρησιμοποίησε Εκτύπωση / PDF.';}}
function resultHTML(title,body){return '<!doctype html><html lang="el"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:18px/1.6 Arial;max-width:900px;margin:35px auto;padding:20px}article{border-bottom:1px solid #ccc;padding:15px 0;break-inside:avoid}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{button{display:none}}</style><h1>'+esc(title)+'</h1>'+body+'<button onclick="window.print()">Εκτύπωση / Αποθήκευση ως PDF</button></html>'}
function safeName(t){return t.replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,70)||'student'}
const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[{"q": "Η δυσκολία διακοπής της χρήσης μαζί με παραμέληση της καθημερινότητας μπορεί να συνδέεται με εξάρτηση από το Διαδίκτυο.", "opts": ["Σωστό.", "Λάθος."], "a": 0}, {"q": "Ποιο στοιχείο του σεναρίου δείχνει ότι χρειάζεται βοήθεια;", "opts": ["Χρησιμοποιεί το Internet για σχολική εργασία.", "Δυσκολεύεται να σταματήσει και παραμελεί συστηματικά ύπνο και μαθήματα.", "Γνωρίζει πώς να ανοίγει ένα παιχνίδι."], "a": 1}, {"q": "Ποια πρόταση είναι πιο σωστή;", "opts": ["Ένας συγκεκριμένος αριθμός ωρών αρκεί πάντα για διάγνωση.", "Κάθε online παιχνίδι προκαλεί εξάρτηση.", "Εξετάζουμε και την επίδραση στην καθημερινότητα και ζητάμε υποστήριξη."], "a": 2}, {"q": "Πρότεινε δύο συγκεκριμένα βήματα που μπορούν να βοηθήσουν τον μαθητή. Εξήγησε γιατί τα διάλεξες.", "open": true}, {"q": "Ποιο μήνυμα δίνει το σενάριο της παλιάς ανακοίνωσης;", "opts": ["Μια πληροφορία μπορεί να παραπλανήσει αν λείπει το πλαίσιο και η ημερομηνία.", "Κάθε πληροφορία με λογότυπο είναι σωστή για σήμερα.", "Οι πολλές κοινοποιήσεις εγγυώνται την αλήθεια."], "a": 0}, {"q": "Τρεις λογαριασμοί αντιγράφουν την ίδια ανάρτηση. Αυτό…", "opts": ["αποδεικνύει ότι είναι τρεις ανεξάρτητες πηγές.", "δεν αποτελεί από μόνο του ανεξάρτητη επιβεβαίωση.", "σημαίνει ότι πρέπει να την κοινοποιήσουμε αμέσως."], "a": 1}, {"q": "Γράψε σε μία ή δύο προτάσεις τι θα ελέγξεις πριν ενημερώσεις την τάξη σου για την ανακοίνωση.", "open": true}, {"q": "Ποια ενέργεια σέβεται τα πνευματικά δικαιώματα στην αφίσα της τάξης;", "opts": ["Αντιγράφω την εικόνα επειδή εμφανίζεται στην αναζήτηση.", "Γράφω «πηγή: Internet» χωρίς άλλο έλεγχο.", "Επιλέγω δική μου εικόνα ή ελέγχω άδεια που επιτρέπει τη συγκεκριμένη χρήση."], "a": 2}, {"q": "Γράψε δύο περιπτώσεις χρήσης υλικού στο Διαδίκτυο που παραβιάζουν τα πνευματικά δικαιώματα επειδή λείπει η απαιτούμενη άδεια.", "open": true}, {"q": "Ένας φίλος λέει: «Αν αναφέρω τον δημιουργό, μπορώ να δημοσιεύσω οποιαδήποτε εικόνα». Συμφωνείς; Αιτιολόγησε και πρότεινε μια ασφαλή εναλλακτική.", "open": true}];const scenes=[["Διαδίκτυο και καθημερινότητα", "Ένας μαθητής παίζει συχνά μέχρι αργά. Δυσκολεύεται να σταματήσει, αφήνει μαθήματα και κοιμάται λιγότερο.", "Σενάριο βασισμένο στη Δραστηριότητα Αξιολόγησης 12."], ["Μια παλιά ανακοίνωση ως σημερινή", "Μια ανάρτηση γράφει «Αύριο κλείνουν τα σχολεία». Η αρχική ανακοίνωση είναι παλιά και αφορά άλλη περιοχή. Πολλοί την κοινοποιούν χωρίς έλεγχο.", "Αυτοτελές σενάριο για το μήνυμα της Δραστηριότητας 13. Δεν αναπαράγει το βίντεο του βιβλίου."], ["Η αφίσα της τάξης", "Η τάξη ετοιμάζει αφίσα για δημοσίευση στο σχολικό site. Μια ομάδα βρίσκει εικόνες και μουσική online και θεωρεί ότι μπορεί να τις χρησιμοποιήσει ελεύθερα.", "Σενάριο βασισμένο στη Δραστηριότητα Αξιολόγησης 14."]];let i=-1,submitted=false,student='',classroom='';const answers={};function sceneno(j){return j<4?0:j<7?1:2}function scenario(j){const s=scenes[sceneno(j)];return `<div class="paper mail"><div class="label">ΣΕΝΑΡΙΟ ΑΞΙΟΛΟΓΗΣΗΣ · ${esc(s[0])}</div><p>${esc(s[1])}</p><p>${esc(s[2])}</p></div>`}function render(){if(i===-1){shell(`<div class="label">ΑΞΙΟΛΟΓΗΣΗ · 10 ΕΡΩΤΗΣΕΙΣ</div><h1>Η δική σου ασφαλής απόφαση</h1><div class="paper"><p>6 ερωτήσεις επιλογής και 4 σύντομες αιτιολογήσεις βασισμένες στις Δραστηριότητες Αξιολόγησης του βιβλίου.</p><label for="name">Ονοματεπώνυμο</label><input id="name" autocomplete="name" value="${esc(student)}"><label for="class">Τμήμα (προαιρετικό)</label><input id="class" value="${esc(classroom)}"><p>Οι απαντήσεις και οι εξηγήσεις εμφανίζονται μετά την υποβολή. Μπορείς να επιστρέφεις και να αλλάζεις απαντήσεις πριν υποβάλεις.</p><button id="start" class="primary">Έναρξη αξιολόγησης →</button><p id="message" role="status"></p><p class="muted">Το όνομα και οι απαντήσεις μένουν μόνο στην ανοικτή σελίδα. Δεν αποστέλλονται. Στο τέλος μπορείς να αποθηκεύσεις τα αποτελέσματα σε τοπικό αρχείο ή PDF.</p></div>`);return}if(submitted){const scored=qs.map((q,j)=>!q.open&&answers[j]===q.a?1:0).reduce((a,b)=>a+b,0);shell(`<div class="label">Η ΑΞΙΟΛΟΓΗΣΗ ΥΠΟΒΛΗΘΗΚΕ</div><h1>${esc(student)}</h1><div class="paper"><p class="bigscore">${scored} / 6 στις ερωτήσεις επιλογής</p><p>Οι 4 γραπτές απαντήσεις χρειάζονται αξιολόγηση από τον καθηγητή. Δεν περιλαμβάνονται στην αυτόματη βαθμολογία.</p><button id="saveResults" class="primary">Αποθήκευση αποτελεσμάτων σε αρχείο</button> <button id="pdf">PDF / Εκτύπωση</button><p id="saveStatus" role="alert"></p><p class="muted">Η αποθήκευση αρχείου επιτρέπει επιλογή φακέλου όπου υποστηρίζεται, διαφορετικά χρησιμοποιεί τις Λήψεις του browser.</p><p class="muted">Στο παράθυρο εκτύπωσης επίλεξε «Αποθήκευση ως PDF». Η αναφορά περιλαμβάνει όνομα, απαντήσεις και αποτέλεσμα. Δεν περιλαμβάνει λύσεις.</p><h2>Οι απαντήσεις σου</h2>${qs.map((q,j)=>`<div class="source"><h3>${j+1}. ${esc(q.q)}</h3><p>${esc(q.open?answers[j]:q.opts[answers[j]])}</p>${q.open?'<p class="muted">Προς αξιολόγηση από τον καθηγητή.</p>':`<p>${answers[j]===q.a?'✓ Σωστά':'↻ Σωστή επιλογή: '+esc(q.opts[q.a])}</p>`}</div>`).join('')}</div>`);report(scored);return}if(i===qs.length){const missing=qs.map((q,j)=>(q.open?!String(answers[j]||'').trim():answers[j]===undefined)?j+1:null).filter(Boolean);shell(`<div class="label">ΕΛΕΓΧΟΣ ΠΡΙΝ ΤΗΝ ΥΠΟΒΟΛΗ</div><h1>Έτοιμος για υποβολή;</h1><div class="paper"><p>Ονοματεπώνυμο: <b>${esc(student)}</b></p><p>${missing.length?'Εκκρεμούν οι ερωτήσεις: '+missing.join(', '):'Έχεις απαντήσει και στις 10 ερωτήσεις.'}</p><button id="review">Επιστροφή στις ερωτήσεις</button> <button id="submit" class="primary" ${missing.length?'disabled':''}>Οριστική υποβολή</button></div>`);return}const q=qs[i];shell(`<div class="label">ΑΞΙΟΛΟΓΗΣΗ · ${i+1} / 10 · ${esc(student)}</div><h1>${sceneno(i)+1}. ${esc(scenes[sceneno(i)][0])}</h1><div class="grid">${scenario(i)}<div class="paper"><h2>${esc(q.q)}</h2>${q.open?`<label for="written">Η αιτιολογημένη απάντησή σου</label><textarea id="written">${esc(answers[i])}</textarea>`:`<div class="options">${q.opts.map((o,j)=>`<button data-answer="${j}" aria-pressed="${answers[i]===j}" class="${answers[i]===j?'selected':''}">${esc(o)}</button>`).join('')}</div>`}</div></div><p id="answerWarning" role="alert"></p><div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><button id="next" class="primary">${i===9?'Έλεγχος και υποβολή':'Επόμενο →'}</button></div><p class="muted">Προσαρμογή των Δραστηριοτήτων Αξιολόγησης 12–14 του Φύλλου εργασίας Α.5.3 Μ2 (σ. 151–152) σε 10 ερωτήσεις. Το σενάριο παραπληροφόρησης αντικαθιστά τη δραστηριότητα παρακολούθησης βίντεο για offline χρήση.</p>`)}function report(score){$('report').innerHTML=`<h1>Α.5.3 Μ2 · Κίνδυνοι στο Διαδίκτυο</h1><p class="meta">Ονοματεπώνυμο: ${esc(student)}<br>Τμήμα: ${esc(classroom)||'—'}<br>Ημερομηνία: ${new Date().toLocaleDateString('el-GR')}<br>Ερωτήσεις επιλογής: ${score} / 6<br>Γραπτές απαντήσεις: προς αξιολόγηση από τον καθηγητή</p>${scenes.map((s,k)=>`<h2>Σενάριο ${k+1}: ${esc(s[0])}</h2><p>${esc(s[1])} ${esc(s[2])}</p>${qs.map((q,j)=>sceneno(j)===k?`<article><h3>${j+1}. ${esc(q.q)}</h3><p><b>Απάντηση:</b> ${esc(q.open?answers[j]:q.opts[answers[j]])}</p>${q.open?'<p>Σχόλιο / βαθμός καθηγητή: __________________________________</p>':''}</article>`:'').join('')}`).join('')}`};function bind(){listen('start',()=>{student=$('name').value.trim();classroom=$('class').value.trim();if(!student){$('message').className='alert';$('name').focus();$('message').textContent='Συμπλήρωσε το όνομά σου για να συνεχίσεις.';return}i=0;render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[i]=+b.dataset.answer;render()});if($('written'))$('written').oninput=()=>{answers[i]=$('written').value};listen('prev',()=>{i--;render()});listen('next',()=>{const q=qs[i];if(q.open?!String(answers[i]||'').trim():answers[i]===undefined){$('answerWarning').className='alert';$('answerWarning').textContent='Πρέπει να απαντήσεις στην ερώτηση πριν συνεχίσεις.';if($('written'))$('written').focus();return}i++;render()});listen('review',()=>{i=0;render()});listen('submit',()=>{submitted=true;render()});listen('saveResults',()=>{if(!student.trim()){$('saveStatus').className='alert';$('saveStatus').textContent='Υποχρεωτικό πεδίο: χρειάζεται ονοματεπώνυμο για αποθήκευση.';return}saveLocal(resultHTML('Α.5.3 Μ2 · Αποτελέσματα αξιολόγησης',$('report').innerHTML),'A5_3_M2_Assessment_'+safeName(student)+'.html','saveStatus')});listen('pdf',()=>{window.print()})}render();</script></html>
