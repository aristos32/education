async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά ή χρησιμοποίησε Εκτύπωση / PDF.';}}

ς ή ελλιπείς πληροφορίες μπορούν να μας οδηγήσουν σε λανθασμένα συμπεράσματα.</p><p>Ελέγχω <b>ποιος</b> το γράφει, <b>πότε</b> και <b>σε ποιες αποδείξεις</b> στηρίζεται. Συγκρίνω με ανεξάρτητες αξιόπιστες πηγές.</p><div class=\"visual-strip\"><span class=\"mini\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"6\" r=\"3\"/><path d=\"M5 21v-4a7 7 0 0 1 14 0v4M8 15v6M16 15v6\"/></svg>Συγγραφέας</span><span class=\"mini\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 6v6l4 3\"/></svg>Ημερομηνία</span><span class=\"mini\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5C8 2 3 4 3 4v15s5-2 9 1c4-3 9-1 9-1V4s-5-2-9 1Zm0 0v15\"/></svg>Πηγές</span></div><button id=\"investigate\" class=\"primary\">Έλεγξε την ανάρτηση 🔎</button><div id=\"evidence\" class=\"hide reveal\"><p class=\"source\"><b>Ημερομηνία:</b> η αρχική ανακοίνωση είναι παλιά.</p><p class=\"source\"><b>Προέλευση:</b> αφορά άλλο σχολείο.</p><p class=\"source\"><b>Σημερινή ανακοίνωση:</b> δεν αναφέρει κλείσιμο.</p></div></div><div class=\"scene\"><div class=\"tag\">ΤΟ ΠΑΡΑΔΕΙΓΜΑ ΤΗΣ ΑΡΧΗΣ</div><h2>«Αύριο κλείνουν όλα τα σχολεία!»</h2><p>Μια παλιά ανακοίνωση μπορεί να είναι αληθινή για τότε, αλλά παραπλανητική για σήμερα.</p><p><b>Πολλά likes ≠ επιβεβαίωση.</b></p><p>Δεν κοινοποιώ πριν διασταυρώσω.</p></div></div>"], ["Το βρήκα online. Μπορώ να το χρησιμοποιήσω;", "105″", "<div class=\"grid\"><div><div class=\"topic-art\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M16 8a5 5 0 1 0 0 8\"/></svg><span>Κάθε έργο έχει δημιουργό</span></div><p>Μια φωτογραφία, ένα τραγούδι ή ένα πρόγραμμα έχει δημιουργό και δικαιώματα χρήσης (<b>Copyright ©</b>).</p><p>Το ότι το βρίσκω ή το κατεβάζω δωρεάν <b>δεν σημαίνει ότι έχω άδεια να το αναδημοσιεύσω</b>.</p><p>Προτιμώ δικό μου υλικό ή υλικό με κατάλληλη άδεια. Ελέγχω τους όρους και αναφέρω την πηγή όπου απαιτείται.</p></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Θέλεις μια φωτογραφία για την ιστοσελίδα της τάξης. Ποια επιλογή σε βοηθά να σεβαστείς τον δημιουργό;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Η αναφορά πηγής από μόνη της δεν δίνει άδεια αναδημοσίευσης.</div></details></div></div>"], ["«Άλλο ένα παιχνίδι…»", "105″", "<div class=\"grid\"><div class=\"scene\"><div class=\"topic-art\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 7h10c3 0 5 12 2 12-2 0-3-4-5-4h-4c-2 0-3 4-5 4C2 19 4 7 7 7Z\"/><path d=\"M7 10v5M4.5 12.5h5\"/><circle cx=\"16\" cy=\"11\" r=\".6\"/><circle cx=\"18\" cy=\"14\" r=\".6\"/></svg><span>Παιχνίδι και καθημερινότητα</span></div><div class=\"tag\">ΦΑΝΤΑΣΤΙΚΟ ΣΕΝΑΡΙΟ</div><h2>Ο Νίκος δεν μπορεί να σταματήσει</h2><p>Αναβάλλει τα μαθήματα, κοιμάται αργά και αποφεύγει τις δραστηριότητες με φίλους.</p><div class=\"meter\"><i id=\"timebar\" style=\"width:20%\"></i></div><p class=\"muted\" style=\"color:#d3d6eb\">Το σενάριο δείχνει επιπτώσεις στην καθημερινότητα, όχι διάγνωση από έναν αριθμό ωρών.</p></div><div class=\"paper\"><p>Η δυσκολία να σταματήσουμε και η παραμέληση ύπνου, μαθημάτων ή σχέσεων είναι λόγοι για να ζητήσουμε βοήθεια.</p><div class=\"visual-strip\"><span class=\"mini\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 6v6l4 3\"/></svg>Ύπνος</span><span class=\"mini\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5C8 2 3 4 3 4v15s5-2 9 1c4-3 9-1 9-1V4s-5-2-9 1Zm0 0v15\"/></svg>Μαθήματα</span><span class=\"mini\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"6\" r=\"3\"/><path d=\"M5 21v-4a7 7 0 0 1 14 0v4M8 15v6M16 15v6\"/></svg>Φίλοι</span></div><button id=\"balance\" class=\"primary\">Τι μπορεί να αλλάξει;</button><div id=\"plan\" class=\"hide reveal\"><p>✓ Συμφωνεί πρόγραμμα και όρια με τους γονείς.</p><p>✓ Κάνει διαλείμματα και κρατά χρόνο για ύπνο και δραστηριότητες εκτός οθόνης.</p><p>✓ Μιλά σε έμπιστο ενήλικα αν δυσκολεύεται να τηρήσει το πρόγραμμα.</p></div></div></div>"], ["Τέσσερις κίνδυνοι, δικές μου επιλογές", "90″", "<div class=\"paper summary\"><div class=\"topic-art\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z\"/><path d=\"m8 12 3 3 5-6\"/></svg><span>Αναγνωρίζω τον κίνδυνο, επιλέγω προστασία</span></div><p><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z\"/><path d=\"m8 12 3 3 5-6\"/></svg><b>Ακατάλληλο περιεχόμενο:</b> σταματώ, δεν προωθώ, ζητώ βοήθεια.</p><p><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"6\"/><path d= 0?' expired':remaining<=120?' warn':'');$('timerStatus').textContent=remaining===0?'Ο χρόνος των 10΄ ολοκληρώθηκε. Η παρουσίαση παραμένει διαθέσιμη.':remaining<=60?'Προσοχή: απομένει λιγότερο από 1 λεπτό.':remaining<=120?'Προσοχή: απομένουν έως 2 λεπτά.':'Χρόνος θεωρίας και συζήτησης · 10΄';$('timerToggle').textContent=running?'Παύση':remaining?'Έναρξη / Συνέχεια':'Ο χρόνος ολοκληρώθηκε'}listen('timerToggle',()=>{if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));running=false}else if(remaining){deadline=Date.now()+remaining*1000;running=true}tick()});listen('timerReset',()=>{remaining=600;running=false;tick()});setInterval(tick,250);function render(){const s=slides[i];shell(`<div class="label">ΘΕΩΡΙΑ · ${i+1} / ${slides.length} · ${s[1]}</div><h1>${s[0]}</h1>${s[2]}<div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><span class="count">10΄ μαζί με συζήτηση</span><button id="next" class="primary" ${i===slides.length-1?'disabled':''}>Επόμενο →</button></div>`)}function bind(){document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{document.getElementById('age-explain').textContent='PEGI '+b.dataset.age+': καταλληλότητα περιεχομένου για ηλικίες '+b.dataset.age+' και άνω.'});listen('investigate',()=>document.getElementById('evidence').classList.remove('hide'));listen('balance',()=>{document.getElementById('plan').classList.remove('hide');document.getElementById('timebar').style.width='90%'});listen('prev',()=>{i--;render()});listen('next',()=>{i++;render()})}document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&i<slides.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});render();</script></html>
