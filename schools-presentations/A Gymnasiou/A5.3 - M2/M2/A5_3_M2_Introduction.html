</style><header><a class="button" href="professor_index.html" style="white-space:nowrap">⌂ Αρχικό Μενού</a><div><small>Α΄ ΓΥΜΝΑΣΙΟΥ · Α.5.3 Μ2</small><div>Αφόρμηση και αρχική συζήτηση</div></div><div class="tools"><button id="board">Μεγάλα γράμματα</button><button id="full" aria-label="Πλήρης οθόνη">⛶</button></div></header><main id="app"></main><script>const pages=[["Θα το πιστέψεις; Θα το μοιραστείς;", "<div class=\"grid\"><div class=\"scene\"><div class=\"tag\">ΦΑΝΤΑΣΤΙΚΗ ΑΝΑΡΤΗΣΗ</div><div class=\"topic-art\"><svg class=\"\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 4h16v12H9l-5 4Z\"/><path d=\"M8 8h8M8 12h5\"/></svg><span>Μήνυμα χωρίς τεκμηρίωση</span></div><h2>«Αύριο κλείνουν όλα τα σχολεία!»</h2><p>Χωρίς ημερομηνία. Χωρίς πηγή. Με εκατοντάδες κοινοποιήσεις.</p><div class=\"stamp\">ΕΙΝΑΙ ΑΡΚΕΤΟ;</div></div><div class=\"paper\"><h2>Συζήτηση στην τάξη</h2><p>Τι θα έκανες πρώτα;</p><details><summary>Σημείο συζήτησης για τον καθηγητή</summary><div class=\"feedback\">Πρώτα ελέγχουμε την πληροφορία. Μετά αποφασίζουμε αν θα τη μοιραστούμε.</div></details><p class=\"muted\">Σήμερα: ακατάλληλο περιεχόμενο, παραπληροφόρηση, Copyright και εθισμός στο Διαδίκτυο.</p></div></div>"], ["Βλέπουμε και παρατηρούμε", "<div class=\"paper\"><video id=\"video\" controls preload=\"metadata\" playsinline style=\"width:100%;max-height:62vh;background:#101b2a;border-radius:16px\"><source src=\"material/aformisi.mp4\" type=\"video/mp4\">Ο browser δεν υποστηρίζει προβολή βίντεο.</video><p id=\"videoError\" role=\"alert\"></p><p class=\"muted\">Διάρκεια περίπου 42″. Πάτησε αναπαραγωγή. Μπορείς να σταματήσεις ή να ξαναδείς ένα σημείο.</p><a href=\"material/aformisi.mp4\" target=\"_blank\" rel=\"noopener\">Άνοιγμα βίντεο σε ξεχωριστή καρτέλα</a></div>"], ["Τι κρατάμε από το βίντεο;", "<div class=\"paper\"><h2>Τι παρατήρησες;</h2><p>Περιέγραψε μια στιγμή του βίντεο, χωρίς να την ερμηνεύσεις ακόμη.</p><h2>Ποιο πιστεύεις ότι είναι το μήνυμά του;</h2><p>Ποια στιγμή στηρίζει την άποψή σου;</p><h2>Ποια απόφαση θα άλλαζες;</h2><p>Τι θα συμβούλευες έναν συνομήλικό σου και γιατί;</p></div>"], ["Τα ερωτήματα του σημερινού μαθήματος", "<div class=\"paper\"><p>🛡 Τι κάνω όταν βλέπω ακατάλληλο περιεχόμενο;</p><p>🔎 Πώς ελέγχω αν μια πληροφορία είναι αληθινή;</p><p>© Μπορώ να χρησιμοποιώ ό,τι βρίσκω online;</p><p>🕒 Πώς κρατώ ισορροπία ανάμεσα στο Internet και την καθημερινότητά μου;</p><blockquote>Ποιο από αυτά θέλεις να διερευνήσουμε περισσότερο;</blockquote><a class=\"button primary\" href=\"A5_3_M2_Theory.html\">Συνέχεια στη θεωρία →</a></div><p class=\"muted\">Η αφόρμηση είναι ξεχωριστή από τη δεκάλεπτη παρουσίαση θεωρίας.</p>"]];let i=0;const app=document.getElementById('app');function render(){app.innerHTML='<section class="reveal"><div class="label">ΑΦΟΡΜΗΣΗ · '+(i+1)+' / '+pages.length+' · περίπου 4–5 λεπτά</div><h1>'+pages[i][0]+'</h1>'+pages[i][1]+'<div class="foot"><button id="prev" '+(i===0?'disabled':'')+'>← Πίσω</button><button id="next" class="primary" '+(i===pages.length-1?'disabled':'')+'>Επόμενο →</button></div></section>';document.getElementById('prev').onclick=()=>{i--;render()};document.getElementById('next').onclick=()=>{i++;render()};const v=document.getElementById('video');if(v)v.addEventListener('error',()=>{document.getElementById('videoError').textContent='Το βίντεο δεν βρέθηκε. Αποσυμπίεσε όλο το πακέτο και κράτησε τον φάκελο material δίπλα στο HTML.'},true)}document.getElementById('board').onclick=()=>document.body.classList.toggle('board');document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='BUTTON'||document.activeElement.tagName==='VIDEO')return;if(e.key==='ArrowRight'&&i<pages.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});render();</script></html>
