async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά ή χρησιμοποίησε Εκτύπωση / PDF.';}}

svg><span>Viruses · Trojan horses · Worms</span></div><div class=\"grid\"><div><p>Μπορούν να αλλάξουν ή να διαγράψουν αρχεία, να εγκαταστήσουν άλλο επιβλαβές λογισμικό και να επιβραδύνουν τον υπολογιστή.</p><p>Ένα ύποπτο συνημμένο ή μια λήψη μπορεί να τα μεταφέρει. Δεν είναι κάθε συνημμένο κακόβουλο.</p><div class=\"files\"><span>📎 photo.jpg</span><span>📎 photo.jpg.vbs</span></div></div><div class=\"paper\"><h2>Ποιο αρχείο χρειάζεται προσοχή;</h2><p>Τι μας λέει η τελική κατάληξη;</p><details><summary>Αποκάλυψη εξήγησης</summary><p>Το photo.jpg.vbs τελειώνει σε .vbs και δεν είναι απλώς εικόνα. Η πλήρης εμφάνιση επεκτάσεων βοηθά να αναγνωρίζουμε το είδος αρχείου. Το όνομα μόνο δεν εγγυάται ασφάλεια.</p></details></div></div>"], ["Προστασία και αντίδραση", "105″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z\"/><path d=\"m8 12 3 3 5-6\"/></svg><span>Πολλά μέτρα συνεργάζονται</span></div><div class=\"grid\"><div class=\"paper\"><p><b>Antivirus:</b> ενεργό και ενημερωμένο.</p><p><b>Updates:</b> ενημερώσεις συστήματος και εφαρμογών.</p><p><b>Backup:</b> αντίγραφα για να ανακτήσουμε αρχεία.</p><p><b>Προσοχή:</b> ελέγχουμε προέλευση και συνημμένα πριν ανοίξουμε.</p></div><div class=\"paper\"><h2>Αν υποψιαστούμε μόλυνση;</h2><p>Ενημερώνουμε τον καθηγητή ή έμπιστο ενήλικα και ζητάμε πλήρη έλεγχο (Full system scan) με ενημερωμένο Antivirus.</p><details><summary>Συζήτηση · Το Backup εμποδίζει τον ιό;</summary><p>Όχι. Βοηθά στην ανάκτηση αρχείων. Κανένα μέτρο μόνο του δεν εγγυάται πλήρη προστασία.</p></details></div></div>"], ["Spam: πολλά μηνύματα που δεν ζήτησα", "90″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"m3 6 9 7 9-7\"/></svg><span>Ανεπιθύμητη μαζική αλληλογραφία</span></div><div class=\"grid\"><div class=\"scene\"><h2>📨 Προσφορές! Κέρδη! Διαφημίσεις!</h2><p>Αποστολή σε πολλούς παραλήπτες που δεν τη ζήτησαν.</p></div><div class=\"paper\"><p>Δεν απαντώ σε ύποπτα Spam.</p><p>Χρησιμοποιώ <b>Report spam</b> και φίλτρα.</p><p>Δεν δίνω εύκολα το email μου σε μη έμπιστες υπηρεσίες.</p><details><summary>Συζήτηση · Κάθε διαφήμιση είναι Phishing;</summary><p>Όχι. Το Phishing στοχεύει στην παραπλάνηση και στην απόσπαση στοιχείων. Ένα Spam μπορεί όμως να περιέχει και Phishing.</p></details></div></div>"], ["Phishing: ποιος ζητά τα στοιχεία μου;", "120″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 3v12a5 5 0 0 1-10 0v-3l4 3M11 3h8\"/></svg><span>Ένα μήνυμα προσποιείται έμπιστο αποστολέα</span></div><div class=\"grid\"><div class=\"paper mail\"><div class=\"line\"><b>Αποστολέας:</b> «Υποστήριξη τράπεζας»</div><h2>Η κάρτα σου θα κλείσει!</h2><p>Στείλε αμέσως τον αριθμό και τον κωδικό της κάρτας σου.</p><p class=\"muted\">Εκπαιδευτική προσομοίωση, χωρίς ενεργό σύνδεσμο.</p></div><div><p>Ενδείξεις: πίεση χρόνου, απειλή ή δώρο, αίτημα για μυστικά στοιχεία.</p><p>Δεν απαντώ με προσωπικά στοιχεία και δεν ακολουθώ τον σύνδεσμο του μηνύματος.</p><p>Ελέγχω από ανεξάρτητο κανάλι που ήδη γνωρίζω και ενημερώνω ενήλικα.</p><details><summary>Συζήτηση · Αρκεί ένα λογότυπο;</summary><p>Όχι. Το εμφανιζόμενο όνομα και το λογότυπο μπορούν να αντιγραφούν.</p></details></div></div>"], ["Τι κρατάμε από το μάθημα;", "105″", "<div class=\"art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m7 12 3 3 7-7\"/></svg><span>Η δική μας ασφαλής απόφαση</span></div><div class=\"paper\"><p><b>Κακόβουλο λογισμικό:</b> Antivirus, Updates, έλεγχος αρχείων και Backup.</p><p><b>Spam:</b> δεν απαντώ, χρησιμοποιώ φίλτρα και Report spam.</p><p><b>Phishing:</b> δεν δίνω κωδικούς και ελέγχω ανεξάρτητα.</p><blockquote>Ένας φίλος σού στέλνει απροσδόκητα ένα αρχείο. Το ανοίγεις αμέσως;</blockquote><details><summary>Τελική συζήτηση · 45″</summary><p>Επιβεβαιώνω με τον φίλο από γνωστό κανάλι ότι το έστειλε και τι περιέχει. Ακόμη και γνωστός λογαριασμός μπορεί να έχει παραβιαστεί.</p></details></div><p class=\"muted\">Σύνολο 10΄, μαζί με τις συζητήσεις. Πηγές: Σημειώσεις Α΄ Γυμνασίου σ. 129–131 και Φύλλο εργασίας Α.5.3 Μ1 σ. 145–148.</p>"]];let i=0;let remaining=600,deadline=0,running=false;function tick(){if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!remaining)running=false}const m=Math.floor(remaining/60),sec=remaining%60;$('clock').textContent=m+':'+String(sec).padStart(2,'0');$('timerbar').className='timerbar'+(remaining===0?' expired':remaining<=120?' warn':'');$('timerStatus').textContent=remaining===0?'Ο χρόνος των 10΄ ολοκληρώθηκε. Η παρουσίαση παραμένει διαθέσιμη.':remaining<=60?'Προσοχή: απομένει λιγότερο από 1 λεπτό.':remaining<=120?'Προσοχή: απομένουν έως 2 λεπτά.':'Χρόνος θεωρίας και συζήτησης · 10΄';$('timerToggle').textContent=running?'Παύση':remaining?'Έναρξη / Συνέχεια':'Ο χρόνος ολοκληρώθηκε'}listen('timerToggle',()=>{if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));running=false}else if(remaining){deadline=Date.now()+remaining*1000;running=true}tick()});listen('timerReset',()=>{remaining=600;running=false;tick()});setInterval(tick,250);function render(){const s=slides[i];shell(`<div class="label">ΘΕΩΡΙΑ · ${i+1} / ${slides.length} · ${s[1]}</div><h1>${s[0]}</h1>${s[2]}<div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><span class="count">10΄ μαζί με συζήτηση</span><button id="next" class="primary" ${i===slides.length-1?'disabled':''}>Επόμενο →</button></div>`)}function bind(){listen('prev',()=>{i--;render()});listen('next',()=>{i++;render()})}document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&i<slides.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});render();</script></html>
