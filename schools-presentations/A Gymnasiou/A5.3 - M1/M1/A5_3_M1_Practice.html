async function saveLocal(html,filename,statusId){const status=$(statusId);try{if(window.showSaveFilePicker&&window.isSecureContext){const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});const w=await handle.createWritable();await w.write(html);await w.close();if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν στο αρχείο που επέλεξες.';return}const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);if(status)status.textContent='Η λήψη ξεκίνησε. Έλεγξε τις Λήψεις του browser και αποθήκευσε το αρχείο στον φάκελο που θέλεις.';}catch(e){if(status)status.textContent=e.name==='AbortError'?'Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.':'Η αποθήκευση δεν ολοκληρώθηκε. Δοκίμασε ξανά ή χρησιμοποίησε Εκτύπωση / PDF.';}}
function resultHTML(title,body){return '<!doctype html><html lang="el"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:18px/1.6 Arial;max-width:900px;margin:35px auto;padding:20px}article{border-bottom:1px solid #ccc;padding:15px 0;break-inside:avoid}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{button{display:none}}</style><h1>'+esc(title)+'</h1>'+body+'<button onclick="window.print()">Εκτύπωση / Αποθήκευση ως PDF</button></html>'}
function safeName(t){return t.replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,70)||'student'}
const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[["Ένα ύποπτο συνημμένο μπορεί να μεταφέρει…", ["κακόβουλο πρόγραμμα (Virus).", "μόνο Spam χωρίς κανέναν άλλο κίνδυνο.", "μόνο ένα φίλτρο email."], 0, "Σκέψου τι μπορεί να εκτελεστεί στον υπολογιστή όταν ανοίγουμε ένα αρχείο.", "Κακόβουλα προγράμματα μπορεί να μεταφερθούν μέσω συνημμένων. Δεν είναι όλα τα συνημμένα μολυσμένα. (Εμπέδωση 1)"], ["Ποιο εργαλείο βοηθά στον εντοπισμό ιών;", ["Backup", "Antivirus", "Φίλτρο Spam"], 1, "Ποια λέξη περιέχει το virus;", "Το Antivirus βοηθά στον εντοπισμό και στην αντιμετώπιση κακόβουλου λογισμικού. (Εμπέδωση 2)"], ["Ένα email προσποιείται την τράπεζα και ζητά μυστικά στοιχεία. Αυτό είναι…", ["Spam μόνο, επειδή είναι email.", "Backup.", "Phishing."], 2, "Σκέψου τον στόχο: να σε παραπλανήσει και να πάρει στοιχεία.", "Το Phishing στοχεύει στην απόσπαση προσωπικών πληροφοριών. (Εμπέδωση 3)"], ["Ποια αντίδραση μειώνει τον κίνδυνο Phishing;", ["Δεν στέλνω προσωπικά στοιχεία ή κωδικούς μέσω του ύποπτου μηνύματος.", "Στέλνω μόνο τον μισό κωδικό.", "Απαντώ αν υπάρχει λογότυπο."], 0, "Το λογότυπο αντιγράφεται. Ο κωδικός παραμένει μυστικός.", "Δεν αποκαλύπτουμε κωδικούς και ελέγχουμε από ανεξάρτητο, γνωστό κανάλι. (Εμπέδωση 4)"], ["Μαζικές διαφημίσεις που δεν ζήτησες ονομάζονται…", ["Antivirus.", "Spam.", "Updates."], 1, "Η βασική έννοια είναι «ανεπιθύμητα μαζικά μηνύματα».", "Spam είναι η ανεπιθύμητη μαζική αλληλογραφία. (Εμπέδωση 5)"], ["Ποια ρύθμιση βοηθά να περιορίσουμε τα Spam;", ["Μεγαλύτερη γραμματο ι προωθήσεις το μήνυμα σε όλη την τάξη.", "Εντόπισε δύο κινδύνους και γράψε τι θα απαντούσες σε φίλο που θέλει να το κάνει.", "Υπάρχει αίτημα για μυστικό κωδικό και προσπάθεια μαζικής διάδοσης. Δεν στέλνω στοιχεία ούτε προωθώ το μήνυμα. Εξηγώ στον φίλο τις ενδείξεις και ζητώ βοήθεια από ενήλικα."], ["Antivirus ή Backup;", "Ο συμμαθητής σου λέει: «Έχω Backup, άρα μπορώ να ανοίγω κάθε συνημμένο».", "Γιατί δεν αρκεί το Backup; Πρότεινε συνδυασμό τριών μέτρων.", "Το Backup βοηθά να ανακτήσουμε αρχεία και δεν εμποδίζει από μόνο του τη μόλυνση. Χρειάζονται ενημερωμένο Antivirus, Updates και προσεκτικός έλεγχος προέλευσης και αρχείων."], ["Μια τράπεζα με σωστό λογότυπο", "Email με σωστό λογότυπο απειλεί ότι η κάρτα σου κλείνει σε 10 λεπτά. Ο σύνδεσμος οδηγεί σε διαφορετικό όνομα ιστοσελίδας.", "Πώς θα επαληθεύσεις το αίτημα χωρίς να χρησιμοποιήσεις στοιχεία επικοινωνίας από το email;", "Δεν πατώ τον σύνδεσμο ή απαντώ με στοιχεία. Ανοίγω ανεξάρτητα το γνωστό επίσημο κανάλι ή μιλώ με την τράπεζα μέσω ήδη γνωστού αριθμού, με βοήθεια ενήλικα."], ["Αφού έστειλα τον κωδικό", "Ένας φίλος παραδέχεται ότι έστειλε το password του σε μήνυμα που υποσχόταν δώρο.", "Ποια άμεσα βήματα βοήθειας προτείνεις, χωρίς να τον κατηγορήσεις;", "Τον ενθαρρύνω να ενημερώσει αμέσως έμπιστο ενήλικα. Αλλάζει τον κωδικό από την πραγματική υπηρεσία, όχι από το ύποπτο μήνυμα, και ζητά βοήθεια για την ασφάλεια του λογαριασμού. Αν επαναχρησιμοποίησε τον κωδικό, χρειάζεται αλλαγή και στους σχετικούς λογαριασμούς."]];let i=0,stage='quiz',ex=0,started=false,expired=false,finished=false,deadline=0,extraName='';function timeCheck(){if(started&&!finished&&!expired&&Date.now()>=deadline){expired=true;render()}const rem=!started?600:finished?Math.max(0,Math.ceil((deadline-finished)/1000)):Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');$('timerbar').className='timerbar'+(expired?' expired':started&&!finished&&rem<=120?' warn':'');$('timerStatus').textContent=expired?'Ο χρόνος έληξε. Οι 10 ερωτήσεις εμπέδωσης κλειδώθηκαν.':finished?'Η εμπέδωση ολοκληρώθηκε. Το χρονόμετρο σταμάτησε.':!started?'Ο χρόνος αρχίζει με την Έναρξη.':rem<=60?'Προσοχή: απομένει έως 1 λεπτό.':rem<=120?'Προσοχή: απομένουν έως 2 λεπτά.':'Εμπέδωση · υποχρεωτική απάντηση πριν τη συνέχεια.'}setInterval(timeCheck,250);
function extraSave(){if($('extraName'))extraName=$('extraName').value.trim();const msg=$('saveStatus');if(!extraName){msg.className='alert';msg.textContent='Υποχρεωτικό πεδίο: συμπλήρωσε το ονοματεπώνυμό σου πριν αποθηκεύσεις.';$('extraName').focus();return}msg.className='feedback';const body='<p><b>Ονοματεπώνυμο:</b> '+esc(extraName)+'</p><p>Ημερομηνία: '+new Date().toLocaleDateString('el-GR')+'</p>'+extra.map((x,j)=>'<article><h2>'+esc(x[0])+'</h2><p>'+esc(x[1])+'</p><p><b>'+esc(x[2])+'</b></p><p>Απάντηση: '+esc(responses[j]||'Δεν απαντήθηκε')+'</p></article>').join('');saveLocal(resultHTML('Α.5.3 Μ1 · Επιπλέον Δραστηριότητες',body),'A5_3_M1_Extra_'+safeName(extraName)+'.html','saveStatus')}
const answers={},attempts={},hints={},responses={},guides={};function render(){if(!started){shell(`<div class="paper"><h1>Εμπέδωση · 10 ερωτήσεις / 10΄</h1><p>Μπορείς να χρησιμοποιείς υποδείξεις και να ξαναδοκιμάζεις. Η σωστή απάντηση εμφανίζεται με πράσινο χρώμα. Στα 10΄ οι ερωτήσεις κλειδώνουν.</p><button id="begin" class="primary">Έναρξη 10 λεπτών →</button></div>`);return}if(expired&&stage!=='extra'){shell(`<div class="paper"><h1>Ο χρόνος ολοκληρώθηκε</h1><p class="alert">Οι 10 ερωτήσεις εμπέδωσης έχουν κλειδωθεί.</p><p>Απαντημένες: ${Object.keys(answers).length} / 10 · Σωστές: ${qs.filter((q,j)=>answers[j]===q[2]).length} / 10</p></div>`);return}if(stage==='extra'){const x=extra[ex];shell(`<div class="label">ΕΠΙΠΛΕΟΝ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ · ${ex+1} / ${extra.length}</div><h1>Κριτική σκέψη στην πράξη</h1><div class="stepnav">${extra.map((_,j)=>`<button data-ex="${j}" class="${j===ex?'primary':''}">${j+1}</button>`).join('')}</div><div class="paper"><h2>${x[0]}</h2><p>${x[1]}</p><p><b>${x[2]}</b></p><label for="response">Η απόφασή σου και η αιτιολόγησή της</label><textarea id="response" placeholder="Γράψε συγκεκριμένα βήματα και εξήγησε γιατί…">${esc(responses[ex])}</textarea><button id="guide">Ενδεικτική προσέγγιση / Αυτοέλεγχος</button>${guides[ex]?`<div class="feedback">${x[3]}<p><b>Αυτοέλεγχος:</b> Αναγνώρισες τον κίνδυνο; Αιτιολόγησες; Πρότεινες ασφαλή βήματα;</p></div>`:''}</div><div class="foot"><button id="exprev" ${ex===0?'disabled':''}>← Προηγούμενο</button><button id="result">Επιστροφή στο αποτέλεσμα</button><button id="exnext" ${ex===extra.length-1?'disabled':''}>Επόμενο →</button></div>${ex===extra.length-1?`<div class="savearea"><label for="extraName">Ονοματεπώνυμο <b>(υποχρεωτικό για αποθήκευση)</b></label><input id="extraName" required value="${esc(extraName)}"><button id="saveExtra" class="primary">Αποθήκευση αποτελεσμάτων σε αρχείο</button><p id="saveStatus" role="alert"></p><p class="muted">Επιλέγεις φάκελο στο παράθυρο αποθήκευσης, όπου υποστηρίζεται. Διαφορετικά το αρχείο κατεβαίνει στις Λήψεις.</p></div>`:''}<p class="muted">Φανταστικά σενάρια καθημερινής ζωής. Οι γραπτές απαντήσεις δεν βαθμολογούνται αυτόματα και μένουν μόνο στην ανοικτή σελίδα.</p>`);return}if(i===qs.length){shell(`<div class="label">ΟΛΟΚΛΗΡΩΣΗ ΕΜΠΕΔΩΣΗΣ</div><h1>Ολοκλήρωσες τις 10 ερωτήσεις!</h1><div class="paper"><p>Σωστές με την πρώτη προσπάθεια: <b>${qs.filter((q,j)=>attempts[j]===q[2]).length} / 10</b></p><p>Ακολούθησε τις εξηγήσεις και προχώρησε στις δυσκολότερες ασκήσεις.</p><button id="extras" class="primary">Επιπλέον Δραστηριότητες →</button> <button id="retry">Επανάληψη</button></div>`);return}const q=qs[i],a=answers[i],ok=a===q[2];shell(`<div class="label">ΕΜΠΕΔΩΣΗ · ${i+1} / 10 · Έκδοση 2</div><h1>Μαθαίνω και δοκιμάζω</h1><div class="paper"><h2>${q[0]}</h2><div class="options">${q[1].map((o,j)=>`<button data-answer="${j}" ${ok?'disabled':''} class="${a===j?(ok?'correct':'wrong'):''}" style="${a===j?(ok?'background:transparent;color:#087b32;border:1px solid #beced6;font-weight:400;opacity:1;':'background:transparent;color:#b3261e;border:1px solid #beced6;font-weight:400;'):''}">${a===j?(ok?'✓ ΣΩΣΤΟ — ':'✗ ΛΑΘΟΣ — '):''}${o}</button>`).join('')}</div><button id="hint">💡 ${hints[i]?'Η βοήθεια είναι ανοικτή':'Χρειάζομαι μια υπόδειξη'}</button>${hints[i]?`<div class="feedback">${q[3]}</div>`:''}${a!==undefined?`<div class="feedback ${ok?'answer-correct':'answer-wrong'}" role="status" aria-live="polite" style="background:transparent;color:${ok?'#087b32':'#b3261e'};border:0;padding:12px 0;font-weight:400"><strong style="display:block;font-size:22px;font-weight:400">${ok?'✓ ΣΩΣΤΗ ΑΠΑΝΤΗΣΗ':'✗ ΛΑΘΟΣ ΑΠΑΝΤΗΣΗ'}</strong><p>${ok?q[4]:'Δοκίμασε ξανά. Πάτησε την υπόδειξη για βοήθεια.'}</p></div>`:''}</div><div class="foot"><button id="prev" ${i===0?'disabled':''}>← Πίσω</button><span class="count">Μπορείς να ξαναδοκιμάσεις.</span><button id="next" class="primary" ${!ok?'disabled':''}>${i===9?'Ολοκλήρωση':'Επόμενο →'}</button></div><p class="muted">Προσαρμογή των 6 ερωτήσεων Εμπέδωσης του βιβλίου σε 10 ερωτήσεις με εφαρμογές και σύνθεση. Φύλλο εργασίας σ. 145–146 · θεωρία σ. 129–131.</p>`)}function bind(){listen('begin',()=>{started=true;deadline=Date.now()+600000;render();timeCheck()});if($('extraName'))$('extraName').oninput=()=>{extraName=$('extraName').value};listen('saveExtra',extraSave);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(expired||Date.now()>=deadline){timeCheck();return}const n=+b.dataset.answer;if(attempts[i]===undefined)attempts[i]=n;answers[i]=n;render()});listen('hint',()=>{hints[i]=true;render()});listen('prev',()=>{i--;render()});listen('next',()=>{if(Date.now()>=deadline){timeCheck();return}if(answers[i]!==qs[i][2])return;i++;if(i===qs.length)finished=Date.now();render();timeCheck()});listen('extras',()=>{stage='extra';render()});listen('result',()=>{stage='quiz';i=qs.length;render()});listen('retry',()=>{started=false;expired=false;finished=false;deadline=0;i=0;Object.keys(answers).forEach(k=>delete answers[k]);Object.keys(attempts).forEach(k=>delete attempts[k]);Object.keys(hints).forEach(k=>delete hints[k]);render()});document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{if(+b.dataset.ex>ex&&extra.slice(0,+b.dataset.ex).some((_,j)=>!String(responses[j]||'').trim())){alert('Απάντησε στο τρέχον σενάριο πριν συνεχίσεις.');return}ex=+b.dataset.ex;render()});if($('response'))$('response').oninput=()=>{responses[ex]=$('response').value};listen('guide',()=>{responses[ex]=$('response').value;guides[ex]=true;render()});listen('exprev',()=>{ex--;render()});listen('exnext',()=>{if(!String(responses[ex]||'').trim()){alert('Απάντησε στο σενάριο πριν πας στο επόμενο.');return}ex++;render()})}render();</script></html>
