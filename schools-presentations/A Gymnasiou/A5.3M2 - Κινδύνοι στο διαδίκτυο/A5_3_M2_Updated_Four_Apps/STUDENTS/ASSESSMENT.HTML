async function saveLocal(html,filename,statusId){
 const status=$(statusId);
 if(status)status.textContent='';
 if(window.showSaveFilePicker&&window.isSecureContext&&window.top===window.self){
  try{
   const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Αναφορά αποτελεσμάτων HTML',accept:{'text/html':['.html']}}]});
   const writable=await handle.createWritable();await writable.write(html);await writable.close();
   if(status)status.textContent='✓ Τα αποτελέσματα αποθηκεύτηκαν.';
   return;
  }catch(error){if(error.name==='AbortError'){if(status)status.textContent='Η αποθήκευση ακυρώθηκε. Μπορείς να ξαναδοκιμάσεις.';return}}
 }
 try{
  const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download=filename;link.textContent='📥 Λήψη αναφοράς αποτελεσμάτων';link.className='button primary';
  if(status){status.replaceChildren();const message=document.createElement('p');message.textContent='Η λήψη ξεκίνησε. Αν δεν εμφανιστεί αρχείο στις Λήψεις, πάτησε το κουμπί παρακάτω.';status.append(message,link)}else document.body.appendChild(link);
  link.click();
  link.addEventListener('click',()=>{if(status)status.setAttribute('aria-label','Λήψη αναφοράς αποτελεσμάτων')});
 }catch(error){if(status)status.textContent='Δεν ήταν δυνατή η δημιουργία του αρχείου. Κράτησε τη σελίδα ανοιχτή και δοκίμασε ξανά.'}
}

const app=document.getElementById('app');const $=id=>document.getElementById(id);function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listen(id,fn){if($(id))$(id).onclick=fn}function shell(html){app.innerHTML='<section class="reveal">'+html+'</section>';bind()}listen('board',()=>{document.body.classList.toggle('board')});listen('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[{"title": "Ακατάλληλο περιεχόμενο στην ομάδα", "case": "Στο ομαδικό chat της τάξης, ο Αλέξης στέλνει ένα βίντεο με βία και ρατσιστικά σχόλια. Ο Πέτρος ζητά να το προωθήσετε και σε άλλους μαθητές.", "q": "Ποια είναι η ασφαλέστερη αντίδραση;", "hint": "Σκέψου την προστασία σου, την αποφυγή διάδοσης και τη βοήθεια από έμπιστο ενήλικα.", "guide": "Αναγνώριση ακατάλληλου περιεχομένου. Σταματώ την προβολή, δεν το προωθώ και ενημερώνω έμπιστο ενήλικα για ασφαλή αναφορά ή αποκλεισμό.", "options": ["Το προωθώ για να το καταδικάσουν.", "Το αποθηκεύω για να το δείξω στην τάξη.", "Σταματώ, δεν προωθώ και ζητώ βοήθεια ενήλικα.", "Αγνοώ το βίντεο και παραμένω στην ομάδα."], "correct": 2, "visual": "<p class=\"scenario-description\">💬 Ανοίγεις το ομαδικό chat της τάξης και βλέπεις ένα βίντεο με βία και ρατσιστικά σχόλια. Δύο συμμαθητές σου γράφουν:</p><div class=\"assessment-chat\" aria-label=\"Συνομιλία συμμαθητών\"><div class=\"chat-message\"><span class=\"chat-avatar\" aria-hidden=\"true\">👦</span><div><b>Αλέξης</b><p>Δείτε αυτό το βίντεο!</p></div></div><div class=\"chat-message\"><span class=\"chat-avatar second-avatar\" aria-hidden=\"true\">🧑</span><div><b>Πέτρος</b><p>Στείλτε το και στους υπόλοιπους, να το δουν όλοι!</p></div></div></div><p class=\"scenario-question\">Πώς θα αντιδρούσες;</p>"}, {"title": "Δύο ενδείξεις στο ίδιο παιχνίδι", "case": "Η Μαρία είναι 12 ετών. Ένας φίλος της προτείνει ένα παιχνίδι και της λέει ότι είναι εύκολο. Στ και πηγές</label><textarea id="response" placeholder="Κατάγραψε ευρήματα, πηγές ή το σχέδιο εργασίας σου…">${esc(responses[ex])}</textarea>`}<button id="extraHint">💡 Καθοδήγηση</button>${extraHints[ex]?`<div class="feedback">${x.hint}</div>`:''}<p id="extraWarning" role="alert"></p></div><div class="foot"><button id="extraPrev" ${ex===0?'disabled':''}>← Προηγούμενο</button><button id="extraNext" class="primary">${ex===extras.length-1?'Ολοκλήρωση επιπλέον δραστηριοτήτων':'Επόμενη αποστολή →'}</button></div>`);return}if(stage==='extraResults'){shell(`<div class="label">ΕΠΙΠΛΕΟΝ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ · ΟΛΟΚΛΗΡΩΣΗ</div><h1>Αποθήκευση της εργασίας σου</h1><div class="paper"><p><b>${esc(student)}</b> · ${esc(classroom)}</p><button id="saveExtra" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="extraStatus" role="alert"></p><p class="muted">Η αναφορά περιλαμβάνει όσα έγραψες εδώ. Αποθήκευσε τα αρχεία Word χωριστά.</p><h2>Παράδοση των εγγράφων Word</h2><p>Όταν ολοκληρώσεις τις εργασίες, επισύναψε τα έγγραφα Word σε email προς <b>aristos.aresti@gmail.com</b>.</p><details><summary>Σημεία αυτοελέγχου των αποστολών</summary>${extras.map((x,j)=>`<div class="source"><h3>${j+1}. ${x.title}</h3><p>${x.guide}</p></div>`).join('')}</details><button id="extraReview">Επιστροφή στις αποστολές</button> </div>`);return}}const pegiFields=[['game','Τίτλος παιχνιδιού'],['age','Ηλικιακή ένδειξη PEGI'],['descriptors','Περιγραφικές ενδείξεις (ή «δεν εμφανίζονται»)'],['source','Σύνδεσμος αποτελέσματος PEGI'],['advice','Θα το πρότεινες στο παιδί; Γιατί;']];
const pegiAnswers={};
function renderPegiFields(){return '<div class="extra-fields">'+pegiFields.map(([key,label])=>`<div class="${key==='advice'?'wide-field':''}"><label for="pegi-${key}">${label}</label>${key==='advice'?`<textarea id="pegi-${key}" required>${esc(pegiAnswers[key])}</textarea>`:`<input id="pegi-${key}" required value="${esc(pegiAnswers[key])}">`}</div>`).join('')+'</div>'}
function capture(){if($('pegi-game')){for(const [key] of pegiFields)pegiAnswers[key]=$('pegi-'+key).value;responses[0]=pegiFields.map(([key,label])=>label+': '+pegiAnswers[key].trim()).join('\n')}if($('answerA'))openParts.a=$('answerA').value;if($('answerB'))openParts.b=$('answerB').value;if($('answerA2'))openParts.a2=$('answerA2').value;if($('answerB2'))openParts.b2=$('answerB2').value;if($('response'))responses[ex]=$('response').value}function bind(){listen('begin',()=>{student=$('name').value.trim();classroom=$('class').value.trim();if(!student){$('nameWarning').className='alert';$('nameWarning').textContent='Υποχρεωτικό πεδίο: συμπλήρωσε το ονοματεπώνυμό σου για να συνεχίσεις.';$('name').focus();return}if(!classroom){$('nameWarning').className='alert';$('nameWarning').textContent='Συμπλήρωσε το τμήμα σου για να ξεκινήσεις την αξιολόγηση.';$('class').focus();return}assessmentDeadline=Date.now()+600000;stage='question';render();updateAssessmentClock()});if(stage==='question'&&qs[i].options)qs[i].options.forEach((_,k)=>listen('choice'+k,()=>{if(checkDeadline())return;answers[i]=String(k);render()}));for(const id of ['answerA','answerA2','answerB','answerB2'])if($(id))$(id).oninput=()=>{capture();checkDeadline()};listen('hint',()=>{if(checkDeadline())return;capture();hints[i]=true;render()});listen('prev',()=>{if(checkDeadline())return;capture();i--;render()});listen('next',()=>{if(checkDeadline())return;capture();if(!answerComplete(i)){$('answerWarning').className='alert';$('answerWarning').textContent=qs[i].options?'Επίλεξε μία απάντηση πριν συνεχίσεις.':'Συμπλήρωσε και τα τέσσερα πεδία: δύο στοιχεία και δύο βήματα βοήθειας.';if($('answerA')){const missing=[['a','answerA'],['a2','answerA2'],['b','answerB'],['b2','answerB2']].find(([key])=>!openParts[key].trim());if(missing)$(missing[1]).focus()}else $('choice0')?.focus();return}if(i===qs.length-1)stage='review';else i++;render()});listen('review',()=>{if(checkDeadline())return;i=0;stage='question';render()});listen('submit',()=>{if(checkDeadline()||!completed())return;finishAssessment(false)});listen('saveAssessment',saveAssessment);listen('extraStart',()=>{if(!submitted)return;stage='extra';render()});if($('response'))$('response').oninput=()=>responses[ex]=$('response').value;listen('extraHint',()=>{capture();extraHints[ex]=true;render()});listen('extraPrev',()=>{capture();ex--;render()});listen('extraNext',()=>{capture();const missing=ex===0&&pegiFields.find(([key])=>!pegiAnswers[key]?.trim());if(missing){$('extraWarning').className='alert';$('extraWarning').textContent='Συμπλήρωσε το πεδίο «'+missing[1]+'» για να συνεχίσεις.';$('pegi-'+missing[0]).focus();return}if(!String(responses[ex]||'').trim()){$('extraWarning').className='alert';$('extraWarning').textContent='Κατάγραψε την απάντηση ή τα ευρήματά σου πριν συνεχίσεις.';$('response').focus();return}if(ex===extras.length-1){extraComplete=true;stage='extraResults'}else ex++;render()});listen('saveExtra',saveExtra);listen('extraReview',()=>{stage='extra';ex=0;render()})}render();</script></body></html>
