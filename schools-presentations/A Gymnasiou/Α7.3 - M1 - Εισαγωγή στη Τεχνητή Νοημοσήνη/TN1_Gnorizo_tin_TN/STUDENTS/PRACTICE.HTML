<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ΤΝ 1 · Εμπέδωση</title><style>
*{box-sizing:border-box}
:root{--navy:#213450;--teal:#146f86;--ink:#213450;--muted:#586a7d;--line:#c9d7e6;--bg:#edf3f8;--amber:#d9991a}
.in{--c:#146f86;--t:#d9eff4}.out{--c:#5363b8;--t:#e3e7fa}.st{--c:#b47a0c;--t:#fbefd2}.main{--c:#c4533c;--t:#fbe3dc}.nv{--c:#213450;--t:#dde6f0}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 'Segoe UI',Inter,'Noto Sans',Arial,sans-serif;min-height:100dvh}
svg.ic{display:block;width:100%;height:100%;color:var(--c,#213450);overflow:visible}
button,a.button{font:inherit;cursor:pointer;border:1px solid #b9c8d9;border-radius:12px;padding:10px 18px;background:white;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled),a.button:hover{border-color:var(--teal);background:#f3f9fb}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--teal)!important;color:white!important;border-color:var(--teal)!important;font-weight:600}
.primary:hover:not(:disabled){background:#0f5d71!important}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
header.top{padding:10px 3vw;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top a{color:white}
header.top .brand{display:flex;align-items:center;gap:12px;font-weight:600}
header.top .badge{background:#a6dfeb;color:var(--navy);border-radius:8px;padding:2px 9px;font-size:15px;font-weight:800;letter-spacing:.04em}
header.top button{background:transparent;color:white;border-color:#5d7593;padding:7px 14px;font-size:16px}
header.top button:hover:not(:disabled){background:#2d4466}
.timer{display:flex;align-items:center;gap:16px;padding:8px 3vw;background:#dcecf2;transition:background .3s}
.timer b{font-size:28px;font-variant-numeric:tabular-nums;color:var(--teal);min-width:80px}
.timer .bar{flex:1;height:8px;border-radius:6px;background:#c3dbe4;overflow:hidden;max-width:420px}
.timer .bar i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .3s}
.timer.warn{background:#fff0bb}.timer.warn b{color:#8a5b00}.timer.warn .bar i{background:var(--amber)}
.timer.expired{background:#f7ddd7}.timer.expired b{color:#ae2d28}.timer.expired .bar i{background:#ae2d28}
main{max-width:1180px;margin:0 auto;padding:20px 24px 40px}
.paper{padding:24px 28px;border-radius:20px;background:white;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
h1{font-size:clamp(26px,3.2vw,40px);line-height:1.18;margin:4px 0 14px}
h2{font-size:clamp(21px,2vw,27px);line-height:1.25;margin:0 0 10px}
h3{font-size:20px;margin:6px 0}
p{margin:7px 0 12px}
.label{font-size:14px;color:#376878;letter-spacing:.1em;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.muted{font-size:16px;color:var(--muted)}
.error{color:#ae2d28;font-weight:600;min-height:1em}
.notice{background:#fff4d2;border-left:6px solid var(--amber);border-radius:12px;padding:12px 18px;margin:14px 0}
.notice p{margin:4px 0}
.feedback{padding:12px 16px;background:#eef2fc;border-left:5px solid #5363b8;border-radius:10px;margin:10px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.enter>*{animation:arrive .3s ease both}
@media(prefers-reduced-motion:reduce){#app.enter>*{animation:none}}

.missions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.missions button{border-radius:999px;padding:8px 16px;font-size:16px;font-weight:600}
.missions button.now{background:var(--navy);color:white;border-color:var(--navy)}
.missions button.done{background:#e6f6ec;border-color:#2f9a5c;color:#16703a}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:center}
.heroart{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.heroart i{display:block;height:90px;background:var(--t);border-radius:16px;padding:10px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.rules div{background:#f1f6fa;border-radius:14px;padding:12px 14px;font-size:17px}.rules b{display:block;font-size:22px;margin-bottom:2px}
.mhead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:6px}
.mhead .mi{width:84px;height:64px;background:var(--t);border-radius:16px;padding:8px}
.mhead h1{margin:0}.mhead p{margin:2px 0 0}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:118px;padding:12px;border:2px dashed var(--line);border-radius:16px;background:#f8fbfd;align-items:center}
.pool:empty::after{content:'✓ Όλα τοποθετήθηκαν';color:var(--muted);font-size:16px;margin:auto}
.chip{background:white;border:2px solid var(--line);border-radius:14px;padding:6px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;transition:transform .12s,box-shadow .12s,border-color .12s}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--line)}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 4px #ffe3a3}
.chip .pet{width:84px;height:78px}
.chip i{display:block;width:84px;height:62px}
.chip span{font-size:14px;font-weight:600;text-align:center;max-width:120px;line-height:1.2}
.chip.ok{border-color:#2f9a5c;background:#e6f6ec}.chip.bad{border-color:#d0675f;background:#fdeceb}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.bin{border-radius:18px;border:3px solid var(--c);background:var(--t);min-height:150px;padding:10px 12px;transition:box-shadow .15s}
.bin.over{box-shadow:0 0 0 5px #ffe3a3}
.bin h3{margin:0 0 8px;color:var(--c);display:flex;align-items:center;gap:8px;font-size:22px}
.bin .items{display:flex;flex-wrap:wrap;gap:8px}
.brain{margin-top:14px;border-radius:18px;background:var(--navy);color:white;padding:16px 20px;display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center}
.brain i{display:block;width:90px;height:68px;--c:#a6dfeb;--t:#2d4466}
.brain .rule{font-size:22px;font-weight:800;color:#ffd27a}
.brain p{margin:4px 0}
.tests{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.test{background:white;border-radius:14px;border:2px solid var(--line);padding:8px;text-align:center}
.test .pet{width:90px;height:82px}
.test b{display:block;font-size:17px}.test.ok{border-color:#2f9a5c;background:#e6f6ec}.test.bad{border-color:#d0675f;background:#fdeceb}
.meter{height:14px;border-radius:8px;background:#dfe7ef;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#c4533c,#d9991a,#2f9a5c);transition:width .6s}
.lesson{background:#fff4d2;border-left:6px solid var(--amber);border-radius:12px;padding:12px 16px;margin-top:12px;font-size:18px}
.timeline{display:grid;gap:10px;margin-top:10px}
.ev{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;background:white;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.ev .yr{font-weight:800;color:var(--teal);font-size:18px;text-align:center}
.ev .arr{display:flex;gap:6px}.ev .arr button{padding:6px 12px;font-size:18px}
.ev.ok{border-color:#2f9a5c;background:#e6f6ec}.ev.bad{border-color:#d0675f;background:#fdeceb}
.ev i{display:inline-block;width:40px;height:30px;vertical-align:middle;margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.stats div{background:#f1f6fa;border-radius:14px;padding:14px;text-align:center}.stats b{display:block;font-size:32px;color:var(--teal)}.stats span{font-size:16px;color:var(--muted)}
.next-stage{border-top:4px solid var(--teal);margin-top:24px;padding-top:18px}.next-stage .button{font-size:22px;padding:14px 22px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:820px){.hero,.rules,.stats,.bins{grid-template-columns:1fr}.heroart{display:none}.tests{grid-template-columns:1fr 1fr}}

function predict(r,kind,color){if(r.type==='color')return r.map[color]||'?';if(r.type==='ears')return r.map[kind]||'?';return '?'}
function ruleText(r){if(r.type==='color')return Object.entries(r.map).map(([c,l])=>'χρώμα '+COLGR[c]+' → '+GR[l]).join(' · ');
 if(r.type==='ears')return Object.entries(r.map).map(([k,l])=>EARGR[k]+' → '+GR[l]).join(' · ');return 'Δεν βρήκα κανόνα που να ταιριάζει σε όλα τα παραδείγματα.'}
/* ---- mission 2 state ---- */
const place={};let sortChecked=false,sortWrong=new Set();
/* ---- mission 3 state ---- */
let order=SH.slice(),tlChecked=false;

function missionsBar(){const n=['🧠 Εκπαίδευσε την ΤΝ','🧩 ΤΝ ή όχι;','⏳ Χρονολόγιο'];return '<div class="missions">'+n.map((t,k)=>'<button id="mb'+k+'" class="'+(k===m?'now':done[k]?'done':'')+'" '+(k>0&&!done[k-1]&&k!==m?'disabled':'')+'>'+(done[k]?'✓ ':'')+t+'</button>').join('')+'</div>'}
function chipPet(id,kind,color,extra){return '<div class="chip '+(extra||'')+'" data-id="'+id+'">'+animal(kind,color)+'</div>'}

function render(){
 if(stage==='start'){show('<div class="paper"><div class="hero"><div><div class="label">Εμπέδωση · 3 αποστολές</div><h1>Γίνε εκπαιδευτής ΤΝ!</h1><p>Θα «διδάξεις» μια μηχανή, θα εντοπίσεις πού κρύβεται η ΤΝ γύρω σου και θα ταξιδέψεις στην ιστορία της.</p></div><div class="heroart">'+IC('robot','main')+IC('data','st')+IC('brain','out')+IC('faceid','in')+IC('voice','out')+IC('turing','nv')+'</div></div>'
  +'<div class="rules"><div><b>🧠 Αποστολή 1</b>Εκπαίδευσε την ΤΝ να ξεχωρίζει γάτες από σκύλους.</div><div><b>🧩 Αποστολή 2</b>Βρες ποιες συσκευές χρησιμοποιούν ΤΝ.</div><div><b>⏳ Αποστολή 3</b>Βάλε την ιστορία της ΤΝ στη σωστή σειρά.</div></div>'
  +'<div class="notice"><p>⏱️ Έχεις <b>15΄</b>. Σέρνε τις κάρτες με το ποντίκι ή πάτησε πρώτα την κάρτα και μετά το κουτί. Δεν ζητάμε όνομα και δεν αποθηκεύεται τίποτα.</p></div><button id="begin" class="primary">Ξεκινάμε →</button></div>');return}
 if(stage==='end'){const s=stats;show('<div class="paper"><h1>'+(expired?'⏰ Ο χρόνος τελείωσε':'🏆 Ολοκλήρωσες όλες τις αποστολές!')+'</h1><div class="stats"><div><b>'+(s.finalAcc===null?'—':s.finalAcc+'%')+'</b><span>🧠 ακρίβεια της ΤΝ σου στο τέλος</span></div><div><b>'+(s.sortFirst===null?'—':s.sortFirst+'/10')+'</b><span>🧩 σωστές με την πρώτη στο «ΤΝ ή όχι;»</span></div><div><b>'+(done[2]?s.tlChecks:'—')+'</b><span>⏳ έλεγχοι για το χρονολόγιο</span></div></div>'
  +'<div class="lesson">💡 <b>Θυμήσου:</b> η ΤΝ μαθαίνει από <b>παραδείγματα</b>. Όσο πιο πολλά, σωστά και <b>διαφορετικά</b> είναι, τόσο καλύτερα μαθαίνει. Αυτό λέγεται <b>Machine Learning</b>.</div><div class="next-stage"><a class="button primary" href="ASSESSMENT.HTML">Συνέχεια στην Αξιολόγηση →</a></div></div>');return}
 if(m===0)renderTrain();else if(m===1)renderSort();else renderTimeline()}

function renderTrain(){const set=round===1?TRAIN1:TRAIN2;const pool=set.filter(([id])=>!labels[id]);
 const binItems=l=>trainSet().filter(([id])=>labels[id]===l).map(([id,k,c])=>chipPet(id,k,c)).join('');
 let h=missionsBar()+'<div class="paper"><div class="mhead">'+IC('robot','mi main')+'<div><div class="label">Αποστολή 1 · Γύρος '+round+' από 2</div><h1>🧠 Εκπαίδευσε την ΤΝ</h1><p>'+(round===1?'Η ΤΝ δεν ξέρει τι είναι γάτα και τι σκύλος. Βάλε κάθε εικόνα στο σωστό κουτί για να της δώσεις <b>παραδείγματα</b>.':'Δώσε στην ΤΝ <b>περισσότερα και πιο διαφορετικά</b> παραδείγματα. Βάλε τις νέες εικόνες στα κουτιά.')+'</p></div></div>';
 if(phase==='label'){h+='<div class="pool" data-bin="pool">'+pool.map(([id,k,c])=>chipPet(id,k,c)).join('')+'</div><div class="bins"><div class="bin in" data-bin="cat"><h3>🐱 ΓΑΤΑ</h3><div class="items">'+binItems('cat')+'</div></div><div class="bin out" data-bin="dog"><h3>🐶 ΣΚΥΛΟΣ</h3><div class="items">'+binItems('dog')+'</div></div></div>'
  +'<div class="foot"><span class="muted">Έκανες λάθος; Πάτησε μια κάρτα στο κουτί και μετά το άλλο κουτί.</span><button id="trainBtn" class="primary" '+(pool.length?'disabled':'')+'>🧠 Εκπαίδευση της ΤΝ</button></div>'}
 else{const r=rule;h+='<div class="brain">'+IC('brain')+'<div><p>Ο κανόνας που βρήκε η ΤΝ από τα '+trainSet().length+' παραδείγματά σου:</p><div class="rule">'+esc(ruleText(r))+'</div></div></div>';
  if(r.type==='none')h+='<div class="lesson">🤔 Η ΤΝ μπερδεύτηκε! Κάποιο παράδειγμα μάλλον μπήκε σε λάθος κουτί. Τα <b>λάθος δεδομένα</b> κάνουν την ΤΝ να μαθαίνει λάθος.</div><div class="foot"><span></span><button id="relabel" class="primary">← Διόρθωσε τα κουτιά</button></div>';
  else if(phase==='trained')h+='<div class="foot"><span class="muted">Ας δούμε αν έμαθε σωστά, με εικόνες που <b>δεν έχει δει</b> ποτέ.</span><button id="testBtn" class="primary">🧪 Δοκίμασε την ΤΝ</button></div>';
  else{const T=round===1?TEST1:TEST2;const ok=testRes.filter(Boolean).length,acc=Math.round(ok/T.length*100);
   h+='<div class="tests">'+T.map(([id,k,c],j)=>{const p=predict(r,k,c);return '<div class="test '+(testRes[j]?'ok':'bad')+'">'+animal(k,c)+'<b>ΤΝ: '+(p==='?'?'Δεν ξέρω 🤷':GR[p])+' '+(testRes[j]?'✓':'✗')+'</b></div>'}).join('')+'</div>'
   +'<p style="margin-top:12px"><b>Ακρίβεια: '+acc+'%</b></p><div class="meter"><i style="width:'+acc+'%"></i></div>';
   if(round===1)h+='<div class="lesson">😮 <b>Η ΤΝ έμαθε λάθος κανόνα!</b> Όλες οι γάτες σου ήταν πορτοκαλί και όλοι οι σκύλοι μαύροι, οπότε «έμαθε» να κοιτάζει το <b>χρώμα</b>. Δεν φταίει η μηχανή: φταίνε τα <b>λίγα και μονόπλευρα</b> παραδείγματα.</div><div class="foot"><span></span><button id="round2" class="primary">➕ Δώσε περισσότερα παραδείγματα</button></div>';
   else h+='<div class="lesson">🎉 <b>Τέλεια!</b> Με πιο πολλά και διαφορετικά παραδείγματα, η ΤΝ βρήκε το σωστό χαρακτηριστικό: τα <b>αυτιά</b>. Έτσι λειτουργεί η <b>Machine Learning</b>: η μηχανή μαθαίνει μόνη της από δεδομένα, χωρίς να της πούμε τον κανόνα.</div><div class="foot"><span></span><button id="toM2" class="primary">Επόμενη αποστολή →</button></div>'}}
 show(h+'</div>');if(phase==='label')wireSort((id,bin)=>{if(bin==='pool')delete labels[id];else labels[id]=bin;render()})}

function renderSort(){const pool=AION.map((_,j)=>j).filter(j=>place[j]===undefined);
 const chip=(j)=>{const a=AION[j];const st=sortChecked&&place[j]!==undefined?(sortWrong.has(j)?'bad':'ok'):'';return '<div class="chip '+st+'" data-id="'+j+'" title="'+esc(a[1])+'">'+IC(a[0],'nv')+'<span>'+a[1]+'</span></div>'};
 const items=b=>AION.map((_,j)=>j).filter(j=>place[j]===b).map(chip).join('');
 const allOk=sortChecked&&sortWrong.size===0&&!pool.length;
 let h=missionsBar()+'<div class="paper"><div class="mhead">'+IC('question','mi nv')+'<div><div class="label">Αποστολή 2</div><h1>🧩 ΤΝ ή όχι;</h1><p>Ποιες συσκευές και εφαρμογές <b>χρησιμοποιούν ΤΝ</b>; Βάλε κάθε κάρτα στο σωστό κουτί και πάτησε «Έλεγχος».</p></div></div>'
  +'<div class="pool" data-bin="pool">'+pool.map(chip).join('')+'</div><div class="bins"><div class="bin main" data-bin="1"><h3>🧠 ΧΡΗΣΙΜΟΠΟΙΕΙ ΤΝ</h3><div class="items">'+items(1)+'</div></div><div class="bin nv" data-bin="0"><h3>⚙️ ΧΩΡΙΣ ΤΝ</h3><div class="items">'+items(0)+'</div></div></div>';
 if(sortChecked&&sortWrong.size)h+='<div class="feedback">✗ '+sortWrong.size+' κάρτες είναι σε λάθος κουτί (κόκκινες). '+[...sortWrong].map(j=>'<br>💡 <b>'+AION[j][1]+':</b> '+AION[j][3]).join('')+'</div>';
 if(allOk)h+='<div class="lesson">🎉 <b>Σωστά και τα 10!</b> Η ΤΝ κρύβεται εκεί όπου η μηχανή <b>αναγνωρίζει</b> (εικόνα, φωνή, γλώσσα) ή <b>παίρνει αποφάσεις</b>. Η αριθμομηχανή και το ρολόι απλώς ακολουθούν σταθερούς κανόνες.</div>';
 h+='<div class="foot"><button id="back1">← Αποστολή 1</button>'+(allOk?'<button id="toM3" class="primary">Επόμενη αποστολή →</button>':'<button id="checkSort" class="primary" '+(pool.length?'disabled':'')+'>✓ Έλεγχος</button>')+'</div></div>';
 show(h);if(!allOk)wireSort((id,bin)=>{const j=+id;if(bin==='pool')delete place[j];else place[j]=+bin;sortChecked=false;render()})}

function renderTimeline(){const okAll=tlChecked&&order.every((v,k)=>v===k);
 let h=missionsBar()+'<div class="paper"><div class="mhead">'+IC('turing','mi nv')+'<div><div class="label">Αποστολή 3</div><h1>⏳ Χρονολόγιο της ΤΝ</h1><p>Βάλε τα γεγονότα <b>από το παλαιότερο στο νεότερο</b> με τα βελάκια ▲▼ και πάτησε «Έλεγχος».</p></div></div><div class="timeline">'
  +order.map((v,k)=>{const e=TL[v];const st=tlChecked?(v===k?'ok':'bad'):'';return '<div class="ev '+st+'"><div class="yr">'+(tlChecked&&v===k?e[0]:(k+1)+'.')+'</div><div>'+IC(e[1],'nv')+e[2]+'</div><div class="arr">'+(okAll?'':'<button id="up'+k+'" '+(k===0?'disabled':'')+' aria-label="Πάνω">▲</button><button id="dn'+k+'" '+(k===order.length-1?'disabled':'')+' aria-label="Κάτω">▼</button>')+'</div></div>'}).join('')+'</div>';
 if(tlChecked&&!okAll)h+='<div class="feedback">Οι πράσινες είναι στη σωστή θέση και δείχνουν τη χρονιά. Μετακίνησε τις κόκκινες και ξαναδοκίμασε. 💡 Ξεκίνα από τον Turing!</div>';
 if(okAll)h+='<div class="lesson">🎉 <b>Μπράβο!</b> Η ΤΝ έχει ιστορία περίπου <b>75 ετών</b>, από το τεστ του Turing μέχρι τα αυτοκίνητα χωρίς οδηγό.</div>';
 h+='<div class="foot"><button id="back2">← Αποστολή 2</button>'+(okAll?'<button id="finish" class="primary">Ολοκλήρωση 🏆</button>':'<button id="checkTl" class="primary">✓ Έλεγχος</button>')+'</div></div>';show(h)}

function timeout(){if(stage==='play'&&Date.now()>=deadline){expired=true;finish=deadline;stage='end';render()}return stage==='end'}
function tick(){timeout();const left=stage==='start'?TOTAL:Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000));
 setTimer(left,TOTAL,expired?' expired':stage==='play'&&left<=120?' warn':'',expired?'⏰ Ο χρόνος τελείωσε.':stage==='end'?'✓ Ολοκληρώθηκε.':stage==='start'?'Ο χρόνος αρχίζει με την Έναρξη.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Εμπέδωση · 15΄')}
function bind(){
 on('begin',()=>{stage='play';deadline=Date.now()+TOTAL*1000;render();tick()});
 [0,1,2].forEach(k=>on('mb'+k,()=>{if(timeout())return;m=k;render()}));
 on('trainBtn',()=>{if(timeout())return;rule=learn();stats.rounds++;phase='trained';render()});
 on('relabel',()=>{phase='label';rule=null;render()});
 on('testBtn',()=>{if(timeout())return;const T=round===1?TEST1:TEST2;testRes=T.map(([id,k,c])=>predict(rule,k,c)===k);const acc=Math.round(testRes.filter(Boolean).length/T.length*100);if(round===1)stats.firstAcc=acc;else{stats.finalAcc=acc;if(acc===100){done[0]=true;confetti()}}phase='tested';render()});
 on('round2',()=>{round=2;phase='label';rule=null;testRes=null;render()});
 on('toM2',()=>{m=1;render()});on('back1',()=>{m=0;render()});on('back2',()=>{m=1;render()});
 on('checkSort',()=>{if(timeout())return;sortChecked=true;stats.sortChecks++;sortWrong=new Set(AION.map((a,j)=>j).filter(j=>place[j]!==AION[j][2]));if(stats.sortFirst===null)stats.sortFirst=10-sortWrong.size;
   if(!sortWrong.size){done[1]=true;confetti()}render();setTimeout(()=>{if(sortWrong.size){sortWrong.forEach(j=>delete place[j]);sortChecked=true;render()}},1800)});
 on('toM3',()=>{m=2;render()});
 order.forEach((_,k)=>{on('up'+k,()=>{if(timeout()||k===0)return;[order[k-1],order[k]]=[order[k],order[k-1]];tlChecked=false;render()});on('dn'+k,()=>{if(timeout()||k===order.length-1)return;[order[k+1],order[k]]=[order[k],order[k+1]];tlChecked=false;render()})});
 on('checkTl',()=>{if(timeout())return;tlChecked=true;stats.tlChecks++;if(order.every((v,k)=>v===k)){done[2]=true;confetti()}render()});
 on('finish',()=>{stage='end';finish=Date.now();render();tick()})}
setInterval(tick,250);render();
</script></body></html>
