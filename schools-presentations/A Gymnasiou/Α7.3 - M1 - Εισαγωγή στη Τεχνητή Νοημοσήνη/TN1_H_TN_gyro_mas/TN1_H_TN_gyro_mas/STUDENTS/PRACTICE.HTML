<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Τεχνητή Νοημοσύνη 1 · Εμπέδωση</title><style>
*{box-sizing:border-box}
:root{--navy:#213450;--teal:#146f86;--ink:#213450;--muted:#586a7d;--line:#c9d7e6;--bg:#edf3f8;--amber:#d9991a}
.in{--c:#146f86;--t:#d9eff4}.out{--c:#5363b8;--t:#e3e7fa}.st{--c:#b47a0c;--t:#fbefd2}.main{--c:#c4533c;--t:#fbe3dc}.nv{--c:#213450;--t:#dde6f0}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 'Segoe UI',Inter,'Noto Sans',Arial,sans-serif;min-height:100dvh}
svg.ic{display:block;width:100%;height:100%;color:var(--c,#213450);overflow:visible}
button,a.button{font:inherit;cursor:pointer;border:1px solid #b9c8d9;border-radius:12px;padding:10px 18px;background:white;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled),a.button:hover{border-color:var(--teal);background:#f3f9fb}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--teal)!important;color:white!important;border-color:var(--teal)!important;font-weight:600}
.primary:hover:not(:disabled){background:#0f5d71!important}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
header.top{padding:10px 3vw;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top a{color:white}
header.top .brand{display:flex;align-items:center;gap:12px;font-weight:600}
header.top .badge{background:#a6dfeb;color:var(--navy);border-radius:8px;padding:2px 9px;font-size:15px;font-weight:800;letter-spacing:.04em}
header.top button{background:transparent;color:white;border-color:#5d7593;padding:7px 14px;font-size:16px}
header.top button:hover:not(:disabled){background:#2d4466}
.timer{display:flex;align-items:center;gap:16px;padding:8px 3vw;background:#dcecf2;transition:background .3s}
.timer b{font-size:28px;font-variant-numeric:tabular-nums;color:var(--teal);min-width:80px}
.timer .bar{flex:1;height:8px;border-radius:6px;background:#c3dbe4;overflow:hidden;max-width:420px}
.timer .bar i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .3s}
.timer.warn{background:#fff0bb}.timer.warn b{color:#8a5b00}.timer.warn .bar i{background:var(--amber)}
.timer.expired{background:#f7ddd7}.timer.expired b{color:#ae2d28}.timer.expired .bar i{background:#ae2d28}
main{max-width:1180px;margin:0 auto;padding:20px 24px 40px}
.paper{padding:24px 28px;border-radius:20px;background:white;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
h1{font-size:clamp(26px,3.2vw,40px);line-height:1.18;margin:4px 0 14px}
h2{font-size:clamp(21px,2vw,27px);line-height:1.25;margin:0 0 10px}
h3{font-size:20px;margin:6px 0}
p{margin:7px 0 12px}
.label{font-size:14px;color:#376878;letter-spacing:.1em;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.muted{font-size:16px;color:var(--muted)}
.error{color:#ae2d28;font-weight:600;min-height:1em}
.notice{background:#fff4d2;border-left:6px solid var(--amber);border-radius:12px;padding:12px 18px;margin:14px 0}
.notice p{margin:4px 0}
.feedback{padding:12px 16px;background:#eef2fc;border-left:5px solid #5363b8;border-radius:10px;margin:10px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.enter>*{animation:arrive .3s ease both}
@media(prefers-reduced-motion:reduce){#app.enter>*{animation:none}}

.missions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.missions button{border-radius:999px;padding:8px 16px;font-size:16px;font-weight:600}
.missions button.now{background:var(--navy);color:white;border-color:var(--navy)}
.missions button.done{background:#e6f6ec;border-color:#2f9a5c;color:#16703a}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:center}
.heroart{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.heroart i{display:block;height:90px;background:var(--t);border-radius:16px;padding:10px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.rules.five{grid-template-columns:repeat(5,1fr)}.rules.five div{font-size:15px}.rules.five b{font-size:18px}.rules div{background:#f1f6fa;border-radius:14px;padding:12px 14px;font-size:17px}.rules b{display:block;font-size:22px;margin-bottom:2px}
.mhead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:6px}
.mhead .mi{width:84px;height:64px;background:var(--t);border-radius:16px;padding:8px}
.mhead h1{margin:0}.mhead p{margin:2px 0 0}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:118px;padding:12px;border:2px dashed var(--line);border-radius:16px;background:#f8fbfd;align-items:center}
.pool:empty::after{content:'✓ Όλα τοποθετήθηκαν';color:var(--muted);font-size:16px;margin:auto}
.chip{background:white;border:2px solid var(--line);border-radius:14px;padding:6px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;transition:transform .12s,box-shadow .12s,border-color .12s}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--line)}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 4px #ffe3a3}
.chip .pet{width:84px;height:78px}
.chip i{display:block;width:84px;height:62px}
.chip span{font-size:14px;font-weight:600;text-align:center;max-width:120px;line-height:1.2}
.chip.ok{border-color:#2f9a5c;background:#e6f6ec}.chip.bad{border-color:#d0675f;background:#fdeceb}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.bins.four{grid-template-columns:repeat(4,1fr);gap:10px}.bins.four .bin{min-height:170px}.bins.four h3{font-size:17px}.chip.wide span{max-width:150px;font-size:13px}.task{background:#eef2fc;border-left:6px solid #5363b8;border-radius:12px;padding:12px 16px;margin:12px 0}.task p{margin:4px 0}textarea{font:inherit;width:100%;border:1px solid #b9c8d9;border-radius:10px;padding:10px 12px;font-size:18px;resize:vertical}label{display:block;margin-top:12px;font-size:17px;font-weight:600}
.bin{border-radius:18px;border:3px solid var(--c);background:var(--t);min-height:150px;padding:10px 12px;transition:box-shadow .15s}
.bin.over{box-shadow:0 0 0 5px #ffe3a3}
.bin h3{margin:0 0 8px;color:var(--c);display:flex;align-items:center;gap:8px;font-size:22px}
.bin .items{display:flex;flex-wrap:wrap;gap:8px}
.brain{margin-top:14px;border-radius:18px;background:var(--navy);color:white;padding:16px 20px;display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center}
.brain i{display:block;width:90px;height:68px;--c:#a6dfeb;--t:#2d4466}
.brain .rule{font-size:22px;font-weight:800;color:#ffd27a}
.brain p{margin:4px 0}
.tests{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.test{background:white;border-radius:14px;border:2px solid var(--line);padding:8px;text-align:center}
.test .pet{width:90px;height:82px}
.test b{display:block;font-size:17px}.test.ok{border-color:#2f9a5c;background:#e6f6ec}.test.bad{border-color:#d0675f;background:#fdeceb}
.meter{height:14px;border-radius:8px;background:#dfe7ef;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#c4533c,#d9991a,#2f9a5c);transition:width .6s}
.lesson{background:#fff4d2;border-left:6px solid var(--amber);border-radius:12px;padding:12px 16px;margin-top:12px;font-size:18px}
.timeline{display:grid;gap:10px;margin-top:10px}
.ev{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;background:white;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.ev .yr{font-weight:800;color:var(--teal);font-size:18px;text-align:center}
.ev .arr{display:flex;gap:6px}.ev .arr button{padding:6px 12px;font-size:18px}
.ev.ok{border-color:#2f9a5c;background:#e6f6ec}.ev.bad{border-color:#d0675f;background:#fdeceb}
.ev i{display:inline-block;width:40px;height:30px;vertical-align:middle;margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.stats div{background:#f1f6fa;border-radius:14px;padding:14px;text-align:center}.stats b{display:block;font-size:32px;color:var(--teal)}.stats span{font-size:16px;color:var(--muted)}
.next-stage{border-top:4px solid var(--teal);margin-top:24px;padding-top:18px}.next-stage .button{font-size:22px;padding:14px 22px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:820px){.hero,.rules,.rules.five,.stats,.bins,.bins.four{grid-template-columns:1fr}.heroart{display:none}.tests{grid-template-columns:1fr 1fr}}

.rules.five{grid-template-columns:repeat(5,1fr)}.rules.five div{font-size:15px}.rules.five b{font-size:18px}
.chip.wide{width:150px}.chip.wide span{max-width:140px;font-size:14px}
.bins.four h3{font-size:16px}.bins.four h3 small{display:block;font-size:12px;font-weight:600;opacity:.8}
.house{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.room{background:#f6f9fc;border:2px solid var(--line);border-radius:16px;padding:10px}
.room h3{margin:0 0 8px;font-size:18px}
.obj{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;text-align:left;border-radius:14px;padding:8px 10px;font-size:16px;font-weight:600;background:white}
.obj .em{font-size:30px;line-height:1}.obj.ai{background:#e6f6ec;border-color:#2f9a5c}.obj.no{background:#f1f1f1;border-color:#c9c9c9;color:#777}.obj.now{border-color:var(--amber);box-shadow:0 0 0 3px #ffd27a}
.ask{background:#fff8e5;border:2px solid var(--amber);border-radius:16px;padding:12px 16px;margin-top:12px}
.ask .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ask .opts button{font-weight:700}
.found{font-size:19px;font-weight:800;margin:6px 0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.slot{min-height:120px;border:3px dashed #9fb3c8;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:16px;color:var(--muted)}
.slot.ok{border-style:solid;border-color:#2f9a5c;background:#e6f6ec;color:var(--ink)}.slot .em{font-size:34px}
.cards4{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.cards4 button{flex-direction:column;width:200px;font-size:16px;font-weight:700;padding:12px}.cards4 .em{font-size:34px}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.match{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;background:#f6f9fc;border-radius:12px;padding:8px 12px;border:2px solid transparent}
.mrow b{font-size:18px}.mrow select{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;width:100%}
.mrow.ok{border-color:#2f9a5c;background:#e6f6ec}.mrow.bad{border-color:#d0675f;background:#fdeceb}
.task{background:#eef2fc;border-left:6px solid #5363b8;border-radius:12px;padding:12px 16px;margin:12px 0}.task p{margin:4px 0}
textarea{font:inherit;width:100%;border:1px solid #b9c8d9;border-radius:10px;padding:10px 12px;font-size:18px;resize:vertical}label{display:block;margin-top:12px;font-size:17px;font-weight:600}
@media(max-width:820px){.rules.five,.house,.steps{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}}

function renderHouse(){const rooms=[...new Set(HOUSE.map(x=>x[0]))];const found=hs.filter(v=>v==='ai').length,all=found===AIN;
 let h=missionsBar()+'<div class="paper">'+mh('home','st','Αποστολή 2 · A7.9.4','🏠 Κυνήγι Τεχνητής Νοημοσύνης στο σπίτι','Σε αυτό το σπίτι κρύβονται <b>'+AIN+' συσκευές με ΤΝ</b>. Πάτησε μια συσκευή. Αν έχει ΤΝ, διάλεξε την υπερδύναμή της.')
  +'<div class="found">Βρήκες: '+found+' / '+AIN+' '+'⭐'.repeat(found)+'</div><div class="house">'+rooms.map(r=>'<div class="room"><h3>'+r+'</h3>'+HOUSE.map((x,j)=>x[0]!==r?'':'<button class="obj '+(hs[j]==='ai'?'ai':hs[j]==='no'?'no':'')+(cur===j?' now':'')+'" id="o'+j+'" '+(hs[j]||all?'disabled':'')+'><span class="em">'+x[1]+'</span><span>'+x[2]+(hs[j]==='ai'?'<br><small>✓ '+x[3].map(c=>CN[c][2]).join(' + ')+'</small>':hs[j]==='no'?'<br><small>✗ όχι ΤΝ</small>':'')+'</span></button>').join('')+'</div>').join('')+'</div>';
 if(cur!==null){const x=HOUSE[cur];h+='<div class="ask"><b>'+x[1]+' '+x[2]+':</b> έχει Τεχνητή Νοημοσύνη; Αν ναι, ποια υπερδύναμη χρησιμοποιεί;<div class="opts">'+CATS.map(c=>'<button id="c_'+c[0]+'">'+c[2]+'</button>').join('')+'<button id="c_no">🚫 Δεν έχει ΤΝ</button></div></div>'}
 if(hmsg)h+='<div class="feedback">'+hmsg+'</div>';
 if(all)h+='<div class="lesson">🎉 <b>Τα βρήκες όλα!</b> Η ΤΝ κρύβεται σε πολλές συσκευές του σπιτιού. Μια συσκευή είναι «έξυπνη» όταν <b>βλέπει, ακούει, απαντά ή δημιουργεί</b>, όχι απλώς επειδή είναι ηλεκτρική.</div>';
 show(h+foot(all)+'</div>');
 HOUSE.forEach((_,j)=>on('o'+j,()=>{if(timeout())return;cur=j;hmsg='';render()}));
 if(cur!==null){CATS.forEach(c=>on('c_'+c[0],()=>answerHouse(c[0])));on('c_no',()=>answerHouse(null))}}
function answerHouse(c){const x=HOUSE[cur];const isAI=x[3].length>0;
 if(c===null&&!isAI){hs[cur]='no';hmsg='✓ Σωστά! <b>'+x[2]+':</b> '+x[4];cur=null}
 else if(c!==null&&x[3].includes(c)){hs[cur]='ai';hmsg='⭐ Βρήκες ΤΝ! <b>'+x[2]+':</b> '+x[4];cur=null;if(hs.filter(v=>v==='ai').length===AIN){done[1]=true;confetti()}}
 else{stats.houseMiss++;hmsg=c===null?'🤔 Ξανασκέψου: αυτή η συσκευή <b>έχει</b> ΤΝ. Τι κάνει: βλέπει, ακούει, απαντά ή δημιουργεί;':(isAI?'🤔 Έχει ΤΝ, αλλά όχι αυτή την υπερδύναμη. Τι της δίνεις και τι σου δίνει;':'🤔 Μήπως αυτή η συσκευή <b>δεν</b> έχει ΤΝ; Βλέπει, ακούει, απαντά ή δημιουργεί;')}
 render()}

/* ---------- 3: voice assistant steps ---------- */
function renderSteps(){const all=placed.length===4;
 let h=missionsBar()+'<div class="paper">'+mh('voice','out','Αποστολή 3 · A7.9.3 & A7.9.4','🔊 Πώς δουλεύει ο βοηθός φωνής;','Ρωτάς τον βοηθό: <b>«Τι καιρό θα κάνει αύριο;»</b> Πάτησε τα βήματα με τη <b>σωστή σειρά</b>.')
  +'<div class="steps">'+[0,1,2,3].map(k=>{const s=placed[k]!==undefined?STEPS[placed[k]]:null;return '<div class="slot '+(s?'ok':'')+'">'+(s?'<span class="em">'+s[0]+'</span>'+s[1]+'<small>'+s[2]+'</small>':'Βήμα '+(k+1))+'</div>'}).join('')+'</div>'
  +(all?'':'<div class="cards4">'+SO.filter(j=>!placed.includes(j)).map(j=>'<button id="s'+j+'" class="'+(shakeId===j?'shake':'')+'"><span class="em">'+STEPS[j][0]+'</span>'+STEPS[j][1]+'</button>').join('')+'</div>');
 if(smsg)h+='<div class="feedback">'+smsg+'</div>';
 if(all)h+='<div class="lesson">🎉 <b>Μπράβο!</b> Ο βοηθός φωνής χρησιμοποιεί <b>δύο υπερδυνάμεις</b>: πρώτα <b>ακούει</b> (αναγνώριση φωνής) και μετά <b>απαντά</b> (απαντήσεις & κείμενο), και στο τέλος μετατρέπει το κείμενο σε φωνή.</div>';
 show(h+foot(all)+'</div>');shakeId=null;
 SO.forEach(j=>on('s'+j,()=>{if(timeout())return;if(j===placed.length){placed.push(j);smsg='';if(placed.length===4){done[2]=true;confetti()}}else{stats.stepMiss++;shakeId=j;smsg='🤔 Όχι ακόμη! Τι πρέπει να κάνει πρώτα ο βοηθός πριν από αυτό;'}render()}))}

/* ---------- 4: match fields ---------- */
function renderMatch(){const res=FIELDS.map((f,k)=>sel[k]!==''&&+sel[k]===f[2]);const allOk=mChecked&&res.every(Boolean);
 let h=missionsBar()+'<div class="paper">'+mh('medical','in','Αποστολή 4 · A7.9.4','🌍 Η Τεχνητή Νοημοσύνη στη ζωή των ανθρώπων','Για κάθε τομέα διάλεξε το παράδειγμα που ταιριάζει.')
  +'<div class="match">'+FIELDS.map((f,k)=>'<div class="mrow '+(mChecked?(res[k]?'ok':'bad'):'')+'"><b>'+f[0]+' '+f[1]+'</b><select id="f'+k+'" '+(allOk?'disabled':'')+'><option value="">— διάλεξε παράδειγμα —</option>'+EXO.map(e=>'<option value="'+e+'"'+(sel[k]===String(e)?' selected':'')+'>'+EXS[e]+'</option>').join('')+'</select></div>').join('')+'</div>';
 if(mChecked&&!allOk)h+='<div class="feedback">✗ '+res.filter(v=>!v).length+' λάθος ταιριάσματα (με κόκκινο). Διόρθωσέ τα και ξαναέλεγξε.</div>';
 if(allOk)h+='<div class="lesson">🎉 <b>Τέλεια!</b> Η ΤΝ βοηθά σε κάθε τομέα της ζωής. Θυμήσου όμως: στο τέλος <b>αποφασίζει ο άνθρωπος</b>.</div>';
 h+='<div class="foot"><span></span>'+(allOk?'<button id="toM" class="primary">Τελευταία αποστολή →</button>':'<button id="checkMatch" class="primary" '+(sel.every(v=>v!=='')?'':'disabled')+'>✓ Έλεγχος</button>')+'</div></div>';
 show(h);FIELDS.forEach((_,k)=>{const e=$('f'+k);if(e)e.onchange=ev=>{sel[k]=ev.target.value;mChecked=false;render()}})}

/* ---------- 5: open ---------- */
function renderIdea(){const ok=idea.every(v=>v.trim().length>=10);
 show(missionsBar()+'<div class="paper">'+mh('chat','st','Αποστολή 5 · Ανοικτή ερώτηση','✍️ Η Τεχνητή Νοημοσύνη στη μέρα μου','Σκέψου τη δική σου ζωή και γράψε με δικά σου λόγια.')
  +IDEA.map((l,k)=>'<label for="idea'+k+'">'+(k+1)+'. '+l+'</label><textarea id="idea'+k+'" rows="3">'+esc(idea[k])+'</textarea>').join('')
  +'<p class="muted">Γράψε τουλάχιστον μία πρόταση σε κάθε πεδίο. Θα συζητήσουμε τις απαντήσεις στην τάξη.</p><div class="foot"><button id="back">← Αποστολή 4</button><button id="finish" class="primary" '+(ok?'':'disabled')+'>Ολοκλήρωση 🏆</button></div></div>');
 IDEA.forEach((_,k)=>{$('idea'+k).oninput=e=>{idea[k]=e.target.value;$('finish').disabled=!idea.every(v=>v.trim().length>=10)}})}

function timeout(){if(stage==='play'&&Date.now()>=deadline){expired=true;finish=deadline;stage='end';render()}return stage==='end'}
function tick(){timeout();const left=stage==='start'?TOTAL:Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000));
 setTimer(left,TOTAL,expired?' expired':stage==='play'&&left<=120?' warn':'',expired?'⏰ Ο χρόνος τελείωσε.':stage==='end'?'✓ Ολοκληρώθηκε.':stage==='start'?'Ο χρόνος αρχίζει με την Έναρξη.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Εμπέδωση · 10΄')}
function bind(){
 on('begin',()=>{stage='play';deadline=Date.now()+TOTAL*1000;render();tick()});
 [0,1,2,3,4].forEach(k=>on('mb'+k,()=>{if(timeout())return;m=k;render()}));
 on('toM',()=>{m++;render()});on('back',()=>{m=3;render()});
 on('checkSort',()=>{if(timeout())return;sortChecked=true;sortWrong=new Set(SORT.map((_,j)=>j).filter(j=>place[j]!==SORT[j][2]));if(stats.sortFirst===null)stats.sortFirst=SORT.length-sortWrong.size;if(!sortWrong.size){done[0]=true;confetti()}render();setTimeout(()=>{if(sortWrong.size&&m===0){sortWrong.forEach(j=>delete place[j]);render()}},1800)});
 on('checkMatch',()=>{if(timeout())return;mChecked=true;const ok=FIELDS.filter((f,k)=>+sel[k]===f[2]).length;if(stats.matchFirst===null)stats.matchFirst=ok;if(ok===6&&!done[3]){done[3]=true;confetti()}render()});
 on('finish',()=>{if(!idea.every(v=>v.trim().length>=10))return;done[4]=true;stage='end';finish=Date.now();confetti();render();tick()})}
setInterval(tick,250);render();
</script></body></html>
