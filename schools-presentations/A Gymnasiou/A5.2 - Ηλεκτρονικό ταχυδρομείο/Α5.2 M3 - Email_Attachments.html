<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Α.5.2 Μ3 — Συνημμένα στο email</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#152e40;background:#edf3f5;font-size:20px}*{box-sizing:border-box}body{margin:0}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 4vw}header{background:#123648;color:white}header small{color:#a6d8d3}button,select{font:inherit;border:1px solid #bad0d8;border-radius:12px;padding:12px 20px;background:white;color:#17394b;cursor:pointer}button:hover{background:#e0f3ee}button:focus-visible{outline:4px solid #eeac40}button:disabled{opacity:.45;cursor:default}.primary{background:#087e79;color:white;border:0}.primary:hover{background:#08635f}main{max-width:1150px;margin:25px auto;padding:0 25px;min-height:65vh}h1{font-size:clamp(30px,4vw,48px);margin:10px 0 18px;letter-spacing:-1px}h2{font-size:26px}p{line-height:1.5}.tag{color:#087e79;font-weight:700;font-size:16px;letter-spacing:1px}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:28px}.card,.mail{background:white;border:1px solid #d3e0e5;border-radius:20px;padding:24px;box-shadow:0 12px 35px #12364809}.mail{border-top:6px solid #087e79}.row{padding:12px 0;border-bottom:1px solid #e3ebee}.row b{display:inline-block;width:90px}.pill{display:inline-block;padding:12px 17px;border-radius:12px;background:#e6f3ef;margin:8px 5px 8px 0}.hidden{display:none!important}.view{animation:appear .45s ease-out}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.answers{display:grid;gap:10px;margin:18px 0}.answers button{text-align:left}.feedback{min-height:35px;color:#08645c;font-weight:600;margin-top:15px}.note{font-size:16px;color:#526b79}.bar{height:5px;background:#d5e4e7}.bar i{display:block;height:100%;background:#f1b54b;transition:width .3s}.big{font-size:65px}.steps{line-height:1.9;padding-left:25px}.file{display:block;width:100%;text-align:left;margin:10px 0}.chosen{background:#d5efe6;border:2px solid #087e79}.upload{height:8px;background:#d3e4e5;border-radius:6px;overflow:hidden;margin:15px 0}.upload i{display:block;height:100%;width:0;background:#087e79;animation:upload 1.3s forwards}@keyframes upload{to{width:100%}}body.board{font-size:25px}.board main{max-width:1350px}footer{max-width:1150px;margin:auto}.count{font-size:16px}.success{background:#e3f2eb;padding:18px;border-radius:12px}dialog{border:0;border-radius:20px;max-width:600px;width:90%;padding:28px}dialog::backdrop{background:#12364899}@media(max-width:750px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}main{padding:0 16px}button{padding:10px 14px}h1{letter-spacing:0}footer{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style><header><div><small>Α΄ ΓΥΜΝΑΣΙΟΥ / Α.5.2 Μ3</small><div>Το αρχείο ταξιδεύει με το email</div></div><div><button id="mode">Προβολή πίνακα</button> <button id="full">⛶</button></div></header><div class="bar"><i id="progress"></i></div><main id="app"></main><footer><button id="prev">← Πίσω</button><span class="count" id="count"></span><button class="primary" id="next">Επόμενο →</button></footer><dialog id="picker"><h2>Επιλογή αρχείων · Open</h2><p>Επίλεξε και τα δύο αρχεία από τον φάκελο «Σχολείο».</p><button class="file" data-file="0">📄 Πρόγραμμα.pdf</button><button class="file" data-file="1">🖼 Φωτογραφία.jpg</button><button id="attach" class="primary">Open — Επισύναψη</button> <button id="cancel">Άκυρο</button><p id="pickmsg" aria-live="polite"></p></dialog><script>
const finalQuestions=[
['Σε ποιο πεδίο βάζουμε κάποιον για να πάρει αντίγραφο με τη διεύθυνσή του ορατή στους παραλήπτες;',['BCC','CC','Subject'],1,'Το CC είναι κοινοποίηση με ορατή διεύθυνση.'],
['Θέλεις να στείλεις αντίγραφο χωρίς να φαίνεται η διεύθυνση αυτού του παραλήπτη στους άλλους. Επιλέγεις…',['To','CC','BCC'],2,'Το BCC είναι κρυφή κοινοποίηση.'],
['Θέλεις να στείλεις ένα PDF και μια φωτογραφία στο ίδιο email. Μπορείς;',['Ναι, μπορούν να έχουν διαφορετικό τύπο.','Όχι, επιτρέπεται μόνο ένα αρχείο.','Μόνο αν τα μετατρέψεις στον ίδιο τύπο.'],0,'Μπορούμε να επισυνάψουμε πολλά αρχεία διαφορετικών τύπων.'],
['Έγραψες «επισυνάπτω την εργασία», αλλά δεν εμφανίζεται αρχείο στο μήνυμα. Τι κάνεις πριν το Send;',['Πατάς Reply.','Πατάς Attach, επιλέγεις το αρχείο και περιμένεις να επισυναφθεί.','Αλλάζεις το CC.'],1,'Ελέγχουμε ότι το αρχείο έχει επισυναφθεί πριν στείλουμε το μήνυμα.'],
['Θέλεις να κρατήσεις ένα συνημμένο στον δικό σου φάκελο. Ποια σειρά είναι σωστή;',['Open → κλείσιμο μηνύματος','Reply → Send','Download / Save as → επιλογή φακέλου → Save'],2,'Με την αποθήκευση κρατάμε αντίγραφο στη θέση που επιλέγουμε.']];
let finalIndex=0;const finalAnswers=[];
function finalQuiz(){if(finalIndex===finalQuestions.length){const score=finalQuestions.filter((q,i)=>q[2]===finalAnswers[i]).length;return '<div class="tag">07 / ΤΕΛΙΚΟ ΚΟΥΙΖ</div><h1>Ολοκλήρωσες το κουίζ!</h1><div class="card"><h2>Αποτέλεσμα: '+score+' / 5</h2><p>Επίστρεψε στις ερωτήσεις για ακόμη μία προσπάθεια.</p><button id="quizretry" class="primary">Νέα προσπάθεια</button></div>'}const q=finalQuestions[finalIndex],a=finalAnswers[finalIndex],answered=a!==undefined;return '<div class="tag">07 / ΤΕΛΙΚΟ ΚΟΥΙΖ · 70″</div><h1>Ερώτηση '+(finalIndex+1)+' από 5</h1><div class="card"><h2>'+q[0]+'</h2><div class="answers">'+q[1].map((v,i)=>'<button data-final="'+i+'" '+(answered?'disabled':'')+' class="'+(answered&&i===q[2]?'chosen':'')+'">'+v+'</button>').join('')+'</div><div class="feedback" aria-live="polite">'+(answered?(a===q[2]?'✓ Σωστά! ':'✗ Η σωστή απάντηση επισημαίνεται. ')+q[3]:'Επίλεξε μία απάντηση.')+'</div><button class="primary" id="quiznext" '+(answered?'':'disabled')+'>'+(finalIndex===4?'Δες το αποτέλεσμα':'Επόμενη ερώτηση →')+'</button></div>'}
let page=0;const answers={},done={},files=new Set();let attached=false,sent=false,opened=false,saved=false;const app=document.querySelector('#app');const times=['40″','35″','60″','45″','35″','15″','70″'];
const questions=[['Θέλεις να λάβει ο καθηγητής αντίγραφο χωρίς να βλέπουν οι άλλοι τη διεύθυνσή του. Τι επιλέγεις;',['CC','BCC','To'],1,'Το BCC κρύβει τη διεύθυνση αυτού του παραλήπτη από τους άλλους παραλήπτες.'],['Ποια αρχεία μπορούν να συνυπάρχουν σε ένα email;',['Μόνο εικόνες','Μόνο αρχεία ίδιου τύπου','Ένα PDF και μία εικόνα'],2,'Μπορούμε να επισυνάψουμε πολλά αρχεία διαφορετικών τύπων.'],['Άνοιξες το συνημμένο. Ποιο βήμα χρειάζεται για να κρατήσεις αντίγραφο στον φάκελό σου;',['Download / Save as και επιλογή φακέλου','Reply στον αποστολέα','Μόνο κλείσιμο του email'],0,'Το άνοιγμα προβάλλει το αρχείο. Η αποθήκευση κρατά αντίγραφο στη θέση που επιλέγουμε.']];
function quiz(i){const q=questions[i];return `<div class="card"><h2>Σκέψου και απάντησε</h2><p>${q[0]}</p><div class="answers">${q[1].map((a,j)=>`<button data-q="${i}" data-a="${j}" ${done[i]?'disabled':''}>${a}</button>`).join('')}</div><div class="feedback" aria-live="polite">${done[i]?'✓ '+q[3]:answers[i]!==undefined?'Δοκίμασε ξανά.':''}</div></div>`}
function render(){let html='';if(page===0)html=`<div class="tag">01 / ΓΡΗΓΟΡΗ ΥΠΕΝΘΥΜΙΣΗ · 40″</div><h1>CC & BCC: ποιος βλέπει ποιον;</h1><div class="grid"><div class="card"><p><b>To</b> → ο κύριος παραλήπτης.</p><p><b>CC</b> → αντίγραφο. Η διεύθυνση φαίνεται στους παραλήπτες.</p><p><b>BCC</b> → κρυφό αντίγραφο. Η διεύθυνση δεν φαίνεται στους άλλους παραλήπτες.</p><span class="pill">Και οι δύο λαμβάνουν το μήνυμα.</span></div>${quiz(0)}</div>`;
if(page===1)html=`<div class="tag">02 / Η ΣΗΜΕΡΙΝΗ ΑΠΟΣΤΟΛΗ · 35″</div><h1>Ένα email, πολλά συνημμένα</h1><div class="grid"><div><div class="big">📎</div><p>Το <b>Attachment (συνημμένο)</b> είναι αρχείο που στέλνουμε μαζί με το μήνυμα.</p><p>Κείμενο, εικόνα, ήχος ή βίντεο — ακόμη και διαφορετικοί τύποι μαζί.</p><p class="note">Υπάρχουν όρια μεγέθους ανά υπηρεσία email.</p></div>${quiz(1)}</div>`;
if(page===2)html=`<div class="tag">03 / ΔΟΚΙΜΑΣΕ ΤΟ · 75″</div><h1>Επισύναψε πριν πατήσεις Send</h1><div class="grid"><div><ol class="steps"><li>Πάτησε <b>📎 Attach</b>.</li><li>Επίλεξε τα δύο αρχεία.</li><li>Πάτησε <b>Open</b> και περίμενε να ολοκληρωθεί η επισύναψη.</li><li>Έλεγξε τα συνημμένα και πάτησε <b>Send</b>.</li></ol><p class="note">Προσομοίωση: δεν χρησιμοποιούνται πραγματικά αρχεία και δεν στέλνεται email.</p></div><div class="mail"><div class="row"><b>To</b> teacher@example.com</div><div class="row"><b>Subject</b> Φωτογραφίες σχολείου</div><p>Σας στέλνω τη φωτογραφία και το πρόγραμμα.</p><div id="attached">${attached?'<span class="pill">📄 Πρόγραμμα.pdf ✓</span><span class="pill">🖼 Φωτογραφία.jpg ✓</span>':''}</div><button id="paper">📎 Attach</button> <button class="primary" id="send" ${sent?'disabled':''}>Send →</button><p id="sendmsg" class="feedback" aria-live="polite">${sent?'✓ Στάλθηκε το μήνυμα με τα δύο αρχεία.':''}</p></div></div>`;
if(page===3)html=`<div class="tag">04 / ΛΑΜΒΑΝΩ ΣΥΝΗΜΜΕΝΟ · 60″</div><h1>Open ≠ Save</h1><div class="grid"><div><p><b>Open:</b> βλέπω το περιεχόμενο. Χρειάζομαι κατάλληλη εφαρμογή ή προεπισκόπηση.</p><p><b>Download / Save as:</b> κρατώ αντίγραφο για αργότερα.</p><p>Διαλέγω τη μονάδα και τον φάκελό μου → <b>Save</b>.</p><p class="note">Η εμφάνιση των επιλογών διαφέρει ανά υπηρεσία και browser. Ανοίγω συνημμένα μόνο όταν εμπιστεύομαι το μήνυμα.</p></div><div class="mail"><div class="tag">INBOX / ΜΗΝΥΜΑ ΚΑΘΗΓΗΤΗ</div><h2>Εξετάσεις: πρόγραμμα</h2><span class="pill">📎 Πρόγραμμα.pdf</span><p><button id="open">Open</button> <button id="download">Download / Save as</button></p><div id="preview" class="${opened?'':'hidden'} success">📄 Προεπισκόπηση: Εξετάσεις Δευτέρα, 08:00.<p class="note">Το βλέπεις, αλλά δεν επέλεξες ακόμη φάκελο αποθήκευσης.</p></div><div id="savebox" class="hidden"><label>Θέση αποθήκευσης <select id="folder"><option value="">Επίλεξε φάκελο…</option><option>Έγγραφα / Ο φάκελός μου</option><option>USB / Εργασίες</option></select></label><p><button id="save" class="primary">Save</button></p></div><p id="savemsg" class="feedback" aria-live="polite">${saved?'✓ Αποθηκεύτηκε στον φάκελο που επέλεξες (προσομοίωση).':''}</p></div></div>`;
if(page===4)html=`<div class="tag">05 / ΕΛΕΓΧΟΣ ΚΑΤΑΝΟΗΣΗΣ · 70″</div><h1>Το άνοιξες. Το αποθήκευσες;</h1>${quiz(2)}<p class="note">Θυμήσου: μπορούμε να ανοίξουμε ΚΑΙ να αποθηκεύσουμε ένα συνημμένο.</p>`;
if(page===5)html=`<div class="tag">06 / ΑΝΑΚΕΦΑΛΑΙΩΣΗ · 15″</div><h1>Θυμήσου τα βασικά</h1><div class="grid"><div class="card"><h2>Για να στείλω</h2><p>📎 Attach → επιλογή αρχείου → Open → έλεγχος → Send</p><h2>Για να κρατήσω</h2><p>Συνημμένο → Download / Save as → φάκελος → Save</p></div><div class="card"><h2>Τώρα δοκίμασε τις γνώσεις σου</h2><p>Απάντησε σε 5 σύντομες ερωτήσεις για CC, BCC και συνημμένα.</p><p>Θα δεις εξήγηση μετά από κάθε απάντηση και βαθμολογία στο τέλος.</p><button id="startquiz" class="primary">Έναρξη τελικού κουίζ →</button></div></div><p class="note">Πηγές: Σημειώσεις Α΄ Γυμνασίου, σ. 123–125 · Φύλλο εργασίας Α.5.2 Μ3, σ. 139–141. Προτεινόμενη συνολική διάρκεια: 5 λεπτά.</p>`;
if(page===6)html=finalQuiz();app.innerHTML='<section class="view">'+html+'</section>';document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===6;document.querySelector('#count').textContent=`${page+1} / 7 · ${times[page]} · συνολικά 5′`;document.querySelector('#progress').style.width=((page+1)/7*100)+'%';bind()}
function bind(){const start=document.querySelector("#startquiz");if(start)start.onclick=()=>{page=6;render()};document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>{finalAnswers[finalIndex]=+b.dataset.final;render()});const advance=document.querySelector('#quiznext');if(advance)advance.onclick=()=>{finalIndex++;render()};const retry=document.querySelector('#quizretry');if(retry)retry.onclick=()=>{finalIndex=0;finalAnswers.length=0;render()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,a=+b.dataset.a;answers[i]=a;if(a===questions[i][2])done[i]=true;render()});const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};on('paper',()=>document.querySelector('#picker').showModal());on('send',()=>{if(!attached){document.querySelector('#sendmsg').textContent='Λείπουν τα συνημμένα! Πάτησε πρώτα 📎 Attach.';return}sent=true;render()});on('open',()=>{opened=true;document.querySelector('#preview').classList.remove('hidden')});on('download',()=>document.querySelector('#savebox').classList.remove('hidden'));on('save',()=>{const f=document.querySelector('#folder').value;document.querySelector('#savemsg').textContent=f?'✓ Αποθηκεύτηκε: '+f+' / Πρόγραμμα.pdf (προσομοίωση)':'Επίλεξε πρώτα τον φάκελο αποθήκευσης.';if(f)saved=true});on('reset',()=>{Object.keys(done).forEach(k=>delete done[k]);Object.keys(answers).forEach(k=>delete answers[k]);files.clear();attached=sent=opened=saved=false;document.querySelectorAll('[data-file]').forEach(b=>b.classList.remove('chosen'));page=0;finalIndex=0;finalAnswers.length=0;render()})}
document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{const f=+b.dataset.file;files.has(f)?files.delete(f):files.add(f);b.classList.toggle('chosen',files.has(f));b.setAttribute('aria-pressed',files.has(f))});document.querySelector('#attach').onclick=()=>{if(files.size!==2){document.querySelector('#pickmsg').textContent='Χρειάζονται και τα δύο αρχεία. Επίλεξέ τα.';return}document.querySelector('#picker').close();const e=document.querySelector('#attached');e.innerHTML='<p>Επισύναψη αρχείων…</p><div class="upload"><i></i></div>';document.querySelector('#send').disabled=true;setTimeout(()=>{attached=true;if(page===2)render()},1350)};document.querySelector('#cancel').onclick=()=>document.querySelector('#picker').close();document.querySelector('#prev').onclick=()=>{if(page>0){page--;render()}};document.querySelector('#next').onclick=()=>{if(page<6){page++;render()}};document.querySelector('#mode').onclick=()=>{document.body.classList.toggle('board');document.querySelector('#mode').textContent=document.body.classList.contains('board')?'Ατομική προβολή':'Προβολή πίνακα'};document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.querySelector('#full').setAttribute('aria-label','Πλήρης οθόνη');document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||['SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&page<6){page++;render()}if(e.key==='ArrowLeft'&&page>0){page--;render()}});render();
</script></html>
