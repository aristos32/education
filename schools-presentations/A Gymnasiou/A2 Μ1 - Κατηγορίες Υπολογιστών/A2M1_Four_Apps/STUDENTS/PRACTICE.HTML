<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Α2 Μ1 · Εμπέδωση</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#213450;font:19px/1.45 'Segoe UI',Arial,sans-serif;min-height:100dvh}button,a.button{font:inherit;cursor:pointer;border:1px solid #b9c8d9;border-radius:10px;padding:10px 16px;background:white;color:#213450;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:default}.primary{background:#146f86!important;color:white!important;border-color:#146f86!important}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d9991a;outline-offset:3px}header{padding:9px 3vw;background:#213450;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}header a{color:white}header small{font-size:14px}.timer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 3vw;background:#dcecf2}.timer b{font-size:26px;font-variant-numeric:tabular-nums}.warn{background:#fff0bb}.expired{background:#f7ddd7}main{max-width:1220px;margin:0 auto;padding:18px 24px}.paper,.scenario,.question{padding:18px 22px;border-radius:16px;background:white;margin-bottom:12px}.scenario{background:#253d60;color:white}.question{background:#e3eafa;border-left:5px solid #6374c9}h1{font-size:clamp(26px,3.4vw,43px);line-height:1.2;margin:6px 0 18px}h2{font-size:clamp(21px,2.1vw,28px);line-height:1.25;margin:0 0 10px}h3{font-size:21px;margin:8px 0}p{margin:7px 0 12px}.label{font-size:14px;color:#376878;letter-spacing:.06em;margin-bottom:10px}.scenario .label{color:#bfd9ed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:white;border:1px solid #c9d7e6;border-radius:14px;padding:16px}.tile p{font-size:17px}.art{height:100px;display:flex;align-items:center;justify-content:center}.art svg{max-height:100%;width:130px}.options{display:grid;gap:10px}.option{display:flex;text-align:left;gap:14px;align-items:center;width:100%;padding:13px 16px}.letter{border:1px solid currentColor;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}.selected{border:2px solid #146f86;background:#edf7fa}.correct{color:#16703a!important;background:transparent!important;font-weight:400}.wrong{color:#ae2d28!important;background:transparent!important;font-weight:400}.feedback{padding:12px 16px;background:#e9effb;border-radius:10px;margin:10px 0}.notice{background:#fff1c5;border-left:5px solid #d2a23c;border-radius:10px;padding:13px 16px;margin:12px 0}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.muted{font-size:15px;color:#586a7d}.error{color:#ae2d28;font-weight:600}label{display:block;margin-top:10px;font-size:17px}input,textarea{font:inherit;width:100%;border:1px solid #b9c8d9;border-radius:9px;padding:9px;background:white;color:#213450}textarea{min-height:62px;resize:vertical}.answer-group{border:1px solid #c9d7e6;border-radius:12px;padding:12px;margin-bottom:12px}.answer-group h2{font-size:21px}.answer-group textarea{height:58px;min-height:58px}.record{padding:12px 0;border-bottom:1px solid #c9d7e6}.record p{font-size:17px}.next-stage{border-top:4px solid #146f86;margin-top:24px;padding-top:20px}.next-stage .button{font-size:23px;padding:15px 22px}.teacher main{min-height:calc(100dvh - 135px);display:flex;flex-direction:column}.teacher #content{flex:1}.key{background:#fff1c5;color:#594516;padding:12px;border-radius:10px}.teacher details{margin-top:12px}.mini-list{display:grid;gap:8px}.mini-list p{margin:0;padding:10px;border-radius:9px;background:#f0f5fb}.scenario .mini-list p{background:#345075}.intro main{min-height:calc(100dvh - 55px);display:flex;align-items:stretch}.intro .paper{flex:1;display:flex;flex-direction:column;justify-content:center}.intro .grid{align-items:center}.intro .art{height:200px}.intro .art svg{width:230px}.report-table{overflow-wrap:anywhere}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}main{padding:14px}header{flex-wrap:wrap}.foot{flex-wrap:wrap}.teacher main{min-height:0}.timer{flex-wrap:wrap}.art{height:76px}}</style></head><body class=""><header><span>Α2 Μ1 · Κατηγορίες Υπολογιστών</span><button id="full">⛶ Πλήρης οθόνη</button></header><aside class="timer" id="timer"><b id="clock">10:00</b><span id="timeStatus">Ο χρόνος αρχίζει με την Έναρξη.</span></aside><main id="app"></main><script>const app=document.getElementById('app');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function on(id,fn){if($(id))$(id).onclick=fn}function show(html){app.innerHTML=html;bind();window.scrollTo(0,0)}on('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const qs=[["🧭 Ποιο κριτήριο με βοηθά περισσότερο να κατατάξω έναν υπολογιστή;", ["Το χρώμα και η μάρκα του.", "Η εργασία που εκτελεί, οι δυνατότητές του και οι χρήστες που εξυπηρετεί.", "Μόνο το μέγεθος της οθόνης του."], 1, "Σκέψου τι χρειάζεται ο χρήστης και πώς λειτουργεί ο υπολογιστής.", "Εξετάζουμε επεξεργασία, αποθήκευση, χρήστες, αξιοπιστία και μεταφορά."], ["🌦️ Πολλές μονάδες επεξεργασίας λύνουν πολύπλοκες εξισώσεις πρόγνωσης καιρού. Ποια κατηγορία ταιριάζει;", ["Mainframe", "Personal Computer", "Supercomputer"], 2, "Το κύριο ζητούμενο είναι πολύπλοκοι υπολογισμοί σε μεγάλο όγκο δεδομένων.", "Ο Supercomputer είναι κατάλληλος για απαιτητική υπολογιστική επεξεργασία."], ["🏦 Ο κεντρικός υπολογιστής μιας τράπεζας επεξεργάζεται πολλές ταυτόχρονες συναλλαγές με συνεχή αξιόπιστη λειτουργία. Τι ταιριάζει;", ["Mainframe", "Laptop", "Tablet"], 0, "Δώσε έμφαση στους πολλούς χρήστες και στην αξιόπιστη κεντρική επεξεργασία.", "Ο Mainframe εξυπηρετεί πολλούς χρήστες και συναλλαγές με μεγάλη αξιοπιστία."], ["🖥️ Η Μαρία εργάζεται πάντα στο ίδιο γραφείο και θέλει ξεχωριστή οθόνη και πληκτρολόγιο. Τι ταιριάζει;", ["Smartphone", "Laptop", "Desktop"], 2, "Η μεταφορά δεν αποτελεί ανάγκη της Μαρίας.", "Ο Desktop προορίζεται για σταθερή θέση εργασίας."], ["🎒 Ο Πέτρος γράφει μεγάλες εργασίες στο σπίτι και στη βιβλιοθήκη. Χρειάζεται πληκτρολόγιο και μπαταρία. Τι επιλέγει;", ["Desktop", "Laptop / notebook", "Mainframe"], 1, "Χρειάζεται να μεταφέρει οθόνη, πληκτρολόγιο και μονάδα συστήματος μαζί.", "Ο Laptop συνδυάζει αυτά τα μέρη σε μία φορητή συσκευή με μπαταρία."], ["📱 Ο πατέρας θέλει συσκευή τσέπης με οθόνη αφής για σύντομα μηνύματα και επικοινωνία. Τι επιλέγει;", ["Smartphone", "Desktop", "Server"], 0, "Σκέψου τη συσκευή που μπορεί να κρατά στο χέρι.", "Το Smartphone συνδυάζει φορητό υπολογιστή χειρός και λειτουργίες τηλεφώνου."], ["👆 Η γιαγιά διαβάζει και κάνει βιντεοκλήσεις από τον καναπέ. Θέλει μεγαλύτερη οθόνη αφής από το κινητό, χωρίς μόνιμο πληκτρολόγιο. Τι ταιριάζει;", ["Mainframe", "Tablet", "Desktop"], 1, "Σκέψου μεγαλύτερη φορητή οθόνη αφής.", "Το Tablet εξυπηρετεί αυτή την ανάγκη φορητότητας και οθόνης αφής."], ["🌐 Ένας υπολογιστής στέλνει τις σελίδες της σχολικής ιστοσελίδας στους επισκέπτες της. Ποιος είναι ο ρόλος του;", ["Supercomputer", "Game console", "Server"], 2, "Προσφέρει μια συγκεκριμένη υπηρεσία σε άλλους υπολογιστές.", "Ο Server εξυπηρετεί άλλους υπολογιστές, εδώ παρέχοντας ιστοσελίδες."], ["🧺 Ένας μικρός υπολογιστής μέσα στο πλυντήριο ελέγχει το πρόγραμμα πλύσης. Πώς λέγεται;", ["Embedded computer", "Laptop", "Mainframe"], 0, "Βρίσκεται μέσα σε άλλη συσκευή και έχει συγκεκριμένο σκοπό.", "Ο Embedded computer ελέγχει λειτουργίες της συσκευής στην οποία είναι ενσωματωμένος."], ["🔗 Πολλοί συνδεδεμένοι υπολογιστές συνεργάζονται για μεγάλο υπολογιστικό έργο. Πώς ονομάζεται αυτή η ομάδα;", ["Palmtop", "Computer cluster", "Game console"], 1, "Η ισχύς προκύπτει από τη συνεργασία πολλών υπολογιστών.", "Ένα Computer cluster είναι συστάδα υπολογιστών που συνεργάζονται."]];let i=0,started=false,ended=false,expired=false,deadline=0,finish=0;const first={},attempts={},answers={},hints={};function report(){return qs.map((q,j)=>'<article class="record"><h3>'+(j+1)+'. '+q[0]+'</h3><p>Πρώτη απάντηση: '+(first[j]===undefined?'Δεν απαντήθηκε':esc(q[1][first[j]]))+'</p><p>Σωστή με την πρώτη: '+(first[j]===undefined?'—':first[j]===q[2]?'Ναι':'Όχι')+' · Προσπάθειες: '+(attempts[j]||0)+' · Υπόδειξη: '+(hints[j]?'Ναι':'Όχι')+'</p></article>').join('')}function render(){if(!started){show('<div class="paper"><h1>🧩 Εμπέδωση · 10 ερωτήσεις</h1><p>Διάλεξε τον κατάλληλο υπολογιστή με βάση τις ανάγκες κάθε χρήστη. Επιλέγεις μία σωστή απάντηση.</p><div class="notice"><b>📝 Τι καταγράφεται;</b><p>Καταγράφονται η πρώτη επιλογή σου, κάθε προσπάθεια και η χρήση υπόδειξης. Θα τα δεις στην τελική αναφορά. Μπορείς να ξαναδοκιμάσεις μέχρι να βρεις τη σωστή απάντηση.</p></div><p>⏱️ Έχεις 10΄. Προχωράς μόνο με σωστή απάντηση. Στη λήξη οι ερωτήσεις κλειδώνουν.</p><button id="begin" class="primary">Έναρξη →</button></div>');return}if(ended){show('<div class="paper"><h1>'+(expired?'⏰ Ο χρόνος ολοκληρώθηκε':'🎉 Ολοκλήρωσες την Εμπέδωση!')+'</h1><p>🎯 Σωστές με την πρώτη: '+qs.filter((q,j)=>first[j]===q[2]).length+' / 10</p><p>✅ Τελικά σωστές: '+qs.filter((q,j)=>answers[j]===q[2]).length+' / 10</p><p>🔁 Συνολικές προσπάθειες: '+Object.values(attempts).reduce((a,b)=>a+b,0)+'</p><details><summary>📊 Πρώτες απαντήσεις και προσπάθειες</summary>'+report()+'</details><div class="next-stage"><a class="button primary" href="ASSESSMENT.HTML">Συνέχεια στην Αξιολόγηση →</a></div></div>');return}const q=qs[i],ok=answers[i]===q[2];show('<div class="label">ΕΜΠΕΔΩΣΗ · '+(i+1)+' / 10</div><div class="question"><h1>'+q[0]+'</h1></div><div class="paper"><p>Επίλεξε <b>μία σωστή απάντηση</b> από τις τρεις επιλογές.</p><div class="options" role="group" aria-label="Επιλογές απάντησης">'+q[1].map((o,k)=>'<button id="c'+k+'" class="option '+(answers[i]===k?(ok?'correct':'wrong'):'')+'" '+(ok?'disabled':'')+'><span class="letter">'+String.fromCharCode(913+k)+'</span><span>'+(answers[i]===k?(ok?'✓ ':'✗ '):'')+o+'</span></button>').join('')+'</div><p><button id="hint">💡 Υπόδειξη</button></p>'+(hints[i]?'<div class="feedback">'+q[3]+'</div>':'')+(answers[i]!==undefined?'<p class="'+(ok?'correct':'wrong')+'">'+(ok?'✓ Σωστή απάντηση. '+q[4]:'✗ Δοκίμασε ξανά ή άνοιξε την υπόδειξη.')+'</p>':'')+'</div><div class="foot"><button id="prev" '+(i===0?'disabled':'')+'>← Πίσω</button><button id="next" class="primary" '+(!ok?'disabled':'')+'>'+(i===9?'Ολοκλήρωση':'Επόμενο →')+'</button></div>')}function timeout(){if(started&&!ended&&Date.now()>=deadline){ended=true;expired=true;finish=deadline;render()}return ended}function tick(){timeout();const left=started?Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000)):600;$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timer').className='timer'+(expired?' expired':started&&!ended&&left<=120?' warn':'');$('timeStatus').textContent=expired?'Η Εμπέδωση κλειδώθηκε.':ended?'Η Εμπέδωση ολοκληρώθηκε.':!started?'Ο χρόνος αρχίζει με την Έναρξη.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Εμπέδωση · 10΄'}function bind(){on('begin',()=>{started=true;deadline=Date.now()+600000;render();tick()});if(started&&!ended)qs[i][1].forEach((_,k)=>on('c'+k,()=>{if(timeout()||answers[i]===qs[i][2])return;if(first[i]===undefined)first[i]=k;attempts[i]=(attempts[i]||0)+1;answers[i]=k;render()}));on('hint',()=>{if(timeout())return;hints[i]=true;render()});on('prev',()=>{if(timeout()||i===0)return;i--;render()});on('next',()=>{if(timeout()||answers[i]!==qs[i][2])return;i++;if(i===qs.length){ended=true;finish=Date.now()}render();tick()})}setInterval(tick,250);render();</script></body></html>
