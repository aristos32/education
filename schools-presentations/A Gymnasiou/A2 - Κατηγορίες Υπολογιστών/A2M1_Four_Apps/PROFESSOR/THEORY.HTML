align-items:center}.intro .art{height:200px}.intro .art svg{width:230px}.report-table{overflow-wrap:anywhere}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}main{padding:14px}header{flex-wrap:wrap}.foot{flex-wrap:wrap}.teacher main{min-height:0}.timer{flex-wrap:wrap}.art{height:76px}}</style></head><body class="teacher"><header><a href="INDEX.HTML">⌂ Αρχικό Μενού</a><span>Α2 Μ1 · Θεωρία</span><button id="full">⛶</button></header><aside class="timer" id="timer"><b id="clock">10:00</b><span id="timeStatus">10΄ μαζί με συζήτηση</span><span><button id="toggle">Έναρξη</button> <button id="reset">Επαναφορά</button></span></aside><main id="app"></main><script>const app=document.getElementById('app');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function on(id,fn){if($(id))$(id).onclick=fn}function show(html){app.innerHTML=html;bind();window.scrollTo(0,0)}on('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const slides=[["Ποια ανάγκη εξυπηρετεί;", 75, "<div class=\"cards\"><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 16h40v82H8zM55 16h40v82H55zM102 16h40v82h-40zM16 30h24m-24 16h24m-24 16h24m23-32h24m-24 16h24m-24 16h24m23-32h24m-24 16h24m-24 16h24\"/></svg></div><h2>Supercomputer</h2><p>Πολύπλοκοι υπολογισμοί με τεράστιες ποσότητες δεδομένων.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"37\" y=\"8\" width=\"76\" height=\"94\" rx=\"6\"/><path d=\"M38 37h74M38 67h74M48 24h25m-25 29h25m-25 28h25\"/><circle cx=\"98\" cy=\"23\" r=\"3\"/><circle cx=\"98\" cy=\"53\" r=\"3\"/><circle cx=\"98\" cy=\"82\" r=\"3\"/></svg></div><h2>Mainframe</h2><p>Αξιόπιστη κεντρική επεξεργασία και αποθήκευση για πολλούς χρήστες ταυτόχρονα.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"12\" y=\"12\" width=\"92\" height=\"60\" rx=\"5\"/><path d=\"M45 74v15m-16 1h49\"/><rect x=\"112\" y=\"18\" width=\"26\" height=\"76\" rx=\"4\"/><path d=\"M120 30h10m-10 10h10\"/></svg></div><h2>Personal Computer</h2><p>Ατομική εργασία, συνήθως από έναν χρήστη κάθε στιγμή.</p></article></div><p class=\"key\">Επιλέγω με βάση την εργασία, τη μεταφορά, τους χρήστες και την αξιοπιστία.</p>"], ["Ίδιος χώρος, διαφορετική δουλειά", 120, "<div class=\"grid\"><div class=\"scenario\">🌦️ Ένα μετεωρολογικό κέντρο συγκεντρώνει δεδομένα από χιλιάδες σταθμούς. Χρειάζεται πολύπλοκους υπολογισμούς εγκαίρως για την αυριανή πρόγνωση.<p><b>Supercomputer</b> για απαιτητική επεξεργασία.</p><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 16h40v82H8zM55 16h40v82H55zM102 16h40v82h-40zM16 30h24m-24 16h24m-24 16h24m23-32h24m-24 16h24m-24 16h24m23-32h24m-24 16h24m-24 16h24\"/></svg></div></div><div class=\"paper\">🏦 Μια τράπεζα επεξεργάζεται ταυτόχρονα τις συναλλαγές πολλών καταστημάτων. Χρειάζεται αξιόπιστη συνεχή λειτουργία και κεντρική αποθήκευση.<p><b>Mainframe</b> για πολλές ταυτόχρονες συναλλαγές.</p><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"37\" y=\"8\" width=\"76\" height=\"94\" rx=\"6\"/><path d=\"M38 37h74M38 67h74M48 24h25m-25 29h25m-25 28h25\"/><circle cx=\"98\" cy=\"23\" r=\"3\"/><circle cx=\"98\" cy=\"53\" r=\"3\"/><circle cx=\"98\" cy=\"82\" r=\"3\"/></svg></div></div></div><details><summary>💬 Ερώτημα συζήτησης</summary><p>Ο μετεωρολόγος που γράφει απλώς το δελτίο χρειάζεται Supercomputer; Γιατί;</p></details>"], ["Personal Computers · πώς διαλέγω;", 150, "<div class=\"cards\"><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"12\" y=\"12\" width=\"92\" height=\"60\" rx=\"5\"/><path d=\"M45 74v15m-16 1h49\"/><rect x=\"112\" y=\"18\" width=\"26\" height=\"76\" rx=\"4\"/><path d=\"M120 30h10m-10 10h10\"/></svg></div><h2>Desktop</h2><p>Σταθερή θέση, ξεχωριστή οθόνη και πληκτρολόγιο. Κατάλληλος για σταθερό χώρο εργασίας.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M26 18h98v66H26zM10 86h130l-10 12H20z\"/><path d=\"M39 32h72v36H39z\"/></svg></div><h2>Laptop / notebook</h2><p>Μπαταρία και ενσωματωμένη οθόνη και πληκτρολόγιο. Για εργασία σε διαφορετικούς χώρους.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"48\" y=\"6\" width=\"54\" height=\"96\" rx=\"8\"/><path d=\"M58 23h34v57H58zM69 93h12\"/></svg></div><h2>Palmtop / Smartphone</h2><p>Μικρή συσκευή χειρός, οθόνη αφής και εύκολη μεταφορά. Για σύντομες εργασίες και επικοινωνία.</p></article></div><p>📱 Το <b>tablet</b> προσφέρει φορητότητα και μεγαλύτερη οθόνη αφής. Το <b>netbook</b> είναι μικρός φορητός υπολογιστής. Η <b>game console</b> έχει σχεδιαστεί κυρίως για παιχνίδια.</p><details><summary>💬 Ερώτημα συζήτησης</summary><p>Η Άννα γράφει μεγάλες εργασίες στη βιβλιοθήκη και στο σπίτι. Ποια χαρακτηριστικά χρειάζεται;</p></details>"], ["Υπηρεσίες και εξειδικευμένες εργασίες", 135, "<div class=\"cards\"><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"37\" y=\"8\" width=\"76\" height=\"94\" rx=\"6\"/><path d=\"M38 37h74M38 67h74M48 24h25m-25 29h25m-25 28h25\"/><circle cx=\"98\" cy=\"23\" r=\"3\"/><circle cx=\"98\" cy=\"53\" r=\"3\"/><circle cx=\"98\" cy=\"82\" r=\"3\"/></svg></div><h2>Server</h2><p>Προσφέρει συγκεκριμένη υπηρεσία σε άλλους υπολογιστές, όπως ιστοσελίδες ή email.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 16h40v82H8zM55 16h40v82H55zM102 16h40v82h-40zM16 30h24m-24 16h24m-24 16h24m23-32h24m-24 16h24m-24 16h24m23-32h24m-24 16h24m-24 16h24\"/></svg></div><h2>Computer cluster</h2><p>Συνδεδεμένοι υπολογιστές συνεργάζονται για επεξεργασία ή αποθήκευση.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"40\" y=\"24\" width=\"70\" height=\"62\" rx=\"7\"/><path d=\"M55 10v14m20-14v14m20-14v14M55 86v14m20-14v14m20-14v14M25 38h15m-15 18h15m-15 18h15m70-36h15m-15 18h15m-15 18h15M55 39h40v32H55z\"/></svg></div><h2>Embedded computer</h2><p>Ενσωματωμένος σε άλλη συσκευή, όπως πλυντήριο ή αυτοκίνητο, για συγκεκριμένες λειτουργίες.</p></article></div><p class=\"key\">Ο ρόλος έχει σημασία. Ένας Server εξυπηρετεί υπηρεσίες, ενώ ένας Desktop υπαλλήλου εξυπηρετεί την ατομική εργασία του.</p>"], ["Διάλεξε και αιτιολόγησε", 120, "<div class=\"grid\"><div class=\"scenario\"><p>🧑‍🎓 Ο Πέτρος γράφει εργασίες σε διαφορετικούς χώρους χωρίς πάντα διαθέσιμη πρίζα.</p><p>🏛️ Μια υπηρεσία επεξεργάζεται ταυτόχρονα χιλιάδες κεντρικές εγγραφές πολιτών.</p><p>🧺 Μια συσκευή ελέγχει αυτόματα το πρόγραμμα πλύσης.</p></div><div class=\"paper\"><h2>Ποιο κριτήριο σε οδηγεί;</h2><div class=\"mini-list\"><p>🔋 Μεταφορά και μπαταρία → Laptop</p><p>👥 Πολλοί χρήστες και αξιοπιστία → Mainframe</p><p>⚙️ Έλεγχος μέσα σε συσκευή → Embedded computer</p></div><p>Μπορώ να ονομάσω την κατηγορία και να εξηγήσω ποιο χαρακτηριστικό ταιριάζει στην ανάγκη.</p></div></div>"]];let i=0,left=600,running=false,deadline=0;function render(){show('<div id="content"><div class="label">ΘΕΩΡΙΑ · '+(i+1)+' / '+slides.length+' · '+slides[i][1]+'″</div><h1>'+slides[i][0]+'</h1>'+slides[i][2]+'</div><div class="foot"><button id="prev" '+(i===0?'disabled':'')+'>← Πίσω</button><button id="next" class="primary" '+(i===slides.length-1?'disabled':'')+'>Επόμενο →</button></div>')}function bind(){on('prev',()=>{i--;render()});on('next',()=>{i++;render()})}function tick(){if(running){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left)running=false}$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timer').className='timer'+(left===0?' expired':left<=120?' warn':'');$('timeStatus').textContent=left===0?'Ο χρόνος ολοκληρώθηκε.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Θεωρία και συζήτηση · 10΄';$('toggle').textContent=running?'Παύση':'Έναρξη / Συνέχεια'}on('toggle',()=>{if(running)left=Math.max(0,Math.ceil((deadline-Date.now())/1000));else deadline=Date.now()+left*1000;running=!running&&left>0;tick()});on('reset',()=>{left=600;running=false;tick()});document.addEventListener('keydown',e=>{if(e.target.closest('button,input,textarea,summary'))return;if(e.key==='ArrowRight'&&i<slides.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});setInterval(tick,250);render();</script></body></html>
