ilter((q,j)=>q.options&&answers[j]===q.correct).length}function report(){return '<p>Κατάσταση: '+(timedOut?'Λήξη χρόνου':'Ολοκλήρωση')+' · Πλήρως απαντημένες: '+qs.filter((_,j)=>complete(j)).length+'/4 · Πολλαπλής επιλογής: '+score()+'/3 σωστές.</p>'+qs.map((q,j)=>'<article><h2>Ερώτηση '+(j+1)+'</h2><p>'+esc(q.case)+'</p><p>'+esc(q.ask)+'</p><p>'+esc(answerText(j))+'</p><p>Υπόδειξη: '+(hints[j]?'Ναι':'Όχι')+'</p><p>Σχόλιο καθηγητή: ________________________</p></article>').join('')}function end(expired){if(submitted)return;capture();timedOut=expired;finish=expired?deadline:Date.now();submitted=true;stage='results';render();tick()}function check(){if(deadline&&!submitted&&Date.now()>=deadline)end(true);return submitted}function tick(){check();$('timer').hidden=stage==='extra'||stage==='extraResults';const left=deadline?Math.max(0,Math.ceil((deadline-(finish||Date.now()))/1000)):600;$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timer').className='timer'+(timedOut?' expired':deadline&&!submitted&&left<=120?' warn':'');$('timeStatus').textContent=timedOut?'Ο χρόνος έληξε. Αποθήκευσε όσα πρόλαβες.':submitted?'Η Αξιολόγηση ολοκληρώθηκε.':!deadline?'Ο χρόνος αρχίζει με την Έναρξη.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Αξιολόγηση · 10΄'}function render(){if(stage==='start'){show('<div class="paper"><h1>📝 Αξιολόγηση · 4 ερωτήσεις</h1><p>Τρεις ερωτήσεις πολλαπλής επιλογής και ένα σενάριο με τέσσερα σύντομα πεδία. Κάθε ερώτηση χρειάζεται απάντηση πριν συνεχίσεις.</p><div class="notice"><b>Σκέψου προσεκτικά πριν απαντήσεις.</b><p>Η σωστή απάντηση δεν εμφανίζεται κατά την Αξιολόγηση. Η επισήμανση δείχνει μόνο την επιλογή σου.</p></div><p>⏱️ Έχεις 10΄. Στη λήξη οι απαντήσεις κλειδώνουν και μεταφέρεσαι στην αποθήκευση με όσα έχεις γράψει.</p><label for="name">Ονοματεπώνυμο (υποχρεωτικό)</label><input id="name" autocomplete="name" required><label for="class">Τμήμα (υποχρεωτικό)</label><input id="class" required><p id="warning" class="error" role="alert"></p><button id="begin" class="primary">Έναρξη →</button></div>');return}if(stage==='question'){const q=qs[i];show('<div class="label">ΑΞΙΟΛΟΓΗΣΗ · '+(i+1)+' / 4</div><div class="grid"><article class="scenario"><p>'+q.case+'</p><p><b>'+q.ask+'</b></p></article><div class="paper">'+(q.options?'<p class="muted">Η σωστή απάντηση δεν εμφανίζεται εδώ. Επίλεξε μία από τις τέσσερις επιλογές.</p><div class="options" role="group" aria-label="Επιλογές απάντησης">'+q.options.map((o,k)=>'<button id="c'+k+'" aria-pressed="'+(answers[i]===k)+'" class="option '+(answers[i]===k?'selected':'')+'"><span class="letter">'+String.fromCharCode(913+k)+'</span>'+o+'</button>').join('')+'</div>':'<section class="answer-group"><h2>🎙️ Για την Άννα</h2><label for="part0">Ποιες συσκευές χρειάζεται για εισαγωγή και ακρόαση;</label><textarea id="part0">'+esc(parts[0])+'</textarea><label for="part1">Εξήγησε τον ρόλο κάθε επιλογής.</label><textarea id="part1">'+esc(parts[1])+'</textarea></section><section class="answer-group"><h2>💾 Για τον Νίκο</h2><label for="part2">Πού πρέπει να αποθηκεύσει το τελικό αρχείο;</label><textarea id="part2">'+esc(parts[2])+'</textarea><label for="part3">Γιατί δεν αρκεί να μείνει το αρχείο στη RAM;</label><textarea id="part3">'+esc(parts[3])+'</textarea></section>')+'<p><button id="hint">💡 Υπόδειξη</button></p>'+(hints[i]?'<div class="feedback">'+q.hint+'</div>':'')+'<p id="warning" class="error" role="alert"></p></div></div><div class="foot"><button id="prev" '+(i===0?'disabled':'')+'>← Πίσω</button><button id="done">Ολοκλήρωσα · Προς αποθήκευση</button><button id="next" class="primary">'+(i===3?'Έλεγχος απαντήσεων':'Επόμενο →')+'</button></div>');return}if(stage==='review'){show('<div class="paper"><h1>Έλεγξε τις απαντήσεις σου</h1><p>Έχεις απαντήσει και στις τέσσερις ερωτήσεις. Μπορείς να επιστρέψεις πριν ολοκληρώσεις.</p><button id="review">← Επιστροφή</button> <button id="submit" class="primary">Ολοκλήρωση</button></div>');return}if(stage==='results'){show('<div class="paper"><h1>📋 Τα αποτελέσματά σου</h1>'+(timedOut?'<div class="notice">⏰ Τα 10΄ ολοκληρώθηκαν. Οι απαντήσεις σου διατηρήθηκαν.</div>':'')+'<p><b>'+esc(student)+'</b> · '+esc(classroom)+'</p><p>Πλήρως απαντημένες: '+qs.filter((_,j)=>complete(j)).length+'/4 · Πολλαπλής επιλογής: '+score()+'/3 σωστές.</p><p>Το ανοικτό σενάριο θα αξιολογηθεί από τον καθηγητή.</p><button id="save" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="saveStatus" role="status"></p><details><summary>Οι απαντήσεις μου</summary>'+qs.map((q,j)=>'<article class="record"><p>'+esc(q.case)+'</p><p>'+esc(answerText(j))+'</p></article>').join('')+'</details><section class="next-stage"><h2>🚀 Επιπλέον Δραστηριότητες</h2><p>Αποθήκευσε την Αξιολόγηση. Αν τελείωσες νωρίς, συνέχισε σε τέσσερις πιο απαιτητικές αποστολές.</p><button id="extraStart" class="primary">Συνέχεια στις Επιπλέον Δραστηριότητες →</button></section></div>');return}if(stage==='extra'){if(!submitted)return;const x=extras[ex];show('<div class="label">ΕΠΙΠΛΕΟΝ ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ · '+(ex+1)+' / 4</div><div class="paper"><h1>'+x.title+'</h1><p>'+x.case+'</p><div class="question">'+x.task+'</div>'+x.labels.map((label,j)=>'<label for="extra'+j+'">'+label+'</label><textarea id="extra'+j+'">'+esc(extraAnswers[ex][j])+'</textarea>').join('')+'<p><button id="extraHint">💡 Καθοδήγηση</button></p>'+(extraHints[ex]?'<div class="feedback">'+x.hint+'</div>':'')+'<p id="warning" class="error" role="alert"></p></div><div class="foot"><button id="extraPrev" '+(ex===0?'disabled':'')+'>← Πίσω</button><button id="extraNext" class="primary">'+(ex===3?'Ολοκλήρωση':'Επόμενη αποστολή →')+'</button></div>');return}if(stage==='extraResults'){show('<div class="paper"><h1>🎉 Ολοκλήρωσες τις αποστολές</h1><p><b>'+esc(student)+'</b> · '+esc(classroom)+'</p><button id="saveExtra" class="primary">Αποθήκευση αποτελεσμάτων ως…</button><p id="extraStatus" role="status"></p><p>Το Word αποθηκεύεται χωριστά από την εφαρμογή Word.</p><button id="extraReview">Επιστροφή στις αποστολές</button></div>')}}function bind(){on('begin',()=>{student=$('name').value.trim();classroom=$('class').value.trim();if(!student||!classroom){$('warning').textContent='Συμπλήρωσε ονοματεπώνυμο και τμήμα.';(!student?$('name'):$('class')).focus();return}deadline=Date.now()+600000;stage='question';render();tick()});if(stage==='question'&&qs[i].options)qs[i].options.forEach((_,k)=>on('c'+k,()=>{if(check())return;answers[i]=k;render()}));parts.forEach((_,j)=>{if($('part'+j))$('part'+j).oninput=()=>{capture();check()}});on('hint',()=>{if(check())return;capture();hints[i]=true;render()});on('prev',()=>{if(check()||i===0)return;capture();i--;render()});on('next',()=>{if(check())return;capture();if(!complete(i)){$('warning').textContent=qs[i].options?'Επίλεξε μία απάντηση για να συνεχίσεις.':'Συμπλήρωσε και τα τέσσερα πεδία για να συνεχίσεις.';return}if(i===3)stage='review';else i++;render()});on('done',()=>end(false));on('review',()=>{if(check())return;i=0;stage='question';render()});on('submit',()=>{if(check()||!qs.every((_,j)=>complete(j)))return;end(false)});on('save',()=>saveReport('Α2 Μ2 · Αξιολόγηση',report(),'Assessment','saveStatus'));on('extraStart',()=>{if(!submitted)return;stage='extra';render();tick()});on('extraHint',()=>{capture();extraHints[ex]=true;render()});on('extraPrev',()=>{capture();if(ex>0)ex--;render()});on('extraNext',()=>{capture();if(!extraAnswers[ex].every(v=>v.trim())){$('warning').textContent='Συμπλήρωσε όλα τα πεδία για να συνεχίσεις.';return}if(ex===3)stage='extraResults';else ex++;render()});on('saveExtra',()=>saveReport('Α2 Μ2 · Επιπλέον Δραστηριότητες',extras.map((x,j)=>'<article><h2>'+esc(x.title)+'</h2><p>'+esc(x.task)+'</p>'+x.labels.map((label,k)=>'<p>'+esc(label)+': '+esc(extraAnswers[j][k])+'</p>').join('')+'</article>').join(''),'Extra','extraStatus'));on('extraReview',()=>{ex=0;stage='extra';render()})}setInterval(tick,250);render();</script></body></html>
