<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Α2 Μ2 · Θεωρία</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#213450;font:19px/1.45 'Segoe UI',Arial,sans-serif;min-height:100dvh}button,a.button{font:inherit;cursor:pointer;border:1px solid #b9c8d9;border-radius:10px;padding:10px 16px;background:white;color:#213450;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:default}.primary{background:#146f86!important;color:white!important;border-color:#146f86!important}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d9991a;outline-offset:3px}header{padding:9px 3vw;background:#213450;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}header a{color:white}header small{font-size:14px}.timer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 3vw;background:#dcecf2}.timer b{font-size:26px;font-variant-numeric:tabular-nums}.warn{background:#fff0bb}.expired{background:#f7ddd7}main{max-width:1220px;margin:0 auto;padding:18px 24px}.paper,.scenario,.question{padding:18px 22px;border-radius:16px;background:white;margin-bottom:12px}.scenario{background:#253d60;color:white}.question{background:#e3eafa;border-left:5px solid #6374c9}h1{font-size:clamp(26px,3.4vw,43px);line-height:1.2;margin:6px 0 18px}h2{font-size:clamp(21px,2.1vw,28px);line-height:1.25;margin:0 0 10px}h3{font-size:21px;margin:8px 0}p{margin:7px 0 12px}.label{font-size:14px;color:#376878;letter-spacing:.06em;margin-bottom:10px}.scenario svg{stroke:#a6dfeb}.scenario .label{color:#bfd9ed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:white;border:1px solid #c9d7e6;border-radius:14px;padding:16px}.tile p{font-size:17px}.art{height:100px;display:flex;align-items:center;justify-content:center}.art svg{max-height:100%;width:130px}.options{display:grid;gap:10px}.option{display:flex;text-align:left;gap:14px;align-items:center;width:100%;padding:13px 16px}.letter{border:1px solid currentColor;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}.selected{border:2px solid #146f86;background:#edf7fa}.correct{color:#16703a!important;background:transparent!important;font-weight:400}.wrong{color:#ae2d28!important;background:transparent!important;font-weight:400}.feedback{padding:12px 16px;background:#e9effb;border-radius:10px;margin:10px 0}.notice{background:#fff1c5;border-left:5px solid #d2a23c;border-radius:10px;padding:13px 16px;margin:12px 0}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.muted{font-size:15px;color:#586a7d}.error{color:#ae2d28;font-weight:600}label{display:block;margin-top:10px;font-size:17px}input,textarea{font:inherit;width:100%;border:1px solid #b9c8d9;border-radius:9px;padding:9px;background:white;color:#213450}textarea{min-height:62px;resize:vertical}.answer-group{border:1px solid #c9d7e6;border-radius:12px;padding:12px;margin-bottom:12px}.answer-group h2{font-size:21px}.answer-group textarea{height:58px;min-height:58px}.record{padding:12px 0;border-bottom:1px solid #c9d7e6}.record p{font-size:17px}.next-stage{border-top:4px solid #146f86;margin-top:24px;padding-top:20px}.next-stage .button{font-size:23px;padding:15px 22px}.teacher main{min-height:calc(100dvh - 135px);display:flex;flex-direction:column}.teacher #content{flex:1}.key{background:#fff1c5;color:#594516;padding:12px;border-radius:10px}.teacher details{margin-top:12px}.mini-list{display:grid;gap:8px}.mini-list p{margin:0;padding:10px;border-radius:9px;background:#f0f5fb}.scenario .mini-list p{background:#345075}.intro main{min-height:calc(100dvh - 55px);display:flex;align-items:stretch}.intro .paper{flex:1;display:flex;flex-direction:column;justify-content:center}.intro .grid{align-items:center}.intro .art{height:200px}.intro .art svg{width:230px}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#app{animation:arrive .3s ease}@media(prefers-reduced-motion:reduce){#app{animation:none}}.report-table{overflow-wrap:anywhere}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}main{padding:14px}header{flex-wrap:wrap}.foot{flex-wrap:wrap}.teacher main{min-height:0}.timer{flex-wrap:wrap}.art{height:76px}}</style></head><body class="teacher"><header><a href="INDEX.HTML">⌂ Αρχικό Μενού</a><span>Α2 Μ2 · Θεωρία</span><button id="full">⛶</button></header><aside class="timer" id="timer"><b id="clock">10:00</b><span id="timeStatus">10΄ μαζί με συζήτηση</span><span><button id="toggle">Έναρξη</button> <button id="reset">Επαναφορά</button></span></aside><main id="app"></main><script>const app=document.getElementById('app');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function on(id,fn){if($(id))$(id).onclick=fn}function show(html){app.innerHTML=html;bind();window.scrollTo(0,0)}on('full',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});const slides=[["Hardware και Software · συνεργάζονται", 80, "<div class=\"grid\"><article class=\"paper\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"12\" y=\"12\" width=\"92\" height=\"60\" rx=\"5\"/><path d=\"M45 74v15m-16 1h49\"/><rect x=\"112\" y=\"18\" width=\"26\" height=\"76\" rx=\"4\"/><path d=\"M120 30h10m-10 10h10\"/></svg></div><h2>🧩 Hardware</h2><p>Όλα τα φυσικά εξαρτήματα και οι συσκευές, μέσα και έξω από τον υπολογιστή.</p><p>Keyboard, Monitor, CPU, RAM.</p></article><article class=\"paper\"><h2>💻 Software</h2><p>Τα προγράμματα που δίνουν οδηγίες στο Hardware.</p><p>Word, Paint, Windows.</p><div class=\"notice\">Το εικονίδιο του Word φαίνεται στην οθόνη· το πρόγραμμα παραμένει Software.</div></article></div><details><summary>💬 Συζήτηση</summary>Αγγίζω την οθόνη όπου φαίνεται το Paint. Αγγίζω το πρόγραμμα ή μια συσκευή;</details>"], ["Οι τρεις κύριες μονάδες", 120, "<div class=\"cards\"><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"40\" y=\"24\" width=\"70\" height=\"62\" rx=\"7\"/><path d=\"M55 10v14m20-14v14m20-14v14M55 86v14m20-14v14m20-14v14M25 38h15m-15 18h15m-15 18h15m70-36h15m-15 18h15m-15 18h15M55 39h40v32H55z\"/></svg></div><h2>CPU · ΚΜΕ</h2><p>Εκτελεί τις εντολές του προγράμματος και επεξεργάζεται δεδομένα.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8\" y=\"25\" width=\"134\" height=\"54\" rx=\"4\"/><path d=\"M20 36h22v28H20zM53 36h22v28H53zM86 36h22v28H86zM18 79v13m15-13v13m15-13v13m15-13v13m15-13v13m15-13v13m15-13v13m15-13v13\"/></svg></div><h2>RAM · Κύρια Μνήμη</h2><p>Κρατά προσωρινά δεδομένα και εντολές κατά την εκτέλεση. Το περιεχόμενό της χάνεται χωρίς ρεύμα.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"40\" y=\"24\" width=\"70\" height=\"62\" rx=\"7\"/><path d=\"M55 10v14m20-14v14m20-14v14M55 86v14m20-14v14m20-14v14M25 38h15m-15 18h15m-15 18h15m70-36h15m-15 18h15m-15 18h15M55 39h40v32H55z\"/></svg></div><h2>I/O Unit</h2><p>Συνδέει τις περιφερειακές μονάδες και μεσολαβεί στην επικοινωνία τους με την CPU.</p></article></div><p class=\"key\">Η CPU είναι εξάρτημα, όχι ολόκληρος ο «πύργος». Η RAM δεν διατηρεί μόνιμα τα αρχεία.</p>"], ["Περιφερειακά · ποια κατεύθυνση έχουν τα δεδομένα;", 140, "<div class=\"cards\"><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"8\" y=\"30\" width=\"134\" height=\"58\" rx=\"7\"/><path d=\"M20 44h110M20 58h110M35 72h80M30 35v24m20-24v24m20-24v24m20-24v24m20-24v24\"/></svg></div><h2>Είσοδος → υπολογιστής</h2><p>Keyboard: κείμενο · Mouse: κινήσεις/κλικ · Scanner: έγγραφο · Microphone: ήχος · Web Camera: βίντεο.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M36 37V8h78v29M25 40h100v42h-15M36 82H25M40 65h70v38H40zM51 79h48m-48 12h48\"/></svg></div><h2>Έξοδος → περιβάλλον</h2><p>Monitor: εικόνα · Printer: χαρτί · Speakers: ήχος.</p></article><article class=\"tile\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M54 8h42v31H54zM45 39h60v61H45zM64 17v12m22-12v12M62 57h26\"/></svg></div><h2>Αποθήκευση → ανάκληση</h2><p>Hard Disk, USB Flash Drive, CD/DVD: κρατούν πληροφορίες για αργότερα. Τα CD/DVD χρειάζονται κατάλληλο Drive.</p></article></div><p class=\"key\">Κατατάσσω με βάση τη λειτουργία. Ένας εσωτερικός Hard Disk παραμένει περιφερειακή μονάδα αποθήκευσης.</p>"], ["Μία συσκευή, περισσότεροι ρόλοι", 110, "<div class=\"grid\"><article class=\"scenario\"><div class=\"art\"><svg viewBox=\"0 0 150 110\" fill=\"none\" stroke=\"#357e9a\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"28\" y=\"8\" width=\"94\" height=\"92\" rx=\"8\"/><path d=\"M40 21h70v62H40zM70 92h10\"/></svg></div><p>👆 Η Μαρία αγγίζει έναν αριθμό στην οθόνη αφής του μηχανήματος εισιτηρίων.</p><p>🎟️ Η ίδια οθόνη εμφανίζει το εισιτήριο που επέλεξε.</p></article><article class=\"paper\"><h2>Οθόνη αφής</h2><p>Το άγγιγμα στέλνει δεδομένα: <b>είσοδος</b>.</p><p>Η εμφάνιση πληροφοριών: <b>έξοδος</b>.</p><div class=\"notice\">Η οθόνη αφής είναι συσκευή εισόδου–εξόδου. Δεν είναι η κύρια μονάδα I/O Unit.</div><p>🖨️ Σε ένα πολυμηχάνημα ξεχωρίζουμε Scanner (είσοδος) και Printer (έξοδος).</p></article></div>"], ["Από τη φωνή στο αποθηκευμένο αρχείο", 150, "<div class=\"grid\"><article class=\"scenario\"><p>🎙️ Ο Νίκος ηχογραφεί μια σχολική ανακοίνωση.</p><p>⚙️ Το πρόγραμμα επεξεργάζεται τον ήχο.</p><p>💾 Πατά «Αποθήκευση» στον Hard Disk.</p><p>🔊 Ακούει την ανακοίνωση από τα Speakers.</p></article><article class=\"paper\"><h2>Σύνδεσε λειτουργία και μονάδα</h2><div class=\"mini-list\"><p>Είσοδος → Microphone</p><p>Επεξεργασία → CPU, με προσωρινά δεδομένα στη RAM</p><p>Αποθήκευση → Hard Disk</p><p>Έξοδος → Speakers</p></div><details><summary>💬 Αν διακοπεί το ρεύμα;</summary>Τα δεδομένα της RAM χάνονται. Το αρχείο που αποθηκεύτηκε επιτυχώς στον Hard Disk παραμένει.</details></article></div>"]];let i=0,left=600,running=false,deadline=0;function render(){show('<div id="content"><div class="label">ΘΕΩΡΙΑ · '+(i+1)+' / '+slides.length+' · '+slides[i][1]+'″</div><h1>'+slides[i][0]+'</h1>'+slides[i][2]+'</div><div class="foot"><button id="prev" '+(i===0?'disabled':'')+'>← Πίσω</button><button id="next" class="primary" '+(i===slides.length-1?'disabled':'')+'>Επόμενο →</button></div>')}function bind(){on('prev',()=>{i--;render()});on('next',()=>{i++;render()})}function tick(){if(running){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left)running=false}$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timer').className='timer'+(left===0?' expired':left<=120?' warn':'');$('timeStatus').textContent=left===0?'Ο χρόνος ολοκληρώθηκε.':left<=60?'Απομένει έως 1 λεπτό.':left<=120?'Απομένουν έως 2 λεπτά.':'Θεωρία και συζήτηση · 10΄';$('toggle').textContent=running?'Παύση':'Έναρξη / Συνέχεια'}on('toggle',()=>{if(running)left=Math.max(0,Math.ceil((deadline-Date.now())/1000));else deadline=Date.now()+left*1000;running=!running&&left>0;tick()});on('reset',()=>{left=600;running=false;tick()});document.addEventListener('keydown',e=>{if(e.target.closest('button,input,textarea,summary'))return;if(e.key==='ArrowRight'&&i<slides.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});setInterval(tick,250);render();</script></body></html>
