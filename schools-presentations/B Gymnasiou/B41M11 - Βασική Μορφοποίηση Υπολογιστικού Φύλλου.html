const titles=['Αρχή','Γραμματοσειρά','B · I · U','Χρώματα','Μορφές αριθμών','Format Painter','Έλεγχος'];const times=['1΄','1΄','1½΄','1΄','2΄','1΄','2½΄'];let page=0,answered={},first={},states={};
const questions=[['Τι κάνουμε πριν εφαρμόσουμε μορφοποίηση;',['Επιλέγουμε τα κελιά.','Αποθηκεύουμε πάντα νέο αρχείο.','Αλλάζουμε το περιεχόμενο.'],0,'Πρώτα επιλέγουμε το κελί ή την περιοχή και μετά εφαρμόζουμε μορφοποίηση.'],['Ποια επιλογή μεγαλώνει τα γράμματα;',['Font Color','Font Size','Number Format'],1,'Το Font Size ορίζει το μέγεθος σε στιγμές (pt).'],['Θέλουμε έντονα και πλάγια γράμματα. Επιλέγουμε…',['μόνο U','μόνο B','B και I'],2,'Μπορούμε να συνδυάσουμε Bold και Italic.'],['Ποια εντολή χρωματίζει το φόντο του κελιού;',['Font Color','Fill Color','Font Size'],1,'Fill Color: φόντο. Font Color: γράμματα.'],['Το κελί περιέχει 0,25. Με Percent Style εμφανίζεται…',['0,25%','25%','250%'],1,'Το 0,25 αντιστοιχεί στο 25%. Η υποκείμενη τιμή παραμένει 0,25.'],['Το A1 γράφει «Τίτλος» και το A3 «Σύνολο». Με Format Painter από A1 σε A3…',['το A3 γράφει «Τίτλος».','αντιγράφεται μόνο το κείμενο.','το «Σύνολο» παίρνει τη μορφοποίηση του A1.'],2,'Το Format Painter αντιγράφει μορφοποίηση, όχι το περιεχόμενο.']];
function quiz(n){let q=questions[n];return `<div class="question"><span class="pill">Σκέψου & απάντησε</span><p><b>${q[0]}</b></p><div class="answers">${q[1].map((a,i)=>`<button onclick="answer(${n},${i},this)">${a}</button>`).join('')}</div><div class="feedback" id="f${n}" aria-live="polite"></div></div>`}
function answer(n,i,b){if(first[n]===undefined)first[n]=i;let ok=i===questions[n][2];b.classList.add(ok?'correct':'wrong');document.getElementById('f'+n).textContent=ok?'✓ '+questions[n][3]:'Δοκίμασε ξανά. '+(n===4?'Σκέψου: 0,25 = 25/100.':'Διάβασε το παράδειγμα πιο πάνω.');if(ok)answered[n]=true;}
function table(content){return `<table class="sheet"><tr><th></th><th>A</th><th>B</th></tr>${content}</table>`}
function render(){document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${i+1}. ${t}</button>`).join('');let body='';
if(page===0)body=`<div class="layout"><div><p>Το σχολικό κυλικείο χρειάζεται έναν ευανάγνωστο τιμοκατάλογο. Θα αλλάξουμε την <b>εμφάνιση</b> των δεδομένων του.</p><div class="note"><b>Η βασική σειρά:</b><br>1. Επιλέγω κελί ή περιοχή.<br>2. Home → κατάλληλη ομάδα.<br>3. Εφαρμόζω μορφοποίηση.</div><p class="muted">7 ενότητες · συνολικά 10΄ μαζί με τις ερωτήσεις. Προχώρα με τα κουμπιά ή τα βέλη ← →. Στον πίνακα απαντά η τάξη· ατομικά απαντάς εσύ.</p>${quiz(0)}</div><div class="panel"><span class="eyebrow">Η ΑΠΟΣΤΟΛΗ ΜΑΣ</span>${table('<tr><th>1</th><td id="hero">Κυλικείο</td><td>Τιμή</td></tr><tr><th>2</th><td>Χυμός</td><td>1,5</td></tr><tr><th>3</th><td>Νερό</td><td>0,5</td></tr>')}<p><button class="primary" onclick="hero()">▶ Δες τη μεταμόρφωση</button></p><p class="muted">Ίδια δεδομένα, πιο καθαρή παρουσίαση.</p></div></div>`;
if(page===1)body=`<div class="layout"><div><p><b>Home → Font</b></p><p>Το <b>Font</b> αλλάζει το σχέδιο των γραμμάτων. Το <b>Font Size</b> αλλάζει το μέγεθός τους, σε <b>pt</b>.</p><div class="note">Παράδειγμα του φύλλου εργασίας: Comic Sans MS, 16 pt.</div>${quiz(1)}</div><div class="panel"><span class="pill">Προσομοίωση · επιλεγμένο A1</span><div class="ribbon"><label>Font <select onchange="document.getElementById('fontcell').style.fontFamily=this.value"><option>Arial</option><option>Georgia</option><option>Comic Sans MS</option></select></label><label>Size <select onchange="document.getElementById('fontcell').style.fontSize=this.value+'pt'"><option>12</option><option>16</option><option>24</option><option>32</option></select></label></div>${table('<tr><th>1</th><td colspan="2" class="sel sample" id="fontcell">Κυλικείο</td></tr>')}<p class="muted">Άλλαξε πρώτα Font και μετά Font Size. Μια γραμματοσειρά εμφανίζεται αν είναι εγκατεστημένη στη συσκευή.</p></div></div>`;
if(page===2)body=`<div class="layout"><div><p><b>Bold (B)</b> → έντονα · <b>Italic (I)</b> → πλάγια · <b>Underline (U)</b> → υπογράμμιση.</p><p>Για <b>Double Underline</b> ανοίγουμε το βελάκι δίπλα στο U. Επιλέγουμε απλή <em>ή</em> διπλή υπογράμμιση.</p><div class="note">Ctrl+B · Ctrl+I · Ctrl+U<br>Πατάμε ξανά για να αφαιρέσουμε την αντίστοιχη μορφοποίηση.</div>${quiz(2)}</div><div class="panel"><div class="ribbon"><button onclick="toggle('fontWeight','bold','normal')"><b>B</b> Bold</button><button onclick="toggle('fontStyle','italic','normal')"><i>I</i> Italic</button><select aria-label="Υπογράμμιση" onchange="under(this.value)"><option value="none">Χωρίς υπογράμμιση</option><option value="solid">U · απλή</option><option value="double">U · διπλή</option></select></div>${table('<tr><th>1</th><td colspan="2" id="styled" class="sel sample">Προσφορά ημέρας</td></tr>')}<p class="muted">Δοκίμασε συνδυασμό B + I + διπλή υπογράμμιση.</p></div></div>`;
if(page===3)body=`<div class="layout"><div><p><b>Font Color</b> αλλάζει το χρώμα των γραμμάτων. <b>Fill Color</b> αλλάζει το φόντο του κελιού.</p><p>Στο Excel, από το βελάκι του Font Color → <b>More Colors…</b> βρίσκουμε περισσότερα ή δημιουργούμε δικό μας χρώμα.</p><div class="note">Κράτησε έντονη αντίθεση για να διαβάζεται εύκολα το κείμενο.</div>${quiz(3)}</div><div class="panel"><div class="ribbon"><button onclick="color('color','#1749af')">A · Font Color: μπλε</button><button onclick="color('backgroundColor','#ffe88c')">▰ Fill Color: κίτρινο</button><button onclick="color('color','#162e39');color('backgroundColor','#fff')">Επαναφορά</button></div>${table('<tr><th>1</th><td colspan="2" class="sel sample" id="colors">Χυμός πορτοκάλι</td></tr>')}</div></div>`;
if(page===4)body=`<div class="layout"><div><p><b>Home → Number</b>: επιλέγουμε τον κατάλληλο τρόπο εμφάνισης.</p><p>Ποσά: <b>Currency / Accounting</b> (€ ή £). Ποσοστά: <b>Percent Style</b>. Ημερομηνίες: <b>Date</b>.</p><p><b>Increase / Decrease Decimal</b>: περισσότερα ή λιγότερα δεκαδικά ψηφία. Το διαχωριστικό χιλιάδων διευκολύνει την ανάγνωση.</p><div class="note">Η μορφοποίηση αλλάζει την εμφάνιση, όχι την αποθηκευμένη τιμή. Το 1,236 μπορεί να εμφανιστεί 1,24.</div>${quiz(4)}</div><div class="panel"><span class="pill">Πάτησε κάθε μορφή</span><div class="ribbon"><button onclick="num('money')">€ Ποσό</button><button onclick="num('pound')">£ Ποσό</button><button onclick="num('percent')">% Ποσοστό</button><button onclick="num('dec')">3 δεκαδικά</button><button onclick="num('thousand')">Χιλιάδες</button><button onclick="num('date')">Ημερομηνία</button></div><div class="format" aria-live="polite"><span id="raw">Αποθηκευμένη τιμή: 1,5</span><div class="big" id="formatted">1,50 €</div><div id="numhint">Currency · δύο δεκαδικά ψηφία</div></div><p class="muted">Κάθε κουμπί δείχνει διαφορετικό παράδειγμα. Για μήνα με αγγλικό όνομα επιλέγουμε κατάλληλη μορφή και τοπική ρύθμιση.</p></div></div>`;
if(page===5)body=`<div class="layout"><div><p>Το <b>Format Painter</b> μεταφέρει τη μορφοποίηση σε άλλο κελί.</p><div class="note">1. Επιλέγω το κελί πηγής A1.<br>2. Home → Clipboard → Format Painter.<br>3. Πατώ το κελί προορισμού A3.</div><p>Το κείμενο του A3 παραμένει «Σύνολο».</p>${quiz(5)}</div><div class="panel"><div class="ribbon"><button onclick="paint(1)">1. Επιλογή A1</button><button onclick="paint(2)">2. Format Painter</button><button onclick="paint(3)">3. Κλικ A3</button><button onclick="render()">Επαναφορά</button></div>${table('<tr><th>1</th><td id="src" style="font-weight:bold;color:#1749af;text-decoration:underline double;font-size:25px">Τίτλος</td><td></td></tr><tr><th>2</th><td></td><td></td></tr><tr><th>3</th><td id="dest">Σύνολο</td><td></td></tr>')}<p id="paintmsg" aria-live="polite">Ακολούθησε τα τρία βήματα.</p></div></div>`;
if(page===6){let score=Object.keys(first).filter(k=>first[k]===questions[k][2]).length;body=`<p>Λύσε τις 3 τελικές ασκήσεις. Πάτησε <b>Έλεγχος</b> και μετά <b>Επόμενη άσκηση →</b>. Μπορείς να επιστρέψεις στις προηγούμενες.</p><div id="finaltasks"></div><details class="panel"><summary>Αποτελέσματα των ερωτήσεων του μαθήματος</summary><p>${Object.keys(answered).length}/6 λύθηκαν σωστά · ${score}/6 σωστές στην πρώτη προσπάθεια.</p><button onclick="go(0)">Επιστροφή στο μάθημα</button></details>`;}
const groups={1:[['font','Font · γραμματοσειρά'],['size','Font Size · μέγεθος']],2:[['bold','Bold · έντονα'],['italic','Italic · πλάγια'],['under','Underline · υπογράμμιση']],3:[['fontcolor','Font Color · γράμματα'],['fill','Fill Color · φόντο']],4:[['number','Number Format · αριθμοί / ημερομηνίες'],['currency','Accounting Number Format · νόμισμα'],['percent','Percent Style · ποσοστό'],['comma','Comma Style · χιλιάδες'],['decimal','Increase / Decrease Decimal']],5:[['paint','Clipboard → Format Painter']]};if(groups[page])body+=shotGroup(groups[page]);
document.getElementById('main').innerHTML=`<div class="step"><span class="eyebrow">ΜΑΘΗΜΑ 10΄ · ΕΝΟΤΗΤΑ ${page+1}/7 · ${times[page]}</span><h1>${['Ίδια δεδομένα. Καλύτερη εμφάνιση.','Δώσε χαρακτήρα στα γράμματα.','Τόνισε ό,τι έχει σημασία.','Γράμματα ή φόντο;','Ο ίδιος αριθμός, άλλη εμφάνιση.','Αντίγραψε το στυλ.','Η σειρά σου!'][page]}</h1>${body}</div><div class="bottom"><button onclick="go(page-1)" ${page===0?'disabled':''}>← Πίσω</button><span class="muted">${page+1} / 7</span><button class="primary" onclick="go(page+1)" ${page===6?'hidden':''}>Επόμενη ενότητα →</button></div><progress value="${page+1}" max="7" aria-label="Πρόοδος μαθήματος"></progress>`;states.paint=0;if(page===6)renderTask();for(let n=0;n<6;n++)if(answered[n]&&document.getElementById('f'+n))document.getElementById('f'+n).textContent='✓ Έχεις ήδη απαντήσει σωστά. Μπορείς να δοκιμάσεις ξανά.';}
function go(i){page=Math.max(0,Math.min(6,i));render();window.scrollTo(0,0)}function hero(){let t=document.getElementById('hero').closest('table');t.rows[1].cells[1].style.cssText='color:#087e68;font-weight:bold;font-size:26px';t.rows[1].cells[2].style.fontWeight='bold';t.rows[2].cells[2].textContent='1,50 €';t.rows[3].cells[2].textContent='0,50 €';t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse')}
function toggle(p,v,off){let e=document.getElementById('styled');e.style[p]=e.style[p]===v?off:v}function under(v){let e=document.getElementById('styled');e.style.textDecorationLine=v==='none'?'none':'underline';e.style.textDecorationStyle=v==='none'?'solid':v}function color(p,v){document.getElementById('colors').style[p]=v}
function num(k){let data={money:['1,5','1,50 €','Currency · δύο δεκαδικά'],pound:['1,5','£1,50','Currency · σύμβολο λίρας'],percent:['0,25','25%','Percent Style · 0,25 = 25/100'],dec:['1,5','1,500','Number · τρία δεκαδικά ψηφία'],thousand:['12345','12.345','Number · διαχωριστικό χιλιάδων, χωρίς δεκαδικά'],date:['ημερομηνία 31 Μαρτίου 2021','31/3/21','Date · εναλλακτική εμφάνιση: 31 March 2021']}[k];document.getElementById('raw').textContent='Αποθηκευμένη τιμή: '+data[0];document.getElementById('formatted').textContent=data[1];document.getElementById('numhint').textContent=data[2];let e=document.getElementById('formatted');e.animate([{opacity:.1,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:450});}
function paint(n){let m=document.getElementById('paintmsg');if(n===1){states.paint=1;document.getElementById('src').classList.add('sel');m.textContent='A1 επιλεγμένο. Τώρα πάτησε Format Painter.'}else if(n===2&&states.paint===1){states.paint=2;m.textContent='Το πινέλο είναι έτοιμο. Πάτησε A3.'}else if(n===3&&states.paint===2){document.getElementById('dest').style.cssText=document.getElementById('src').style.cssText;document.getElementById('dest').classList.add('pulse');m.textContent='✓ Αντιγράφηκε η μορφοποίηση. Το «Σύνολο» παραμένει ίδιο.';states.paint=3}else m.textContent='Ξεκίνα με την επιλογή A1 και ακολούθησε τη σειρά 1 → 2 → 3.'}
let taskIndex=0;const tasks=[{bold:false,color:'black',size:12,done:false},{fill:'white',done:false},{format:'',done:false}];
function renderTask(){let t=tasks[taskIndex],content='';
if(taskIndex===0)content=`<p>Κάνε τον τίτλο <b>έντονο, μπλε και 24 pt</b>.</p><div class="ribbon"><button aria-pressed="${t.bold}" class="${t.bold?'chosen':''}" onclick="tasks[0].bold=!tasks[0].bold;tasks[0].done=false;renderTask()"><b>B</b> · Έντονα ${t.bold?'✓':''}</button><label>Χρώμα <select onchange="tasks[0].color=this.value;tasks[0].done=false;renderTask()"><option value="black" ${t.color==='black'?'selected':''}>Μαύρο</option><option value="blue" ${t.color==='blue'?'selected':''}>Μπλε</option></select></label><label>Μέγεθος <select onchange="tasks[0].size=+this.value;tasks[0].done=false;renderTask()"><option ${t.size===12?'selected':''}>12</option><option ${t.size===24?'selected':''}>24</option></select></label></div><div class="format" style="font-weight:${t.bold?'bold':'normal'};color:${t.color};font-size:${t.size}pt">Τιμοκατάλογος</div>`;
if(taskIndex===1)content=`<p>Βάλε <b>κίτρινο φόντο</b> στο κελί με το Fill Color.</p><div class="ribbon">${[['white','Λευκό'],['#ffe88c','Κίτρινο'],['#c8e7ff','Μπλε']].map(([v,l])=>`<button class="${t.fill===v?'chosen':''}" onclick="tasks[1].fill='${v}';tasks[1].done=false;renderTask()">Fill Color · ${l}</button>`).join('')}</div><div class="format sample" style="background:${t.fill}">Προσφορά ημέρας</div>`;
if(taskIndex===2)content=`<p>Το κελί έχει τιμή <b>0,25</b>. Εμφάνισέ την ως <b>25%</b>, επιλέγοντας το σωστό κουμπί.</p><div class="ribbon">${[['currency','€ · Accounting'],['percent','% · Percent Style'],['decimal','Increase Decimal']].map(([v,l])=>`<button class="${t.format===v?'chosen':''}" onclick="tasks[2].format='${v}';tasks[2].done=false;renderTask()">${l}</button>`).join('')}</div><div class="format big">${{currency:'0,25 €',percent:'25%',decimal:'0,250'}[t.format]||'0,25'}</div>`;
document.getElementById('finaltasks').innerHTML=`<section class="panel"><span class="pill">Άσκηση ${taskIndex+1} από 3</span><h2>${['Μορφοποίησε τον τίτλο','Χρωμάτισε το φόντο','Εμφάνισε ποσοστό'][taskIndex]}</h2>${content}<p><button class="primary" onclick="checkTask()">Έλεγχος άσκησης</button></p><p id="taskfeedback" aria-live="polite">${t.done?'✓ Σωστά! '+(taskIndex<2?'Πάτησε «Επόμενη άσκηση →».':'Ολοκλήρωσες και την τρίτη άσκηση!'):''}</p><div class="tasknav"><button onclick="moveTask(-1)" ${taskIndex===0?'disabled':''}>← Προηγούμενη άσκηση</button><button class="primary" onclick="moveTask(1)" ${taskIndex===2?'disabled':''}>Επόμενη άσκηση →</button></div><p class="muted">Ολοκληρώθηκαν: ${tasks.filter(x=>x.done).length}/3 · Τα κουμπιά πλοήγησης λειτουργούν και πριν τον έλεγχο.</p>${tasks.every(x=>x.done)?'<p class="taskdone">✓ Μπράβο! Ολοκλήρωσες όλες τις αποστολές.</p><button onclick="resetTasks()">Ξανά τις 3 ασκήσεις</button>':''}</section>`;}
function moveTask(n){taskIndex=Math.max(0,Math.min(2,taskIndex+n));renderTask()}
function resetTasks(){tasks[0]={bold:false,color:'black',size:12,done:false};tasks[1]={fill:'white',done:false};tasks[2]={format:'',done:false};taskIndex=0;renderTask()}
function checkTask(){let t=tasks[taskIndex];t.done=taskIndex===0?t.bold&&t.color==='blue'&&t.size===24:taskIndex===1?t.fill==='#ffe88c':t.format==='percent';renderTask();if(!t.done)document.getElementById('taskfeedback').textContent=['Δοκίμασε ξανά: ενεργοποίησε B, διάλεξε Μπλε και μέγεθος 24.','Δοκίμασε ξανά: επίλεξε Fill Color · Κίτρινο.','Δοκίμασε ξανά: για ποσοστό χρησιμοποίησε το %.'][taskIndex]}
document.getElementById('mode').onclick=function(){document.body.classList.toggle('board');this.textContent=document.body.classList.contains('board')?'Ατομική προβολή':'Προβολή πίνακα'};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Η πλήρης οθόνη δεν υποστηρίζεται εδώ. Άνοιξε το HTML σε ξεχωριστή καρτέλα.')}};if(location.protocol==='file:')document.getElementById('download').hidden=true;document.addEventListener('keydown',e=>{if(['SELECT','INPUT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});render();
</script></html>
