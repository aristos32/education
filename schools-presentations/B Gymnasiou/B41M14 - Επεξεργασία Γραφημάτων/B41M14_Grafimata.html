let page=0,answers={},taskIndex=0,taskAnswers={},taskDone={};
const titles=['Αρχή','Στοιχεία γραφήματος','Τίτλος','Υπόμνημα','Data Labels','Χρώματα','Γραμματοσειρές','Ασκήσεις'];
const times=['½΄','1΄','1΄','1΄','1½΄','1½΄','1΄','2½΄'];
const qs=[['Πριν αλλάξουμε ένα γράφημα…',['αλλάζουμε όνομα στο φύλλο.','επιλέγουμε το γράφημα.','επιλέγουμε όλα τα κελιά.'],1,'Με την επιλογή του γραφήματος εμφανίζονται οι καρτέλες εργαλείων του.'],['Η περιοχή όπου σχεδιάζονται οι στήλες είναι…',['Plot Area','Legend','Chart Title'],0,'Το Plot Area βρίσκεται μέσα στο Chart Area.'],['Για να αφαιρέσουμε τον τίτλο επιλέγουμε…',['Legend → None','Data Labels → None','Chart Title → None'],2,'Το Chart Title ελέγχει την εμφάνιση του τίτλου.'],['Το Legend εξηγεί…',['το ύψος των γραμμών του φύλλου.','ποια σειρά δεδομένων αντιστοιχεί σε κάθε χρώμα.','το μέγεθος γραμματοσειράς.'],1,'Για παράδειγμα: κόκκινο = 2016, μπλε = 2017, πράσινο = 2018.'],['Για να εμφανιστεί 50% σε τμήμα πίτας, επιλέγουμε…',['More Data Label Options → Percentage','Font Size → 50','Legend → Right'],0,'Percentage εμφανίζει το μερίδιο του τμήματος ως ποσοστό.'],['Για να αλλάξουμε μόνο το φόντο του υπομνήματος…',['επιλέγουμε όλο το φύλλο.','επιλέγουμε μόνο τον τίτλο.','επιλέγουμε το Legend και μετά Shape Fill.'],2,'Πρώτα επιλέγουμε ακριβώς το στοιχείο που θέλουμε να μορφοποιήσουμε.'],['Για τίτλο 16 pt, κόκκινο και έντονο…',['μορφοποιούμε το Plot Area.','επιλέγουμε τον τίτλο και χρησιμοποιούμε Font Size, Font Color, Bold.','αλλάζουμε τον τύπο γραφήματος.'],1,'Η γραμματοσειρά αλλάζει στο επιλεγμένο κείμενο.']];
function quiz(n){let q=qs[n];return `<div class="question"><span class="pill">Σκέψου & απάντησε</span><p><b>${q[0]}</b></p><div class="answers">${q[1].map((t,i)=>`<button onclick="answer(${n},${i},this)">${t}</button>`).join('')}</div><p id="feedback" aria-live="polite">${answers[n]?'✓ '+q[3]:''}</p></div>`}
function answer(n,i,b){const ok=i===qs[n][2];b.classList.add(ok?'correct':'wrong');if(ok)answers[n]=true;document.getElementById('feedback').textContent=ok?'✓ '+qs[n][3]:'Δοκίμασε ξανά. Συμβουλεύσου το παράδειγμα.'}
function screens(arr){return `<aside class="shotbox"><b>Πού βρίσκεται στο Excel;</b><p class="muted">Το κόκκινο πλαίσιο δείχνει τη σχετική επιλογή.</p><div class="shotgrid">${arr.map(([k,t])=>`<figure class="excelshot"><img class="screen" src="${shots[k]}" alt="Excel: ${t}, με κόκκινη επισήμανση"><figcaption>${t}</figcaption></figure>`).join('')}</div></aside>`}
function panel(t,d){return `<div class="layout"><div>${t}${quiz(page)}</div><div class="panel"><span class="pill">Διαδραστική προσομοίωση</span>${d}</div></div>`}

let chart={title:'Ποσοστά τουριστών στην Κύπρο',legend:'bottom',labels:false,bg:'#ffffff',plot:'#f4f7f5',legendbg:'#ffffff',colors:['#80948b','#a4b5ae','#c3cfc9'],font:16,fontcolor:'#162e39',bold:false};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chartHTML(){let c=chart,right=c.legend==='right',width=right?300:420;let bars='';const data=[[25,30,35],[20,25,30]],names=['Χώρα Α','Χώρα Β'];for(let i=0;i<2;i++){for(let j=0;j<3;j++){let x=75+i*(width/2)+j*36,h=data[i][j]*4;bars+=`<rect class="bar" x="${x}" y="${230-h}" width="27" height="${h}" fill="${c.colors[j]}"><title>${names[i]} · ${2016+j}: ${data[i][j]}%</title></rect>${c.labels?`<text x="${x+13.5}" y="${230-h/2}" fill="#111" font-size="13" text-anchor="middle">${data[i][j]}%</text>`:''}`}bars+=`<text x="${115+i*(width/2)}" y="253" text-anchor="middle" font-size="14">${names[i]}</text>`}
let lg=c.legend==='none'?'':`<g><rect x="${right?410:95}" y="${right?88:276}" width="${right?100:340}" height="${right?118:32}" rx="6" fill="${c.legendbg}" stroke="#ccd5d0"/>${c.colors.map((col,j)=>`<rect x="${right?421:111+j*105}" y="${right?103+j*32:286}" width="12" height="12" fill="${col}"/><text x="${right?442:130+j*105}" y="${right?114+j*32:297}" font-size="${page===6?12:14}" fill="${page===6?'#1749af':'#162e39'}">${2016+j}</text>`).join('')}</g>`;
return `<svg viewBox="0 0 550 330" role="img" aria-label="Εκπαιδευτικό γράφημα δύο χωρών και τριών ετών"><rect x="2" y="2" width="546" height="326" rx="12" fill="${c.bg}" stroke="#cbd6cf"/>${c.title?`<text x="275" y="32" text-anchor="middle" font-size="${c.font}" fill="${c.fontcolor}" font-weight="${c.bold?'bold':'normal'}">${esc(c.title)}</text>`:''}<rect x="53" y="58" width="${width}" height="172" fill="${c.plot}"/>${[0,10,20,30,40].map(v=>`<line x1="53" x2="${53+width}" y1="${230-v*4}" y2="${230-v*4}" stroke="#cbd6cf"/><text x="44" y="${234-v*4}" text-anchor="end" font-size="12">${v}%</text>`).join('')}${bars}${lg}</svg><p class="data-note">Ενδεικτικά, επινοημένα δεδομένα για εξάσκηση · δεν είναι πραγματικά στατιστικά τουρισμού.</p>`}
function updateChart(){let e=document.getElementById('chart');if(e)e.innerHTML=chartHTML()}
function setChart(k,v){chart[k]=v;updateChart()}
function render(){document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${i+1}. ${t}</button>`).join('');let t='',d='',ss=[];
if(page===0){t=`<p>Έχουμε ένα γράφημα. Πώς θα καταλαβαίνει ο αναγνώστης <b>τι δείχνει</b>, <b>τι σημαίνουν τα χρώματα</b> και <b>ποιες είναι οι τιμές</b>;</p><div class="note">Επιλέγω το γράφημα → εμφανίζονται Chart Tools.<br>Design / Chart Design: στοιχεία γραφήματος.<br>Format: μορφοποίηση του επιλεγμένου στοιχείου.</div><p>Υπενθύμιση: A4:D9 → Insert → Column → Clustered Column, όπως στο φύλλο εργασίας.</p>`;ss=[['insert','Insert → Column Chart']];d=`<button class="primary" onclick="chart.title='Ποσοστά τουριστών στην Κύπρο';chart.labels=true;chart.colors=['#d94c46','#3578ce','#26966c'];updateChart()">▶ Κάνε το γράφημα πιο σαφές</button>`}
if(page===1){t=`<p><b>Chart Area</b>: ολόκληρο το γράφημα.<br><b>Plot Area</b>: η εσωτερική περιοχή με τους άξονες και τις στήλες.<br><b>Data Series</b>: π.χ. όλες οι στήλες του 2016.<br><b>Data Point</b>: μία συγκεκριμένη στήλη.</p><div class="note">Επίλεξε το σωστό στοιχείο πριν εφαρμόσεις μορφοποίηση.</div>`;d=`<div class="chart-controls"><button onclick="setChart('bg','#fff0a8')">Δείξε Chart Area</button><button onclick="setChart('plot','#c9e6f9')">Δείξε Plot Area</button><button onclick="chart.bg='#fff';chart.plot='#f4f7f5';updateChart()">Επαναφορά</button></div>`}
if(page===2){t=`<p>Chart Tools → <b>Design → Add Chart Element → Chart Title</b>.</p><p><b>Above Chart</b>: τίτλος πάνω από το γράφημα. Κάνουμε κλικ στο κείμενο του τίτλου για να τον τροποποιήσουμε.<br><b>None</b>: αφαίρεση τίτλου.</p><div class="note">Στο φύλλο εργασίας: «Ποσοστά τουριστών στην Κύπρο».</div>`;d=`<label>Κείμενο τίτλου <input id="titleinput" maxlength="48" value="${esc(chart.title)}" oninput="setChart('title',this.value)"></label><div class="chart-controls"><button onclick="setChart('title','Ποσοστά τουριστών στην Κύπρο');document.getElementById('titleinput').value=chart.title">Above Chart</button><button onclick="setChart('title','');document.getElementById('titleinput').value=''">Chart Title → None</button></div>`;ss=[['element','Design → Add Chart Element → Chart Title']]}
if(page===3){t=`<p>Το <b>Legend</b> συνδέει χρώματα και σειρές δεδομένων.</p><p>Design → Add Chart Element → <b>Legend</b> → Bottom / Right.<br>Για αφαίρεση: <b>None</b>.</p><div class="note">Στην άσκηση μετακινούμε το υπόμνημα δεξιά.</div>`;d=`<div class="chart-controls"><button onclick="setChart('legend','bottom')">Legend → Bottom</button><button onclick="setChart('legend','right')">Legend → Right</button><button onclick="setChart('legend','none')">Legend → None</button></div>`;ss=[['element','Design → Add Chart Element → Legend']]}
if(page===4){t=`<p>Design → Add Chart Element → <b>Data Labels → Center</b>: ετικέτες στο κέντρο των στηλών.</p><p>Για πίτα: <b>More Data Label Options… → Percentage</b>, και θέση <b>Outside End</b>, όπως στο φύλλο εργασίας.</p><div class="note">Value: η τιμή από τα δεδομένα.<br>Percentage: το μερίδιο της πίτας επί 100.<br>Data Labels → None: αφαίρεση.</div>`;d=`<div class="chart-controls"><button onclick="setChart('labels',true)">Data Labels → Center</button><button onclick="setChart('labels',false)">Data Labels → None</button><button onclick="document.getElementById('piedemo').hidden=!document.getElementById('piedemo').hidden">Δες Percentage σε πίτα</button></div><div id="piedemo" hidden><div class="pie" role="img" aria-label="Πίτα με ποσοστά 50%, 30%, 20%"><span class="pielabel" style="right:-40px;top:80px">50%</span><span class="pielabel" style="left:-40px;bottom:15px">30%</span><span class="pielabel" style="left:-25px;top:10px">20%</span></div><p class="muted">Outside End: οι ετικέτες έξω από τα τμήματα. Η προσομοίωση δείχνει επίπεδη πίτα· η άσκηση Excel ζητά 3-D Pie.</p></div>`;ss=[['element','Design → Add Chart Element → Data Labels']]}
if(page===5){t=`<p>Επιλέγω το στοιχείο → <b>Format → Shape Fill</b>.</p><p>Για μια ολόκληρη σειρά: επιλέγω μια στήλη της σειράς. Για ένα μόνο σημείο: δεύτερο κλικ στη συγκεκριμένη στήλη ή στο τμήμα πίτας.</p><div class="note">Στην άσκηση: 2016 κόκκινο, 2017 μπλε, 2018 πράσινο. Chart Area κίτρινο, Legend λευκό.</div>`;d=`<label>Επιλεγμένο στοιχείο <select id="target"><option value="series">Σειρά 2016</option><option value="bg">Chart Area</option><option value="plot">Plot Area</option><option value="legendbg">Legend</option></select></label><div class="chart-controls"><button onclick="applyFill('#d94c46')">Κόκκινο</button><button onclick="applyFill('#fff0a8')">Κίτρινο</button><button onclick="applyFill('#ffffff')">Λευκό</button><button onclick="chart.colors=['#d94c46','#3578ce','#26966c'];updateChart()">Χρώματα των 3 ετών</button></div><p class="muted">Το Shape Fill εφαρμόζεται μόνο στο επιλεγμένο στοιχείο.</p>`;ss=[['fill','Format → Shape Fill']]}
if(page===6){t=`<p>Επιλέγω το κείμενο του τίτλου → <b>Home → Font</b>.</p><p><b>Font Size</b>: 16 pt.<br><b>Font Color</b>: κόκκινο.<br><b>Bold</b>: έντονα.</p><div class="note">Με τον ίδιο τρόπο μορφοποιούμε κείμενο αξόνων και Legend. Στην αξιολόγηση: Legend 10 pt και μπλε.</div><p class="muted">Προαιρετική σύνδεση με τη θεωρία: Design → Change Chart Type αλλάζει τον τύπο, όχι τις αρχικές τιμές.</p>`;d=`<div class="chart-controls"><button onclick="setChart('font',16)">Τίτλος · 16 pt</button><button onclick="setChart('fontcolor','#c52b2b')">Τίτλος · κόκκινο</button><button onclick="setChart('bold',!chart.bold)"><b>B</b> · Bold</button></div>`;ss=[['font','Home → Font Size'],['fontcolor','Home → Font Color'],['type','Design → Change Chart Type']]}
let b=page===7?`<p>Επίλεξε τη σωστή εντολή. Κάθε άσκηση έχει βοήθεια και άμεσο έλεγχο.</p><div id="tasks"></div><p class="note">Ερωτήσεις μαθήματος: ${Object.keys(answers).length}/7 σωστές.</p>`:panel(t,`<div id="chart"></div>${d}`);
document.getElementById('main').innerHTML=`<div class="step"><span class="eyebrow">ΜΑΘΗΜΑ 10΄ · ${page+1}/8 · ${times[page]}</span><h1>${titles[page]}</h1>${b}${ss.length?screens(ss):''}</div><div class="bottom"><button ${page===0?'disabled':''} onclick="go(page-1)">← Προηγούμενη ενότητα</button><span>${page+1}/8</span><button class="primary" ${page===7?'hidden':''} onclick="go(page+1)">Επόμενη ενότητα →</button></div><progress value="${page+1}" max="8"></progress>`;if(page===7)renderTasks();else updateChart();}
function go(i){page=Math.max(0,Math.min(7,i));chart.legend='bottom';if(i===0)chart.title='';else if(!chart.title)chart.title='Ποσοστά τουριστών στην Κύπρο';render();window.scrollTo(0,0)}
function applyFill(v){let k=document.getElementById('target').value;if(k==='series')chart.colors[0]=v;else chart[k]=v;updateChart()}
const tasks=[['Το υπόμνημα πρέπει να μετακινηθεί στη δεξιά πλευρά.', ['Chart Title → Right','Legend → Right','Data Labels → Center'],1,'Το Legend ελέγχει τη θέση του υπομνήματος.'],['Σε μια πίτα θέλουμε ποσοστά έξω από τα τμήματα.', ['More Data Label Options → Percentage + Outside End','Legend → Percentage','Font Size → 100'],0,'Διάλεξε περιεχόμενο Percentage και θέση Outside End.'],['Θέλουμε λευκό Legend και κίτρινο Chart Area.', ['Επιλέγουμε μόνο Plot Area και Shape Fill: κίτρινο.','Επιλέγουμε όλες τις στήλες και Shape Fill: λευκό.','Μορφοποιούμε χωριστά το Legend και το Chart Area με Shape Fill.'],2,'Κάθε στοιχείο επιλέγεται και μορφοποιείται ξεχωριστά.']];
function renderTasks(){let t=tasks[taskIndex];document.getElementById('tasks').innerHTML=`<section class="panel"><span class="pill">Άσκηση ${taskIndex+1} από 3</span><h2>${t[0]}</h2><div class="answers">${t[1].map((a,i)=>`<button class="${taskAnswers[taskIndex]===i?'chosen':''}" onclick="taskAnswers[taskIndex]=${i};taskDone[taskIndex]=false;renderTasks()">${a}</button>`).join('')}</div><p><button class="primary" onclick="checkTask()">Έλεγχος</button></p><details class="hints"><summary>Χρειάζομαι βοήθεια</summary>${t[3]}</details><p id="taskfeedback" aria-live="polite">${taskDone[taskIndex]?'✓ Σωστά!':''}</p><div class="tasknav"><button ${taskIndex===0?'disabled':''} onclick="taskIndex--;renderTasks()">← Προηγούμενη άσκηση</button><button class="primary" ${taskIndex===2?'disabled':''} onclick="taskIndex++;renderTasks()">Επόμενη άσκηση →</button></div><p>Ολοκληρώθηκαν: ${Object.values(taskDone).filter(Boolean).length}/3</p>${Object.values(taskDone).filter(Boolean).length===3?'<p class="taskdone">✓ Ολοκλήρωσες το μάθημα!</p><button onclick="taskAnswers={};taskDone={};taskIndex=0;renderTasks()">Νέα προσπάθεια</button>':''}</section>`}
function checkTask(){let a=taskAnswers[taskIndex];if(a===undefined){document.getElementById('taskfeedback').textContent='Επίλεξε πρώτα μία απάντηση.';return}taskDone[taskIndex]=a===tasks[taskIndex][2];renderTasks();if(!taskDone[taskIndex])document.getElementById('taskfeedback').textContent='Δοκίμασε ξανά ή άνοιξε τη βοήθεια.'}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Χρησιμοποίησε F11 ή άνοιξε το HTML στον browser.')}}
document.addEventListener('keydown',e=>{if(['SELECT','BUTTON','INPUT','SUMMARY'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});if(location.protocol==='file:')document.getElementById('download').hidden=true;render();
</script></body></html>
