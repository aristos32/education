function quiz(n){let q=qs[n];return `<div class="question"><span class="pill">Σκέψου & απάντησε</span><p><b>${q[0]}</b></p><div class="answers">${q[1].map((t,i)=>`<button onclick="answer(${n},${i},this)">${t}</button>`).join('')}</div><p id="feedback" aria-live="polite">${answers[n]?'✓ '+q[3]:''}</p></div>`}
function answer(n,i,b){const ok=i===qs[n][2];b.classList.add(ok?'correct':'wrong');if(ok)answers[n]=true;document.getElementById('feedback').textContent=ok?'✓ '+qs[n][3]:'Δοκίμασε ξανά. Συμβουλεύσου το παράδειγμα.'}
function screens(arr){return `<aside class="shotbox"><b>Πού βρίσκεται στο Excel;</b><p class="muted">Το κόκκινο πλαίσιο δείχνει τη σχετική επιλογή.</p><div class="shotgrid">${arr.map(([k,t])=>`<figure class="excelshot"><img class="screen" src="${shots[k]}" alt="Excel: ${t}, με κόκκινη επισήμανση"><figcaption>${t}</figcaption></figure>`).join('')}</div></aside>`}
function panel(t,d){return `<div class="layout"><div>${t}${quiz(page)}</div><div class="panel"><span class="pill">Διαδραστική προσομοίωση</span>${d}</div></div>`}
function render(){document.getElementById('nav').innerHTML=titles.map((t,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${i+1}. ${t}</button>`).join('');let b='',ss=[];
if(page===0)b=panel(`<p>Το <b>Μαθητικό Συμβούλιο</b> ετοιμάζει πίνακα με ονόματα και αρμοδιότητες. Πώς θα τον κάνουμε ευανάγνωστο;</p><div class="note">Επιλέγω κελιά → Home → κατάλληλο κουμπί.<br>Θα δουλέψουμε περίγραμμα, αναδίπλωση, στοίχιση, συγχώνευση και στυλ.</div><p class="muted">Μάθημα 10΄ μαζί με τις ερωτήσεις. Χρησιμοποίησε τα βέλη ή τα κουμπιά πλοήγησης.</p>`,`<p>Από έναν απλό πίνακα…</p><table class="grid-demo" id="intro"><tr><td>Μαθητικό Συμβούλιο</td><td>Ρόλος</td></tr><tr><td>Μαρία</td><td>Πρόεδρος</td></tr></table><p><button class="primary" onclick="document.getElementById('intro').classList.toggle('bordered');document.getElementById('intro').rows[0].style.background='#d5f572'">▶ Δες τη διαφορά</button></p>`);
if(page===1){ss=[['fill','Home → Font → Fill Color'],['border','Home → Font → Borders']];b=panel(`<p><b>Fill Color</b>: χρώμα μέσα στα κελιά.<br><b>Borders</b>: γραμμές γύρω από τα κελιά.</p><div class="note"><b>All Borders</b>: όλα τα περιγράμματα.<br><b>Outside Borders</b>: μόνο το εξωτερικό περίγραμμα.<br><b>More Borders…</b>: επιλέγω Style και Color, μετά πατώ τις πλευρές και OK.</div><p>Όπως στο φύλλο εργασίας: <b>μπλε, διπλή γραμμή</b>.</p>`,`<div class="ribbon"><button onclick="borderDemo('all')">All Borders</button><button onclick="borderDemo('outside')">Outside Borders</button><button onclick="borderDemo('double')">Μπλε διπλό</button><button onclick="document.getElementById('bt').style.background='#fff0a8'">Fill Color</button></div><table class="grid-demo" id="bt"><tr><td>Όνομα</td><td>Ρόλος</td></tr><tr><td>Μαρία</td><td>Πρόεδρος</td></tr></table>`)}
if(page===2){ss=[['wrap','Home → Alignment → Wrap Text']];b=panel(`<p>Το <b>Wrap Text</b> εμφανίζει το μεγάλο κείμενο σε πολλές γραμμές <b>μέσα στο ίδιο κελί</b>.</p><div class="note">Επιλέγω A5 → Home → Alignment → Wrap Text.<br>Αν δεν φαίνεται όλο το κείμενο, αυξάνω το ύψος της γραμμής ή χρησιμοποιώ AutoFit Row Height.</div>`,`<p>Το κελί A5 έχει μεγάλο τίτλο:</p><div id="wrapcell" class="target" style="white-space:nowrap;overflow:hidden">Υπεύθυνος σχολικών εκδηλώσεων</div><p><button id="wrapbtn" aria-pressed="false" onclick="wrapDemo(this)">Wrap Text · ενεργοποίηση</button></p><p class="muted">Το κείμενο παραμένει στο A5.</p>`)}
if(page===3){ss=[['align','Home → Alignment: οριζόντια και κάθετη στοίχιση']];b=panel(`<p>Δύο διαφορετικές κατευθύνσεις:</p><p><b>Οριζόντια</b>: Align Left · Center · Align Right.<br><b>Κάθετα</b>: Top Align · Middle Align · Bottom Align.</p><div class="note">Στο φύλλο εργασίας: A5:E5 → <b>Center + Middle Align</b>.</div>`,`<div class="ribbon"><label>Οριζόντια <select aria-label="Οριζόντια στοίχιση" onchange="document.getElementById('aligncell').style.textAlign=this.value"><option value="left">Align Left</option><option value="center">Center</option><option value="right">Align Right</option></select></label><label>Κάθετα <select aria-label="Κάθετη στοίχιση" onchange="document.getElementById('aligncell').style.verticalAlign=this.value"><option value="top">Top Align</option><option value="middle">Middle Align</option><option value="bottom">Bottom Align</option></select></label></div><table style="width:100%;height:180px;border:2px solid #087e68"><tr><td id="aligncell" style="vertical-align:top">ΟΝΟΜΑ</td></tr></table>`)}
if(page===4){ss=[['merge','Merge Cells · ενώνει τα επιλεγμένα κελιά'],['unmerge','Unmerge Cells · αναιρεί τη συγχώνευση']];b=panel(`<p><b>Merge Cells</b>: ενώνει μια περιοχή κελιών.<br><b>Merge & Center</b>: ενώνει και κεντράρει.<br><b>Unmerge Cells</b>: ξαναχωρίζει τα κελιά.</p><div class="note">Επιλέγω A1:E1 → Home → Alignment → βελάκι Merge & Center → Merge Cells.</div><p>Στο παράδειγμα μόνο το A1 έχει κείμενο. Πριν συγχωνεύσεις, κράτησε δεδομένα μόνο στο πάνω αριστερό κελί, ώστε να μη χαθούν άλλα περιεχόμενα.</p>`,`<p><b>Επιλεγμένη περιοχή A1:E1</b> · Παρατήρησε τις 5 στήλες και τα εσωτερικά περιγράμματα.</p><div id="mergearea"></div><div class="ribbon"><button onclick="mergeDemo('merge')">Merge Cells</button><button onclick="mergeDemo('center')">Merge & Center</button><button onclick="mergeDemo('unmerge')">Unmerge Cells</button></div><p id="mergemsg" aria-live="polite"></p>`)}
if(page===5){ss=[['orientation','Home → Alignment → Orientation'],['styles','Home → Styles → Cell Styles']];b=panel(`<p><b>Orientation → Vertical Text</b>: τα γράμματα μπαίνουν το ένα κάτω από το άλλο. Η περιστροφή 90° γυρίζει ολόκληρο το κείμενο.</p><p><b>Cell Styles</b>: έτοιμος συνδυασμός μορφοποίησης για επιλεγμένα κελιά.</p><div class="note">Στο φύλλο εργασίας: Vertical Text στο A6 και στυλ <b>40% - Accent 5</b> στην P5:S11. Το χρώμα του στυλ εξαρτάται από το θέμα του βιβλίου.</div>`,`<div class="ribbon"><button onclick="orient('normal')">Οριζόντια</button><button onclick="orient('vertical')">Vertical Text</button><button onclick="orient('rotate')">Περιστροφή 90°</button><button onclick="document.getElementById('orientbox').style.background='#c9d9ef';document.getElementById('orientbox').style.color='#19365c'">Cell Style · δείγμα</button></div><div class="demo" id="orientbox" style="height:250px;background:#eef5ef"><span id="orienttext" style="display:inline-block;transition:transform .4s">ΡΟΛΟΣ</span></div>`)}
if(page===6){ss=[['paint','Home → Clipboard → Format Painter'],['background','Page Layout → Page Setup → Background']];b=panel(`<p><b>Format Painter</b>: επιλέγω την πηγή → πατώ το πινέλο → επιλέγω τον προορισμό. Μεταφέρει τη μορφοποίηση.</p><p><b>Background</b>: εικόνα στο φόντο ολόκληρου του φύλλου, από Page Layout. Διαφέρει από το Fill Color ενός κελιού.</p><div class="note">Απλό κλικ στο πινέλο: μία εφαρμογή. Διπλό κλικ: πολλές εφαρμογές, μέχρι να πατήσουμε Esc.</div>`,`<div class="paintsteps"><span id="ps1">1 · Επιλογή πηγής A1</span><span id="ps2">2 · Πάτημα πινέλου</span><span id="ps3">3 · Κλικ προορισμού A3</span></div><div class="ribbon"><button onclick="paint(1)">1. Επιλογή A1</button><button id="painttool" onclick="paint(2)">2. 🖌 Format Painter</button><button onclick="paint(3)">3. Κλικ A3</button><button onclick="resetPaint()">↺ Επαναφορά</button></div><table class="excel-grid"><tr><th></th><th>A</th></tr><tr><th>1</th><td id="src" class="paint-source"><span class="cell-id">ΠΗΓΗ · έχει ήδη μορφοποίηση</span><button class="paint-cell" onclick="paint(1)">Πρόεδρος</button></td></tr><tr><th>2</th><td style="text-align:center;height:48px;color:#087e68" id="transferarrow">↓ Μεταφέρουμε μόνο τη μορφή ↓</td></tr><tr><th>3</th><td id="dest"><span class="cell-id">ΠΡΟΟΡΙΣΜΟΣ · διαφορετικό κείμενο</span><button class="paint-cell" onclick="paint(3)">Γραμματέας</button></td></tr></table><div class="format-tags"><span>Κίτρινο φόντο</span><span>Μπλε έντονα γράμματα</span><span>Διπλό περίγραμμα</span></div><p id="paintmsg" aria-live="polite">Πάτησε το κελί A1 ή το κουμπί 1 για να ξεκινήσεις.</p>`)}
if(page===7)b=`<p>Τρεις πρακτικές επιλογές. Πάτησε <b>Έλεγχος</b> και <b>Επόμενη άσκηση</b>.</p><div id="tasks"></div><p class="note">Ερωτήσεις μαθήματος: ${Object.keys(answers).length}/7 σωστές. Μπορείς να επιστρέψεις στις ενότητες για επανάληψη.</p>`;
document.getElementById('main').innerHTML=`<div class="step"><span class="eyebrow">ΜΑΘΗΜΑ 10΄ · ${page+1}/8 · ${times[page]}</span><h1>${titles[page]}</h1>${b}${ss.length?screens(ss):''}</div><div class="bottom"><button ${page===0?'disabled':''} onclick="go(page-1)">← Προηγούμενη ενότητα</button><span>${page+1}/8</span><button class="primary" ${page===7?'hidden':''} onclick="go(page+1)">Επόμενη ενότητα →</button></div><progress max="8" value="${page+1}"></progress>`;paintStep=0;if(page===4)mergeDemo('unmerge');if(page===7)renderTasks();}
function go(i){page=Math.max(0,Math.min(7,i));render();window.scrollTo(0,0)}
function borderDemo(v){let t=document.getElementById('bt');t.className='grid-demo';t.style.border='';for(let c of t.querySelectorAll('td'))c.style.border='';if(v==='all')t.classList.add('bordered');if(v==='double')t.classList.add('double');if(v==='outside'){t.style.border='3px solid #2165bb';for(let c of t.querySelectorAll('td'))c.style.border='none'}}
function wrapDemo(b){let on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent='Wrap Text · '+(on?'ενεργό':'ανενεργό');document.getElementById('wrapcell').style.whiteSpace=on?'normal':'nowrap'}
function mergeDemo(v){let merged=v!=='unmerge';let top=merged?`<td class="range" colspan="5" style="text-align:${v==='center'?'center':'left'}"><span class="cell-id">A1:E1 · 1 ενιαίο κελί</span>Μαθητικό Συμβούλιο</td>`:['A','B','C','D','E'].map((c,i)=>`<td class="range" style="background:${i%2?'#d9ecdf':'#f1f9ee'}"><span class="cell-id">${c}1</span>${i===0?'Μαθητικό Συμβούλιο':'&nbsp;'}</td>`).join('');document.getElementById('mergearea').innerHTML=`<p class="merge-state">${merged?'ΜΕΤΑ: 1 ενιαίο κελί · οι εσωτερικές γραμμές αφαιρέθηκαν':'ΠΡΙΝ / UNMERGE: 5 ξεχωριστά κελιά'}</p><table class="excel-grid"><tr><th></th>${['A','B','C','D','E'].map(c=>`<th>${c}</th>`).join('')}</tr><tr><th>1</th>${top}</tr><tr><th>2</th>${['A2','B2','C2','D2','E2'].map(c=>`<td><span class="cell-id">${c}</span></td>`).join('')}</tr></table>`;document.getElementById('mergemsg').textContent=merged?'✓ Η πρώτη γραμμή έγινε ένα κελί. Η δεύτερη γραμμή διατηρεί 5 ξεχωριστά κελιά.':'Οι γραμμές χωρίζουν καθαρά τα A1, B1, C1, D1, E1. Το κείμενο βρίσκεται μόνο στο A1.'}
function orient(v){let e=document.getElementById('orienttext');e.textContent=v==='vertical'?'Ρ\nΟ\nΛ\nΟ\nΣ':'ΡΟΛΟΣ';e.style.whiteSpace='pre';e.style.textAlign='center';e.style.transform=v==='rotate'?'rotate(-90deg)':'none'}
let paintStep=0;function resetPaint(){paintStep=0;document.getElementById('src').className='paint-source';document.getElementById('dest').className='';for(let i=1;i<=3;i++)document.getElementById('ps'+i).classList.remove('done');document.getElementById('painttool').classList.remove('chosen');document.getElementById('transferarrow').textContent='↓ Μεταφέρουμε μόνο τη μορφή ↓';document.getElementById('paintmsg').textContent='Πάτησε A1 για να ξεκινήσεις ξανά.'}
function paint(n){let m=document.getElementById('paintmsg');if(n===1){resetPaint();paintStep=1;document.getElementById('src').classList.add('paint-selected');document.getElementById('ps1').classList.add('done');m.textContent='1/3 · Το A1 επιλέχθηκε (πράσινο πλαίσιο). Πάτησε Format Painter.'}else if(n===2&&paintStep===1){paintStep=2;document.getElementById('ps2').classList.add('done');document.getElementById('painttool').classList.add('chosen');document.getElementById('dest').classList.add('paint-ready');document.getElementById('transferarrow').textContent='🖌 Το πινέλο είναι έτοιμο → πάτησε A3';m.textContent='2/3 · Η μορφή είναι στο πινέλο. Πάτησε το κελί «Γραμματέας» (A3).'}else if(n===3&&paintStep===2){paintStep=3;document.getElementById('ps3').classList.add('done');document.getElementById('dest').className='paint-source transfer';document.getElementById('painttool').classList.remove('chosen');document.getElementById('transferarrow').textContent='✓ Ίδια μορφοποίηση · διαφορετικό κείμενο';m.textContent='3/3 · Αντιγράφηκαν φόντο, γράμματα και περίγραμμα. Το A3 εξακολουθεί να γράφει «Γραμματέας».'}else m.textContent='Ακολούθησε τη σειρά: 1. A1 → 2. Format Painter → 3. A3.'}
const tasks=[['Ο μεγάλος τίτλος πρέπει να φαίνεται ολόκληρος μέσα στο A5.', ['Merge Cells','Wrap Text','Align Right'],1,'Το Wrap Text βάζει το κείμενο σε πολλές γραμμές στο ίδιο κελί.'],['Τα A5:E5 πρέπει να είναι κεντραρισμένα οριζόντια και κάθετα.', ['Center + Middle Align','Center + Top Align','Align Left + Middle Align'],0,'Χρειάζονται δύο επιλογές: μία για κάθε κατεύθυνση.'],['Βάλε μπλε διπλή γραμμή γύρω από κάθε κελί της A5:E11.', ['Outside Borders μόνο','Fill Color: μπλε','More Borders: διπλό Style, μπλε Color, Outline + Inside'],2,'Στο παράθυρο Border επιλέγεις γραμμή και χρώμα και εφαρμόζεις εξωτερικές και εσωτερικές πλευρές.']];
function exerciseExample(goal){let n=taskIndex,cols=n===0?['A']:['A','B','C','D','E'];let rows=n===2?7:1;return `<table style="${n===0?'width:210px;max-width:100%':''}" class="excel-grid exercise-grid ${goal&&n===2?'goal-double':''}"><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${Array.from({length:rows},(_,r)=>`<tr><th>${r+5}</th>${cols.map((c,i)=>{let txt=n===0?'Υπεύθυνος σχολικών εκδηλώσεων':n===1?['Όνομα','Τμήμα','Ρόλος','Ψήφοι','Σειρά'][i]:r===0?['Όνομα','Τμήμα','Ρόλος','Ψήφοι','Σειρά'][i]:[['Μαρία','Β1','Πρόεδρος','28','1'],['Νίκος','Β2','Αντιπρ.','25','2'],['Έλενα','Β3','Γραμμ.','23','3'],['Άννα','Β1','Μέλος','21','4'],['Πέτρος','Β2','Μέλος','20','5'],['Σοφία','Β3','Μέλος','18','6']][r-1][i];return `<td style="${n===0?'max-width:150px;'+(goal?'white-space:normal;height:100px;':'white-space:nowrap;text-overflow:clip;'):n===1?'height:110px;text-align:'+(goal?'center':'left')+';vertical-align:'+(goal?'middle':'top')+';':''}">${txt}</td>`}).join('')}</tr>`).join('')}</table>`}
function taskVisual(){return `<div class="comparison"><div><h3>Πριν · όπως είναι τώρα</h3>${exerciseExample(false)}<p class="muted">${['Το κείμενο δεν φαίνεται ολόκληρο στο A5.','Οι τίτλοι είναι αριστερά και πάνω.','Τα κελιά έχουν απλό περίγραμμα.'][taskIndex]}</p></div><div><h3>Στόχος · έτσι το θέλουμε</h3>${exerciseExample(true)}<p class="muted">${['Όλο το κείμενο, σε πολλές γραμμές μέσα στο A5.','Οι ίδιοι τίτλοι στο κέντρο και στο μέσο των κελιών.','Μπλε διπλή γραμμή σε κάθε πλευρά κάθε κελιού.'][taskIndex]}</p></div></div>`}
function renderTasks(){let t=tasks[taskIndex];document.getElementById('tasks').innerHTML=`<section class="panel"><span class="pill">Άσκηση ${taskIndex+1} από 3</span><h2>${t[0]}</h2>${taskVisual()}<p><b>Ποια εντολή θα εφαρμόσεις στην επιλεγμένη περιοχή;</b></p><div class="answers">${t[1].map((a,i)=>`<button class="${taskAnswers[taskIndex]===i?'chosen':''}" onclick="taskAnswers[taskIndex]=${i};taskDone[taskIndex]=false;renderTasks()">${a}</button>`).join('')}</div><p><button class="primary" onclick="checkTask()">Έλεγχος</button></p><details class="hints"><summary>Χρειάζομαι βοήθεια</summary>${t[3]}</details><p id="taskfeedback" aria-live="polite">${taskDone[taskIndex]?'✓ Σωστά!':''}</p><div class="tasknav"><button ${taskIndex===0?'disabled':''} onclick="taskIndex--;renderTasks()">← Προηγούμενη άσκηση</button><button class="primary" ${taskIndex===2?'disabled':''} onclick="taskIndex++;renderTasks()">Επόμενη άσκηση →</button></div><p>Ολοκληρώθηκαν: ${Object.values(taskDone).filter(Boolean).length}/3</p>${Object.values(taskDone).filter(Boolean).length===3?'<p class="taskdone">✓ Ολοκλήρωσες το μάθημα!</p><button onclick="taskAnswers={};taskDone={};taskIndex=0;renderTasks()">Νέα προσπάθεια</button>':''}</section>`}
function checkTask(){let a=taskAnswers[taskIndex];if(a===undefined){document.getElementById('taskfeedback').textContent='Επίλεξε πρώτα μία απάντηση.';return}taskDone[taskIndex]=a===tasks[taskIndex][2];renderTasks();if(!taskDone[taskIndex])document.getElementById('taskfeedback').textContent='Δοκίμασε ξανά ή άνοιξε τη βοήθεια.'}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Χρησιμοποίησε F11 ή άνοιξε το HTML στον browser.')}}
document.addEventListener('keydown',e=>{if(['SELECT','BUTTON','INPUT','SUMMARY'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});if(location.protocol==='file:')document.getElementById('download').hidden=true;render();
</script></html>
