: "Μπράβο! Επιλέξατε σωστά μέτρα πρόληψης και προστασίας από κακόβουλα προγράμματα (malware).", "fail": "Σκεφτείτε τρεις διαφορετικούς τρόπους προστασίας: ένα εργαλείο που εντοπίζει απειλές, τη διατήρηση του λογισμικού ενημερωμένου και τη δυνατότητα ανάκτησης αρχείων."}, {"type": "choice", "title": "7η Αποστολή", "prompt": "Ένας συμμαθητής πάτησε ύποπτο σύνδεσμο και έδωσε κωδικό. Τι του προτείνετε;", "options": ["Να κρύψει το περιστατικό", "Να στείλει ξανά τον κωδικό", "Να ενημερώσει αμέσως γονέα ή καθηγητή"], "answer": 2, "explain": "Σε ύποπτο περιστατικό ενημερώνουμε άμεσα έμπιστο ενήλικα.", "success": "Μπράβο! Επιλέξατε να ζητήσετε άμεσα βοήθεια από έμπιστο ενήλικα μετά από ένα ύποπτο περιστατικό.", "fail": "Σκεφτείτε ποια ενέργεια περιορίζει τον κίνδυνο μετά την αποκάλυψη ενός κωδικού. Θα βοηθούσε να κρατήσουμε το περιστατικό κρυφό;"}, {"type": "choice", "title": "8η Αποστολή", "prompt": "Η ομάδα λαμβάνει email που μοιάζει να προέρχεται από υπηρεσία παιχνιδιών. Ζητά να συνδεθείτε από άγνωστο σύνδεσμο και να πληκτρολογήσετε τον κωδικό σας. Ποια είναι η ασφαλέστερη ενέργεια;", "options": ["Να πατήσετε τον σύνδεσμο, επειδή εμφανίζεται το λογότυπο της υπηρεσίας.", "Να ανοίξετε την επίσημη ιστοσελίδα πληκτρολογώντας μόνοι σας τη διεύθυνσή της και να ελέγξετε τον λογαριασμό σας.", "Να απαντήσετε στο email γράφοντας τον κωδικό σας."], "answer": 1, "success": "Μπράβο! Επιλέξατε να ελέγξετε την πληροφορία από την επίσημη υπηρεσία, χωρίς να εμπιστευτείτε έναν ύποπτο σύνδεσμο.", "fail": "Σκεφτείτε αν η εμφάνιση ενός λογότυπου αρκεί για να εμπιστευτούμε ένα μήνυμα. Πώς μπορούμε να επισκεφτούμε μια υπηρεσία χωρίς να πατήσουμε τον σύνδεσμο του email;"}, {"type": "drag", "title": "9η Αποστολή", "prompt": "Συμπληρώστε τις συμβουλές για την ασφαλή διαχείριση email και αρχείων.", "parts": ["Για να περιορίσουμε τα ανεπιθύμητα μηνύματα (spam), χρησιμοποιούμε ", " . Πριν ανοίξουμε άγνωστο συνημμένο, ελέγχουμε τον ", " . Για να διατηρούμε αντίγραφα σημαντικών αρχείων, δημιουργούμε ", const scenes={"phishing": "<svg viewBox=\"0 0 640 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ύποπτο email που ζητά κωδικό\"><rect width=\"640\" height=\"270\" rx=\"18\" fill=\"#e6f0ff\"/><rect x=\"60\" y=\"28\" width=\"520\" height=\"215\" rx=\"16\" fill=\"white\" stroke=\"#aac4e5\" stroke-width=\"3\"/><rect x=\"60\" y=\"28\" width=\"520\" height=\"47\" rx=\"16\" fill=\"#1a6095\"/><text x=\"86\" y=\"59\" fill=\"white\" font-size=\"21\" font-family=\"Arial\">✉ Εισερχόμενο μήνυμα</text><text x=\"85\" y=\"105\" font-size=\"17\" fill=\"#263a54\" font-family=\"Arial\">Αποστολέας: support@secure-login-example.net</text><text x=\"85\" y=\"139\" font-size=\"19\" font-weight=\"bold\" fill=\"#b83c38\" font-family=\"Arial\">ΕΠΕΙΓΟΝ! Ο λογαριασμός σου κλειδώνει!</text><text x=\"85\" y=\"171\" font-size=\"17\" fill=\"#263a54\" font-family=\"Arial\">Πάτησε εδώ και δώσε τον μυστικό κωδικό σου.</text><rect x=\"85\" y=\"189\" width=\"235\" height=\"36\" rx=\"8\" fill=\"#e07b53\"/><text x=\"104\" y=\"213\" font-size=\"17\" fill=\"white\" font-family=\"Arial\">Επιβεβαίωση κωδικού</text></svg>", "spam": "<svg viewBox=\"0 0 640 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Γραμματοκιβώτιο με πολλά διαφημιστικά μηνύματα\"><rect width=\"640\" height=\"270\" rx=\"18\" fill=\"#e8f6f3\"/><rect x=\"65\" y=\"24\" width=\"510\" height=\"224\" rx=\"15\" fill=\"white\" stroke=\"#9dcfc7\" stroke-width=\"3\"/><rect x=\"65\" y=\"24\" width=\"510\" height=\"43\" rx=\"15\" fill=\"#177d7a\"/><text x=\"86\" y=\"52\" fill=\"white\" font-size=\"20\" font-family=\"Arial\">✉ Εισερχόμενα (99+)</text><g font-size=\"18\" fill=\"#243b4d\" font-family=\"Arial\"><text x=\"90\" y=\"99\">🎁 ΚΕΡΔΙΣΕ ΔΩΡΟ ΤΩΡΑ!</text><text x=\"90\" y=\"139\">💰 ΑΠΙΣΤΕΥΤΗ ΠΡΟΣΦΟΡΑ!</text><text x=\"90\" y=\"179\">🎉 ΕΙΣΑΙ Ο ΤΥΧΕΡΟΣ ΝΙΚΗΤΗΣ!</text><text x=\"90\" y=\"219\">🎁 ΔΩΡΕΑΝ ΚΟΥΠΟΝΙ!</text></g><g stroke=\"#d9e8e7\"><path d=\"M85 111H553 M85 151H553 M85 191H553\"/></g></svg>", "malware" const content=document.getElementById('content'),bar=document.getElementById('bar');
let names=['',''],step=-1,selected=null,placements={},locked=false,attempts=0,firstCorrect=0,history=[],chosenAttempts=[];

function intro(){bar.hidden=true;content.innerHTML='<h2>Οδηγίες προς τους Ψηφιακούς Ντετέκτιβ</h2><ol class="intro-instructions"><li>Αποφασίστε ποιος θα είναι ο <strong>Ντετέκτιβ 1</strong> και ποιος ο <strong>Ντετέκτιβ 2</strong>.</li><li>Συνεργαστείτε, συζητήστε και καταλήξτε σε <strong>κοινή απάντηση</strong> πριν πατήσετε «Έλεγχος Απάντησης».</li><li>Σε κάθε αποστολή αναγράφεται ποιος ντετέκτιβ <strong>χειρίζεται το ποντίκι</strong>. Ο άλλος έχει τον ρόλο του <strong>υποστηρικτή</strong>, βοηθώντας στη λήψη αποφάσεων.</li><li>Στις ερωτήσεις με κενά, σύρετε ή επιλέξτε τις κατάλληλες λέξεις.</li></ol><div class="detective-names"><label for="detective1">Ντετέκτιβ 1<input id="detective1" type="text" maxlength="70" placeholder="Γράψτε το όνομα" autocomplete="off" required></label><label for="detective2">Ντετέκτιβ 2<input id="detective2" type="text" maxlength="70" placeholder="Γράψτε το όνομα" autocomplete="off" required></label></div><p id="nameError" class="name-error" role="alert" hidden>Συμπληρώστε τα ονόματα και των δύο ντετέκτιβ για να ξεκινήσετε.</p><button class="primary" id="start" disabled>Ξεκινάμε</button>';const a=document.getElementById('detective1'),b=document.getElementById('detective2'),btn=document.getElementById('start');function validate(){btn.disabled=!a.value.trim()||!b.value.trim()||a.value.trim().toLowerCase()===b.value.trim().toLowerCase();document.getElementById('nameError').hidden=true}a.addEventListener('input',validate);b.addEventListener('input',validate);btn.onclick=()=>{validate();if(btn.disabled){document.getElementById('nameError').hidden=false;return}names=[a.value.trim(),b.value.trim()];step=0;render()}}
function render(){const t=tasks[step];bar.hidden=false;bar.value=step;selected=null;placements={};locked=false;attempts=0;chosenAttempts=[];const [operator,supporter]=roleFor(step);let html=`<h2>${esc(t.title)}</h2><div class="roles"><strong>Χειριστής:</strong> ${esc(operator)}<br><strong>Υποστηρικτής:</strong> ${esc(supporter)}<br><span class="muted">Συζητήστε και αποφασίστε μαζί πριν τον έλεγχο.</span></div><p>${esc(t.prompt)}</p>`;

if(t.type==='drag'){html+=`<p class="hint">Συμπληρώστε τα κενά με τη μέθοδο σύρε και άφησε (drag and drop) ή πατήστε πρώτα τη λέξη και μετά το κενό. Για αλλαγή, πατήστε τη συμπληρωμένη λέξη.</p><div class="bank">${t.bank.map((w,i)=>`<button class="token" draggable="true" data-token="${i}">${esc(w)}</button>`).join('')}</div><div class="sentence">${t.parts.map((p,i)=>esc(p)+(i<t.blanks.length?`<button class="slot" data-slot="${i}" aria-label="Κενό ${i+1}">________</button>`:'')).join('')}</div>`}
else html+=`<div>${t.options.map((o,i)=>`<button class="choice" data-choice="${i}">(${String.fromCharCode(945+i)}) ${esc(o)}</button>`).join('')}</div>`;
html+=`<div id="feedback" aria-live="polite"></div><div id="controls"><button class="primary" id="check" disabled>Έλεγχος Απάντησης</button><button class="primary" id="next" hidden>${step===tasks.length-1?'Ολοκλήρωση':'Επόμενη →'}</button></div>`;content.innerHTML=html;
if(t.type==='drag'){
 document.querySelectorAll('[data-token]').forEach(b=>{b.onclick=()=>{if(locked)return;selected=+b.dataset.token;updateTokens()};b.ondragstart=e=>{if(locked){e.preventDefault();return}selected=+b.dataset.token;e.dataTransfer.setData('text/plain',String(selected))}});
 document.querySelectorAll('[data-slot]').forEach(b=>{b.onclick=()=>{if(locked)return;const s=+b.dataset.slot;if(selected!==null)place(s,selected);else if(placements[s]!==undefined){delete placements[s];refresh()}};b.ondragover=e=>{if(locked)return;e.preventDefault();b.classList.add('over')};b.ondragleave=()=>b.classList.remove('over');b.ondrop=e=>{e.preventDefault();b.classList.remove('over');if(locked)return;let v=e.dataTransfer.getData('text/plain');if(v==='')return;let i=Number(v);if(Number.isInteger(i)&&i>=0&&i<t.bank.length)place(+b.dataset.slot,i)}})
}else document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;selected=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('check').disabled=false;clearFeedback()});
document.getElementById('check').onclick=check;document.getElementById('next').onclick=()=>{step++;step<tasks.length?render():finish()};}
function place(s,i){if(Object.values(placements).includes(i)&&placements[s]!==i)return;placements[s]=i;selected=null;refresh()}
function updateTokens(){document.querySelectorAll('[data-token]').forEach(b=>b.classList.toggle('active',+b.dataset.token===selected))}
function clearFeedback(){let f=document.getElementById('feedback');f.textContent='';f.className=''}
function refresh(){let t=tasks[step];document.querySelectorAll('[data-slot]').forEach(b=>{let v=placements[+b.dataset.slot];b.textContent=v===undefined?'________':t.bank[v];b.classList.toggle('filled',v!==undefined)});document.querySelectorAll('[data-token]').forEach(b=>b.disabled=Object.values(placements).includes(+b.dataset.token));document.getElementById('check').disabled=Object.keys(placements).length!==t.blanks.length;updateTokens();clearFeedback()}
function check(){if(locked)return;const t=tasks[step];attempts++;const submitted=t.type==='drag'?t.blanks.map((_,i)=>t.bank[placements[i]]):selected;const correct=t.type==='drag'?t.blanks.every((w,i)=>submitted[i]===w):selected===t.answer;chosenAttempts.push({number:attempts,answer:t.type==='drag'?submitted.join(' | '):`(${String.fromCharCode(945+selected)}) ${t.options[selected]}`,correct});let f=document.getElementById('feedback');if(correct){locked=true;if(attempts===1)firstCorrect++;f.className='feedback good';f.textContent=t.success;history.push({title:t.title,prompt:t.prompt,operator:roleFor(step)[0],supporter:roleFor(step)[1],attempts:chosenAttempts.slice(),answer:t.type==='drag'?submitted.join(' | '):`(${String.fromCharCode(945+selected)}) ${t.options[selected]}`});document.querySelectorAll('.choice,.token,.slot').forEach(b=>b.disabled=true);document.getElementById('check').hidden=true;document.getElementById('next').hidden=false;}else{f.className='feedback bad';let hint=t.fail;if(t.type==='drag'){let n=t.blanks.filter((w,i)=>submitted[i]===w).length;hint+=` Σωστά κενά: ${n} από ${t.blanks.length}.`;}f.textContent=hint;}}
function finish(){bar.value=tasks.length;content.innerHTML=`<h2>Αποστολή Ολοκληρώθηκε!</h2><p>Ντετέκτιβ: <strong>${esc(names[0])}</strong> και <strong>${esc(names[1])}</strong></p><p>Σωστές αποστολές με την πρώτη προσπάθεια: <strong>${firstCorrect}/${tasks.length}</strong></p><p>Στο τέλος μην ξεχάσετε να αποθηκεύσετε τη δραστηριότητά σας στον φάκελό σας και να ενημερώσετε την καθηγήτριά σας.</p><button class="primary" id="save">Αποθήκευση ως PDF</button>`;document.getElementById('save').onclick=()=>window.print();document.getElementById('printReport').innerHTML=`<h1>Γίνε Ψηφιακός Ντετέκτιβ</h1><p>Καθηγήτριες: Μαρία Αντρέου και Έλενα Θεοφάνους</p><p>Πληροφορική Α΄ Γυμνασίου · Α.5.3.Μ1</p><p>Ομαδική δραστηριότητα · Malware, Spam, Phishing</p><p><strong>Ντετέκτιβ:</strong> ${esc(names[0])} και ${esc(names[1])}</p><p><strong>Σωστές αποστολές με την πρώτη προσπάθεια: ${firstCorrect}/${tasks.length}</strong></p>${history.map((h,i)=>`<article><h2>${esc(h.title)}</h2><p>${esc(h.prompt)}</p><p><strong>Χειριστής:</strong> ${esc(h.operator)} · <strong>Υποστηρικτής:</strong> ${esc(h.supporter)}</p><p><strong>Τελική σωστή απάντηση:</strong> ${esc(h.answer)}</p><p><strong>Πλήθος προσπαθειών:</strong> ${h.attempts.length}</p><p><strong>Ιστορικό απαντήσεων:</strong></p><ol>${h.attempts.map(a=>`<li>${esc(a.answer)} — ${a.correct?'Σωστή':'Λανθασμένη'}</li>`).join('')}</ol></article>`).join('')}<p>Καθηγήτρια: Έλενα Θεοφάνους</p>`}
intro();
</script></body></html>
