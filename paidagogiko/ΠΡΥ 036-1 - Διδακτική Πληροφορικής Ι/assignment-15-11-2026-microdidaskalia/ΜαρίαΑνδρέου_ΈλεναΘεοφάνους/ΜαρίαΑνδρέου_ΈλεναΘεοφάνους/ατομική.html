<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Σκέψου Έξυπνα, Πλοηγήσου με Ασφάλεια!</title><style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#f2f6fb;color:#172b49;margin:0}main{max-width:900px;margin:28px auto;padding:27px;background:#fff;border-radius:22px;box-shadow:0 8px 30px #142b4618}h1{color:#165b91;font-size:2rem}h2{font-size:1.25rem}small,.tag{color:#536780}.card{background:#f5f9ff;border:1px solid #dce9fa;padding:22px;border-radius:15px;margin:20px 0}.choice,.token,.slot{font:inherit;border:1px solid #a9bfd7;border-radius:10px;background:white;padding:11px}.choice{display:block;width:100%;margin:9px 0;text-align:left;cursor:pointer;line-height:1.5}.choice:hover,.token:hover{background:#eaf3ff}.choice.selected,.token.active{background:#d8ebff;border:2px solid #226ca9}.primary{background:#1767a2;color:#fff;border:0;padding:12px 22px;border-radius:10px;cursor:pointer;font:inherit;margin:12px 8px 0 0}.primary:disabled{background:#a5b1bc;cursor:default}.feedback{padding:14px;border-radius:10px;margin-top:16px;line-height:1.55}.good{background:#e4f6e8;color:#165c2c}.bad{background:#ffe7e5;color:#912d27}.warning{background:#fff0d9;color:#805009}progress{width:100%;height:14px}.bank{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.token{cursor:grab;touch-action:manipulation}.token:disabled{opacity:.38;cursor:default}.sentence{font-size:1.09rem;line-height:2.8;background:white;border-radius:12px;padding:14px}.slot{display:inline-block;min-width:140px;min-height:46px;vertical-align:middle;border:2px dashed #7c9dbc;cursor:pointer;text-align:center;line-height:1.3;margin:3px}.slot.filled{border-style:solid;background:#e4f1ff}.slot.over{background:#d5f0e1}.hint{font-size:.92rem;color:#52687e}button:focus-visible{outline:3px solid #e6a33a;outline-offset:2px}#printReport{display:none}@media(max-width:600px){main{margin:8px;padding:17px}.sentence{line-height:2.6}h1{font-size:1.65rem}}@media print{body{background:white;color:black}main{box-shadow:none;margin:0;max-width:none;padding:0}#screen,#bar,.tag,#controls{display:none!important}#printReport{display:block!important}#printReport article{break-inside:avoid;border-bottom:1px solid #aaa;padding:8px 0}h1{font-size:20pt}h2{font-size:14pt}}
 .sentence{white-space:normal;line-height:2.1}.sentence .linebreak{display:block;height:16px}.choice img{max-height:70px;width:auto;vertical-align:middle}.hintPanel{display:none;margin:12px 0;padding:12px;background:#fff;border:1px solid #dce9fa;border-radius:12px}.hintPanel img{max-width:100%;height:auto}.hintPanel.visible{display:block} .infoTrigger{display:inline-flex;align-items:center;justify-content:center;border:2px solid #1767a2;border-radius:50%;width:27px;height:27px;background:#fff;color:#1767a2;font-weight:700;font-style:normal;cursor:pointer;vertical-align:middle;margin:0 5px}.hintPanel{vertical-align:middle;max-width:260px}.hintPanel.visible{display:inline-block}.hintPanel img{width:240px;max-width:100%;vertical-align:middle} @media print{.hintPanel,.infoTrigger{display:none!important}} 
.illustration{max-width:640px;margin:14px auto}.illustration svg{display:block;width:100%;height:auto;max-height:290px}.teacher-credit{margin-top:24px;text-align:left;color:#536780;font-size:.88rem;font-weight:500} @media print{.teacher-credit{color:#333;break-inside:avoid}}
</style></head><body><main><div id="screen"><small>Πληροφορική Α΄ Γυμνασίου · Α.5.3.Μ1 Κίνδυνοι από τη Χρήση του Διαδικτύου και η Αντιμετώπισή τους</small><h1>Σκέψου Έξυπνα, Πλοηγήσου με Ασφάλεια!</h1><p class="tag">Ατομική Δραστηριότητα – 7 αποστολές</p><progress id="bar" max="7" value="0" hidden></progress><div id="content" class="card"></div></div><section id="printReport"></section><footer class="teacher-credit">Καθηγήτριες: Μαρία Αντρέου και Έλενα Θεοφάνους</footer></main><script>
const tasks=[{"type":"choice","title":"1η Αποστολή – Το ύποπτο μήνυμα","scene":"phishing","prompt":"Παρατήρησε το μήνυμα. Ποιος κίνδυνος παρουσιάζεται;","options":["Spam","Phishing","Malware"],"answer":1,"success":"Μπράβο! Αναγνώρισες την προσπάθεια υποκλοπής προσωπικών στοιχείων (phishing). Τα μηνύματα που ζητούν κωδικούς απαιτούν ιδιαίτερη προσοχή.","fail":"Παρατήρησε τι σου ζητά ο αποστολέας. Θα ήταν ασφαλές να πληκτρολογήσεις τον μυστικό κωδικό σου σε έναν σύνδεσμο που έλαβες με μήνυμα;"},{"type":"drag","title":"2η Αποστολή","prompt":"Σύρε τις σωστές λέξεις στα κενά.","parts":["Το "," μπορεί να βλάψει αρχεία. Για προστασία χρησιμοποιούμε "," και κρατούμε "," ."],"blanks":["κακόβουλο πρόγραμμα (malware)","αντιικό πρόγραμμα (antivirus)","αντίγραφα ασφαλείας (backups)"],"bank":["αντιικό πρόγραμμα (antivirus)","ανεπιθύμητα μηνύματα (spam)","αντίγραφα ασφαλείας (backups)","κακόβουλο πρόγραμμα (malware)"],"success":"Μπράβο! Ξεχώρισες το κακόβουλο πρόγραμμα (malware) από τα μέτρα προστασίας: αντιικό πρόγραμμα (antivirus) και αντίγραφα ασφαλείας (backups).","fail":"Διάβασε ξανά την πρόταση. Ποια λέξη περιγράφει κάτι που βλάπτει αρχεία; Ποια αναφέρεται σε πρόγραμμα προστασίας και ποια στη διατήρηση αντιγράφων;"},{"type":"choice","title":"3η Αποστολή","prompt":"Ποιο από τα παρακάτω είναι κακόβουλο πρόγραμμα;","options":["Δούρειος Ίππος","Φίλτρο Spam","Αντίγραφο ασφαλείας"],"answer":0,"success":"Μπράβο! Αναγνώρισες τον Δούρειο Ίππο ως μορφή κακόβουλου προγράμματος (malware).","fail":"Σκέψου ποια επιλογή μπορεί να κρύβει βλαβερό λογισμικό και ποια είναι εργαλείο προστασίας ή αντίγραφο αρχείων."},{"type":"choice","title":"4η Αποστολή – Τα εισερχόμενα μηνύματα (inbox)","scene":"spam","prompt":"Τι είναι πιθανότερο να συμβαίνει στο γραμματοκιβώτιο της εικόνας;","options":["Λαμβάνει ανεπιθύμητα μηνύματα Spam","Εκτελεί αντίγραφα ασφαλείας","Ενημερώνει το antivirus"],"answer":0,"success":"Μπράβο! Αναγνώρισες τα ανεπιθύμητα μηνύματα (spam) στα εισερχόμενα.","fail":"Παρατήρησε πόσα παρόμοια διαφημιστικά μηνύματα εμφανίζονται. Πρόκειται για κάποιο μέτρο προστασίας ή για μηνύματα που δεν ζητήσαμε;"},{"type":"drag","title":"5η Αποστολή","prompt":"Συμπλήρωσε σωστά τις οδηγίες.","parts":["Δεν "," στα ανεπιθύμητα μηνύματα και χρησιμοποιώ "," . Δεν δημοσιεύω δημόσια τη "," μου."],"blanks":["απαντώ","φίλτρο Spam","διεύθυνση email"],"bank":["διεύθυνση email","απαντώ","κωδικό","φίλτρο Spam"],"success":"Μπράβο! Συμπλήρωσες σωστά τα μέτρα προστασίας από ανεπιθύμητα μηνύματα (spam).","fail":"Ξαναδιάβασε τις οδηγίες. Είναι ασφαλές να απαντάμε σε άγνωστα μηνύματα; Ποιο εργαλείο βοηθά στο φιλτράρισμά τους και ποιο προσωπικό στοιχείο δεν δημοσιεύουμε;"},{"type":"choice","title":"6η Αποστολή","scene":"malware","prompt":"Ο υπολογιστής έγινε αργός και χάθηκαν αρχεία. Ποιος κίνδυνος μπορεί να ευθύνεται;","options":["Malware","Spam","Phishing"],"answer":0,"success":"Μπράβο! Αναγνώρισες ότι τα κακόβουλα προγράμματα (malware) μπορούν να επηρεάσουν τη λειτουργία και τα αρχεία του υπολογιστή.","fail":"Σκέψου τι μπορεί να προκαλέσει καθυστερήσεις και απώλεια αρχείων. Είναι ο ίδιος κίνδυνος με τα ανεπιθύμητα email ή την υποκλοπή κωδικών;"},{"type":"drag","title":"7η Αποστολή","prompt":"Συμπλήρωσε την ασφαλή αντίδραση.","parts":["Πριν δώσω στοιχεία, ελέγχω τη "," . Δεν αποκαλύπτω τον "," μου και ενημερώνω "," ."],"blanks":["διεύθυνση URL","κωδικό","γονέα ή καθηγητή"],"bank":["γονέα ή καθηγητή","κωδικό","διεύθυνση URL","προσφορά"],"success":"Μπράβο! Επέλεξες ασφαλείς ενέργειες απέναντι στην υποκλοπή στοιχείων (phishing).","fail":"Πριν δώσεις προσωπικά στοιχεία, τι πρέπει να ελέγξεις στον σύνδεσμο; Σε ποιον μπορείς να απευθυνθείς όταν κάτι σου φαίνεται ύποπτο;"}];
const scenes={"phishing":"<svg viewBox=\"0 0 640 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ύποπτο email που ζητά κωδικό\"><rect width=\"640\" height=\"270\" rx=\"18\" fill=\"#e6f0ff\"/><rect x=\"60\" y=\"28\" width=\"520\" height=\"215\" rx=\"16\" fill=\"white\" stroke=\"#aac4e5\" stroke-width=\"3\"/><rect x=\"60\" y=\"28\" width=\"520\" height=\"47\" rx=\"16\" fill=\"#1a6095\"/><text x=\"86\" y=\"59\" fill=\"white\" font-size=\"21\" font-family=\"Arial\">✉ Εισερχόμενο μήνυμα</text><text x=\"85\" y=\"105\" font-size=\"17\" fill=\"#263a54\" font-family=\"Arial\">Αποστολέας: support@secure-login-example.net</text><text x=\"85\" y=\"139\" font-size=\"19\" font-weight=\"bold\" fill=\"#b83c38\" font-family=\"Arial\">ΕΠΕΙΓΟΝ! Ο λογαριασμός σου κλειδώνει!</text><text x=\"85\" y=\"171\" font-size=\"17\" fill=\"#263a54\" font-family=\"Arial\">Πάτησε εδώ και δώσε τον μυστικό κωδικό σου.</text><rect x=\"85\" y=\"189\" width=\"235\" height=\"36\" rx=\"8\" fill=\"#e07b53\"/><text x=\"104\" y=\"213\" font-size=\"17\" fill=\"white\" font-family=\"Arial\">Επιβεβαίωση κωδικού</text></svg>","spam":"<svg viewBox=\"0 0 640 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Γραμματοκιβώτιο με πολλά διαφημιστικά μηνύματα\"><rect width=\"640\" height=\"270\" rx=\"18\" fill=\"#e8f6f3\"/><rect x=\"65\" y=\"24\" width=\"510\" height=\"224\" rx=\"15\" fill=\"white\" stroke=\"#9dcfc7\" stroke-width=\"3\"/><rect x=\"65\" y=\"24\" width=\"510\" height=\"43\" rx=\"15\" fill=\"#177d7a\"/><text x=\"86\" y=\"52\" fill=\"white\" font-size=\"20\" font-family=\"Arial\">✉ Εισερχόμενα (99+)</text><g font-size=\"18\" fill=\"#243b4d\" font-family=\"Arial\"><text x=\"90\" y=\"99\">🎁 ΚΕΡΔΙΣΕ ΔΩΡΟ ΤΩΡΑ!</text><text x=\"90\" y=\"139\">💰 ΑΠΙΣΤΕΥΤΗ ΠΡΟΣΦΟΡΑ!</text><text x=\"90\" y=\"179\">🎉 ΕΙΣΑΙ Ο ΤΥΧΕΡΟΣ ΝΙΚΗΤΗΣ!</text><text x=\"90\" y=\"219\">🎁 ΔΩΡΕΑΝ ΚΟΥΠΟΝΙ!</text></g><g stroke=\"#d9e8e7\"><path d=\"M85 111H553 M85 151H553 M85 191H553\"/></g></svg>","malware":"<svg viewBox=\"0 0 640 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Οθόνη υπολογιστή με προειδοποίηση και αρχεία που λείπουν\"><rect width=\"640\" height=\"270\" rx=\"18\" fill=\"#f0eaff\"/><rect x=\"135\" y=\"18\" width=\"370\" height=\"202\" rx=\"13\" fill=\"#263a5c\"/><rect x=\"150\" y=\"34\" width=\"340\" height=\"168\" rx=\"6\" fill=\"#f7f9ff\"/><text x=\"170\" y=\"72\" font-size=\"20\" fill=\"#253d5d\" font-family=\"Arial\">Αρχεία: 3 δεν βρέθηκαν</text><rect x=\"171\" y=\"91\" width=\"300\" height=\"82\" rx=\"9\" fill=\"#ffe5df\" stroke=\"#e69a8c\"/><text x=\"190\" y=\"122\" font-size=\"23\" fill=\"#a43e34\" font-family=\"Arial\">⚠ ΠΡΟΕΙΔΟΠΟΙΗΣΗ</text><text x=\"190\" y=\"153\" font-size=\"18\" fill=\"#7e3c36\" font-family=\"Arial\">Ο υπολογιστής καθυστερεί!</text><path d=\"M305 220V239H254V248H387V239H336V220\" fill=\"#7a8cab\"/></svg>"}
const content=document.getElementById('content'),bar=document.getElementById('bar');let studentName='';let step=-1,selected=null,placements={},finished=[],attempts=0,attemptHistory=[],firstCorrect=0,locked=false;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function intro(){content.innerHTML='<h2>Οδηγίες προς τον Ψηφιακό Ντετέκτιβ</h2><p>Διάβασε προσεκτικά κάθε περίπτωση και επίλεξε ή συμπλήρωσε την απάντησή σου. Πάτησε «Έλεγχος Απάντησης». Αν χρειαστεί, αξιοποίησε την ανατροφοδότηση, διόρθωσε την απάντηση και δοκίμασε ξανά. Στο τέλος αποθήκευσε τα αποτελέσματά σου ως PDF.</p><label>Ονοματεπώνυμο <input id="studentName" type="text" maxlength="90" placeholder="Γράψε το ονοματεπώνυμό σου"></label><p><button class="primary" id="start">Ξεκινάμε</button></p>';document.getElementById('start').onclick=()=>{studentName=document.getElementById('studentName').value.trim();step=0;render()}}
function render(){bar.hidden=false;bar.value=step;selected=null;placements={};attempts=0;attemptHistory=[];locked=false;let t=tasks[step];let html=`<h2>${esc(t.title)}</h2><p>${esc(t.prompt)}</p>`;if(t.scene)html+=`<div class="illustration">${scenes[t.scene]}</div>`;
if(t.type==='drag'){html+=`<div class="bank">${t.bank.map((w,i)=>`<button class="token" draggable="true" data-token="${i}">${esc(w)}</button>`).join('')}</div><div class="sentence">${t.parts.map((p,i)=>esc(p).replaceAll('\n\n','<span class="linebreak"></span>')+(i<t.blanks.length?`<button class="slot" data-slot="${i}" aria-label="Κενό ${i+1}">________</button>`:'')).join('')}</div>`;if(t.hintImage){html=html.replace(/(διαβάθμιση\.)([\s\S]*?\(β\))/ ,(all,end,rest)=>`${end} <button class="infoTrigger" id="hintToggle" type="button" aria-label="Πληροφορίες PEGI" aria-expanded="false">?</button><span id="hintPanel" class="hintPanel"><img src="${t.hintImage}" alt="Ηλικιακές διαβαθμίσεις PEGI και περιγραφικές ενδείξεις"></span>${rest}`)}}
else{html+=`<div>${t.options.map((o,i)=>`<button class="choice" data-choice="${i}">(${String.fromCharCode(945+i)}) ${t.optionImages?`<img src="${t.optionImages[i]}" alt="Επισήμανση ${String.fromCharCode(945+i)}">`:esc(o)}</button>`).join('')}</div>`}
html+='<div id="feedback" aria-live="polite"></div><div id="controls"><button class="primary" id="check" disabled>Έλεγχος Απάντησης</button><button class="primary" id="next" hidden>Επόμενη →</button></div>';content.innerHTML=html;
if(t.type==='drag'){document.querySelectorAll('[data-token]').forEach(b=>{b.onclick=()=>{if(locked)return;selected=+b.dataset.token;updateTokens()};b.ondragstart=e=>{if(locked){e.preventDefault();return}selected=+b.dataset.token;e.dataTransfer.setData('text/plain',String(selected))}});document.querySelectorAll('[data-slot]').forEach(b=>{b.onclick=()=>{if(locked)return;const s=+b.dataset.slot;if(selected!==null)place(s,selected);else if(placements[s]!==undefined){delete placements[s];refresh()}};b.ondragover=e=>{e.preventDefault();b.classList.add('over')};b.ondragleave=()=>b.classList.remove('over');b.ondrop=e=>{e.preventDefault();b.classList.remove('over');let i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<t.bank.length)place(+b.dataset.slot,i)}});if(t.hintImage){const trigger=document.getElementById('hintToggle'),panel=document.getElementById('hintPanel');const show=()=>{panel.classList.add('visible');trigger.setAttribute('aria-expanded','true')};const hide=()=>{panel.classList.remove('visible');trigger.setAttribute('aria-expanded','false')};trigger.addEventListener('mouseenter',show);trigger.addEventListener('mouseleave',hide);trigger.addEventListener('click',()=>{if(panel.classList.contains('visible'))hide();else show()});trigger.addEventListener('focus',show);trigger.addEventListener('blur',hide)}}
else document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;selected=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('check').disabled=false;clearFeedback()});document.getElementById('check').onclick=check;if(step===tasks.length-1)document.getElementById('next').textContent='Ολοκλήρωση';document.getElementById('next').onclick=()=>{step++;step<tasks.length?render():finish()}}
function place(s,i){if(Object.values(placements).includes(i)&&placements[s]!==i)return;placements[s]=i;selected=null;refresh()}function updateTokens(){document.querySelectorAll('[data-token]').forEach(b=>b.classList.toggle('active',+b.dataset.token===selected))}function clearFeedback(){const f=document.getElementById('feedback');f.textContent='';f.className=''}function refresh(){const t=tasks[step];document.querySelectorAll('[data-slot]').forEach(b=>{const v=placements[+b.dataset.slot];b.textContent=v===undefined?'________':t.bank[v];b.classList.toggle('filled',v!==undefined)});document.querySelectorAll('[data-token]').forEach(b=>b.disabled=Object.values(placements).includes(+b.dataset.token));document.getElementById('check').disabled=Object.keys(placements).length!==t.blanks.length;updateTokens();clearFeedback()}
function check(){if(locked)return;const t=tasks[step];attempts++;attemptHistory.push(t.type==='drag'?t.blanks.map((_,i)=>t.bank[placements[i]]||'—').join(' | '):`(${String.fromCharCode(945+selected)}) ${t.options[selected]||'Επισήμανση PEGI'}`);const correct=t.type==='drag'?t.blanks.every((w,i)=>t.bank[placements[i]]===w):selected===t.answer;const f=document.getElementById('feedback');if(correct){locked=true;if(attempts===1)firstCorrect++;f.className='feedback good';f.textContent=t.success;finished.push({title:t.title,prompt:t.prompt,answer:t.type==='drag'?t.blanks.map((w,i)=>t.bank[placements[i]]).join(' · '):`(${String.fromCharCode(945+selected)}) ${t.options[selected]||'Επισήμανση PEGI OK'}`,attempts,history:[...attemptHistory]});document.querySelectorAll('.choice,.token,.slot').forEach(b=>b.disabled=true);document.getElementById('check').hidden=true;document.getElementById('next').hidden=false}else{f.className='feedback bad';f.textContent=t.type==='drag'?`${t.fail} Σωστά κενά: ${t.blanks.filter((w,i)=>t.bank[placements[i]]===w).length} από ${t.blanks.length}.`:t.fail}}
function finish(){bar.value=tasks.length;content.innerHTML=`<h2>Αποστολή Ολοκληρώθηκε!</h2><p><strong>Μαθητής/τρια:</strong> ${esc(studentName||'Δεν συμπληρώθηκε')}</p><p>Σωστές αποστολές: <strong>${firstCorrect}/${tasks.length}</strong></p><p>Αποθήκευσε τις απαντήσεις και τη βαθμολογία σου ως PDF στον φάκελό σου και ενημέρωσε τις καθηγήτριές σου.</p><button class="primary" id="save">Αποθήκευση ως PDF</button>`;document.getElementById('save').onclick=()=>window.print();document.getElementById('printReport').innerHTML=`<h1>Σκέψου Έξυπνα, Πλοηγήσου με Ασφάλεια!</h1><p>Καθηγήτριες: Μαρία Αντρέου και Έλενα Θεοφάνους</p><p>Πληροφορική Α΄ Γυμνασίου · Α.5.3.Μ1 Κίνδυνοι από τη Χρήση του Διαδικτύου και η Αντιμετώπισή τους</p><h2>Ατομική Δραστηριότητα – 7 αποστολές</h2><p><strong>Μαθητής/τρια:</strong> ${esc(studentName||'Δεν συμπληρώθηκε')}</p><p><strong>Σωστές αποστολές με την πρώτη προσπάθεια: ${firstCorrect}/${tasks.length}</strong></p>${finished.map(x=>`<article><h3>${esc(x.title)}</h3><p>${esc(x.prompt)}</p><p><strong>Τελική σωστή απάντηση:</strong> ${esc(x.answer)}</p><p><strong>Προσπάθειες:</strong> ${x.attempts}</p><p><strong>Ιστορικό απαντήσεων (με τη σειρά υποβολής):</strong></p><ol>${x.history.map((answer,i)=>`<li>${esc(answer)}${i===x.history.length-1?' — σωστή απάντηση':' — λανθασμένη απάντηση'}</li>`).join('')}</ol></article>`).join('')}`}
intro();
</script></body></html>
